check_base = "main"

# T-0399 (gates-quality audit finding 2) / T-0974: investigated turning
# [dup] on by default in THIS repo's own gate path; still held back,
# deliberately, but for a DIFFERENT (and more serious) reason than T-0399
# first found. T-0399 measured `enforce = true` alone blowing past this
# repo's ~150s single-stage foreground budget (docs/guides/agent-
# playbook.md section 3b). T-0974 re-measured cold (no `.frob/dup.db` yet)
# and reproduced the blowout, then added `[dup].native_rungs`
# (frob.dup.DupConfig.native_rungs_enabled, default off) so R1/R2
# (pure-Python, cheap even cold) can run independently of R3/R4/R5 (native-
# call-per-symbol, the actual cost driver) -- see docs/modules/dup.md's
# "[dup].native_rungs" section. That split alone did NOT make it safe to
# flip `enforce` on here: profiling the still-slow R1/R2-only run found a
# genuine DEADLOCK, not just slowness -- `find_clones` unconditionally
# takes `derived_state_write_lock` (EXCLUSIVE) for its whole body, but the
# "clones" gate runs in a `ProcessPoolExecutor` worker (T-0415,
# `_PROCESS_POOL_GATES`) while `frob check`'s main process holds
# `derived_state_lock(..., exclusive=False)` (SHARED) for the whole run;
# the write lock's same-process reentrancy check
# (`_process_already_holds`) cannot see across the process-pool fork
# boundary, so the worker's EXCLUSIVE request blocks forever against the
# main process's SHARED hold (confirmed live via `lslocks`: WRITE* blocked
# vs READ held, same `.frob/derived.lock`, different PIDs). Filed as a
# separate blocking bug (see T-0974's Done report for the id) scoped to
# `src/frob/process/_lock.py` / `src/frob/gates/__init__.py`'s executor
# topology -- fixing the lock's cross-process reentrancy story is a
# different, more careful change than this ticket's profiling/caching
# scope. `enforce` stays `false` here until that lands.


# T-0443: DOC004's console/bash command-drift tier (frob.gates._docblocks.
# doc004_gate) -- `prog` is the console word introducing an invocation in a
# ```console```/```bash```/```sh```/```shell``` fenced doc block; `parser`
# is a `module:callable` dotted path to a zero-argument argparse.
# ArgumentParser factory the gate imports and walks AT CHECK TIME. This
# repo names itself as the first configured instance, pointed at its own
# real CLI registry -- never a hand-maintained second copy of the
# subcommand list.
[[docblocks.commands]]
prog = "frob"
parser = "frob.__main__:_build_parser"

# T-0373: the arch gate (frob.gates._arch.arch_gate, via frob.app.config.
# load_arch_config) and the standalone `frob arch` linter both read this
# table. These are a deliberate calibration, not the library's own
# conservative defaults (30-line functions, 500-line files) -- 800 lines
# and 60-line functions are the idiomatic ceilings this repo actually
# holds itself to; unset keys fall back to load_arch_config's defaults,
# which match these same values, so this table is documentation of the
# decision as much as it is wiring.
[arch]
max_function_lines = 60
max_class_methods = 12
max_local_imports = 8
max_nesting_depth = 4
max_file_lines = 800

# T-0620: `[arch.layering]` is `frob.arch._layering`'s DIP layering
# contract schema -- NOT wired into `frob check` yet (out of this ticket's
# scope, matching T-0616/T-0617/T-0618/T-0619's own disclosed gate-wiring
# cuts), so this table is inert today and present purely as a real,
# minimal worked example of the config shape (docs/modules/arch.md's "DIP
# layering contract" section documents the schema in full). `layers` maps
# a declared layer name to the repo-relative path prefixes belonging to
# it; `allow` maps a layer name to the OTHER layer names it may import
# from -- an edge between two declared layers not listed here is a
# violation once a future ticket wires `check_layering_violations` into
# `frob check`. This particular contract states a fact already true of
# this repo's own layout: `src/frob/app` (the CLI/orchestration layer)
# may depend on `src/frob/lang` (the tree-sitter parsing utility layer),
# but `src/frob/lang` may never import back from `src/frob/app` --
# `frob.lang` is a leaf dependency the rest of the codebase reaches into,
# never the reverse.
[arch.layering.layers]
app = ["src/frob/app"]
lang = ["src/frob/lang"]

[arch.layering.allow]
app = ["lang"]
lang = []

[graph]
# design/litmus/**: strata litmus fixtures (T-0130) -- example models used
# by tests/unit/strata's parametrized suite, not maintained product surface.
# Same posture as tests/fixtures/**: still parseable by frob.lang and
# visible to map/outline/xref/cycle when pointed at them explicitly (those
# commands never consult this exclude list), just kept out of the
# graph/dup/arch obligation surface COV001/TEST001 run over.
# src/frob/scaffold/data/**: jinja templates for scaffolded projects (T-0148)
# -- rendered into OTHER repos' source trees, not executed as part of this
# package's own runtime. TEST005 (module line-coverage floor) was measuring
# these .j2 files as if they were maintained frob modules, which is a
# category error: they are exercised at the rendered-artifact level via
# tests/system/test_scaffold_dx.py (render -> git init -> frob check on the
# OUTPUT), never imported/executed in-process here, so "line coverage" of
# the template source itself is meaningless. Excluded rather than waived
# per-file to avoid leaking frob:waive/T-#### directives into scaffolded
# output that ships into unrelated user projects.
exclude = [
    "tests/fixtures/**",
    "design/litmus/**",
    ".claude/worktrees/**",
    "src/frob/scaffold/data/**",
]

# T-0396: anti-orphan file-reference gate (REF001/002/003) allowlist --
# each entry is a file that is legitimately low/no-inbound because it is
# read from OUTSIDE this repo's own tracked-file graph (a human, GitHub's
# UI, a packaging tool, CI's own runner, the interpreter's own entry-point
# convention), never a blanket mute: every entry carries its own reason.
[[refs.entrypoint]]
path = "README.md"
reason = "read by humans/GitHub, not referenced from other tracked files"

[[refs.entrypoint]]
path = "LICENSE"
reason = "read by humans/packaging tools, not referenced from source"

[[refs.entrypoint]]
path = "CHANGELOG.md"
reason = "read by humans/release tooling, not referenced from source"

[[refs.entrypoint]]
path = "pyproject.toml"
reason = "read by pip/uv/build backends outside this repo's own graph"

[[refs.entrypoint]]
path = "frob.toml"
reason = "the root config every gate reads; referencing it from tracked source would be circular, not meaningful"

[[refs.entrypoint]]
path = "frob.lock"
reason = "machine-generated lock artifact frob.graph writes and reads by fixed path convention, not referenced by name from source"

[[refs.entrypoint]]
path = "src/frob/__main__.py"
reason = "the CLI entry point, invoked by the installed console-script shim outside this repo's tracked-file graph"

[[refs.entrypoint]]
path = "CLAUDE.md"
reason = "read by Claude/AI agents as project instructions, not referenced from other tracked files"

[[refs.entrypoint]]
path = ".gitignore"
reason = "read by git outside this repo's own tracked-file graph, not referenced from source"

[[refs.entrypoint]]
path = ".gitattributes"
reason = "read by git (merge-driver/attribute config) outside this repo's tracked-file graph"

[[refs.entrypoint]]
path = "Makefile"
reason = "read by make outside this repo's tracked-file graph, not referenced from source"

[[refs.entrypoint]]
path = ".github/workflows/ci.yml"
reason = "read by the GitHub Actions runner outside this repo's tracked-file graph"

[[refs.entrypoint]]
path = ".mcp.json"
reason = "read by MCP clients outside this repo's tracked-file graph, not referenced from source"

# REF002 single-anchor waivers for file types the comment-directive scan
# cannot reach (JSON has no comment syntax, TOML/SVG are not a
# frob.lang-supported language) -- see docs/modules/gates.md#anti-orphan-file-reference-gate.
[[refs.entrypoint]]
path = "docs/assets/frob-banner.svg"
reason = "banner image, anchored once from README.md by design; not meant to be embedded elsewhere"

[[refs.entrypoint]]
path = "editors/vscode-strata/language-configuration.json"
reason = "VS Code language-config sidecar, referenced only by its own extension's package.json per VS Code's own single-owner convention"

[[refs.entrypoint]]
path = "frob-core/frob_core.pyi"
reason = "typed stub for the frob_core native extension, paired 1:1 with frob-core/pyproject.toml's [tool.maturin] module-name; a second anchor would not be genuine"

[[refs.entrypoint]]
path = "frob-core/rust-toolchain.toml"
reason = "rust toolchain pin read by cargo/rustup outside this repo's tracked-file graph; scaffold.project.py's mention is the sole intentional anchor"

[[refs.entrypoint]]
path = "strata-core/rust-toolchain.toml"
reason = "rust toolchain pin read by cargo/rustup outside this repo's tracked-file graph; scaffold.project.py's mention is the sole intentional anchor"

[[refs.entrypoint]]
path = "tests/golden/frob_export_seccomp.json"
reason = "golden fixture read by exactly one dedicated golden-export test by design; not meant to be shared across tests"

[[refs.entrypoint]]
path = "tests/unit/cve/fixtures/CVE-2024-4681.json"
reason = "CVE parser fixture consumed by a single dedicated test module by design"

[[refs.entrypoint]]
path = "tests/unit/cve/fixtures/CVE-2024-7039.json"
reason = "CVE parser fixture consumed by a single dedicated test module by design"

[[refs.entrypoint]]
path = "tests/unit/cve/fixtures/mirror/cves/2024/4xxx/CVE-2024-4681.json"
reason = "CVE mirror-layout fixture consumed by a single dedicated test module by design"

[[refs.entrypoint]]
path = "tests/unit/cve/fixtures/mirror/cves/2024/7xxx/CVE-2024-7039.json"
reason = "CVE mirror-layout fixture consumed by a single dedicated test module by design"

[[refs.entrypoint]]
path = "tests/unit/cve/fixtures/mirror/cves/2024/8xxx/CVE-2024-8888.json"
reason = "CVE mirror-layout fixture consumed by a single dedicated test module by design"

[[refs.entrypoint]]
path = "tests/unit/cve/fixtures/mirror/cves/2024/9xxx/CVE-2024-9999.json"
reason = "CVE mirror-layout fixture consumed by a single dedicated test module by design"

[[refs.entrypoint]]
path = "tests/unit/cve/fixtures/vet_mirror/cves/2024/1xxx/CVE-2024-1001.json"
reason = "CVE vet-mirror fixture consumed by a single dedicated test module by design"

[gates.severity]
# COV001 (public symbol has an explicit frob:doc edge) and TEST001 (public
# symbol has a unit test) are now hard errors: the whole surface -- Python,
# Rust (incl. PyO3 exports), and the rest -- is annotated, so any new
# undocumented/untested public symbol in ANY language fails the build.
# TEST002/003/005/006 remain the legacy-adoption baseline (interface- and
# coverage-level obligations) and warn until that campaign lands.
COV001 = "error"
TEST001 = "error"
TEST002 = "warn"
TEST003 = "warn"
TEST005 = "warn"
TEST006 = "warn"
# T-0973: every named SEC110 (env-secret-read) site in the repo now
# carries either a real std.secrets mapping or a reasoned frob:waive
# (16 unwaived findings burned down to 0) -- promote the rule from its
# long-standing WARN-only posture to a real gate.
SEC110 = "error"
# T-0971: gates-quality audit finding 4/5 -- PII010 (undeclared PII-shaped
# data-structure field) and PII012 (PII-shaped identifier/comment keyword
# sweep) were WARN-only, so a repo could carry undeclared PII field
# surfaces and still exit 0. The 167-finding unwaived baseline measured on
# main (2026-07-27) is burned down to zero (reviewed-non-PII homonym
# extension in `_pii_structural.py`'s `_PII012_REVIEWED_NON_PII`, plus the
# 3 pre-existing `frob:waive PII010` sites), so this promotion does not
# immediately red the build.
PII010 = "error"
PII012 = "error"
# T-0977: ARCH101 (low-cohesion-class / LCOM4) -- the 2 live findings in
# `src/frob/mutate/__init__.py` were both false positives from a
# `frob.arch._python` field-access extraction bug (any `X.attr` expression,
# including local-variable attributes and `self.method(...)` call
# callees, was recorded as a `self.<field>` read/write); fixing the
# extractor to require a genuine `self.<name>` read/write
# (`_py_is_self_attribute`) drops both findings to zero without touching
# `mutate/__init__.py` itself. Promoted to error at zero live findings.
ARCH101 = "error"
# T-0972: gates-quality audit finding 1 -- PERF001-004 (membership-in-list,
# .index()/.count(), nested-loop equality-join, sorted()-in-loop) were
# WARN-only, so a repo could carry real O(n^2)/repeated-work perf smells
# and still exit 0. The 46-finding unwaived baseline measured on main
# (2026-07-27) is burned down to zero (2 fixed by hoisting/set-membership,
# the rest reasoned `frob:waive` for per-iteration-distinct-data false
# positives and algorithm-inherent BFS/DFS/Tarjan/two-pointer traversals
# PERF's position-free token-stream detector cannot distinguish from a
# real cross join), so this promotion does not immediately red the build.
PERF001 = "error"
PERF002 = "error"
PERF003 = "error"
PERF004 = "error"

[testing]
# min_unit_cases dropped from the 3-case aspirational target to 1 while the
# gates dogfood milestone is in progress (see ticket for raising it back).
min_unit_cases = 1
min_integration = 1
unit_branch_cov = 90
module_line_cov = 85
system_line_cov = 80

[[test.runner]]
language = "python"
command = ["uv", "run", "pytest", "-q", "{ids}"]
all_command = ["uv", "run", "pytest", "-q"]
cwd = "."

[[test.runner]]
# strata-core's rust kernel crate (native-kernel work, T-0073/T-0093).
# T-0128: multiple [[test.runner]] entries with the SAME language are now
# supported, cwd-scoped -- run_selected routes each selected rust symref to
# whichever entry's `cwd` prefixes the symref's path (frob-core/... here vs.
# strata-core/... below), and fails loudly (TestingError.UnroutedItem) on a
# rust file under neither crate rather than silently dropping it.
# `cargo test --lib` (not plain `cargo test`) avoids also compiling/linking
# doctests, which need the SAME PyO3 env but double the link cost for no
# extra coverage here (no doc examples in this crate).
language = "rust"
command = ["cargo", "test", "--lib", "{filters}"]
all_command = ["cargo", "test", "--lib"]
cwd = "strata-core"

[[test.runner]]
# frob-core: the second pyo3 crate under the identical env constraint
# (T-0092's follow-up, closed by T-0128). See the strata-core entry above
# for how routing between the two works.
language = "rust"
command = ["cargo", "test", "--lib", "{filters}"]
all_command = ["cargo", "test", "--lib"]
cwd = "frob-core"

[[test.runner]]
# T-0149: `.strata` litmus fixtures (tests/unit/strata/litmus/*.strata) are
# test DATA, not directly-runnable source -- there is no standalone strata
# executor, they are exercised THROUGH tests/unit/strata's pytest suite
# (e.g. test_litmus_cwe.py). No frob:tests directive binds an individual
# .strata file as a TESTS-edge source (the DSL anchors to symbols, and a
# design file's module decl is not one), so select_tests' `fallback =
# "package"` always applies here and hands run_selected the touched file's
# *directory* (e.g. tests/unit/strata/litmus) as the selected item. That
# directory holds no python test files by itself, so this runner's command
# names the real covering suite (tests/unit/strata) explicitly via
# `{files}` and folds the fallback-selected directory in alongside it --
# harmless (pytest collects zero extra items from a data-only dir) and
# correct (the fixture's actual covering tests run either way). This is
# strictly narrower than fallback = "suite" (which would run frob's ENTIRE
# python suite for every touched .strata file); it stays scoped to the one
# suite that binds strata design-language fixtures.
language = "strata"
command = ["uv", "run", "pytest", "-q", "tests/unit/strata", "{files}"]
all_command = ["uv", "run", "pytest", "-q", "tests/unit/strata"]
cwd = "."

# T-0333: compiled extension modules the pytest suite importorskip-gates on.
# Declaring them lets `collect_python_tests` fingerprint their build state
# (so `make core` invalidates the collection cache automatically instead of
# leaving a stale set that reds COV003), and lets the coverage gate name the
# real remedy when a native is not built. `name` is the python IMPORT name
# (resolved via importlib.util.find_spec), not a path -- so this works
# identically for these pyo3/maturin crates and for any c/c++ extension.
[[native]]
name = "strata_core"
build_cmd = "make core"
language = "rust"

[[native]]
name = "frob_core"
build_cmd = "make core"
language = "rust"

# T-0569: ratchet pools (docs/modules/gates.md#ratchet-pools) -- rule ids
# opted into "existing findings stay warn (frob-ratchet.lock.json), new
# findings error" instead of a plain warn-first campaign. Empty/absent
# means no rule is ratcheted.
# T-0594: INV006 is the first rule wired into a live gate's severity
# resolution (inv006_gate, src/frob/gates/__init__.py) -- its 29
# pre-existing findings were baselined via `frob pool snapshot INV006`
# (frob-ratchet.lock.json) at the point this was enabled, so they keep
# reporting WARN; any file with a NEW unbound exclusivity claim now
# reports INV006 at ERROR.
[gates.ratchet]
rules = ["INV006"]
