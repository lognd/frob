PERF001 = "error"
PERF002 = "error"
PERF003 = "error"
PERF004 = "error"
# T-1185: OPAQUE001 (runtime-resolved capability indirection --
# getattr/setattr/importlib.import_module/sys.modules-replacement with a
# non-literal, statically-unresolvable name) -- T-1038 fixed-or-waived 90
