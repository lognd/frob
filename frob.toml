check_base = "experimental"

[tickets]
# Append-shared files nearly every crate ticket touches; exempt from whole-file leases.
registry_files = ["Cargo.lock"]

[graph]
# v1 frob indexes nothing useful here; the design and notes cite planned paths.
exclude = ["docs/design/", "notes/"]

[gates.severity]
# Design docs and v1 notes reference planned paths and config tables on purpose.
DOC006 = "warn"
