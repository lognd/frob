# frob v2 configuration for this repository (materialized by `frob init`,
# then tuned). Run `frob config show --effective` to see every resolved knob.

[check]
# Ref the diff of a `--ticket` run is taken against.
base = "experimental"
# Lowest severity that makes `frob check` exit 1; `none` never fails.
fail_on = "error"
# Paths no rule inspects: build output, frob's own local state and the v1
# changelog (a 2.7 MB history file full of v1 directives).
exclude = ["target/", ".frob/", "CHANGELOG.md", "CHANGELOG-v1.md", "notes/", "crates/*/tests/corpus/**", "crates/*/tests/mdtest/**", "crates/*/tests/mdtest_fail/**", "crates/*/tests/fixtures/**", "tests/crunk-parity/fixtures/**"]
# Which Unresolved findings fail the gate: `required`, `never` or `all`.
fail_on_unresolved = "required"
# Wall-clock bound in seconds of one sibling `check --json` run (sibling-contract.md section 7).
# 120 s timed out the grimble sibling under agent load (SIB001 is required); ~77B0T1W caches its binding.
sibling_timeout_secs = 600
# When true an unusable configured sibling is a required Unresolved (`SIB001`).
require_siblings = true

# Crates allowed to spawn processes (PROC001 is inert in repositories that do not list any);
# every other spawn goes through gob_exec::Runner.
process_spawners = ["gob-exec", "gob-git"]

# External tool stages, run after the built-in rules.
[[check.tool]]
name = "cargo"
command = "cargo"
args = ["fmt", "--all", "--check"]
inputs = ["**/*.rs", "**/Cargo.toml", "Cargo.lock", "rust-toolchain*", "clippy.toml", "rustfmt.toml", ".cargo/**"]
# Cold land checkouts on a loaded host exceed the 300 s default (TOOL001 on ~ZZCCYHY, ~3AP1RKR).
timeout_secs = 1200

[[check.tool]]
name = "cargo"
command = "cargo"
args = ["clippy", "--all-targets", "--all-features", "--", "-D", "warnings"]
inputs = ["**/*.rs", "**/Cargo.toml", "Cargo.lock", "rust-toolchain*", "clippy.toml", "rustfmt.toml", ".cargo/**"]
# Cold land checkouts on a loaded host exceed the 300 s default (TOOL001 on ~ZZCCYHY, ~3AP1RKR).
timeout_secs = 1200

[[check.tool]]
name = "cargo"
command = "cargo"
args = ["dev", "gen", "all", "--check"]
# Generated pages are functions of the Rust registrations and the generated files themselves.
inputs = ["**/*.rs", "**/Cargo.toml", "Cargo.lock", "docs/reference/**", "docs/schemas/**", "crates/*/tests/mdtest/**", "crates/*/src/rules/**"]
# Cold land checkouts on a loaded host exceed the 300 s default (TOOL001 on ~ZZCCYHY, ~3AP1RKR).
timeout_secs = 1200

# zizmor and actionlint are bound through `uvx` (pinned versions); frob maps
# their findings to CI ids. The version range makes a tool that lags the
# GitHub schema an Unresolved finding instead of a violation. CI warms the
# same uvx cache before `frob check` (see .github/workflows/ci.yml).
[[check.tool]]
name = "zizmor"
command = "uvx"
args = ["zizmor@1.30.1", "--offline", "--format", "json-v1", "--no-exit-codes", "."]
parser = "zizmor-json-v1"
version_args = ["zizmor@1.30.1", "--version"]
min_version = "1.30.0"
max_version = "1.30.99"

[[check.tool]]
name = "actionlint"
command = "uvx"
args = ["--from", "actionlint-py==1.7.12.25", "actionlint", "-format", "{{json .}}"]
parser = "actionlint-json"
version_args = ["--from", "actionlint-py==1.7.12.25", "actionlint", "-version"]
min_version = "1.7.0"
max_version = "1.7.99"
# Custom self-hosted runner labels go here; this repository uses GitHub-hosted runners only.
labels = []

# Hygiene tools (build-test-ci.md section 4, D98): `cargo dev ci` runs these exact argv as the
# deny, shear and typos steps, and `frob check` runs them as stages; the version range pins the
# output format. A host without the tool gets a non-required Unresolved, never a pass.
[[check.tool]]
name = "cargo-deny"
command = "cargo-deny"
args = ["check"]
version_args = ["--version"]
min_version = "0.19.0"
max_version = "0.19.99"
optional = true

[[check.tool]]
name = "cargo-shear"
command = "cargo-shear"
args = []
version_args = ["--version"]
min_version = "1.14.0"
max_version = "1.14.99"
optional = true

[[check.tool]]
name = "typos"
command = "typos"
args = []
version_args = ["--version"]
min_version = "1.50.0"
max_version = "1.50.99"
optional = true

[git]
# Compare-and-swap retries when moving a ledger ref.
cas_retries = 5

[lease]
# Append-shared files nearly every crate ticket touches; exempt from overlap checks.
shared_files = ["Cargo.lock"]
# 5 s refused work, land and heartbeats with about 15 agents (2026-10-09); ~ZZQ6PA9 shrinks the hold time.
lock_timeout_ms = 30000

[tickets]
# Ref holding the ledger. This is `experimental` while the Rust rewrite lives
# on that branch; it becomes `refs/heads/main` at the merge to main.
ref = "refs/heads/experimental"
# `trunk` commits to `ref`; `branch` commits to the checked-out branch.
ref_mode = "trunk"

[evidence]
# Programs the `command` evidence provider may run; grimble runs bind as evidence; goway runs the
# whole-workspace suite on a LAN helper (the exit code is the remote command's).
allowed_tools = ["cargo", "git", "goway", "grimble", "pytest", "python3"]
# Identities (git `user.email`) that may attest a criterion; `frob init` and `config sync` write the repository owner's email, and an empty list means nobody may.
attesters = ["logan@logandapp.com"]

[compute]
# How an unannotated public signature is treated (`warn-unresolved` or `required`).
public_signatures = "warn-unresolved"
# How an undeclared effect is treated.
effects = "warn-unresolved"
# How a dynamic call is treated.
dynamic_calls = "warn-unresolved"
# The macro and template expansion step budget.
expansion_steps = 1000
# How an unnormalizable construct is treated.
normalization = "warn-unresolved"
# How a notebook with an undeclared cell order is treated.
notebook_order = "warn-unresolved"

[directives]
# Comment namespaces the scanner reads; comments in any other are ignored.
namespaces = ["frob", "grimble", "crunk"]

[pm]
# Pull policy; `rank` takes the highest-ranked doable ticket, the only policy so far and the scrumban default.
pull = "rank"
# Replenishment order point: PM033 advises planning when ready tickets fall below this (default twice the repository WIP limit, so the queue never starves a full WIP).
ready_min = 4
# Definition of ready: predicates a ticket must satisfy to enter `ready`; the default is the full list of pm-enforcement.md section 3 so no ill-formed goal is pulled.
ready_requires = ["story_or_objective_qualified", "criteria", "points", "scope", "parent"]
# Definition of done: predicates checked on close and land; the default lists the three evaluable ones (`criteria_evidenced`, `no_open_children`, `changelog_fragment`); `docs_touched_or_excepted` and `objective_target_met` exist but refuse as Unresolved until they can be evaluated, so listing them is an explicit choice.
done_requires = ["criteria_evidenced", "no_open_children", "changelog_fragment"]
# Days per cycle when a cycle is created without an explicit end; one week is the usual scrumban review cadence.
cycle_days = 2
# Completed cycles needed before capacity and forecasts are enforced; below it they report Unresolved, so a fresh repository never needs an over-commit.
min_history = 3
# Safety factor k in `capacity = rolling_mean - k * stddev` for cycle commitment; 0.5 trades a little throughput for commitments that are usually met.
capacity_k = 0.5
# Sprint gate: while a cycle is active, `work` and `start` refuse a ticket that is not a member of it (`E-PM-NOT-IN-CYCLE`) unless it is expedite or started with `--unplanned --reason`, which assigns it to the cycle as a recorded over-commit; with no active cycle the gate is silent, so it defaults on.
sprint_gate = true
# Strict process policy: PM rules that are warnings by default (PM001, PM002, PM013, PM034, PM036) become errors, so a repository can make its process gate-enforced; off by default so a fresh repository is only advised.
strict = false

[pm.classes]
# Expedite tickets that may exceed the repository WIP limit at once; 1 lets one critical fix through without opening the floodgates.
expedite_max = 1
# Largest share (0.0 to 1.0) of a cycle's points that intangible work (chores, debt) may take, checked by PM035; 0.2 keeps upkeep from crowding out features.
intangible_share = 0.2

[pm.wip]
# Most tickets one holder (actor plus worktree path) may have in progress; 1 makes an agent finish before starting another, 0 is off.
in_progress_per_identity = 1
# Repository WIP cap: wide agent waves (owner 2026-10-09); suite runs go to the goway helpers with
# per-host job fitting (goway ~K60F05J), so local builds stay scoped. Finished-but-unlanded tickets count.
in_progress = 16

[release]
# When true, a CI result that cannot be read (no checks, `gh` missing or unauthenticated, no network, non-GitHub remote) blocks the release like a red one; false reports it as Unresolved only. Unknown is never treated as green.
require_ci = true
# Tag name pattern of a release; `{product}` expands once per product below.
tag = "{product}-v{version}"
# Products a release ships, one tag each (grimble is a preview binary until 0.533.0; crunk is preview until parity with the Python crunk).
products = ["frob", "grimble", "crunk"]
# Products that ship as a preview: their tag message and changelog heading say so (grimble until 0.533.0, crunk until parity).
preview = ["grimble", "crunk"]
