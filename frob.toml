#
# T-1315 (2026-08-08) extends this rationale rather than superseding it:
# 75/70 is a WAYPOINT on that same climb back to 90/85, not a new
# permanent target. All 38 per-package burn-down children of the T-1273
# epic (T-1276..T-1313) are closed as of this date -- every package
# reached zero TEST005 findings at 75/70 -- so the floor is no longer
# doing any work as a ceiling; it is only doing work as a floor. The
# full staged schedule (75/70 -> 80/75 -> 85/80 -> 90/85, one step at a
# time, each step gated on a FRESH `make coverage` measurement clearing
# the next threshold repo-wide) is docs/design/test005-ratchet-
# schedule.md, which names the live step-1 ticket id. STEP 1 (75/70 ->
# 80/75) is tracked as a real, closeable ticket -- not just this comment
# -- so it shows up in `frob ticket doable` the moment its trigger
# measurement clears it, and re-files its own successor before closing.
# frob:ticket T-1315
unit_branch_cov = 75
module_line_cov = 70
system_line_cov = 80

# T-2390 epic child (T-2436): known_keys declares this table's own
# known-key set for TESTRUNNERSCHEMA001 (an unknown/misspelled key in a
# [[test.runner]] entry, previously silently ignored), resolved through
# the same module:symbol idiom as [refs] entrypoint_schema.
[test_runner_schema]
known_keys = "frob.gates._test_runner_schema:TEST_RUNNER_KNOWN_KEYS"

[[test.runner]]
language = "python"
command = ["uv", "run", "pytest", "-q", "{ids}"]
all_command = ["uv", "run", "pytest", "-q"]
cwd = "."

[[test.runner]]
# strata-core's rust kernel crate (native-kernel work, T-0073/T-0093).
# T-0128: multiple [[test.runner]] entries with the SAME language are now
# supported, cwd-scoped -- run_selected routes each selected rust symref to
# whichever entry's `cwd` prefixes the symref's path (frob-core/... here vs.
# strata-core/... below), and fails loudly (TestingError.UnroutedItem) on a
# rust file under neither crate rather than silently dropping it.
# `cargo test --lib` (not plain `cargo test`) avoids also compiling/linking
# doctests, which need the SAME PyO3 env but double the link cost for no
# extra coverage here (no doc examples in this crate).
language = "rust"
command = ["cargo", "test", "--lib", "{filters}"]
all_command = ["cargo", "test", "--lib"]
cwd = "strata-core"

[[test.runner]]
# frob-core: the second pyo3 crate under the identical env constraint
# (T-0092's follow-up, closed by T-0128). See the strata-core entry above
# for how routing between the two works.
language = "rust"
command = ["cargo", "test", "--lib", "{filters}"]
all_command = ["cargo", "test", "--lib"]
cwd = "frob-core"

[[test.runner]]
# T-0149: `.strata` litmus fixtures (tests/unit/strata/litmus/*.strata) are
# test DATA, not directly-runnable source -- there is no standalone strata
# executor, they are exercised THROUGH tests/unit/strata's pytest suite
# (e.g. test_litmus_cwe.py). No frob:tests directive binds an individual
# .strata file as a TESTS-edge source (the DSL anchors to symbols, and a
# design file's module decl is not one), so select_tests' `fallback =
# "package"` always applies here and hands run_selected the touched file's
# *directory* (e.g. tests/unit/strata/litmus) as the selected item. That
# directory holds no python test files by itself, so this runner's command
# names the real covering suite (tests/unit/strata) explicitly via
# `{files}` and folds the fallback-selected directory in alongside it --
# harmless (pytest collects zero extra items from a data-only dir) and
# correct (the fixture's actual covering tests run either way). This is
# strictly narrower than fallback = "suite" (which would run frob's ENTIRE
# python suite for every touched .strata file); it stays scoped to the one
# suite that binds strata design-language fixtures.
language = "strata"
command = ["uv", "run", "pytest", "-q", "tests/unit/strata", "{files}"]
all_command = ["uv", "run", "pytest", "-q", "tests/unit/strata"]
cwd = "."

[[test.runner]]
# T-1604: `tests/fixtures/lang/sample.sh` (and any future `tests/**/*.sh`)
# is bash SOURCE DATA, not runnable test code -- there is no standalone
# bash test framework it runs under. `frob.excludes.is_test_file` treats
# ANY touched file under a `tests/` path component as self-selecting
# (its own path, not a package-directory fallback -- see `_select.py`'s
# `for file in touched_files: if is_test_file(file): _add_selected(...)`
# ), so `run_selected` ends up handed the raw `.sh` path as this
# runner's one selected item. Passing that path to pytest as an explicit
# CLI argument aborts pytest's ENTIRE collection phase (exit 5,
# collected=0 for the whole invocation, not just a zero-match for that
# one path -- confirmed interactively while building this entry), unlike
# a directory argument (which pytest silently collects zero tests from).
# `{files}` is still interpolated, exactly one placeholder as required by
# `frob.testing._runners._validate_placeholder`, but routed to a `bash
# -c` positional parameter the inner script never references (`--
# "{files}"`) rather than pytest's own argv -- so it satisfies the
# schema, stays inert at runtime, and the real covering suites
# (tests/test_lang.py, tests/test_lang_conformance_gate.py) always run
# in full regardless of which bash file triggered selection.
language = "bash"
command = ["bash", "-c", "uv run pytest -q tests/test_lang.py tests/test_lang_conformance_gate.py", "--", "{files}"]
all_command = ["uv", "run", "pytest", "-q", "tests/test_lang.py", "tests/test_lang_conformance_gate.py"]
cwd = "."

[[test.runner]]
# T-1600: identical shape to the bash entry immediately above --
# `tests/fixtures/lang/sample.cs` is C# SOURCE DATA, not runnable test
# code, and `frob.excludes.is_test_file`'s `tests/` path-component rule
# self-selects its raw path the same way. Routed through `bash -c` the
# same inert-positional-parameter way so `{files}` satisfies the one-
# placeholder schema without ever reaching pytest's own argv.
language = "csharp"
command = ["bash", "-c", "uv run pytest -q tests/test_lang.py tests/test_lang_conformance_gate.py", "--", "{files}"]
all_command = ["uv", "run", "pytest", "-q", "tests/test_lang.py", "tests/test_lang_conformance_gate.py"]
cwd = "."

# T-0333: compiled extension modules the pytest suite importorskip-gates on.
# Declaring them lets `collect_python_tests` fingerprint their build state
# (so `make core` invalidates the collection cache automatically instead of
# leaving a stale set that reds COV003), and lets the coverage gate name the
# real remedy when a native is not built. `name` is the python IMPORT name
# (resolved via importlib.util.find_spec), not a path -- so this works
# identically for these pyo3/maturin crates and for any c/c++ extension.
#
# T-2390 epic child (T-2429): known_keys declares this table's own
# known-key set for NATIVESCHEMA001 (an unknown/misspelled key in a
# [[native]] entry, previously silently ignored), resolved through the
# same module:symbol idiom as [refs] entrypoint_schema.
[native_schema]
known_keys = "frob.gates._native_schema:NATIVE_KNOWN_KEYS"

[[native]]
name = "strata_core"
build_cmd = "make core"
language = "rust"

[[native]]
name = "frob_core"
build_cmd = "make core"
language = "rust"

# T-0569: ratchet pools (docs/modules/gates.md#ratchet-pools) -- rule ids
# opted into "existing findings stay warn (frob-ratchet.lock.json), new
# findings error" instead of a plain warn-first campaign. Empty/absent
# means no rule is ratcheted.
# T-1763: INV006 (the rule this pool was first wired for, T-0594) was
# deleted -- 338 waivers, zero unwaived findings across its whole
# lifetime; see docs/modules/gates.md's T-1763 note. No rule is
# currently ratcheted.
#
# T-2390 epic child (T-2435): ratchet_known_keys declares [gates.
# ratchet]'s own known-key set for GATESSCHEMA001 (an unknown key,
# previously silently ignored); [gates.severity]'s own keys are
# validated separately, against the live gate-rule registry itself
# rather than a project-declared set (see the module's own docstring).
[gates_schema]
ratchet_known_keys = "frob.gates._gates_schema:GATES_RATCHET_KNOWN_KEYS"

[gates.ratchet]
rules = []

# T-2390 epic child (T-2430): known_keys declares this table's own
# known-key set for PROFILESCHEMA001 (an unknown/misspelled key in
# [profile], previously silently ignored), resolved through the same
# module:symbol idiom as [refs] entrypoint_schema / [native_schema].
[profile_schema]
known_keys = "frob.gates._profile_schema:PROFILE_KNOWN_KEYS"

[profile]
profile = "rapid"
override_ratchet = true

# T-2576 M2: the terminal fallback `frob.tickets._doable.
# effective_milestone` reads when a ticket has no declared milestone and
# no milestoned ancestor -- this repo's own current milestone target.
# MILE003 fires instead of assuming this value when it is unset; it is
# set here deliberately so the M2 redesign (a read-time default instead
# of a bulk `milestone: 1.0.0` backfill into all 89 open ticket files --
# see this ticket's own "SCOPE REDESIGN" section) achieves the identical
# net effect with zero ticket-file writes.
[tickets]
default_milestone = "1.0.0"

# T-3191: `ty check --python-platform` defaults to the host's own platform,
# so a bare local `frob check` never typechecked Windows- or macOS-only code
# paths at all -- CI run 33135896391 measured 4 such diagnostics (`os.
# sysconf`, `ctypes.windll`) that were structurally unreachable from a Linux
# host. `frob.check._python._run_ty` now runs `ty check` once per platform
# named here (falling back to `_DEFAULT_TY_TARGET_PLATFORMS` -- this same
# list -- if this table/key is absent) and reports the union, each
# diagnostic labelled `[platform=<name>]`. Declared explicitly rather than
# left to the code default so a future change to this project's own CI OS
# matrix (.github/workflows/ci.yml) is a one-line diff here, not a silent
# mismatch between what CI runs and what the local gate covers.
#
# No dedicated TYSCHEMA001-style known-keys validator exists yet for this
# table (unlike [dup]/[profile]/... which each have one via [ty_schema]) --
# filed as a follow-up rather than built here, since T-3191's scope is
# platform reachability, not the config-schema-validator family.
[ty]
target_platforms = ["linux", "win32", "darwin"]
