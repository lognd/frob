check_base = "main"

[graph]
# design/litmus/**: strata litmus fixtures (T-0130) -- example models used
# by tests/unit/strata's parametrized suite, not maintained product surface.
# Same posture as tests/fixtures/**: still parseable by frob.lang and
# visible to map/outline/xref/cycle when pointed at them explicitly (those
# commands never consult this exclude list), just kept out of the
# graph/dup/arch obligation surface COV001/TEST001 run over.
exclude = ["tests/fixtures/**", "design/litmus/**", ".claude/worktrees/**"]

[gates.severity]
# COV001 (public symbol has an explicit frob:doc edge) and TEST001 (public
# symbol has a unit test) are now hard errors: the whole surface -- Python,
# Rust (incl. PyO3 exports), and the rest -- is annotated, so any new
# undocumented/untested public symbol in ANY language fails the build.
# TEST002/003/005/006 remain the legacy-adoption baseline (interface- and
# coverage-level obligations) and warn until that campaign lands.
COV001 = "error"
TEST001 = "error"
TEST002 = "warn"
TEST003 = "warn"
TEST005 = "warn"
TEST006 = "warn"

[testing]
# min_unit_cases dropped from the 3-case aspirational target to 1 while the
# gates dogfood milestone is in progress (see ticket for raising it back).
min_unit_cases = 1
min_integration = 1
unit_branch_cov = 90
module_line_cov = 85
system_line_cov = 80

[[test.runner]]
language = "python"
command = ["uv", "run", "pytest", "-q", "{ids}"]
all_command = ["uv", "run", "pytest", "-q"]
cwd = "."

[[test.runner]]
# strata-core's rust kernel crate (native-kernel work, T-0073/T-0093).
# T-0128: multiple [[test.runner]] entries with the SAME language are now
# supported, cwd-scoped -- run_selected routes each selected rust symref to
# whichever entry's `cwd` prefixes the symref's path (frob-core/... here vs.
# strata-core/... below), and fails loudly (TestingError.UnroutedItem) on a
# rust file under neither crate rather than silently dropping it.
# `cargo test --lib` (not plain `cargo test`) avoids also compiling/linking
# doctests, which need the SAME PyO3 env but double the link cost for no
# extra coverage here (no doc examples in this crate).
language = "rust"
command = ["cargo", "test", "--lib", "{filters}"]
all_command = ["cargo", "test", "--lib"]
cwd = "strata-core"

[[test.runner]]
# frob-core: the second pyo3 crate under the identical env constraint
# (T-0092's follow-up, closed by T-0128). See the strata-core entry above
# for how routing between the two works.
language = "rust"
command = ["cargo", "test", "--lib", "{filters}"]
all_command = ["cargo", "test", "--lib"]
cwd = "frob-core"
