[gates.severity]
# frob-zone-start gates.severity T-1002
# COV001 (public symbol has an explicit frob:doc edge) and TEST001 (public
# symbol has a unit test) are now hard errors: the whole surface -- Python,
# Rust (incl. PyO3 exports), and the rest -- is annotated, so any new
# undocumented/untested public symbol in ANY language fails the build.
# TEST002/003/005/006 remain the legacy-adoption baseline (interface- and
# coverage-level obligations) and warn until that campaign lands.
COV001 = "error"
TEST001 = "error"
TEST002 = "warn"
TEST003 = "warn"
TEST005 = "warn"
TEST006 = "warn"
# T-0973: every named SEC110 (env-secret-read) site in the repo now
# carries either a real std.secrets mapping or a reasoned frob:waive
# (16 unwaived findings burned down to 0) -- promote the rule from its
# long-standing WARN-only posture to a real gate.
SEC110 = "error"
# T-0971: gates-quality audit finding 4/5 -- PII010 (undeclared PII-shaped
# data-structure field) and PII012 (PII-shaped identifier/comment keyword
# sweep) were WARN-only, so a repo could carry undeclared PII field
# surfaces and still exit 0. The 167-finding unwaived baseline measured on
# main (2026-07-27) is burned down to zero (reviewed-non-PII homonym
# extension in `_pii_structural.py`'s `_PII012_REVIEWED_NON_PII`, plus the
# 3 pre-existing `frob:waive PII010` sites), so this promotion does not
# immediately red the build.
PII010 = "error"
PII012 = "error"
# T-0976: ARCH001 (long-function) burn-down -- T-0970 landed 5 of 52 live
# unwaived findings (3 real extractions, 2 honest waivers); this ticket
# carries the remaining 47 to zero unwaived (real hierarchical
# extractions for the large majority, honest `frob:waive ARCH001`
# additions -- matching the existing per-language body-event-walker
# precedent -- for the handful of genuinely-cohesive functions). Promoted
# from WARN to a real gate now that 0 unwaived findings remain.
ARCH001 = "error"
# T-0977: ARCH101 (low-cohesion-class / LCOM4) -- the 2 live findings in
# `src/frob/mutate/__init__.py` were both false positives from a
# `frob.arch._python` field-access extraction bug (any `X.attr` expression,
# including local-variable attributes and `self.method(...)` call
# callees, was recorded as a `self.<field>` read/write); fixing the
# extractor to require a genuine `self.<name>` read/write
# (`_py_is_self_attribute`) drops both findings to zero without touching
# `mutate/__init__.py` itself. Promoted to error at zero live findings.
ARCH101 = "error"
# T-0980: ARCH102 (god-module / export-cohesion clustering) -- T-0977 fixed
# the heuristic's most severe unsoundness (data-only classes inflating
# fragmentation) and dropped 23 live findings to 11; this ticket disposes
# the remaining 11, each via a `frob:waive ARCH102` bound to the bare
# module path with a per-module cohesion argument grounded in the gate's
# own clustering output (which exports land in which cluster, and why the
# naming/usage heuristic misses their real coupling -- shared mutable
# state, a shared data model, or a documented multi-responsibility split).
# No module was force-split speculatively; `frob.lang`'s genuinely
# independent tree-sitter node helpers (cpp_function_nodes/child_by_field/
# node_text/resolve_local_import) are flagged as a real follow-up split
# candidate in that module's waiver reason and tracked as a separate
# ticket rather than done in this pass. Promoted to error at zero live
# unwaived findings.
ARCH102 = "error"
# T-0990: ARCH103 (mixed-concern-function) -- T-0977 burned 22 of 24 live
# findings down via reasoned `frob:waive ARCH103` sites; T-0979 resolved
# 2 more that had moved into `_format_one_path`/`_build_one_crate` post
# T-0976/T-0985 refactors, but a fresh unscoped re-measure turned up 2
# OTHER live unwaived findings that had appeared from unrelated recent
# changes: `perf_runner.py::_collect_stacks_from_file` and
# `gates/__init__.py::_open_process_pool`. This ticket resolved both by
# real extraction (splitting the read/format-resolve/parse steps and the
# two env-marker stamps into single-concern helpers, each below ARCH103's
# 2-decision-point threshold) rather than a waiver, preserving
# `_open_process_pool`'s T-0947 forkserver-preload and T-0982 lock-key
# stamping behavior unchanged. Promoted to error at zero live unwaived
