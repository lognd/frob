# frob:ticket T-2010
# T-1218's stale-binary warning (`frob.app._config_meta.stale_binary_
# warning`) reads this floor and warns loudly when the INVOKED `frob`'s
# own version is strictly below it -- live since T-1218 landed, but
# dormant here (and in every other repo) until a repo actually sets the
# key. The 2026-08-02 incident this exists for: a `git` merge-driver
# invoked a stale globally `uv tool install`ed `frob` (0.9.0) against
# this repo's in-tree code, then at 0.277.0, and spliced tickets.md
# using stale merge-driver logic with no warning at all. Set to this
# repo's own current `pyproject.toml` version at the time T-2010 landed
# -- deliberately NOT re-bumped on every REL001 version bump afterward
# (that would make the floor chase the ceiling and never actually catch
# anything): a floor a few releases behind the tip still catches the
# genuinely stale case (a global install months out of date) without
# nagging on every in-tree land.
min_frob_version = "0.447.0"

check_base = "main"

# T-2390 epic child (T-2431): known_keys declares the known-key set
# for frob.toml's top-level SCALAR keys (min_frob_version, check_base)
# for TOPSCALARSCHEMA001 (an unknown/misspelled top-level scalar key,
# previously silently ignored), resolved through the same module:symbol
# idiom as [refs] entrypoint_schema / [native_schema] / [profile_schema].
[toplevel_scalar_schema]
known_keys = "frob.gates._toplevel_scalar_schema:TOPLEVEL_SCALAR_KNOWN_KEYS"

# T-0399 (gates-quality audit finding 2) / T-0974: [dup] is now ON by
# default in this repo's own gate path. History: T-0399 measured
# `enforce = true` alone blowing past this repo's ~150s single-stage
# foreground budget. T-0974 re-measured cold and reproduced the blowout,
# added `[dup].native_rungs` (frob.dup.DupConfig.native_rungs_enabled) so
# R1/R2 (pure-Python, cheap) can run independently of R3/R4/R5 (native-
# call-per-symbol, the real cost driver -- see docs/modules/dup.md's
# "[dup].native_rungs" section), and then found the R1/R2-only path STILL
# deadlocked: `find_clones` unconditionally takes `derived_state_write_
# lock` (EXCLUSIVE) while the "clones" gate runs in a `ProcessPoolExecutor`
# worker (T-0415) and `frob check`'s main process holds the SHARED
# derived-state lock for the whole run -- the write lock's reentrancy
# check was process-local and blind to the pool's fork boundary. Filed as
# T-0981/T-0982; T-0982 landed the fix (`FROB_DERIVED_LOCK_HELD_KEYS`
# stamped by the pool owner before construction, docs/modules/
# process.md). T-0974 resumed after that landed and re-measured:
#
# - `native_rungs = true` (full R1-R5): still exceeds a 300s foreground
#   cap cold (no `.frob/dup.db` yet) -- NOT flipped on, stays opt-in.
# - `native_rungs = false` (R1/R2 only, this repo's actual setting): cold
#   `frob check --only clones` = 33.9s; cold `--only gates-native` (the
#   real dispatched-agent chunk shape, alongside archgate/perf/
#   exhaustive_handling) = 43.5s; warm (cache populated) `gates-native`
#   settles around 40-45s total, clones itself ~20-22s -- comfortably
#   inside the ~90s per-stage foreground budget either way. `enforce`
#   flips on here with `native_rungs` left off.
# T-2390 epic child (T-2437): known_keys declares this table's own
# known-key set for DUPSCHEMA001 (an unknown/misspelled key, previously
# silently ignored), resolved through the same module:symbol idiom as
# [refs] entrypoint_schema.
[dup_schema]
known_keys = "frob.gates._dup_graph_schema:DUP_KNOWN_KEYS"

[dup]
enforce = true


# T-0443: DOC004's console/bash command-drift tier (frob.gates._docblocks.
# doc004_gate) -- `prog` is the console word introducing an invocation in a
# ```console```/```bash```/```sh```/```shell``` fenced doc block; `parser`
# is a `module:callable` dotted path to a zero-argument argparse.
# ArgumentParser factory the gate imports and walks AT CHECK TIME. This
# repo names itself as the first configured instance, pointed at its own
# real CLI registry -- never a hand-maintained second copy of the
# subcommand list.
#
# T-2397: `config` is FLAGCOV001's own declaration, resolved through the
# SAME dotted-path idiom as `parser` above (frob.gates._docblocks_shared.
# resolve_dotted_symbol) -- the pydantic model this command tree's CLI
# flags are meant to reach. Omitting it leaves FLAGCOV001 UNRESOLVED for
# this entry (never a silent pass), not merely undeclared. `forwarded`
# names this repo's OWN config-forwarding field-name source
# (frob.app._config_external._all_forwarded_field_names, a zero-arg
# callable) explicitly -- FLAGCOV001 requires this on every entry rather
# than silently defaulting to it, so a project whose config is NOT
# AppConfig cannot inherit frob's own forwarding tuples by accident.
#
# T-2390 epic child (T-2434): known_keys declares this table's own
# known-key set for DOCBLOCKSSCHEMA001 (an unknown/misspelled key in a
# [[docblocks.commands]] entry, previously silently ignored), resolved
# through the same module:symbol idiom as [refs] entrypoint_schema.
[docblocks_schema]
known_keys = "frob.gates._docblocks_schema:DOCBLOCKS_COMMAND_KNOWN_KEYS"

[[docblocks.commands]]
prog = "frob"
parser = "frob.__main__:_build_parser"
config = "frob.app.config:AppConfig"
forwarded = "frob.app._config_external:_all_forwarded_field_names"

# T-0373: the arch gate (frob.gates._arch.arch_gate, via frob.app.config.
# load_arch_config) and the standalone `frob arch` linter both read this
# table. These are a deliberate calibration, not the library's own
# conservative defaults (30-line functions, 500-line files) -- 800 lines
# and 60-line functions are the idiomatic ceilings this repo actually
# holds itself to; unset keys fall back to load_arch_config's defaults,
# which match these same values, so this table is documentation of the
# decision as much as it is wiring.
#
# T-2390 epic child (T-2433): known_keys (below, its own sub-table so
# it never collides with a real [arch] key) declares this table's
# known-key set for ARCHSCHEMA001 (an unknown/misspelled key, e.g.
# "max_fuction_lines", previously silently reverting to the calibrated
# default with no diagnostic), resolved through the same module:symbol
# idiom as [testing_schema] / [profile_schema].
[arch_schema]
known_keys = "frob.gates._arch_schema:arch_known_keys"

[arch]
max_function_lines = 60
max_class_methods = 12
max_local_imports = 8
max_nesting_depth = 4
max_file_lines = 800

# T-0620: `[arch.layering]` is `frob.arch._layering`'s DIP layering
# contract schema -- NOT wired into `frob check` yet (out of this ticket's
# scope, matching T-0616/T-0617/T-0618/T-0619's own disclosed gate-wiring
# cuts), so this table is inert today and present purely as a real,
# minimal worked example of the config shape (docs/modules/arch.md's "DIP
# layering contract" section documents the schema in full). `layers` maps
# a declared layer name to the repo-relative path prefixes belonging to
# it; `allow` maps a layer name to the OTHER layer names it may import
# from -- an edge between two declared layers not listed here is a
# violation once a future ticket wires `check_layering_violations` into
# `frob check`. This particular contract states a fact already true of
# this repo's own layout: `src/frob/app` (the CLI/orchestration layer)
# may depend on `src/frob/lang` (the tree-sitter parsing utility layer),
# but `src/frob/lang` may never import back from `src/frob/app` --
# `frob.lang` is a leaf dependency the rest of the codebase reaches into,
# never the reverse.
[arch.layering.layers]
app = ["src/frob/app"]
lang = ["src/frob/lang"]

[arch.layering.allow]
app = ["lang"]
lang = []

# T-2390 epic child (T-2437): known_keys declares this table's own
# known-key set for GRAPHSCHEMA001 (an unknown/misspelled key,
# previously silently ignored), resolved through the same module:symbol
# idiom as [refs] entrypoint_schema.
[graph_schema]
known_keys = "frob.gates._dup_graph_schema:GRAPH_KNOWN_KEYS"

[graph]
# design/litmus/**: strata litmus fixtures (T-0130) -- example models used
# by tests/unit/strata's parametrized suite, not maintained product surface.
# Same posture as tests/fixtures/**: still parseable by frob.lang and
# visible to map/outline/xref/cycle when pointed at them explicitly (those
# commands never consult this exclude list), just kept out of the
# graph/dup/arch obligation surface COV001/TEST001 run over.
# src/frob/scaffold/data/**: jinja templates for scaffolded projects (T-0148)
# -- rendered into OTHER repos' source trees, not executed as part of this
# package's own runtime. TEST005 (module line-coverage floor) was measuring
# these .j2 files as if they were maintained frob modules, which is a
# category error: they are exercised at the rendered-artifact level via
# tests/system/test_scaffold_dx.py (render -> git init -> frob check on the
# OUTPUT), never imported/executed in-process here, so "line coverage" of
# the template source itself is meaningless. Excluded rather than waived
# per-file to avoid leaking frob:waive/T-#### directives into scaffolded
# output that ships into unrelated user projects.
exclude = [
    "tests/fixtures/**",
    "design/litmus/**",
    ".claude/worktrees/**",
    "src/frob/scaffold/data/**",
]

# T-0396: anti-orphan file-reference gate (REF001/002/003) allowlist --
# each entry is a file that is legitimately low/no-inbound because it is
# read from OUTSIDE this repo's own tracked-file graph (a human, GitHub's
# UI, a packaging tool, CI's own runner, the interpreter's own entry-point
# convention), never a blanket mute: every entry carries its own reason.
#
# T-2390 epic child (T-2428): entrypoint_schema declares this
# table's own known-key set for REFSCHEMA001 (an unknown/misspelled key
# in an [[refs.entrypoint]] entry, previously silently ignored), resolved
# through the same module:symbol idiom as [[docblocks.commands]]'s own
# parser/config/forwarded keys.
[refs]
entrypoint_schema = "frob.gates._refs_schema:REFS_ENTRYPOINT_KNOWN_KEYS"

[[refs.entrypoint]]
path = "README.md"
reason = "read by humans/GitHub, not referenced from other tracked files"

[[refs.entrypoint]]
path = "LICENSE"
reason = "read by humans/packaging tools, not referenced from source"

[[refs.entrypoint]]
path = "CHANGELOG.md"
reason = "read by humans/release tooling, not referenced from source"

# T-2369: glob entry point -- `frob.gates._refs._allowlist_covers` also
# accepts a `*`/`?`/`[`-bearing `path` as a fnmatch pattern, not just a
# literal file. changelog.d/T-XXXX.md fragments are write-once inputs
# `frob ticket land`'s release tooling assembles into CHANGELOG.md and
# then leaves in place for audit history -- one is created per landed
# ticket FOREVER, so a fixed per-file entry (261 and counting) would need
# continuous upkeep for a structurally-permanent pattern; a single glob
# covers the whole class.
[[refs.entrypoint]]
path = "changelog.d/*.md"
reason = "write-once per-ticket fragment assembled into CHANGELOG.md by the land pipeline (T-2445); never referenced by name from other tracked files, and created on every future land"

# T-2369: same write-once-artifact-of-a-closed-ticket shape as
# changelog.d/*.md above -- an attachment/evidence file is created once
# under its OWN ticket's directory and read from that ticket's own
# ticket.md/done-report.md, never from any other tracked file; the
# per-ticket count grows forever, so a fixed per-file entry does not
# scale.
[[refs.entrypoint]]
path = "tickets/*/attachments/*"
reason = "write-once ticket attachment, referenced only from its own ticket's ticket.md/done-report.md; created per-ticket forever"

[[refs.entrypoint]]
path = "tickets/*/evidence/*"
reason = "write-once ticket evidence artifact, referenced only from its own ticket's ticket.md/done-report.md; created per-ticket forever"

[[refs.entrypoint]]
path = "tickets/T-2504/census-2026-08-18-raw.json"
reason = "T-2369: a one-off raw data attachment dropped directly under its ticket's own directory (not under attachments/ or evidence/), referenced only from tickets/T-2504/done-report.md; a literal entry since this shape has not recurred (a future recurrence should generalize this to a glob instead)"

[[refs.entrypoint]]
path = "pyproject.toml"
reason = "read by pip/uv/build backends outside this repo's own graph"

[[refs.entrypoint]]
path = "frob.toml"
reason = "the root config every gate reads; referencing it from tracked source would be circular, not meaningful"

[[refs.entrypoint]]
path = "frob.lock"
reason = "machine-generated lock artifact frob.graph writes and reads by fixed path convention, not referenced by name from source"

[[refs.entrypoint]]
path = "src/frob/__main__.py"
reason = "the CLI entry point, invoked by the installed console-script shim outside this repo's tracked-file graph"

# T-2551: standalone EXECUTABLES -- run by a coordinator/git/Claude Code,
# never imported by tracked source. Declared here (not matched by a
# `.claude/hooks/*` glob) so each one is a stated fact with a reason, and a
