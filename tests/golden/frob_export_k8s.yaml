apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frob-strata-checker
spec:
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: core
  - to:
    - podSelector:
        matchLabels:
          app: gates
  - to:
    - podSelector:
        matchLabels:
          app: graphlang
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: cli
  podSelector:
    matchLabels:
      app: checker
  policyTypes:
  - Ingress
  - Egress
