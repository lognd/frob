
[project]
css_root = "styles"
tokens_file = "tokens.css"
root_font_size = 16

[palette]
ink = "#1a1a1a"
paper = "#fafaf7"
accent = "#2f6fed"

[palette.roles]
body = ["ink", "paper"]

[scales]
spacing = [0, 4, 8, 12, 16]
font_sizes = [12, 16, 20]
radii = [0, 4, 8]

[typography]
families = ["Inter", "system-ui"]
weights = [400, 700]

[layers]
base = 0

[org]
buckets = ["base", "components", "layouts", "utilities"]
class_case = "kebab"
component_prefix = true
tokens_only_custom_props = true


[lint]
fix_tolerance = 0.15
color_tolerance = 8.0
