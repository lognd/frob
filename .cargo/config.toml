[alias]
# gob-dev shares the workspace target dir (one build, not two). Where the tool's own binary would
# be rebuilt while it runs (Windows locks a running .exe: the windows-latest CI job and Windows
# developers) use `cargo dev-isolated`, which builds gob-dev into target/dev-tool instead.
dev = "run -p gob-dev --"
dev-isolated = "run -p gob-dev --target-dir target/dev-tool --"

# Fast linking on Linux: clang driver delegating to mold.
# To disable: delete this block, or override per invocation with
#   CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS="" cargo build
# or point at lld instead by using "-C", "link-arg=-fuse-ld=lld".
[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

# Same fast-link setup for aarch64 Linux hosts (the primary dev machine).
[target.aarch64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]
