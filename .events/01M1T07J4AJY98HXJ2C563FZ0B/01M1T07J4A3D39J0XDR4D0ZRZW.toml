body = "An agent ran check with a config inside the project from the worktree root and silently judged the wrong tree; only cd worked. The cwd default is the borrower contract and stays, but r19 exposes a --root flag beside --config on every pipeline command and every --config run prints a locator line naming the resolved spec path and root, so a wrong-root run is visible in its first line instead of silently wrong."
