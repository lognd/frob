kind = "create"
title = "frob init writes a [packs] lock key that the unity pack reader rejects"
type = "bug"
category = "todo"
priority = "medium"
scope = ["crates/frob-obligations/src/unity.rs"]
body = """found while working ~RJFEASS: a fresh frob init writes frob.toml with [packs] lock = "grimble.packs.lock" (default from grimble-check config). The frob-obligations unity reader parses [packs] with deny_unknown_fields and expects enabled or enable, so every frob ticket or check run in a fresh repo logs PACK005 'unknown field lock' and treats the unity pack as disabled. Repro: git init a repo, frob init, frob ticket list. Writer side: crates/grimble-check/src/config.rs:46."""
