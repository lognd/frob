body = "New provider `dotnet` in crates/frob-evidence (provider.rs beside nextest and pytest, config.rs, record.rs, error.rs, verbs.rs, tests/dotnet.rs): runs `dotnet test --logger trx` with a --filter built from test ids (FullyQualifiedName=...), parses the TRX per-test results (outcome, duration, error message, stdout) into a measured record, through gob-exec and the shared redact, scrub and escape paths (scrub.rs), allowlisted like pytest. A missing dotnet SDK refuses with a remedy. Tests use a portable test double for the dotnet binary (not a POSIX shell script, v1 broke on Windows with that). Docs: docs/reference/config.md and docs/schemas/config.json (`[evidence.dotnet]`), docs/design/build-test-ci.md and tickets.md provider list."
