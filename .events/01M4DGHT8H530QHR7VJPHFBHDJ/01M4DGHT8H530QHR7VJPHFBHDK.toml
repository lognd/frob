scope = ["crates/gob-config/src/schema.rs", "docs/schemas/config.json"]
body = "found while working ~CDMAECH. docs/schemas/config.json has $ref to #/$defs/ForbidImport (also FailOn, ToolStage, ExternalPack, Pull) but no $defs object, so the GRL catalog cannot type the columns of config.invariants.forbid_imports. The exporter (schemars subschemas) must carry the definitions into the document root. gob-plan reads $defs when present (ConfigSchema::from_json)."
