Filed: none
Gates: frob check --ticket T-0022 clean (0 errors, exit 0)

type002() now exempts any font-family declaration carrying at least one
var() reference (checked via Declaration.var_refs, mirroring how
COLOR001/COLOR002 treat var() refs as conformant by construction) --
a token-provided family stack, including one mixing a var() ref with
literal names, is never split and matched against spec.typography.families.
This was the root cause of scaffold's own generated base/reset.css
(`font-family: var(--font-family-base);`) failing `crunk check`
immediately after `crunk init`, violating CT-01. scaffold/write.py
needed no change -- the starter reset.css is correct as written, the
bug was entirely in the rule's inability to recognize a var() reference.
Added regression tests for the var()-only, literal-off-family, and
mixed var()+literal cases, plus a CT-01-level end-to-end test that
scaffolds the default preset into tmp_path and asserts run_rules
yields zero unwaived error-severity violations. Documented the
mixed-stack softness (exempt wholesale rather than checking the
literal tail) in docs/design/subsystems/rules.md's TYPE002 bullet.

