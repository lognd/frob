body = "Audit report: /tmp/claude-1000/-home-logan-projects-frob/9dfed69c-963b-4123-8ee8-0030bb0775b3/scratchpad/grimble-audit.md. A may grant has no until=, no profile (test-only network, dev-only stdout), and policies cannot be composed beyond packs and include. Temporary grants therefore become permanent and test-only needs (tests spawning processes) are granted to whole trees (design/model.grmb in this repo grants exec at crates/*/tests/**). Add `until=DATE` on may (expired grant is an error), `profile test|prod|NAME` scoping selected by config or selector, and `policy NAME { ... }` blocks a node can `use`."
