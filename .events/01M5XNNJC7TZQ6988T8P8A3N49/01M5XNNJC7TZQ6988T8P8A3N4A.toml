body = "Audit report: /tmp/claude-1000/-home-logan-projects-frob/9dfed69c-963b-4123-8ee8-0030bb0775b3/scratchpad/grimble-audit.md. grimble-model.md 9.6 says 'There is one callee-vocabulary table per language; the NEAT [neat.effects] tables and grimble's detectors are views over it'. In fact there are five: gob-ir registry + grimble-model atoms (CAP), gob-symbols/src/ambient.rs (clock, rng, env, stdio, exit), grimble-check/src/effects.rs (COH002, the only one with TypeScript), grimble-lints/src/neat/mod.rs:107-122 plus the closed Atom enum in neat/effects.rs (frob:effects claims use words net/env/stdio that are not CAP atoms), and gob-trust/src/effects (pack broker). They disagree (NEAT knows TcpStream::connect as net; CAP detects no network). Make the registry the single source and derive the others from it. Related: ~T28A73Q (COH002 tables into gob-caps) and ~WNH8N7X (vocab classes for NEAT013); this ticket is the umbrella merge and must not duplicate their acceptance."
