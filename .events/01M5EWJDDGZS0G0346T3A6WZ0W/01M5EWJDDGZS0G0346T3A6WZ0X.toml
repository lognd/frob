body = "Found while working ~VR8VGH2. run_locked calls select(items, &Cursors::default(), ..) every run, so Update/Create/Reconcile use a fixed order and are never persisted round robin, and select re-sorts the sweep batch so with sweep_k greater than the budget capacity the lowest-sorted ticket is always served first and later ones starve."
