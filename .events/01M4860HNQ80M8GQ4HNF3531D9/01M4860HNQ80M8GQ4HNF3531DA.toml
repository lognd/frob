body = "Seen 2026-10-06 on every frob doctor run in the primary checkout: WARN frob_worktree::gc::jail: gc refused a path outside its roots path=.frob/warm-sweep-stage resolved=.frob/warm-sweep-stage. The warm-sweep stage is a detached git worktree frob itself creates under .frob/; either gc's roots must include it (and gc must handle it as a worktree, not a plain directory) or the stage must live where gc expects it. The jail must stay strict for real outside paths."
