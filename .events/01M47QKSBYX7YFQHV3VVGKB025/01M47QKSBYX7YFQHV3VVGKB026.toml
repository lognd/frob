body = "language-engines.md sections 2 and 3. The TS/TSX adapter lowers JSX elements to markup: intrinsic tags as apply(kind=element) with a literal head, component tags (capitalised or member expressions) with a ref head resolved through the scope graph so component use is a call edge, attributes as named args with const_value values, spreads at status May, fragments, conditional and mapped children as group. style={{...}} objects lower to style declarations; CSS-in-JS template literals tagged css become a region island in css. Replaces the extraction half of ~8JGRZY3."
