acceptance = ["Given a C# file with a frob directive in a // comment and a bare TODO in a /// comment, when frob check runs, then the directive binds to the member below and TODO001 fires", "Given a C# string literal (regular, verbatim, interpolated, raw) containing // or /*, when the comment scanners run, then no comment is reported inside the string", "Given a C# file with a syntax error, when it is parsed, then the partial tree is reported as a parse gap and never as an empty clean file"]
body = "Language::CSharp (.cs, .csx excluded; .cs only) in crates/gob-languages (language.rs, grammar.rs, parse.rs, comments.rs, query.rs): tree-sitter-c-sharp pinned the way the Rust and Python grammars are (grammar_version recorded for the cache key, hash.rs). Both comment scanners learn C# comment syntax: `//`, `///` XML doc lines, block and `/** */` comments, honoring verbatim, interpolated and raw string literals so a `//` inside a string is not a comment. That makes frob directives, accepts and TODO001 work in C# files. Preprocessor lines (#if, #region) are not comments but must not break scanning. Docs: docs/reference/directives.md (C# comment forms), docs/reference/fidelity.md language list. Same files as ~17ZVW3R (TS/TSX/CSS grammars): sequence or coordinate leases, do not both edit comments.rs at once."
