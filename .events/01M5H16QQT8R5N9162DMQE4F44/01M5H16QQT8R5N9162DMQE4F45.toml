body = "Follow-up of ~M8WETW7, which moved the v1 importer (and the frob-ledger/frob-evidence imports) out of gob-dev into frob-evidence. gob-dev still depends on frob-check (products.rs rule indexes, ci.rs ToolStage), frob-cli (lib.rs cli(), verb tests) and frob-mirror (render/schemas.rs issue projection schema) for doc generation. Invert via data the frob side registers or a generator binary living on the frob side, then drop the layering.rs allow rows and any remaining gob->frob flow. Also: docs/migration/v1-import.md and docs/guides/upgrade-from-v1.md still name the old 'cargo dev import-v1-tickets' command; now 'cargo run -p frob-evidence --example import_v1' (could not edit docs/** under ~M8WETW7: held by another lease)."
