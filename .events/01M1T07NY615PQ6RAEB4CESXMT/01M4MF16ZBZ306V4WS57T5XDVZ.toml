body = "Design note. (1) The ticket was written against the v1 Python tree: src/frob/gates/_protocol_summary.py does not exist in this repository, so there is no release-postdominance machinery to reuse. Narrowing: this ticket lands the detector grimble_lints::res::scan (TypeScript/JavaScript/TSX/JSX), the same shape as ERR001-003 (detector landed, rule declaration follows because grimble has no #[rule] crate yet; product_rules.rs is empty). Rule declaration, page, corpus and gen all go to a follow-up ticket blocked by ~7YMB3EQ. (2) Table: PAIRS: &[Pair] with Pair { id, acquire: Call(callee text) | Method(name, optional receiver constructor) | New(constructor), release: names, scope: ClassOrFunction | ClassOrFile | File, same_receiver, needs_handle }. Rows: performance.mark/clearMarks (File); Map.set on a new Map receiver / delete,clear (ClassOrFile); setTimeout/clearTimeout and setInterval/clearInterval (ClassOrFunction, needs_handle); addEventListener/removeEventListener (same receiver); URL.createObjectURL/revokeObjectURL; new AbortController bound to a name / .abort on that name. (3) Release must appear anywhere in the scope (class, else outermost function, else file); it is structural, not path-sensitive, so 'on all exit paths' is not claimed. A bound handle that is referenced elsewhere in the scope (returned, passed on) is Certainty::Unknown. Unbound results of needs_handle calls are Unknown (fire and forget). Sites inside describe/it/test/before*/after* callbacks are skipped."
at = "2026-10-11T03:10:19Z"
