# v1 done-report

## Done report

alpha_channels=true (r9, A-035) now makes `render_css` emit
`--<color token>-rgb: R G B` triplets after every base color var
(entries()/token_names() cover them for free) and `render_tailwind` map
colors as `rgb(var(--<color token>-rgb) / <alpha-value>)`. TW003 warns
when a scanned `<prefix>-<key>/<digits>` utility's tw_theme mapping
lacks the `<alpha-value>` placeholder, silent when the mapping is
absent or already alpha-capable; registered in the catalog (WARN) and
the rules engine. docs/commands/tokens.md documents the emission shape.

Filed: none (no out-of-scope discoveries).
