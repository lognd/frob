 1 file changed, 13 insertions(+), 3 deletions(-)
```

### Evidence
- `tests/system/test_e2e_52_config.py::test_e2e_52_borrowed_spec_judges_tree_with_no_crunk_toml` (pytest node id, verified passing when recorded)
