- `tests/ticket_land_suite/test_land_dry_run_squash_preview.py::TestDryRunSquashPreviewPreCommitChecks::test_dry_run_pre_commit_sweep_preview_is_clean_when_the_sweep_passes` (pytest node id, verified passing when recorded)

