# v1 done-report

## Done report

Implemented INT-01..08, the system integration test plan pinning the seam
between every pair of adjacent crunk subsystems per docs/design/03-system-design.md
and docs/design/subsystems/*.md. Each test file builds a real fixture project
under tmp_path and exercises real modules end to end (no subprocess, no mocks
on internal code): spec<-toml (including the full documented example verbatim
and each SpecError.Invalid variant), ingest<-fs (all buckets + tokens + stray +
corrupt file + waiver attachment), rules<-(spec+ingest) (a full-catalog fixture
planting exactly one violation per non-shell rule and asserting the exact
planted set plus a [lint] severity override), tokens<-spec (golden css/json
export, byte-identical re-render), fixes<-(rules+ingest) (exact-span rewrite
plus INV-FIX-02: re-running rules on the fixed tree is clean for the fixed
rules), report (terminal text color on/off, documented JSON shape), shell
wiring (App(cfg)() exit codes 0/1/2 across all five commands), and scaffold
(both presets scaffold, reload through spec, and lint clean via run_rules).

Confirmed empirically (via a fresh scaffold+ingest+run_rules run) that the
TYPE002 false positive test_app.py's `project` fixture comment references does
not reproduce against current code -- the current code's var_refs exemption
already covers reset.css's `font-family: var(--font-family-base);` -- so
INT-07/INT-08 use unpatched scaffold output directly. No out-of-scope bugs
found; no new tickets filed.

WIRE001 fired on tests/integration/test_int_06_report.py's synthetic
Violation(rule="COLOR001"/"SPACE001"/"ORG001") literals, since those crunk
domain lint rule ids syntactically collide with frob's own gate-rule-id
