acceptance = ["After frob test --base, a cargo build in the same worktree rebuilds every file changed versus the base"]
body = "Seen four times in cadetta (worktrees whose target links to .git/frob/land-target): after frob test --base main, later cargo build/nextest in the worktree compiled OLD sources (removed struct field still present, bogus compile errors) until every changed .rs file was touched. Hypothesis: the base-ref source swap and restore leaves restored file mtimes no newer than the fingerprints written while base sources were in place, so cargo treats them as fresh; the shared land-target makes it visible across runs. Fix idea: bump mtimes of restored files, or build the base in a separate checkout and target; add a regression test. Reporter: cadetta coordinator session."
