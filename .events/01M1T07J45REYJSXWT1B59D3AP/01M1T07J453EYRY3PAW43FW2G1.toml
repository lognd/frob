body = "Every crunk run wrote a cache directory into the adopting repo, tripping their scope gate and getting deleted twice by an agent; the borrower case writes into a tree crunk does not own at all. r17: the result cache lives in the user cache directory keyed by a hash of the resolved project root, overridable via one environment variable; no repo writes, no gitignore management needed; the scaffold stops adding the obsolete ignore line; key semantics and INV-CACHE-01 unchanged."
