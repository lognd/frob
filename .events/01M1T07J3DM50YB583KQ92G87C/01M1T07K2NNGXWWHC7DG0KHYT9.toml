# v1 done-report

## Done report

Fixed utility_token_map's theme-value token extraction: it was anchored to
the bare `^var(--name)$` shape, so it went blind whenever alpha_channels
wrapped the reference in `rgb(var(--x-rgb) / <alpha-value>)` or any other
var()-wrapping form (color-mix included) -- exactly the config the
adopting shell runs. Now searches for the FIRST var(--name) anywhere in
the value. A -rgb name found this way marks its parent color token as
used too (consuming the channel form genuinely consumes both): unused()
expands extra_used with -rgb parents, and explain()/`_utility_sites` treat
a utility mapped to X's -rgb companion as a use site/utility for X as
well, keeping explain's "never under-report usage relative to check"
contract intact for the parent token.

