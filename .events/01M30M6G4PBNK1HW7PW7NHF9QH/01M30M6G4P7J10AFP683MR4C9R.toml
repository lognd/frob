body = '''found while working T-4712: a directive whose target is QUOTED (frob:tests "some title") and is immediately followed on the same physical line by a bare '# noqa: E501' comment (no other attrs) fails to parse -- MalformedDirective 'bad attribute syntax: ...'. Root cause: _QUOTED_TARGET_RE's trailing \s* already consumes the whitespace between the closing quote and the '#', so _parse_attrs' tail-comment regex (?<=\s)# never matches (it requires a preceding space still present in attr_text) and the noqa text is misread as an unparseable attribute instead of being recognized and stripped as a trailing suppression marker. T-4712's quoted-target wrap narrowing (never cutting inside a quoted target) newly produces this exact shape (an otherwise-unsplittable quoted target getting the unsplittable-remainder noqa suffix appended directly after it) where previously the naive word-boundary wrapper always found SOME cut point inside the quote first.'''
