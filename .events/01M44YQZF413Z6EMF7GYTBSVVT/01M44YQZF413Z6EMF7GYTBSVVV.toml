body = "frob init (crates/frob/src/init.rs, first_run.rs, config.rs) detects ProjectSettings/ProjectVersion.txt and, when found, prints a suggestion with the exact config line to enable the unity pack and the detected editor version; it never enables it silently and is idempotent. Also suggests nothing when a .sln/.csproj-only repository is found (plain .NET needs no pack). Docs: docs/reference/cli/frob.md init section, docs/guides."
