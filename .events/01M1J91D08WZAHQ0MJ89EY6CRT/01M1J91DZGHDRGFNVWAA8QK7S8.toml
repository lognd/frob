(GATERULE001, 13 errors) -- a documented frob defect, not an crunk
defect: GATERULE001 scans src/ for any PREFIX### string literal and
demands it be registered in frob's OWN _KNOWN_GATE_RULES registry
(frob.gates._waive), assuming every scanned repo is frob itself.
crunk's rule catalog (COLOR001, SPACE001, ...) legitimately shares
that shape by convention but names crunk's own domain, not frob's.
Confirmed unwaivable (frob:waive GATERULE001 tried directly above a
flagged line; gate still fires -- T-2448 documents it as a mandatory
"STANDING gate", not opt-out). No in-scope fix exists: registering in
src/frob/gates/_waive.py is out of T-0008's scope and would be
semantically wrong. Logged in this worktree's untracked FROBLEMS.md
(2026-09-03 entry) with full detail. Every other gate family (WIRE,
COV, DRIFT, LANDPARITY, PRE, TEST, SCOPE, TICK, PERF, ROOT, ty,
ruff-check, ruff-format) is clean or waived through the normal
frob:waive mechanism.

