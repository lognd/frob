(bound to acceptance criterion 1 via `frob ticket evidence --accepts 1`)

Filed: none

Gates: `frob check --ticket T-0106` clean (gate-summary: 0 errors, 5 waived,
all pre-existing waivers untouched). `frob coverage --full --fail-on-degraded`
clean. Full suite (`pytest tests/ -q -n 2`) green, 689 tests.

Notes: the field crash was the raw `_token_groups(spec)[full_name]` dict
lookup in `explain` -- fixed by (1) `_token_groups` now adds every
`-rgb` companion under group "color-channels" when
`spec.tailwind.alpha_channels` is set, mirroring exactly what
`tokens.render.entries` emits, and (2) the groups lookup itself is now a
guarded `.get()` returning `QueryError.UnknownToken` on any miss, so no
lookup in `explain` can escape as a raised exception regardless of shape
(including a name present in `entries` but engineered absent from
`groups`, covered by an explicit adversarial unit test).

`query/models.py` needed no changes -- `ExplainAnswer.group`/`.value` are
already generic strings, sufficient for the channel-form answer.

Frob misbehavior encountered: `frob coverage --full --fail-on-degraded`
was reproducibly RED (pytest exit 1) via frob's own watchdog-spawned
subprocess while the IDENTICAL pytest+coverage invocation, run directly,
passed cleanly -- this is the same fleet-contention-flavored discrepancy
already on record from T-0050's done report. This time it was traceable
to something real, not just contention: my new E2E-46 subprocess tests
assert the literal absence of "Traceback" in the CLI subprocess's stderr;
under `frob coverage`'s `COVERAGE_PROCESS_START` (set only for its own
pytest pass, to instrument child processes too), Python's own
`coverage`-installed `.pth` site hook can itself emit a traceback to
stderr under heavy concurrent xdist load -- a race in
`coverage.process_startup`, unrelated to crunk. Fixed in-scope by
stripping `COVERAGE_PROCESS_START`/`COVERAGE_PROCESS_CONFIG` from the
child env inside the new test file's own subprocess helper (not
`conftest.py`, which is out of scope) -- confirmed green afterward both
under plain pytest and with `COVERAGE_PROCESS_START` forced in the
environment.

Separately, `ty` flagged a `no-matching-overload` on the same helper
until `env.pop(...)` mutation was replaced with a fresh filtered dict
comprehension -- `ty` apparently narrows a `dict[str, str]` incompatibly
after a `.pop(key, None)` call; harmless to work around, but worth a
`frob:todo` if that pattern recurs elsewhere in this repo.

