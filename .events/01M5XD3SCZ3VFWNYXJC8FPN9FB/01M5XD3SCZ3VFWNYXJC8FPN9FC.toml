body = "frob wraps test runners for Rust, Python, JS/TS and C# (nextest, pytest, vitest/jest, dotnet/unity) but only reads a hand-made lcov.info (COV004). Every language we can test must also be measured by frob, produce a normalised lcov report, bind coverage as evidence on the ticket, and be checked by COV004 like any other gate. Owner requirement: no tested language may lack coverage."
