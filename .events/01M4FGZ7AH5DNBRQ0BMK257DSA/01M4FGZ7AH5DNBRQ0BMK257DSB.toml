body = "Repros 05-carries-pii-no-construct (~/projects/frob-v2-repros/logand-grimble-20261009/05-carries-pii-no-construct), 07-secret-and-resource-kinds (~/projects/frob-v2-repros/logand-grimble-20261009/07-secret-and-resource-kinds) and 08-retention-years (~/projects/frob-v2-repros/logand-grimble-20261009/08-retention-years). 14.1 item 16 says carries becomes a PII pack (~QVSC54Z) and secret/resource are kinds, but core kinds are six and node_kind needs the unloaded packs. Decide: (1) the attr convention for data categories until the PII pack, (2) whether secret and resource are core kinds or pack node_kinds with REL200 and SYS203 semantics, (3) calendar units y and mo for retention and string attr keys. Record in grmb-spec 2.2, 4.1, 14.1 and packs.md."
