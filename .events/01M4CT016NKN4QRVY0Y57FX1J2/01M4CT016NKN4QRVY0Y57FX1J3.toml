body = "Scrum: work comes from the sprint backlog. When a cycle is active and [pm] sprint_gate = true (new knob, default true for repositories with cycles, materialized by frob init), work/start refuses a ticket that is not a member of the active cycle (E-PM-NOT-IN-CYCLE), except class expedite; --unplanned --reason TEXT assigns it to the active cycle as an over-commit with the reason recorded in the event, so unplanned work is visible in the retro and the commitment ratio. pm-enforcement.md gets the rule."
