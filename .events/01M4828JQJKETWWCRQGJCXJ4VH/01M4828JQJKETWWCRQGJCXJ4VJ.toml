body = "Found while working ~6KKJF80. Two honest gaps of the TS adapter, both reported Unknown today: (1) exports.f = function(){} and module.exports = { f() {} } create no unit (only identifier aliases do); (2) binders are function-level, so a block-scoped let that shadows an outer name hides it for the whole function. Add units for CJS function-expression exports and block-level scopes in the scope graph, with corpus tests."
