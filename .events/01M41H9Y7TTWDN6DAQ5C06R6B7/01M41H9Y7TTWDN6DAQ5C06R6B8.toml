body = "Found by ~V92VDGB: of about 1020 check warnings on this repository, 894 are SYS001 'N unowned file(s) in tickets/<ULID>', one per ticket directory, and consumer repositories (cloc, mdcat, goway) will see the same once their ledgers grow. The ledger directory (and other frob-owned paths: changelog.d fragments, frob.lock, .frob/) belongs to frob itself, not to any node of the user's design model. frob should pass its owned paths to grimble as an implicit owner (a built-in 'frob ledger' owner in the binding owner function, or excluded from SYS001's universe), so SYS001 never reports them; the ledger path comes from configuration, not a hard-coded tickets/. Decide which of the two fits binding.md and record it there."
