# v1 done-report

## Done report

Diagnosis: explain's sites came exclusively from uses(styles, name), which
walks Declaration.var_refs (var() references in CSS and JSX inline
styles) and never looked at Stylesheet.utilities (JSX className Tailwind
utility tokens). On the field fixture ([tokens.prefixes] color="",
palette key bg-primary, tailwind theme "bg-primary" -> "var(--bg-primary)",
TSX className "bg-bg-primary", no inline-style var() ref anywhere),
utility_token_map(styles) already resolved "bg-bg-primary" -> "--bg-primary"
correctly (utility.name.split("-",1)[1] gives "bg-primary", which matches
the tw_theme key) -- so explain's `utilities` list was actually fine; only
`sites` was empty, matching "no sites reference it" from the field report.
Fix: added _utility_sites(styles, utility_map, full_name), which walks the
SAME styles.sheets / utility_map objects check's TW rules use (no second
parse) and emits a (sheet path, line) site for every LocatedUtility whose
mapped token equals the explained name; explain now unions these with
uses()'s var()-ref sites, sorted the same way uses() sorts.

Changed:
  src/crunk/query/engine.py::_utility_sites (new)
  src/crunk/query/engine.py::explain

Evidence:
  tests/system/test_e2e_34_explain_jsx.py::test_e2e_34_explain_lists_jsx_utility_only_site
