(gate:SCOPE, gate:PREWORK, gate:COV's diff-driven COV002/TODO001,
gate:FMT, gate:AFFECT -- AFFECT001 pre-existing waiver covers explain's
edits). Repo-wide gate:DOC (pre-existing tickets/T-0086/ticket.md
DOC006 on an illustrative [tokens.prefixes] reference, outside this
ticket's scope globs and predating this diff) and gate:FLAGCOV
(pre-existing parser-resolution issue, unrelated to explain) remain
red but are unrelated to this change and out of scope per the
scope-note. frob coverage --full --fail-on-degraded run and
frob-coverage.lock.json committed.

