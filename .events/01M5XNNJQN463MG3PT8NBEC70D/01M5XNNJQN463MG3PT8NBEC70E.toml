body = "Audit report: /tmp/claude-1000/-home-logan-projects-frob/9dfed69c-963b-4123-8ee8-0030bb0775b3/scratchpad/grimble-audit.md. claim noflow/reach are refuted only against DECLARED flows (grmb-spec 4.4); there is no 'node X never uses net' claim and no code-level data-flow: labels live on declared flows only, so a Secret read from env reaching println! or an HTTP body is unseen. Add `claim never <node|selector> uses <atom>[(args)]` evaluated against observed (and transitive) uses, and taint rules: sources (env.read of secret-class names, fs.read of secret-shaped paths per gob-trust is_secret_path, declared Secret flows) must not reach sink atoms (stdio.write, log, net.connect, fs.write outside declared stores) without a declassify boundary symbol. Depends on the transitive-summaries ticket for the never-claim and on the v3 spec."
