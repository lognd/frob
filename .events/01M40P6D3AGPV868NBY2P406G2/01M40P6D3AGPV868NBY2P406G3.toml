acceptance = ['Given a regex string "a{2" in a where clause, when parsed, then it is a literal string with no error']
body = 'Limitation from ~MVY3DFK: the lexer splits every string into text and interpolation parts without knowing the position, so an unbalanced { or a {...} containing a quote in a non-message string (a regex string like "a{2" or a glob) fails in the lexer before the parser can treat it as literal; the workaround is \{. Make the lexer emit raw string tokens (escape-checked only) and move interpolation splitting into the parser for message positions only, so non-message strings never fail on braces. Keep spans exact; update malformed cases.'
