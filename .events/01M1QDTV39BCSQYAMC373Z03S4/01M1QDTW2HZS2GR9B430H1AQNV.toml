# v1 done-report

## Done report

Field bug: prettier-style rewrapping of the generated JSON artifacts
(tailwind.tokens.json, the flat json_file) was reported as TOKENS001 drift
even though the DATA was untouched, because the check compared bytes.
Added `_file_status_json` (parsed json.loads equality; unparseable on-disk
content counts as drifted; missing stays missing) and wired it into
`check_tokens_files` for both the tailwind and flat json artifacts.
`tokens.css` keeps its existing byte-exact `_file_status` comparison.

Filed: none (small ticket, no out-of-scope discoveries)

Evidence: 12 pytest node ids bound to acceptance [1] via
`frob ticket evidence T-0105 ... --accepts 1` (9 unit tests in
tests/unit/test_tokens_drift.py covering rewrap-clean/value-edit-drifts/
unparseable-drifts/missing/css-byte-exact for both json artifacts, plus
3 E2E-48 system tests in tests/system/test_e2e_48_semantic_drift.py
driving `crunk tokens --check` end to end).

Gates: `frob check --ticket T-0105` clean (0 errors; the sole UNRES row,
gate:FLAGCOV, is a pre-existing repo-wide parser-resolution issue
unrelated to this ticket's scope). `frob coverage --full
--fail-on-degraded` run and stamped. Full suite: 646 passed
(`FROB_SUGGEST_ACK=1 uv run pytest tests/ -n 2`).

