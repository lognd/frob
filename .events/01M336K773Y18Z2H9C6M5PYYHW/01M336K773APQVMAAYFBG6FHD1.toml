body = "Traceback captured 2026-09-22 22:03 with faulthandler on a wedged land (T-5267, 18 min at 100 percent CPU; T-5291 for 52 min): apply_tier_a_fixes -> fix_docarch002_narrative_move -> _docarch002_fix_one_file -> _docarch002_migrate_one -> _docarch002_existing_body -> tickets._store.load_archive -> yaml.load: the full archived-ticket YAML parse runs once PER DOCARCH002 finding, and the pre-land pass is repo-wide (thousands of findings), so a land never reaches its first phase stamp. It also performs ledger body writes (set_body) for every finding as a side effect of landing an unrelated ticket. Coordinator hotfix e1b14b8248 unregistered DOCARCH002 from TIER_A_HANDLERS on dev. Proper fix: load the archive once per run (memoize on the snapshot), never write the ledger from a pre-land pass, scope the handler to the landing ticket's touched files (T-5106 note), then re-register with a positive control: a pre-land pass over a fixture with 50 DOCARCH002 findings loads the archive once and makes zero ledger writes."
