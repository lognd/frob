body = "found while working ~X5W2SPP: pack.families requires 2+ capital letters A-Z (validate.rs family) and is_rule_id requires [A-Z]+[0-9]{3} (lexer.rs), so the crunk-web family A11Y and rule ids like A11Y101 are rejected (PACK005 / 'not a valid name or rule id'). Fix: allow digits after the first letter in family prefixes (e.g. [A-Z][A-Z0-9]+ ending in a letter or digit) and rule ids ([A-Z][A-Z0-9]*[0-9]{3}), keep crates/crunk-rules/src/family.rs consistent."
