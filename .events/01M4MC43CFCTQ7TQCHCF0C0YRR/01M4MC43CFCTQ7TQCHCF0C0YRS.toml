body = "Found while picking up ~A4HFP5X. The example runner must turn an example's source (rust, python, markdown, json, ...) into the gob-ir Model the executor reads. gob-plan depends only on gob-caps, gob-ir, gob-rules and gob-text, and no crate exposes a source-text-plus-language to Model function; today's models come from grimble-bind or hand-built TermBuilders in tests. Add one such function (parse errors become opaque or hole nodes) that gob-plan can call without pulling in a product crate."
