body = "Found on ~5Y8JFGW: frob init writes merge.frob-ledger.driver = 'frob merge-driver %O %A %B %P'. On a machine where 'frob' on PATH is another frob (here v1 0.531.1 from ~/.local/bin, while v2 runs from a build path), git would run the wrong binary on ledger files during a merge, risking corrupted or lost ledger data. The coordinator pinned this repository's config to the v2 binary by hand. Fix: init resolves 'frob' on PATH and compares it with the running executable (path and version); if they differ, it writes the running executable's absolute path into the driver command and says so (with a --driver-command override), and doctor reports a driver command that resolves to a different frob than the running one. Test both cases."
