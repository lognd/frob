body = "Reported from the cloc repository (FROB_FEEDBACK.md item 4): frob ack (needed to attest frob:accept, EXC005) commits frob.lock on the ticket branch, and the next check --ticket reports SCOPE001 frob.lock is outside the scope lease, so every ticket that acks needs a manual scope widening. frob.lock and grimble.lock are bookkeeping written by frob's own verbs, like the ledger directory that SCOPE001 already exempts (~SF903MG): exempt them in branch_changes, while keeping drift rules on their content. Test: ack on a ticket branch, then check --ticket: no SCOPE001 for the lock."
