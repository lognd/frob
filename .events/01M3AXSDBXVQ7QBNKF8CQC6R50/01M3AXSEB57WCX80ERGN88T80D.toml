   of the code: squawk (T-5333) legitimately shares sql_relevance with
   sqlfluff as a second REQUIRED_FOR_FAMILY entry, so 2 findings on a
   SQL-relevant repo with all tools mocked absent is correct, not a bug.
3. Exported frob.doctor.FamilyToolFinding/family_required_tool_findings
   from src/frob/__init__.py.
4. Declared sqlfluff in tests/unit/test_runtime_deps.py's
   _ALLOWED_UNDECLARED (entry-points-gated import, same shape as z3),
   not _DIST_FOR_IMPORT (it is an optional sql extra, not a core dep).

Discovered scope creep: TestCheckCoverageReg008BurnDown and
test_gate_rule_entries_match_live_known_rules both already fail on true
dev HEAD independent of this ticket -- ~233 other reserved-not-yet-
implemented gate rule ids (WEBSEC/COMPLY/A11Y/SEO/WEBPERF/SQL101-122)
carry the same handled_by-with-no-frob:enforces-edge shape. Filed
T-6553 for that pre-existing debt; it is too broad for this
ticket's own small patch and was not introduced by the SQL/LAUNCH
landing this ticket closes out.

