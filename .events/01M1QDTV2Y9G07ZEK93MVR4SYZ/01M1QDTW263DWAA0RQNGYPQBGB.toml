r9/A-037 wired `check --report`'s unused-token list through the SAME
machinery `query unused` uses -- no second implementation. Extracted
`_unused_token_names(spec, styles)` in app.py: `query.unused` +
`tokens.token_names` + `query.utility_token_map`'s values as `extra_used`,
exactly the wiring `_run_query_styled`'s `unused` branch already had.
Both `_run_query_styled` (via a fresh `UnusedAnswer`) and
`_print_check_report` now call this one helper, so the two surfaces
cannot drift out of sync (verified directly by
test_run_check_report_unused_matches_query_unused and the E2E-39 system
test, both running `check --report --json` and `query unused --json`
against the same fixture and asserting the two lists are identical).

`render_report` gained an "# Unused" Markdown section (sorted names,
"(none)" when empty) and `render_report_json` gained a top-level
`unused_tokens` list (sorted), positioned between `tokens` and `files`
per the 02-specification.md v2 schema example. docs/commands/check.md's
`--report` bullet now describes the Unused section and the
`unused_tokens` field.

Gates: frob check --ticket T-0094 clean (0 errors repo-wide except the
pre-existing, unrelated FLAGCOV001 UNRES gate documented as broken
before this ticket touched anything). frob coverage --full
--fail-on-degraded ran clean before this report (stamped 129 files,
no degradation). Full suite (169 tests via -n 2) green.

