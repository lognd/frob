body = "Audit report: /tmp/claude-1000/-home-logan-projects-frob/9dfed69c-963b-4123-8ee8-0030bb0775b3/scratchpad/grimble-audit.md. grimble-model.md 9.6 and binding.md 7.2 item 4 promise that a language with no detector yields unknown cells and one Unresolved per node 'so an unmeasured node never reads as clean'. caps.rs:566-568 builds the matrix only over atoms that were observed, and report_no_detector (caps.rs:721-723) only handles pack atoms. Repro: a node owning web/a.ts with fs.writeFileSync, child_process.exec and fetch, and a node owning cs/A.cs with File.WriteAllText and Process.Start: zero CAP findings and zero CAP Unresolved. Same for shell scripts, Dockerfiles and CI YAML. Fix: build each node's row over every registered atom for every language it owns and emit the per-node Unresolved; then add TypeScript/JS and C# vocabularies (packs.md 8.1 lists the TypeScript rows)."
