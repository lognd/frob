kind = "create"
title = "Post-commit speculative frob check races an explicit frob check for the worktree check lock"
type = "bug"
category = "todo"
priority = "medium"
scope = ["crates/frob-worktree/**", "crates/frob-check/**"]
body = "The post-commit hook (crates/frob-worktree/src/post_commit.rs) detaches 'frob check --ticket' which holds .frob/check.lock; a user or script running 'frob check --ticket' right after 'git commit' gets E-CHECK-CONCURRENT (exit 3). Seen in CI as quickstart_runs_from_init_to_land. KG4VEGB masks it in the doc tests with FROB_NO_SPECULATIVE_CHECK=1. Fix: let an explicit check wait for or supersede the speculative one, or run the speculative check without the full-run lock."
