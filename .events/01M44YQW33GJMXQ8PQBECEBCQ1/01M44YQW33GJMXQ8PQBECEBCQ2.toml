body = "Project discovery in crates/gob-symbols (new dotnet.rs beside crates.rs and paths.rs): parse .sln (project entries, solution folders) and SDK-style and legacy .csproj (Compile globs and default includes, ProjectReference, PackageReference names, RootNamespace, AssemblyName, ImplicitUsings, TargetFramework(s), LangVersion). Each project maps to the existing package/unit notion so ownership, reach and test selection work unchanged; a file belongs to the nearest enclosing project; bin/ and obj/ are ignored. Cross-project references become package dependency edges. Implicit usings from ImplicitUsings feed the import resolution left Unresolved by the calls story. Malformed project files are reported, never dropped. Docs: docs/design/code-model.md package notion section and docs/reference/config.md if a config key is added."
