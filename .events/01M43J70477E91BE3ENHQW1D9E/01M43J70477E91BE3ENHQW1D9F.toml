body = "Observed 2026-10-04 on goway helper quasar under a wave of concurrent builds: gob-git test twenty_four_concurrent_writers_all_win_with_backoff failed with CasExhausted during cargo dev ci for ~M0388X5 (unrelated change). The test asserts every one of 24 concurrent writers eventually wins; under CPU contention the bounded retry budget runs out. Decide structurally: either the retry budget is time-based with jittered backoff sized so the property holds under load (and the test proves it with a deterministic scheduler or injected clock), or the property is weakened to what the product actually guarantees and the test asserts that. The test must not depend on wall-clock speed of the host."
