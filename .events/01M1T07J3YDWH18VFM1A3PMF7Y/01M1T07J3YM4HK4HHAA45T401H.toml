body = "A sibling branch predating the crunk adoption cannot run check because the spec file lives on another branch. Design: an explicit global --config PATH flag separating spec location from project root (root stays cwd, paths resolve against root as ever); deliberately NO upward discovery -- silently picking a config up the tree is magic that misfires. load_spec_file already provides the seam."
