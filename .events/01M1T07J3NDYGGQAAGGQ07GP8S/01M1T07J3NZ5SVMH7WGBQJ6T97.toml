body = "The adopting project's Shell.tsx mobile-nav dropdown consumes z-footer inside a template-literal className with interpolation; the scanner skipped the whole template so unused_tokens reported a false dead layer. r12 rule: inside a className expression every string-literal fragment and template-literal static segment is a utility-candidate list; tokens touching an interpolation boundary are dropped; .ts template constants get the same static-segment scan. Covers clsx/cn helper-call literals for free."
