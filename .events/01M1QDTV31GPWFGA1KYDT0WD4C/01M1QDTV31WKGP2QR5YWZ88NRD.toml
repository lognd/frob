body = "Two customer decisions: width/height ARE judged (as SIZE001 with its own sizes scale, spacing fallback, max-width exempt -- the coordinator's recommendation over widening SPACE001) and viewport discipline becomes design law: declared breakpoints, BP001 (media query uses an undeclared viewport number), BP002 (responsive-variant utility in a base-required family with no unprefixed mobile base -- desktop-only styling with undefined mobile behavior), BP003 (fixed width wider than the smallest declared breakpoint guarantees horizontal overflow on mobile). The static-enforcement boundary is stated honestly: crunk cannot prove mobile correctness, it makes these three surprise classes impossible."
