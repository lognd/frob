# v1 done-report

## Done report

Implemented root-relative output paths (CR-14) and check --contrast (A-006/A-007).

app/app.py: _run_check and _run_fix now rewrite each violation's path via
_relpath(path, cfg.root) (model_copy on the frozen Violation) right before
rendering, both terminal and JSON; _run_map passes cfg.root through to
render_map/render_map_json's new optional root= param, which defaults to
None (unchanged behavior) and relativizes sheet/stray paths when given.
_run_check gained a _run_check_contrast helper: check --contrast loads the
spec, skips ingest/rules entirely, renders render_contrast/render_contrast_json,
and exits 1 iff any [palette.roles] pair is below the 4.5 AA floor.

report/terminal.py: render_contrast(spec, use_color) -- one row per role
pair ("role  fg on bg  ratio (floor 4.5)  PASS|FAIL"), FAIL rows in red;
report/json_out.py: render_contrast_json(spec) -> {"version": 1, "pairs": [...]}.
The 4.5 floor lives in report.terminal.CONTRAST_AA_FLOOR -- NOT the intended
single crunk.spec.models home, because src/crunk/spec/** was under an
active scope lease held by T-0032 at implementation time (frob ticket
scope --add failed with ScopeLeaseConflict). rules/_contrast.py keeps its
own separate _AA_FLOOR unchanged (untouched, out of scope). This is a real,
documented duplication (docs/design/subsystems/report.md's new "Deviation"
section) with a follow-up ticket T-0042 filed to unify both once
the lease clears.

__main__.py/config.py: added --contrast -> AppConfig.check_contrast: bool,
forwarded via FORWARDED_FIELD_NAMES.

Docs updated: report.md (Path policy, render_contrast/_json contract,
UT-REP-05, the CONTRAST_AA_FLOOR deviation section), shell.md (r4 wiring
bullet, UT-SH-05 contrast part, UT-SH-06), 02-specification.md (--contrast
CLI/exit-code semantics, root-relative path rule, contrast JSON schema,
E2E-15), docs/commands/check.md (--contrast flag), plus README.md/
docs/index.md/docs/commands/{fix,init,map,tokens}.md touched only to
satisfy AFFECT001's doc closure on _build_parser/AppConfig/App (all true,
minor cross-references -- no semantic edits to those commands themselves).

Tests: UT-SH-05 (contrast round-trip through App), UT-SH-06 (relative
paths in check/fix/map, outside-root pass-through), UT-REP-05 (contrast
golden, both renderers), tests/system/test_e2e_15_output.py (E2E-15: full
round trip). No existing test asserted absolute paths, so nothing needed
weakening.

Full suite: 251 passed.

gate:SCOPE/PRE/COV(diff)/FMT/AFFECT -- the families --ticket scopes to
this diff -- are all clean. gate:DOC/REF/TEST/FLAGCOV failures and the
ruff-format drift on tests/system/test_e2e_05_tokens.py and
test_e2e_06_waiver.py are pre-existing repo-wide debt, verified via
a git stash A/B: identical error counts with this diff stashed out.
frob coverage --full --fail-on-degraded hit a FROB misbehavior (see
report to the user) unrelated to this ticket's code -- reported, not
fixed here.

