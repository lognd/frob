body = "Follow-up to T-5036 (repo_root memoization) and T-5075 (leases snapshot threading): with BOTH fixes applied, tests/gates_suite/test_tick.py TestTick008UnknownLedgerFields test_real_repo_ledger_is_tick008_clean STILL stalls (reproduced both locally on Linux, single-worker, and via winrun on Windows with faulthandler). New faulthandler dump shows a THIRD, previously-undiscovered bottleneck: doable() -> leased_by() -> _leased_by_one_holder() -> over_broad_literal_globs(root) (src/frob/tickets/_models.py) -> declared_source_prefixes(root) (src/frob/lang/_nodes.py) -> Path.resolve() -- same failure shape as T-5036's repo_root and T-5075's read_all_leases: an expensive, uncached-per-call operation invoked once per (ticket, holder) pair despite _leased_by_one_holder already receiving a precomputed breadth tuple (the T-0453 pattern), because over_broad_literal_globs(root) itself is called fresh inside the per-pair branch rather than being threaded in as part of that precomputed breadth. Fix direction: thread a precomputed literal_globs value into breadth (or a new parameter alongside it) the same way doable()/leased_by already thread breadth and worktree_leases, computed once per doable() invocation instead of once per pair. Verify via winrun with faulthandler after the fix, same recipe T-5036/T-5075 used."
