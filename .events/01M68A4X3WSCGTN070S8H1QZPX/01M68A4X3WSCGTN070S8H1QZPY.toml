acceptance = ["func Run(m reflect.Value) { m.Call(nil) } and a struct field of type reflect.Value called via s.m.Call report an Unresolved code.eval, never clean", "A clean control (a parameter of a locally declared type named Value) stays clean"]
body = "Found while working ~4RA3JAJ. go_uses types only calls to reflect APIs as reflect.Value; a parameter, field or return value DECLARED as reflect.Value is a Shadow and resolves to nothing, so the dispatch passes clean. Fix by resolving declared types through the import (symbolic), not by text."
