DIAGNOSIS (A-038 investigation): reproduced the .glass-panel shape
end-to-end (an [org].entry-matched entry stylesheet under
model = "utility-first", custom props nested inside @layer) both before
and after the channel-triplet fix. ORG004 already fired correctly for
both custom-prop definition sites in every variant tried (single-level
@layer, doubly-nested @layer, with and without an explicit [org].entry
glob, tokens_only_custom_props true). No defect exists in
rules/_org.py::org004 (it only exempts Bucket.TOKENS, never ENTRY) or in
ingest/parse.py's _walk_rules recursion into @layer/media/supports
at-rules -- both were already correct. The field report's "no ORG004"
observation traces entirely to the MISSING channel-triplet color fact:
before this ticket, a bare `40 40 40` custom-prop value produced no
LocatedColor at all, so COLOR001 never fired for that site. Seeing no
finding at all on that line read as "crunk missed both disciplines,"
but the ORG004 (tokens-only-custom-props) discipline was firing all
along -- only the color-value discipline was genuinely missing. Pinned
the already-correct ORG004 behavior against a future regression with
test_org004_fires_for_layer_nested_entry_sheet_custom_props.

CR-09 RESOLUTION (as directed by the ticket body): an exactly-matching
rgba literal (RGB channels equal to an OPAQUE palette entry's, e.g.
rgba(26, 26, 26, 0.7) against --color-ink #1a1a1a) stays conformant BY
VALUE under CR-09's existing alpha semantics (_color.py::is_conformant_color)
-- no COLOR001 for that literal, unchanged. The audit's actual finding
for that site is the custom-prop DEFINITION-site discipline (ORG004:
tokens_only_custom_props), not the value. This is asserted directly in
test_channel_triplet_and_exact_rgba_both_yield_color001 (no COLOR001 at
the exact-match rgba's line) and
test_glass_panel_definition_sites_both_yield_org004 (ORG004 at both
definition lines). CR-09 semantics are unchanged by this ticket. Per
the ticket's instruction to raise rather than unilaterally change this:
if the design intends an exact-match raw rgba literal used as a
custom-prop DEFINITION (as opposed to an ordinary declaration value) to
ALSO trip a value-level finding -- on the theory that even a
conformant-by-value literal should not live in a custom prop outside
the tokens file -- that would be a new rule/severity question, not a
CR-09 change; I did not make that change and flag it here as a question
for design rather than deciding it myself.

