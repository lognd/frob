# v1 done-report

## Done report

Every OS-level failure reading or resolving the configured `[tailwind].config`
path -- missing, permission-denied, or a bad/looping symlink -- now becomes a
`ParseDiagnostic` naming the path and the OS reason, mirroring the existing
per-CSS-file failure handling in walk.py. The walk continues with an empty
`tw_theme` mapping.

The specific field crash (a symlink loop from a mis-based node_modules) came
from `Path.resolve()`: on ELOOP, cpython's pathlib.check_eloop re-packages the
underlying OSError as a bare RuntimeError instead of letting it propagate as
OSError, so the resolve() call is now wrapped in `except (OSError,
RuntimeError)` with a comment explaining why RuntimeError is included in an
otherwise OS-family-only except clause. `tailwind.py` was audited and has no
path-touching code (it only parses already-read source text), so no change
was needed there.

Added two tests mirroring the neighboring unreadable-file coverage: a
self-referential symlink config path, and a chmod 000 config file (skipped
where root ignores the permission bit, same pattern as test_cache.py).

### Changed
```
 frob-coverage.lock.json   | 112 +++++++++++++++++++++++-----------------------
 src/crunk/ingest/walk.py |  29 +++++++++++-
 tests/unit/test_ingest.py |  46 +++++++++++++++++++
 tickets/T-0110/ticket.md  |   9 +++-
 4 files changed, 136 insertions(+), 60 deletions(-)
```

### Evidence
- `tests/unit/test_ingest.py::test_tailwind_config_dangling_symlink_becomes_diagnostic` (pytest node id, verified passing when recorded)
- `tests/unit/test_ingest.py::test_tailwind_config_permission_denied_becomes_diagnostic` (pytest node id, verified passing when recorded)

### Captured claims
- tests: 2 passed (from 2 evidence id(s))
- gates: 0 error(s), 381 warning(s), 4 waived
- error-findings: none (measured, zero errors)"""
