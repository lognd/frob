# v1 done-report

## Done report

Moved token naming to crunk.spec.naming (sanitize_ident, format_step,
color_token/space_token/font_size_token/radius_token/layer_token/
font_family_token, token_namespaces) so it is reachable from rules
without rules importing tokens. Added TokensConfig ([tokens.prefixes],
frozen, extra=forbid, per-field prefix validation with empty forbidden
on space/font_size/radius) and wired it into DesignSpec/load_spec as an
optional [tokens] section. tokens/render.py now consumes spec.naming
via spec.tokens and exposes entries(spec) as the shared (name, value)
builder behind render_css/render_json. rules/_color.py's COLOR001 fix
replacement and COLOR002's namespace check both use spec.naming instead
of a hardcoded "--color-" string / namespace tuple. Renamed tokens.md's
naming-scheme heading to point at spec.md's new r4 section and repointed
render.py's frob:doc anchors atomically. Added UT-SPEC-06, UT-TOK-05
(prefix half only, per instructions -- stacks deferred), UT-RUL-PREFIX,
and E2E-13 (tests/system/test_e2e_13_prefixes.py).

Filed T-0041 (bug, out of scope) for scaffold/write.py's
_reset_css hardcoding "--color-" instead of spec.naming.color_token --
found while writing E2E-13, whose fixture had to route around it.

Done report

