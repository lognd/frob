[profile.default]
fail-fast = false
slow-timeout = { period = "30s" }

[profile.ci]
fail-fast = false
retries = 0
# Hang guard, not a speed budget: a test running past 120 s (4 periods of 30 s) is terminated
# and fails, so a hung test fails fast while slow CI runners never trip it. Speed regressions
# are the soft budget of `cargo dev ci` (warns at 30 s per test or 90 s per suite, never fails).
# A test that legitimately needs more than 120 s gets an entry in the reviewed override list
# below, with the reason; it is never ignored.
slow-timeout = { period = "30s", terminate-after = 4 }
failure-output = "immediate-final"

# junit feeds the "five slowest tests" report of `cargo dev ci` (target/nextest/ci/junit.xml).
[profile.ci.junit]
path = "junit.xml"

# Reviewed overrides: tests that legitimately exceed the 120 s hang guard. Add an entry only
# with a reason, as `[[profile.ci.overrides]]` with a `filter` and its own `slow-timeout`.
# None today (the trybuild `ui` test peaks near 60 s under load).
