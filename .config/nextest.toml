[profile.default]
fail-fast = false
slow-timeout = { period = "30s" }

[profile.ci]
fail-fast = false
retries = 0
# Hang guard, not a speed budget: a test running past 120 s (4 periods of 30 s) is terminated
# and fails, so a hung test fails fast while slow CI runners never trip it. Speed regressions
# are the soft budget of `cargo dev ci` (warns at 30 s per test or 90 s per suite, never fails).
# A test that legitimately needs more than 120 s gets an entry in the reviewed override list
# below, with the reason; it is never ignored.
slow-timeout = { period = "30s", terminate-after = 4 }
failure-output = "immediate-final"

# junit feeds the "five slowest tests" report of `cargo dev ci` (target/nextest/ci/junit.xml).
[profile.ci.junit]
path = "junit.xml"

# Reviewed overrides: tests that legitimately exceed the 120 s hang guard. Add an entry only
# with a reason, as `[[profile.ci.overrides]]` with a `filter` and its own `slow-timeout`.
#
# gob-macros ui and ui_rule_attr (trybuild compile-fail; the latter has 14 cases, ~9R52NCF): trybuild hardcodes its own project dir at
# target/tests/trybuild, so it cannot share the workspace's warm target dir and must compile
# frob-ledger, gob-cli, gob-config, gob-directives and gob-rules once per cold target dir.
# Measured 2026-10-06 at load average ~25: 85 s cold, 1 s warm; earlier runs hit 120 s+ at load
# ~39. The 300 s allowance (10 periods) keeps the hang guard meaningful for a cold build.
[[profile.ci.overrides]]
filter = "package(gob-macros) & (binary(ui) | binary(ui_rule_attr))"
slow-timeout = { period = "30s", terminate-after = 10 }
