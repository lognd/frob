version = 1
disable_existing_loggers = false

[filters.below_warning]
"()" = "frob.logging.filter._BelowLevelFilter"
below = "WARNING"

[formatters.stdout_fmt]
"()" = "frob.logging.formatter._FrobFormatter"

[formatters.stderr_fmt]
"()" = "frob.logging.formatter._FrobFormatter"
show_level = true

[handlers.stdout]
class = "frob.logging.handler._LazyStdoutHandler"
formatter = "stdout_fmt"
# T-2979: default is INFO, not DEBUG -- gitio/process spawn traces,
# "v2 index cache hit", "is_baseline_stale" etc. are all logged at DEBUG
# (frob.logging.logger._init applies FROB_LOG_LEVEL to raise this back to
# DEBUG when the operator asks for it). Nothing was deleted, only re-levelled.
level = "INFO"
filters = ["below_warning"]

[handlers.stderr]
class = "frob.logging.handler._LazyStderrHandler"
formatter = "stderr_fmt"
level = "WARNING"

[root]
level = "DEBUG"
handlers = ["stdout", "stderr"]
