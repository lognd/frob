version = 1
disable_existing_loggers = false

[filters.below_warning]
"()" = "frob.logging.filter._BelowLevelFilter"
below = "WARNING"

[formatters.stdout_fmt]
"()" = "frob.logging.formatter._FrobFormatter"

[formatters.stderr_fmt]
"()" = "frob.logging.formatter._FrobFormatter"
show_level = true

[handlers.stdout]
class = "frob.logging.handler._LazyStdoutHandler"
formatter = "stdout_fmt"
level = "DEBUG"
filters = ["below_warning"]

[handlers.stderr]
class = "frob.logging.handler._LazyStderrHandler"
formatter = "stderr_fmt"
level = "WARNING"

[root]
level = "DEBUG"
handlers = ["stdout", "stderr"]
