[workspace]
# Glob membership: a new crates/<name>/Cargo.toml joins with no root edit.
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/lognd/frob"
rust-version = "1.98"
authors = ["Logan Dapp"]
# No workspace-wide `publish`: every crate sets it. The whole set ships to
# crates.io in lockstep (docs/design/releases.md 6) except the dev-only crates,
# which carry `publish = false` in their own manifest and are exactly:
#   gob-dev     the `cargo dev` task runner
#   gob-mdtest  the markdown corpus test harness
#   gob-testsupport  test-only helper binaries (fake-sibling) and their locator

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
doc_markdown = "deny"
disallowed_methods = "deny"  # clippy.toml confines wall-clock and local-zone reads to gob-time (D93)
missing_errors_doc = "deny"
missing_panics_doc = "deny"
# Allowed pedantic lints (one-line reason each):
module_name_repetitions = "allow"  # crate-prefixed type names read better at call sites
must_use_candidate = "allow"       # blanket #[must_use] on every getter is noise

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# Hot crates run optimised in dev and test builds (docs/design/build-test-ci.md 5). Only gob-ir
# is adopted: its million-level deep test is pure gob-ir work and drops from about 70 s to 8 s,
# for a few seconds of clean compile. `package."*"` at 2 and gob-symbols, frob-check and frob-cli
# at 1 were measured and rejected (slower clean compile, no suite gain).
[profile.dev.package.gob-ir]
opt-level = 2
