[workspace]
# Glob membership: a new crates/<name>/Cargo.toml joins with no root edit.
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/lognd/frob"
rust-version = "1.98"
authors = ["Logan Dapp"]
version = "0.532.0"
# No workspace-wide `publish`: every crate sets it. The whole set ships to
# crates.io in lockstep (docs/design/releases.md 6) except the dev-only crates,
# which carry `publish = false` in their own manifest and are exactly:
#   gob-dev     the `cargo dev` task runner
#   gob-mdtest  the markdown corpus test harness
#   gob-testsupport  test-only helper binaries (fake-sibling) and their locator

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
doc_markdown = "deny"
disallowed_methods = "deny"  # clippy.toml confines wall-clock and local-zone reads to gob-time (D93)
missing_errors_doc = "deny"
missing_panics_doc = "deny"
# Allowed pedantic lints (one-line reason each):
module_name_repetitions = "allow"  # crate-prefixed type names read better at call sites
must_use_candidate = "allow"       # blanket #[must_use] on every getter is noise

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# frob:ticket 01M4CS7ZMEY096RVK91RWD03DW
# The profile `cargo dev profile` builds the product binaries with (docs/design/build-test-ci.md
# section 4, ~RWD03DW): release speed without LTO (fast to link, so profile runs stay cheap) and
# line tables so perf and samply can attribute frames to source lines.
[profile.profiling]
inherits = "release"
lto = false
debug = "line-tables-only"

# Hot crates run optimised in dev and test builds (docs/design/build-test-ci.md 5). Only gob-ir
# is adopted: its million-level deep test is pure gob-ir work and drops from about 70 s to 8 s,
# for a few seconds of clean compile. `package."*"` at 2 and gob-symbols, frob-check and frob-cli
# at 1 were measured and rejected (slower clean compile, no suite gain).
[profile.dev.package.gob-ir]
opt-level = 2

# frob:ticket 01M4D6NKK3H4V085F2C4A0JHA9
# The ledger read path (gix object/ref/index, zlib inflate, toml, tree-sitter) is the user-visible
# cost of every ticket verb and `frob check` in the dev profile: at opt-level 0 `ticket doable` is
# ~12x slower than release (notes/research/profile-2026-10-07.md section 4 item 6). These
# dependencies change rarely, so the clean-compile cost is paid once per lockfile change.
[profile.dev.package.gix]
opt-level = 3

[profile.dev.package.gix-actor]
opt-level = 3

[profile.dev.package.gix-attributes]
opt-level = 3

[profile.dev.package.gix-config]
