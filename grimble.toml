[check]
# Lowest severity that makes `frob check` exit 1; `none` never fails.
fail_on = "error"
# Paths no grimble stage walks: deliberately broken test corpora, fixtures, extracted inline inputs and the unparsed research corpus.
exclude = ["crates/*/tests/corpus/**", "crates/*/tests/mdtest/**", "crates/*/tests/mdtest_fail/**", "crates/*/tests/fixtures/**", "crates/*/tests/ui/**", "crates/*/resources/inline/**", "crates/*/tests/rule_attr/**", "tests/crunk-parity/fixtures/**", "notes/research/grmb-corpus/**"]
# Which Unresolved findings fail the gate: `required`, `never` or `all`.
fail_on_unresolved = "required"

[compute]
# How an unannotated public signature is treated (`warn-unresolved` or `required`).
public_signatures = "warn-unresolved"
# How an undeclared effect is treated.
effects = "warn-unresolved"
# How a dynamic call is treated.
dynamic_calls = "warn-unresolved"
# The macro and template expansion step budget.
expansion_steps = 1000
# How an unnormalizable construct is treated.
normalization = "warn-unresolved"
# How a notebook with an undeclared cell order is treated.
notebook_order = "warn-unresolved"

[directives]
# Comment namespaces the scanner reads; comments in any other are ignored.
namespaces = ["frob", "grimble", "crunk"]

[packs]
# Enabled pack ids in load order.
enabled = []
# Path of the pack lock, relative to the repository root.
lock = "grimble.packs.lock"

[grimble]
# Root `.grmb` files, one independent model each; only files reachable from them through
# `include` are loaded (MDL019 names the rest, MDL021 fires when none is declared).
models = ["design/model.grmb"]

[rules.TIME001]
# This repository forbids local or naive clock reads whose value is stored or sent.
severity = "error"

[rules.TIME002]
# This repository forbids mixing naive and aware datetimes.
severity = "error"

[log]
# Files never judged by LOG001/LOG002: the defaults (tests, build scripts, __main__) plus
# test-support helper binaries that fake external tools, benches, examples and repo scripts,
# which print by design. Real CLI source stays judged. Setting this replaces the defaults, so they are repeated.
exempt = ["**/tests/**", "**/test/**", "**/__tests__/**", "**/test_*.py", "**/*_test.*", "**/*.test.*", "**/*.spec.*", "**/build.rs", "**/__main__.py", "crates/gob-testsupport/src/bin/**", "**/benches/**", "**/examples/**", "scripts/**"]

[coh]
# COH002 Unresolved noise: the Rust adapter cannot place bare method calls, so every decision
# that calls a std method (push, clone, map, ...) or a local pure helper stayed Unresolved
# (997 findings, ~1800 distinct callee names). The names below were each reviewed as
# non-effects (std collection/string/iterator/option methods, accessors, parsers, local
# pure helpers). Effect-shaped names (write*, remove, put_*, truncate, flush, emit, commit*,
# save*, fetch*, unlink, rename, spawn, create*, delete*, send*, append_land/line/summary,
# open_lock/repo, run_provider/pytest/once/with/case, set_autocrlf/permissions/change*,
# update_ref*, record_bypass/run/snapshot) are deliberately NOT listed and stay Unresolved
# until classified one by one. These go in callee_trivial, not trivial: trivial also drops
# statements from COH001's job clustering, and these names are ordinary code.
callee_trivial = [
  "SystemExit", "_deny", "_frob_version_skew", "_handle_edit", "_log_decision", "_real_run",
  "abi_version", "abnormal", "abort", "abort_with", "aborts", "about", "abs", "absolute",
