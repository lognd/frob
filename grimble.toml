# COH004 mixed-vocabularies: with the built-in floor of 2 words per cluster nearly every
# Rust function (5.7k) split into "vocabularies" made of std/test scaffolding words
# (assert, expect, unwrap, iter, tempdir, ...). A vocabulary now needs 5 domain words and
# the scaffolding words below are dropped before clustering; this keeps the rule live for
# functions that really mix two large domains.
vocab_min_cluster_words = 5
vocab_stop_words = [
  "assert", "expect", "unwrap", "iter", "map", "contains", "collect", "owned", "string", "vec",
  "default", "empty", "from", "run", "std", "with", "join", "format", "write", "into",
  "tempfile", "tempdir", "dir", "file", "filter", "parse", "clone", "matches", "all", "read",
