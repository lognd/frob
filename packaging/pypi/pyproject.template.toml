# Template of one product's PyPI distribution: a maturin `bin` wheel that installs that
# product's executable and nothing else (no Python code). render.py fills the @NAME@ fields
# from products.toml and the lockstep workspace version, so there is no checked-in version
# to drift (REL002 is equal by construction) and no per-product copy of this file.
# See README.md here and docs/design/releases.md sections 5, 6 and 6a.
[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "@NAME@"
version = "@VERSION@"
description = "@SUMMARY@"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Logan Dapp" }]
keywords = @KEYWORDS@
dependencies = @DEPENDENCIES@
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Version Control :: Git",
]

[project.urls]
Homepage = "https://github.com/lognd/frob"
Repository = "https://github.com/lognd/frob"
Changelog = "https://github.com/lognd/frob/blob/main/CHANGELOG.md"
Issues = "https://github.com/lognd/frob/issues"

[tool.maturin]
# The binary comes from the product's Cargo package; maturin builds its [[bin]].
manifest-path = "@MANIFEST@"
bindings = "bin"
strip = true
