concern_family_entries:
  - id: "CHK-THEME-EXISTENCE-NOT-PROOF"
    name: "Existence != proof: evidence/doc edges/frob:tests/registry entries are checked for EXISTENCE, not truth (passed? covers? matches? enforced?)"
    source_doc: "docs/audits/README.md"
    disposition: "handled_by:TEST016"
    cross_refs: []
  - id: "CHK-THEME-QUALITY-NONBLOCKING"
    name: "Green makes no claim about code quality: the entire quality/security surface (PERF, PII010, SEC110, ARCH001, DUP, lower secrets) is WARN-only, exits 0"
    source_doc: "docs/audits/README.md"
    disposition: "deferred:T-0969"
    cross_refs: []
  - id: "CHK-THEME-PYTHON-ONLY"
    name: "Python-only enforcement: COV/DOC/DRIFT/INV and the binding-aware capability resolver silently no-op for TS/Rust/C/C++"
    source_doc: "docs/audits/README.md"
    # T-1193 close 2026-07-29: run_check_cpp/rust/ts all call _run_gates
    # (T-0554), so the COV/DOC/DRIFT families execute for every pipeline
    # over the language-agnostic graph; reviewer-verified non-vacuous
    # (tree-sitter grammars produce real non-Python graph nodes).
    disposition: "handled_by:COV001"
    cross_refs: []
  - id: "CHK-THEME-FAIL-OPEN"
    name: "Fail-open on the unknown: unparseable file, source-unavailable dependency, unknown-language change, missing tool, second lockfile, non-UTF-8 doc all silently skip/pass rather than fail-closed"
    source_doc: "docs/audits/README.md"
    # T-1193 close 2026-07-29: last two residues verified handled --
    # every lockfile scanned (T-0400, _find_all_lockfiles polyglot
    # tests) and non-UTF-8 docs skipped with a disclosed warning
    # (T-0402); the earlier clauses landed as PARSE001/002, NATIVE001,
    # tool-unavailable ToolResults.
    disposition: "handled_by:PARSE001"
    cross_refs: []
  - id: "CHK-THEME-GITIGNORED-TRUST"
    name: "Gitignored-local trust: coverage/stamp/baseline/prework signals live in .frob/ (gitignored), so CI cannot verify the one behavioral gate that exists"
    source_doc: "docs/audits/README.md"
    # T-1193 close 2026-07-29: residue confirmed real (ci.yml self-gate
    # is non-blocking, stamp/baseline unverifiable in CI) and repointed
    # to its dedicated child.
    # T-1265 close 2026-08-01: closed the first half -- the ci.yml
    # self-gate is now blocking and TEST012 verifies
    # frob-coverage.lock.json, the one committed coverage channel. The
    # stamp and delta baseline still live in gitignored .frob/ and are
    # never restored in CI, so TEST005/TEST006 stay structurally inert
    # there; repointed to T-1366 for that remainder.
    # T-1366 close: closed the remainder -- ci.yml's new
    # "coverage stamp + delta baseline must be freshly measurable and
    # clean" step runs make coverage + frob check --stamp-baseline in
    # the runner itself, then fails the build on a missing/stale/
    # tampered stamp (is_stamp_stale) or baseline (is_baseline_stale) or
    # a fresh TEST005/TEST006 finding.
    disposition: "handled_by:TEST006"
    cross_refs: []
  - id: "CHK-SUBSYS-TICKETS-TESTING"
    name: "tickets + testing: evidence means a test EXISTS, never passed/covers; a red or unrelated test closes any ticket; land re-runs nothing"
    source_doc: "docs/audits/README.md"
    disposition: "handled_by:TEST016"
    cross_refs: []
  - id: "CHK-SUBSYS-STRATA"
    name: "strata (proof engine): boundaries never bound to code; proofs pass vacuously when the dangerous flow is un-modeled; eval globally excused"
    source_doc: "docs/audits/README.md"
    disposition: "handled_by:SYS106"
    cross_refs: []
  - id: "CHK-SUBSYS-VET"
    name: "vet: approves code it never read (source-unavailable = empty caps); only the first lockfile scanned; CVE fingerprints + non-Python needles rename/whitespace-evadable"
    source_doc: "docs/audits/README.md"
    disposition: "handled_by:OPAQUE001"
    cross_refs: []
  - id: "CHK-SUBSYS-GATES-ACCOUNTING"
    name: "gates: accounting -- verifies procedural existence, not code quality; DRIFT001 sig facet blind to body rewrites; TS/C/C++ frob:tests need no execution"
    source_doc: "docs/audits/README.md"
    # T-1193 close 2026-07-29: DRIFT001 body-blindness fixed (T-0556,
    # _facets_for_ref unions body into every ack; regression test trips
    # on body-only rewrites); TS retired via the real vitest collector
    # (T-0730); the remaining C/C++ structural-fallback clause repoints
    # to its dedicated child.
    # T-1266 close 2026-08-01: the C/C++ clause is retired. The real
    # ctest collector already cross-references compile_commands.json for
    # unambiguous single-source targets (T-0886) and TEST013 already
    # discloses the unresolved case (T-0552); neither had a gate-level
    # test for c/cpp the way the TS retirement did, so T-1266 added
    # test_cpp_directive_resolves_via_real_ctest_node_id rather than
    # rebuilding a mechanism that was already correct.
    disposition: "handled_by:TEST013"
    cross_refs: []
  - id: "CHK-SUBSYS-LANG-CHECK-DOCS"
    name: "lang + check + docs: doc/coverage/drift gates run ONLY in the Python pipeline; parse/IO failure silently erases a file's whole obligation set; COV001 is WARN-only"
    source_doc: "docs/audits/README.md"
    # T-1193 close 2026-07-29: same mechanism as CHK-THEME-PYTHON-ONLY
    # (T-0554 wires _run_gates into every language pipeline); the
    # parse-failure clause is PARSE001/002's landed disclosure.
    disposition: "handled_by:COV001"
    cross_refs: []
  - id: "CHK-SUBSYS-GRAPH-EDGES"
    name: "graph + edges: load_graph only re-hashes already-cached files (incomplete snapshot on a new file); a non-UTF-8 .md hard-crashes frob check"
    source_doc: "docs/audits/README.md"
    # T-1193 close 2026-07-29: _first_added_file forces CacheStale for
    # any never-ingested source OR doc file, and non-UTF-8 docs skip
    # with a disclosed warning instead of crashing (both T-0402, with
    # regression tests bound via frob:tests on load_graph).
    disposition: "handled_by:PARSE001"
    cross_refs: []
  - id: "CHK-SUBSYS-PERF"
    name: "performance + caching: ~168s CPU is redundant parsing (frob.lang._parse uncached, tree re-walked ~7x/run, 17 gates GIL-serialized)"
    source_doc: "docs/audits/README.md"
    disposition: "handled_by:PERF009"
    cross_refs: []
  - id: "CHK-SUBSYS-GATES-QUALITY"
    name: "gates: quality/security -- the entire quality surface is non-blocking (WARN); DUP fails open; frob:secret-fake suppresses real secrets with no accountability"
    source_doc: "docs/audits/README.md"
    disposition: "handled_by:SEC004"
    cross_refs: []
