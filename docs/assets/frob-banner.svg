<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="frob: the enforcement layer for agentic development">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f16"/>
      <stop offset="1" stop-color="#0f141d"/>
    </linearGradient>
    <radialGradient id="glowGreen" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3fb950" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#3fb950" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#388bfd" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#388bfd" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ballsheen" cx="0.35" cy="0.28" r="0.95">
      <stop offset="0" stop-color="#2b3648"/>
      <stop offset="0.55" stop-color="#131824"/>
      <stop offset="1" stop-color="#04060a"/>
    </radialGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e6edf3"/>
      <stop offset="1" stop-color="#9fb6c9"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#66bd52"/>
      <stop offset="1" stop-color="#458c3c"/>
    </linearGradient>
    <linearGradient id="skinDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fa244"/>
      <stop offset="1" stop-color="#3a7c33"/>
    </linearGradient>
    <linearGradient id="leather" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8f6136"/>
      <stop offset="1" stop-color="#644023"/>
    </linearGradient>
    <linearGradient id="standg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#273242"/>
      <stop offset="1" stop-color="#141b26"/>
    </linearGradient>
    <clipPath id="ballclip"><circle cx="290" cy="232" r="54"/></clipPath>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <!-- modern soft accent glows -->
  <circle cx="1120" cy="30" r="260" fill="url(#glowBlue)"/>
  <circle cx="240" cy="290" r="300" fill="url(#glowGreen)"/>
  <!-- hairline top accent -->
  <rect x="0" y="0" width="1200" height="2" fill="#1f6feb" opacity="0.35"/>

  <!-- ================= mascot: silhouette froblin (no outlines) ================= -->
  <!-- body silhouette: hump, ears, head. Arms tucked behind the ball. -->
  <g fill="#2d4124">
    <path d="M212 212 C206 164 238 140 290 140 C342 140 374 164 368 212 C348 190 232 190 212 212 Z"/>
    <path d="M240 112 C210 92 172 92 148 122 C158 138 196 142 238 128 Z"/>
    <path d="M340 112 C370 92 408 92 432 122 C422 138 384 142 342 128 Z"/>
    <ellipse cx="290" cy="127" rx="60" ry="48"/>
  </g>
  <!-- nose: tone-separated hook, no stroke -->
  <path d="M280 140 C297 140 305 159 295 170 C287 177 276 171 277 158 C277 149 278 144 280 140 Z" fill="#385030"/>

  <!-- aviator cap: covers the skull completely -->
  <g fill="#231911">
    <path d="M226 122 C226 64 354 64 354 122 L354 131 C312 112 268 112 226 131 Z"/>
    <path d="M228 122 C223 139 225 150 233 156 C240 148 242 135 240 123 Z"/>
    <path d="M352 122 C357 139 355 150 347 156 C340 148 338 135 340 123 Z"/>
  </g>
  <!-- goggles: dim gold rims -->
  <rect x="250" y="92" width="80" height="7" rx="3.5" fill="#191007"/>
  <circle cx="268" cy="96" r="12.5" fill="#120c06" stroke="#8a6f3a" stroke-width="2.6"/>
  <circle cx="312" cy="96" r="12.5" fill="#120c06" stroke="#8a6f3a" stroke-width="2.6"/>
  <path d="M262 91 a8 8 0 0 1 7 -4" fill="none" stroke="#c7a95e" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
  <path d="M306 91 a8 8 0 0 1 7 -4" fill="none" stroke="#c7a95e" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>

  <!-- eyes: pure glowing glints, no pupils -->
  <circle cx="266" cy="138" r="8" fill="#9fe88a" opacity="0.15"/>
  <circle cx="319" cy="134" r="7" fill="#9fe88a" opacity="0.15"/>
  <path d="M258 136 a8 5.6 -10 1 0 16 -3 a8 5.6 -10 1 0 -16 3 Z" fill="#a9f096"/>
  <path d="M312 132 a7 4.9 -10 1 0 14 -2.6 a7 4.9 -10 1 0 -14 2.6 Z" fill="#a9f096"/>

  <!-- stand -->
  <path d="M256 280 Q290 274 324 280 L314 298 Q290 302 266 298 Z" fill="url(#standg)"/>
  <ellipse cx="290" cy="302" rx="40" ry="4.5" fill="#000000" opacity="0.3"/>

  <!-- crystal ball -->
  <circle cx="290" cy="232" r="54" fill="url(#ballsheen)" stroke="#4a5a75" stroke-width="2"/>
  <g clip-path="url(#ballclip)" stroke-linecap="round" fill="none" stroke-width="2.8">
    <path d="M252 212 l6 0 m4 0 l3 -6 l3 6 m6 0 l6 0" stroke="#ff7b72"/>
    <path d="M288 212 l8 0 m4 0 l5 0 m4 -4 l0 4" stroke="#d2a8ff"/>
    <path d="M262 226 l5 0 m4 0 l4 -5 m2 5 l5 0" stroke="#79c0ff"/>
    <path d="M292 226 l6 0 m4 -4 a3 3 0 1 0 0.1 0" stroke="#7ee787"/>
    <path d="M318 226 l5 0" stroke="#8b949e"/>
    <path d="M268 240 l4 0 m3 -5 l0 5 m4 0 l5 0" stroke="#ffa657"/>
    <path d="M294 240 l4 0 m3 0 l4 -5 l4 5" stroke="#79c0ff"/>
    <path d="M262 254 l6 0 m4 0 a3 3 0 1 1 0.1 0" stroke="#7ee787"/>
    <path d="M286 254 l5 0 m4 -5 l3 5 l3 -5" stroke="#d2a8ff"/>
    <path d="M312 254 l6 0" stroke="#ff7b72"/>
  </g>
  <ellipse cx="268" cy="204" rx="19" ry="10" fill="#e6edf3" opacity="0.14" transform="rotate(-24 268 204)"/>
  <circle cx="290" cy="232" r="54" fill="none" stroke="#7ee787" stroke-width="1.2" opacity="0.22"/>

  <!-- chin glow crescent -->
  <path d="M272 172 C282 176 298 176 308 170" fill="none" stroke="#7ee787" stroke-width="1.8" stroke-linecap="round" opacity="0.2"/>

  <!-- ================= wordmark ================= -->
  <text x="500" y="158" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="96" font-weight="700" fill="url(#wordmark)" letter-spacing="-2">frob</text>
  <text x="504" y="200" font-family="ui-monospace, 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace" font-size="23" fill="#8d97a5">the enforcement layer for agentic development</text>

  <!-- modern pill chips -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="17">
    <rect x="504" y="222" width="76" height="30" rx="15" fill="#12251a" stroke="#2ea04326"/>
    <rect x="504" y="222" width="76" height="30" rx="15" fill="none" stroke="#2ea043" stroke-opacity="0.45"/>
    <text x="542" y="242" text-anchor="middle" fill="#7ee787">graph</text>

    <rect x="590" y="222" width="90" height="30" rx="15" fill="#101c2e"/>
    <rect x="590" y="222" width="90" height="30" rx="15" fill="none" stroke="#388bfd" stroke-opacity="0.45"/>
    <text x="635" y="242" text-anchor="middle" fill="#79c0ff">tickets</text>

    <rect x="690" y="222" width="76" height="30" rx="15" fill="#261a10"/>
    <rect x="690" y="222" width="76" height="30" rx="15" fill="none" stroke="#db6d28" stroke-opacity="0.45"/>
    <text x="728" y="242" text-anchor="middle" fill="#ffa657">gates</text>

    <rect x="776" y="222" width="84" height="30" rx="15" fill="#1c142a"/>
    <rect x="776" y="222" width="84" height="30" rx="15" fill="none" stroke="#8957e5" stroke-opacity="0.45"/>
    <text x="818" y="242" text-anchor="middle" fill="#d2a8ff">strata</text>
  </g>
</svg>
