[[decision]]
id = "D124"
date = "2026-10-09"
decision = "Owner 2026-10-08 mockup: the .grmb planning layer is admitted as the one behaviour construct, because it is checkable: system and actors, goal variant trees, scenarios of steps with typed outcomes, impl blocks bound to code, pages; each construct is V-model typed by its kind (goal requirements or requirement_spec, scenario system_spec, page system_design, impl component_design) so kernel closure needs no hand-written vmodel entity; `verified_by` is the Evidence relation on every level"
status = "accepted"
home = "design/grmb-spec.md#d124"

[[decision]]
id = "D125"
date = "2026-10-09"
decision = "Planning words are contextual (item heads at item position, body words inside planning items), so major-2 text keeps its meaning (grmb-spec 3.4); new tokens `=>`, `-!>`, `*` were lexical errors before; names are dotted identifiers (no `::` paths, no strings, no `let`), labels are `title`"
status = "amended"
by = ["D155", "D159"]
home = "design/grmb-spec.md#d125"

[[decision]]
id = "D126"
date = "2026-10-09"
decision = "Actors are the only irreducible event generators: `actor NAME : KIND` with kinds from pack vocabulary (core human, external, timer, device; `system` is spelled `external` because it is a planning word); every scenario starts with an actor step; `system` steps are reactions; firmware peers, sensors and timers are actors, no special case"
status = "accepted"
home = "design/grmb-spec.md#d126"

[[decision]]
id = "D127"
date = "2026-10-09"
decision = "`impl STEP for SCENARIO` (or `for *`) binds a step to code with pack realization kinds (ui, handler, isr, driver, ...; never grammar) whose right-hand side is a selector, so B, SYS004/007/008 and ack apply unchanged; `requires page` is transitive over a declared navigation graph; `in node` locates the step"
status = "amended"
by = ["D161"]
home = "design/grmb-spec.md#d127"

[[decision]]
id = "D128"
date = "2026-10-09"
decision = "Goals are keyed variant sets at an actor or goal path (`goal customer as action { ... }`), nesting is OR refinement, `requires` is an acyclic transitive precondition; coverage is exhaustiveness over the goal enum, an unrealized leaf is an obligation (PLAN001 Advisory), realizing a refined goal is a wildcard (PLAN002 Warn)"
status = "amended"
by = ["D141"]
home = "design/grmb-spec.md#d128"

[[decision]]
id = "D129"
date = "2026-10-09"
decision = "Scenario operators with Zig/Rust semantics: `->` infallible, `=>` immediate exhaustive match, `-!>` collects (a `none` outcome is collected like any other non-ok variant; there is no `-?>`) into an error-set union handled by `handle` or propagated by `fails with`, `include` takes the included scenario's ending set, `retry ... max N` is bounded and defaults to `end err(v)`; MDL022-MDL031, `_` arm is MDL028 Warn so a new variant propagates like a compile error"
status = "amended"
by = ["D152", "D153"]
home = "design/grmb-spec.md#d129"

[[decision]]
