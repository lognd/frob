decision = "PLAN017 is retired into PLAN011: a code failure no variant models that only an `unknown` arm would receive is PLAN011 with that arm in its detail; PLAN011 and the other code-fact rules (PLAN030-034, PLAN041, PLAN042, PLAN044) ship in P7, which builds the error-flow facts (cycle 5 M3, M4)"
