[[decision]]
# citations: none (internal consistency; spec 12.9 law 1 and law 3) (notes/research/grmb-evidence/evidence.md, section 2)
id = "D196"
date = "2026-10-31"
decision = "Cycle 6 consistency: AMB004 is one finding per (arm retry, ambient policy that applies to it) with the product of the two `max` counts, and the include arm is dropped (an included scenario's own clause never applies inside its includer, D192); an ambient retry applies to the triggered scenarios without an override and their includes, or to the override's scenario and its includes; a `sorry` element has `Out = Unknown` (links and matches after it Unresolved, no `Succ` pair) and a `sorry` terminal adds Unknown to `E(s)`; a leading `sorry` element gives an Unknown trigger; on a scenario `{ sorry; }` is the whole-body form, encoded as the unit's only Body child; a `_`-caught PLAN006 obligation's detail names its pair; waypoint names are unique per chain (MDL008); `wp[K]` is stable under fmt only; PLAN040 ships in P7 (cycle 6 M1-M3, L1-L6)"
status = "amended"
by = ["D197", "D198"]
home = "design/grmb-spec.md#d196"
see = ["../notes/research/grmb-evidence/evidence.md"]

[[decision]]
# citations: none (internal consistency; Zig explicit error sets bound an implementation, E15) (notes/research/grmb-evidence/evidence.md, section 2)
id = "D197"
date = "2026-10-31"
decision = "Cycle 7: a declared `fails with` bounds a `sorry` terminal (E(s) = F(s) stays exact; only an undeclared set and `Eok` become Unknown); an element whose outcome is Unknown makes every rule reading its outcome or derived pairs Unresolved at that subject (MDL022-025, PLAN006, PLAN016, AMB004); every scenario is a triggered scenario, so the policies applying to it are its own override, else the system policy, plus the overrides of its transitive includers; a main chain of one `sorry` terminal is the whole-body form whatever else the body holds, and a chain with no element gives an Unknown trigger; actors, goal variants and steps have no `sorry` body (cycle 7 M1, L1-L4)"
status = "amended"
by = ["D198", "D199"]
home = "design/grmb-spec.md#d197"
see = ["../notes/research/grmb-evidence/evidence.md"]

[[decision]]
# citations: none (internal consistency; spec 12.9 law 1) (notes/research/grmb-evidence/evidence.md, section 2)
id = "D198"
date = "2026-10-31"
decision = "Cycle 8: a whole-body `sorry` scenario is `declared` in 12.8 whatever `verified_by` it carries, has no trigger (MDL029 and PLAN007 do not apply), and is encoded as the one `apply(kind=sorry)` Body child standing where the main chain or realizations would be; an includer types it Unknown as a whole (no per-arm split); a `sorry` element, like a terminal, makes an undeclared `E(s)` Unknown (cycle 8 M1, L1-L5)"
status = "amended"
by = ["D199"]
home = "design/grmb-spec.md#d198"
see = ["../notes/research/grmb-evidence/evidence.md"]

[[decision]]
# citations: none (internal consistency; spec 12.9 laws 1 and 3) (notes/research/grmb-evidence/evidence.md, section 2)
id = "D199"
date = "2026-10-31"
decision = "Cycle 9: a scenario's design status is the meet over its step uses and included scenarios, and the meet over none is `declared` (covering the whole-body `sorry` and every all-`sorry` chain); every scenario counts as triggered whatever its trigger (no included-only marker); an Unknown trigger makes MDL029 Unresolved for the scenario and PLAN007 Unresolved on an impl only when its kinds need the timer/device clause and no using scenario has a known other trigger (cycle 9 M1, L1, L2)"
status = "amended"
by = ["D200"]
home = "design/grmb-spec.md#d199"
see = ["../notes/research/grmb-evidence/evidence.md"]

[[decision]]
# citations: none (internal consistency; spec 8.3 ladder) (notes/research/grmb-evidence/evidence.md, section 2)
id = "D200"
date = "2026-10-31"
decision = "Cycle 10: one OWN EVIDENCE test for `covered` on impls, pages, scenarios and goals: at least one of the entity's own `verified_by` resolves to test units or is `manual`; a `planned` clause never counts (cycle 10 M1)"
status = "amended"
by = ["D201", "D202"]
home = "design/grmb-spec.md#d200"
