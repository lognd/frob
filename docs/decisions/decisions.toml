[[decision]]
# citations: E25 (SysML VerdictKind) (notes/research/grmb-evidence/evidence.md, section 2)
id = "D201"
date = "2026-10-31"
decision = "Cycle 11: frob's overlay rung `verified` means the entity is `covered` and every row of its OWN EVIDENCE passes; a `planned` clause is no row; a `manual` row's verdict is its recorded human attestation, `not-run` without one; so the universal is never vacuous (cycle 11 M1)"
status = "amended"
by = ["D202", "D205"]
home = "design/grmb-spec.md#d201"
see = ["../notes/research/grmb-evidence/evidence.md"]

[[decision]]
# citations: E30 (StrictDoc: one link relation plus a code-side marker, both read alike) (notes/research/grmb-evidence/evidence.md, section 2)
id = "D202"
date = "2026-10-31"
decision = "Cycle 12: OWN EVIDENCE is the set of the entity's Evidence rows of both spellings (`verified_by` and `frob:tests`), one per selected test unit and one per `manual` clause, `planned` clauses contributing none; PLAN005, `covered` and `verified` all read that set; a `manual` row is `pass` when a passed attestation on a live ticket implementing the entity or a design ancestor carries its clause anchor as a fact, else `not-run`; the trace shows `uncovered`, `planned` and the 12.8 verdicts only (flaky and suspect evidence are PLAN052-PLAN059 findings) (cycle 12 M1-M3, L1)"
status = "amended"
by = ["D203"]
home = "design/grmb-spec.md#d202"
see = ["../notes/research/grmb-evidence/evidence.md"]

[[decision]]
# citations: none (internal consistency; D28, D130 layering) (notes/research/grmb-evidence/evidence.md, section 2)
id = "D203"
date = "2026-10-31"
decision = "Cycle 13: PLAN053, PLAN054 and PLAN059 (R2 G04, G05, G10) are frob-side verification rules over tickets and evidence records, owned by frob-pm and shipped in P3, never evaluated by grimble (D28, D130); grimble-bind keeps PLAN050-PLAN052 and PLAN055-PLAN058 in P4; flaky evidence is PLAN059 and suspect evidence PLAN052; the manual attestation fact is the full anchor `kind/full-name/verified_by[i]`, frob:tests rows count one per named unit, and until ticket ~AMNDCCT lands every manual row is `not-run` (cycle 13 M1, L1-L3)"
status = "amended"
by = ["D204"]
home = "design/grmb-spec.md#d203"
see = ["../notes/research/grmb-evidence/evidence.md"]

[[decision]]
# citations: none (internal consistency; rules.md one family one crate, D28, D130) (notes/research/grmb-evidence/evidence.md, section 2)
id = "D204"
date = "2026-10-31"
decision = "Cycle 14: the frob-side verification rules take PM ids in the frob-pm family, so every family keeps one owning crate: PM046 VERIFICATION-UNPLANNED (was PLAN053), PM047 DESIGN-VERIFIED opt-in close guard defined in the spec as every implemented entity `verified` (was PLAN054), PM048 NONTEST-UNRECORDED (was PLAN055, which needs frob's attestation record), PM049 FLAKY-EVIDENCE (was PLAN059); PM042, PM044 and PM045 stay unused (R1 proposals); PLAN052 reads the lock and ships in P3 with PLAN021 and PLAN022; grimble-bind keeps PLAN050, PLAN051 and PLAN056-PLAN058 in P4 (cycle 14 M1, M2, L1-L4)"
status = "amended"
by = ["D205"]
home = "design/grmb-spec.md#d204"
see = ["../notes/research/grmb-evidence/evidence.md"]

[[decision]]
# citations: E25 (SysML inconclusive verdict) (notes/research/grmb-evidence/evidence.md, section 2)
id = "D205"
date = "2026-10-31"
decision = "Cycle 15: an OWN EVIDENCE row's verdict is its latest frob record, but `inconclusive` when its records since the entity's last semantic-digest change disagree; that span is PM049's window, so a flaky row keeps its entity from `verified` and PM047 agrees; pm-enforcement.md points to PM037-PM049 in grmb-spec.md 16.5 and new PM ids start at PM050 (cycle 15 M1, L1)"
status = "amended"
by = ["D206"]
home = "design/grmb-spec.md#d205"
see = ["../notes/research/grmb-evidence/evidence.md", "design/pm-enforcement.md"]

[[decision]]
# citations: none (internal consistency; uses existing body_digest and git history) (notes/research/grmb-evidence/evidence.md, section 2)
id = "D206"
date = "2026-10-31"
decision = "Cycle 16: a test row's verdict is its latest frob record, `inconclusive` when the records in its WINDOW disagree; the WINDOW is the records whose stored entity `body_digest` (frob stores the `grimble graph --json` value on each record) equals the current one and that were made at or after the last commit changing the test unit's file, so a test fix ends flakiness without a design edit; an entity's semantic digest (PLAN022, PLAN052, PM048) is its `body_digest`; `manual` rows keep their own attestation rule; the trace shows a flaky row as `inconclusive` (cycle 16 M1, M2, L1, L2)"
status = "amended"
by = ["D207"]
home = "design/grmb-spec.md#d206"
see = ["../notes/research/grmb-evidence/evidence.md"]

[[decision]]
# citations: none (internal consistency; reuses the first-parent convention of the grant ratchet, 4.1) (notes/research/grmb-evidence/evidence.md, section 2)
id = "D207"
date = "2026-10-31"
decision = "Cycle 17: the evidence WINDOW's commit bound is HEAD-relative: a record counts when its commit is the newest first-parent commit from HEAD that changed the test unit's file or a descendant of it; a commit outside HEAD's history is outside the WINDOW; the stored `body_digest` record field is frob work in ticket ~AMNDCCT, and a record without it is outside every WINDOW and never makes PM048's digests differ (cycle 17 M1, L1, L2)"
status = "accepted"
home = "design/grmb-spec.md#d207"
see = ["../notes/research/grmb-evidence/evidence.md"]
