[[decision]]
# citations: E34 (OTP: a fault is handled by the supervisor of the running tree) (notes/research/grmb-evidence/evidence.md, section 2)
id = "D192"
date = "2026-10-31"
decision = "Ambient policies across includes: a fault inside an included scenario is handled by the policy of the outermost (triggered) scenario, which is what an ambient `retry` re-runs; an included scenario's own `ambient` applies only when it is triggered; AMB004 reports one finding per innermost retry with the product of every enclosing retry's `max` (cycle 5 M2)"
status = "amended"
by = ["D196", "D197"]
home = "design/grmb-spec.md#d192"
see = ["../notes/research/grmb-evidence/evidence.md"]

[[decision]]
