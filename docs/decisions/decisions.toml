[[decision]]
# citations: E39, E24, E26, E27 (notes/research/grmb-evidence/evidence.md, section 2)
id = "D152"
date = "2026-10-31"
decision = "One meaning per token: `->` means follows or moves to (flow and claim endpoints, scenario links); `=>` maps a pattern to its consequence, read left to right, in matches, arms and outcome-map entries (`PaymentDeclined, 402 => declined;`); `:` gives a step its outcome type (`step S : { ok, e } idempotent;`); a waypoint chain is an ordered statement list with no arrows; a cross-node hop finds its flow and never names it (`via FLOW` dropped); with a chain, the impl's node is its first waypoint's node. The D139 token set is unchanged; its last sentence (`->` means reaches inside a chain) and the `via` hop of D148 are superseded (audit R5, R9 first half, S2, C8, C9)"
status = "accepted"
home = "design/grmb-spec.md#d152"
see = ["../notes/research/grmb-evidence/evidence.md"]

[[decision]]
