# goway reads this to provision helpers (goway doctor --fix) and to build the helper .git.
# The ticket ledger is read from this ref, so ledger rules resolve on a helper (cargo dev ci check).
# origin/experimental is the base for `frob test --dry-run` (the test-dry-run step).
with_refs = ["refs/heads/experimental", "refs/remotes/origin/experimental"]

[toolchain]
tools = ["uv", "cargo-insta"]
