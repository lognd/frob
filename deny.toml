[graph]
all-features = true

[advisories]
yanked = "deny"
# Every ignore carries a reason (build-test-ci.md section 4).
ignore = [
    # unsafe-libyaml (via serde_yaml_ng) was archived upstream; no safe upgrade exists. Replacement tracked in a ticket.
    { id = "RUSTSEC-2024-0449", reason = "unmaintained, no known vulnerability; serde_yaml_ng replacement ticketed" },
]

[licenses]
confidence-threshold = 0.9
allow = ["MIT", "MIT-0", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CDLA-Permissive-2.0"]
# MIT-0 (permissive, no attribution) covers borrow-or-share, pulled in by jsonschema for crunk-gallery.
# CDLA-Permissive-2.0 covers the webpki root certificate data (webpki-root-certs, used by reqwest).
# uluru is MPL-2.0 (file-level copyleft), used unmodified as a transitive dependency of gix-pack.
exceptions = [
  { allow = ["MPL-2.0"], name = "uluru" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies carry no version requirement (dev-dependencies are not published).
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
