body = "First green CI on experimental (run 37158875783, 2026-10-03) published no dev prerelease: dev.yml triggers on workflow_run of ci, and GitHub only runs workflow_run workflows whose file is on the default branch (main, which still holds v1's workflows). workflow_run is also the dangerous trigger zizmor flags (CI006, accepted in dev.yml). Replace it: the dev publish becomes the last job of ci.yml, needs every test job, runs only on push to the configured dev branches (experimental) of this repository (if on github.ref and github.repository, no pull_request), holds the only contents: write, and calls the shared build-smoke workflow as dev.yml does today; delete dev.yml and its CI006 accept. Keep every invariant the dev_workflow tests pin (add-then-prune, cleanup of this run's uploads only, never publishes to registries, SHA pins, timeouts) by moving those tests to read the job in ci.yml. The parity test (~AHBKXAZ) must still pass: publishing is not a cargo dev ci step."
