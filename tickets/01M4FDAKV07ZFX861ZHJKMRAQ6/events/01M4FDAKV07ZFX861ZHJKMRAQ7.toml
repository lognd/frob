body = "Hullbreach convention (from its Jira): story points are the sum of subtask points and subtasks are the backlog items; sums like 4, 6, 7, 11 and 18 cannot be entered on the Fibonacci scale, and rounding would break the totals the course grades against. Coordinator decision: derive parent points from children (not entered), count only leaves toward capacity, and add a point_scale knob for repositories that use plain integers."
