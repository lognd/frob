# v1 done-report

## Done report

gob-cli, the Command derive and the frob binary (package frob-cli) per cli.md sections 1-4 (D27) and architecture.md sections 4 and 6: clap root with --format json|text|auto (--json/--text aliases), --quiet, -v, --color, --cwd, --schema, per-verb --dry-run opt-in; Command trait with Outcome/Payload/CliError mapping to the exit table; #[derive(Command)] registering CommandMeta (verb, product, idempotent, dry_run, exits, summary, module) in inventory; single render function over gob-diagnostics; Registry::verify_unique at startup. Verbs: doctor (toolchain, git discovery, worktree kind, cache stats, CFG001 status, ledger ref reachability; never fails on findings), init (materialize frob.toml, .frob/ in .gitignore, merge driver config and .gitattributes line; second run already=true; E-NOT-A-REPO outside git), config show --effective with provenance, config sync, schema. M1 ConfigTables: tickets (ref, dir), check (fail_on, exclude, size_cap), cache (busy_timeout_ms), git (cas_retries). Out of scope by one line: crates/gob-exec/src/proc001.rs adds frob to the PROC001 allow list because main calls std::process::exit. Deviations to reconcile in the design: envelope gains verb and already fields (proposal: move them into gob-diagnostics Envelope); fail_on default error vs design none; cas_retries under [git]; tickets.ref default refs/heads/main.

