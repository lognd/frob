body = "Trial migration of the platform repository (Python with some TS/TSX and CSS, a crunk.toml, 130 v1 tickets, a hullbreach.strata design file, a frob.toml with three [[test.runner]] tables and many [[refs.entrypoint]] tables, no frob.lock) using the verbs of docs/design/migration.md (frob migrate tickets, config, directives, exceptions; grimble migrate for design/*.strata), run in a scratch clone first with --dry-run, then merged into the repository by its owner; frob2 runs side by side with v1 and `frob2 compare --against frob` until the diff is explained (migration.md section 2); only acks current under v1 carry over. The ticket does not modify the hullbreach repository from this checkout: the work happens in a scratch clone, and any change to the real repository is a reviewed change the owner lands. Python is covered by the first-party adapter and the pytest provider (~HKNM4VV, done); TS/TSX and CSS stay opaque until ~17ZVW3R lands, with the Unresolved count recorded as the baseline. Output: a findings diff report, a list of unmapped v1 config keys and rule ids, and tickets for each v2 gap found. Needs the migration tooling and the grimble strata migration (~T0GMFJA)."
