body = "Test-shape detection in crates/gob-symbols (csharp.rs, mirrored by `is_python_test_fn` style helpers exported from lib.rs) and crates/frob-tests/src/catalog.rs: NUnit ([Test], [TestCase], [TestCaseSource], [UnityTest]), xUnit ([Fact], [Theory]) and MSTest ([TestMethod]). [SetUp], [TearDown], [UnitySetUp] are fixtures, not tests. A test id is the fully qualified method name (Namespace.Type.Method), the form both runners filter by; parameterized cases keep the method id. A test file is recognised by test attributes, not by path alone (Unity keeps tests under Assets/Tests/EditMode and Assets/Tests/PlayMode). Game fixture shape to mirror: 274 [Test] and 17 [UnityTest] across 43 files in 8 test assemblies."
