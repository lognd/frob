body = "Implement crates/frob-lease and crates/frob-worktree per tickets.md section 6 as updated by D26 and audit L21. Leases live in .git/frob/leases/<ticket>.toml under one lock file .git/frob/leases.lock (fs2 or rustix flock); holder = actor plus worktree path; overlap = glob intersection (globset text analysis) OR resolved-set intersection, with [tickets] registry_files exempt; TTL knob with renewal on any frob verb from the worktree; steal with --steal --reason recorded as an event. frob work <ticket>: idempotent for the same holder (returns existing worktree and lease), refuses with E-LEASE-HELD exit 3 naming the holder otherwise; creates the worktree at the [worktree] dir knob (default ../<repo>-wt/<ticket-handle>) via gob-git (spawn fallback allowed), branch ticket/<handle>, merges the base branch, transitions the ticket to in-progress, writes the lease. Verbs: work, start, requeue (release), ticket contention. SCOPE001 rule: diff of the worktree against base touches files outside the lease (reuse gob-git diff). Tests: concurrent work calls on two overlapping tickets from two threads produce exactly one lease."
