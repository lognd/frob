body = """Found on ~MVY3DFK: ticket evidence add --provider nextest --ref="-p gob-plan -E 'test(a) | test(b)'" was refused with E-EVIDENCE-NO-TESTS although both tests exist; substring filters worked. Either the --ref value is split on whitespace or shell-tokenized in a way that breaks the -E expression, or the zero-match detection (~PFY7RCD, matched_no_tests) misreads nextest's output for union expressions. Reproduce with a two-test project, find which, fix it, and test: a union -E expression records a measured pass; a genuinely empty match still refuses. Document how --ref is tokenized for the nextest provider (shell-words? one argument?) in the provider's docs and in cli.md."""
