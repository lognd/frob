body = "Consumer F-338 (T-4135). A nested pyproject.toml's [tool.pytest.ini_options] wins when pytest is invoked with only its own subtree, and the root's pythonpath (needed to import a sibling scripts/ dir) is silently dropped -- so a system test passes standalone and fails from the repo root, or vice versa. The configured test.runner invocation must resolve the same rootdir regardless of which paths it is given. Fixture-testable: YES."
