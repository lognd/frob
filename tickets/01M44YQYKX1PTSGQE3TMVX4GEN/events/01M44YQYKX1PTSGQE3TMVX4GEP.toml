acceptance = ['Given Invoke("Reload", 1f) in a MonoBehaviour and a method named Reload, when the graph is built with the pack, then the edge is Unresolved and Reload is not marked reached by it', "Given SendMessage with a string method name, when the graph is built, then the call is Unresolved with the reason named", "Given a typed method call, when the graph is built, then it resolves as before"]
body = 'Third vocabulary of the unity pack: SendMessage, SendMessageUpwards, BroadcastMessage, Invoke("name"), InvokeRepeating, StartCoroutine("name"), CancelInvoke("name") and string-keyed lookups (GameObject.Find, FindWithTag, Resources.Load) are dynamic calls, recorded as Unresolved call edges per the compute policy and never resolved by guesswork; UnityEvent wiring lives in scene and prefab YAML and is reported Unresolved with its GUID reference when the asset is read (YAML contents beyond GUID references are out of scope, design section 3). A literal method name never turns into an edge. Docs: docs/design/packs.md and docs/design/dotnet-unity.md section 3.'
