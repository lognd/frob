# v1 done-report

## Done report

Changed: src/frob/gitio.py::run_argv (timeout_s now defaults to None, resolved via _configured_default_timeout_s, clamped to a hard ceiling, slow-spawn WARNING added), src/frob/gitio.py::_configured_default_timeout_s (new), src/frob/gitio.py::_load_average_str (new), src/frob/gitio.py::_run_git (timeout_s default now None); docs/modules/testing.md; tests/test_gitio.py

Why: the 30s git spawn budget was a hang guard, not a load budget -- under a running land drain plus 5-7 concurrent agents, a perfectly healthy git status/diff spawn routinely exceeded it purely from CPU/disk contention, and every caller (ticket scope/land/etc.) surfaced that as "a required git operation failed", indistinguishable from a genuine hang (measured 2026-09-24, live during this very ticket's own `frob ticket work T-5818`: the ledger-commit git spawn timed out at exactly this budget). Fixed by raising the default to 120s, adding a FROB_GIT_SPAWN_TIMEOUT_S override (clamped to a 300s hard ceiling that applies unconditionally, including to an explicit caller-supplied timeout_s, so the hang guard itself can never be configured away), and logging a WARNING with the elapsed time and 1-minute load average whenever a spawn exceeds the OLD 30s threshold, so a load-driven slowdown stays visible without failing the caller.

Evidence: tests/test_gitio.py::TestGitSpawnBudgetT5818 -- test_slow_but_under_budget_spawn_succeeds_and_warns is the ticket's own positive control (a spawn stubbed to run past the warn threshold succeeds and logs the load-average warning); the remaining 5 cover the must-not-regress controls (fast spawns stay silent, the env override is honored and clamped, garbage env falls back to the default, the new default is 120s not 30s, and an absurd explicit timeout_s is still clamped to the hard ceiling).

Filed: none.

Gates: clean (ruff check/format clean on all three touched files; full tests/test_gitio.py -- 51 passed, no regressions).

