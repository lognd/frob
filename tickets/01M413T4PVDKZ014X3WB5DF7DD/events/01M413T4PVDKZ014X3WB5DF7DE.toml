body = """Reported by the cloc repository (FROB_FEEDBACK item 13): release cut tags every entry of SHIPPED_BINARIES (frob-vX, grimble-vX) and release changelog hard-codes a '### frob' product heading and refuses an existing hand-written CHANGELOG.md without an integrity marker. Make products and the tag pattern configuration ([release] tag = "v{version}", products = [...]; frob's own repo sets frob and grimble), default to one product named after the repository with tag v{version}, omit the product heading when there is one product, and adopt an existing CHANGELOG.md (insert above the first version heading, keep what is above, mark only the generated section)."""
