acceptance = ["Given a file changed between check and --fix, when frob check --fix runs, then the envelope error code is E-FIX-STALE with the guard-refusal exit class and a remedy"]
body = "~WS4WZBD reports a file changed between check and --fix as CheckError::FixIo with a message prefixed E-FIX-STALE, because crates/frob-check/src/verb.rs was leased by ~A6C2R1C. So the CLI classes a guard refusal as an internal error. Add a dedicated FixStale variant with its own code in the error catalog, map it in verb.rs to the guard-refusal exit class with a remedy (re-run frob check, then --fix), and test the envelope."
