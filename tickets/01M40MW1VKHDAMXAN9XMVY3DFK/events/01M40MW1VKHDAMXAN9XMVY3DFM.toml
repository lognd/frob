body = '''Found by the parser (~Y8NPAQE): the lexer splits every string into text and interpolation parts, so the spec's CI002 glob ".github/workflows/*.{yml,yaml}" is rejected as an interpolation, and the parser test pins the verbatim spec text as an error. Decision (grl-spec.md 3, updated by the coordinator): interpolation exists only in message positions (report, note, fix replacement text, unresolved because, explain); in every other string position (globs, paths, regexes given as strings, config values, knob defaults, example inputs) the parser rejoins the lexer's parts and braces are literal. Change the parser accordingly, make the verbatim CI002 fixture parse clean, drop CI002_escaped.grl, and keep \{ \} working as an escape in message strings only.'''
