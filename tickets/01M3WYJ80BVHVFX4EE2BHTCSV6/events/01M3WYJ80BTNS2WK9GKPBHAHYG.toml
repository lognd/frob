body = "Implement crates/gob-walk and crates/gob-cache per architecture.md section 3 and D30. gob-walk: parallel repository walk with the ignore crate honoring .gitignore and a [check] exclude knob, returning FileEntry { path, size, blake3 digest, language guess by extension } in a deterministic order; size cap knob with Unresolved marker for oversized files. gob-cache: per-worktree SQLite at .frob/cache.sqlite (WAL, busy_timeout knob, best-effort writes logged on failure, schema versioned with migrations): tables artifacts(key = digest + producer identity, bytes), findings(file digest, rule id, rule version, side-input digest -> serialized findings), repo_rule(graph digest, rule id -> findings). API is sync; a Cache::open fails soft (returns a NullCache) when the directory is read-only. Benchmarks with criterion for walk of 10k files and 10k cache hits."
