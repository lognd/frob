# v1 done-report

## Done report

gob-config and the ConfigTable derive per architecture.md section 6 and D22/D34: derive generates describe(), Default, Deserialize rejecting unknown keys, and an inventory TableEntry; load/load_with layer defaults < file < overrides with per-key provenance and UnknownKey errors carrying a did-you-mean; materialize uses toml_edit to add absent enforcement knobs with doc comments while preserving comments and order; check emits CFG001 (Rule derive, family CFG, Error, Repo, Deterministic) per missing knob naming key, default and remedy; schema() builds one JSON Schema via schemars; trybuild case for an enforcement field without a default; insta snapshots. Deviations: inventory stores a describe function rather than a value; check returns Result so an unreadable file is not silently clean; dotted table paths supported; FieldDescription carries a per-field JSON schema.

