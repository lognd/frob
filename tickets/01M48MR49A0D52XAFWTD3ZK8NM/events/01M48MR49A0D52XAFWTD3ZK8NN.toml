body = "Macro review 2026-10-06 against ruff (derive(ViolationMetadata): docs from the doc comment, required stability metadata) and ty (declare_lint!: doc comment with fixed sections, rendered to the rules page). Today #[derive(Rule)] silently defaults polarity to Pplus and must_measure to false (its own docs say to always declare them), takes version/since as unchecked strings, and accepts any doc comment as the explanation. Make polarity and must_measure required (a compile error naming the rule when missing, migrate the existing rules), validate version/since as semver at expansion, and require the doc comment to carry the sections What it does / Why it matters / Example (compile error with a span), so the generated rule pages have one shape; the Example block becomes an executable mdtest (build-test-ci.md 2, ty lint_docs)."
