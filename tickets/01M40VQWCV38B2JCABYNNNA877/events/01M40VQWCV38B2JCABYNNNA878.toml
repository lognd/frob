acceptance = ["Given an open 7-day cycle on its first day with unfinished members, when cycle close with --next-goal runs, then a next cycle starting tomorrow exists, the members are carried into it, and the ratio counts them as committed", "Given the same without --next-goal, when close runs, then it refuses with a remedy naming --next-goal"]
body = "Found while switching this repository to 2-day cycles (owner: close early when the goal is met): closing a cycle before its planned end with incomplete members needs a carry target, but creating the next cycle (starting the day after today) is refused as overlapping the still-open cycle's planned window; the only workaround (unassigning incomplete members first) records a false commitment ratio. Fix: cycle close CYCLE --next-goal TEXT [--next-days N] creates the next cycle starting the day after the effective end (cycle_days long unless --next-days), in the same operation, and carries the incomplete members into it; the overlap check for that creation uses the effective end being recorded. E-CYCLE-NO-NEXT's remedy names --next-goal. Tests: early close with unfinished work and --next-goal creates the next cycle, carries members and records the true ratio; without --next-goal the remedy names it."
