body = "Implement crates/frob-ledger per tickets.md sections 2 to 5 and 11 as updated by D23, D24, D33, D34, and exceptions for M1 (accept and defer only). Storage: tickets/<ulid>/ticket.md with TOML frontmatter (schema via #[derive(TicketField)] in gob-macros generating serde, schema and the docs table) and events/<ulid>.toml append-only; frontmatter is the fold of events and integrity = equals-fold. Ticket types per tickets.md (minus milestone), categories triage|todo|in-progress|blocked(derived)|done plus outcome, structured story fields optional in M1, typed links from the canonical link table with inverses. Writes go through gob-git commit_paths on the ledger ref ([tickets] ref knob, default trunk; branch mode). Index: SQLite table in gob-cache keyed by the ledger tree id, rebuilt on mismatch, used by list and show (< 50 ms warm). Verbs (via gob-cli Command derive, in the frob binary): ticket new (with --idempotency-key, structured flags, --scope, --points, --parent, --blocked-by, --acceptance), show, list (filters by state, type, parent, label), update (patch), link/unlink, comment, close (guards: outcome required, evidence hook left as a trait for frob-evidence), drop --reason, reopen --reason, doable (no open blockers, lease-safe hook as a trait), brief, doctor (ledger integrity), merge-driver (hidden; union events then re-fold). Handles: full ULID canonical; unique suffix handle accepted on input. TICK rules: TICK001 frontmatter differs from fold, TICK002 referenced ticket not on base, TICK003 dangling link. Trial error_set for this crate's error types per D22 and report on it in the done-report. Dogfood: this ticket's tests create a temp repo and run the whole lifecycle."
