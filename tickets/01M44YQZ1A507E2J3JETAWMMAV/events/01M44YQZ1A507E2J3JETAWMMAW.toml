body = "New rule family UNITY in the unity pack, implemented as compiled rules registered in crates/gob-rules (registry.rs, id.rs, meta.rs) and evaluated in crates/frob-obligations (new unity.rs): UNITY001 a tracked file or folder under Assets/ or embedded package under Packages/ without its .meta; UNITY002 a tracked .meta whose asset is not tracked (orphan); UNITY003 a duplicate GUID across .meta files, severity Error. Unity-ignored names are exempt (leading dot, trailing tilde, named cvs, .tmp extension) and so are Packages/manifest.json and packages-lock.json; only git-tracked files count (gob-git), so a stray local file does not fire. Findings follow docs/reference/rules format; one reference page per id in docs/reference/rules (UNITY001.md ...). Reference shape: 236 tracked .meta files under Assets in the game repository."
