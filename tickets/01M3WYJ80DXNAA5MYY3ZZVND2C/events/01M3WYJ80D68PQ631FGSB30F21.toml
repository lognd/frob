body = "Implement crates/gob-symbols per code-model.md sections 2 and 3 and D31. Symbol extraction for Rust (modules, fns, structs, enums, traits, impls, consts, macros, with visibility) and markdown (headings as anchors path#slug), yielding SymbolRecord { symref path::Qual.Name or path#slug, kind, span, visibility, digests { sig, body, doc } as blake3 of normalized text facets }. Imports (use trees resolved to crate-relative paths where possible) and a conservative call graph for Rust (callee names resolved within the crate, unresolved kept as names). Repository-level SymbolGraph with petgraph: nodes are symbols, edges Imports/Calls/Contains; a public-API view; affects(symref) and reach(symref, kind) queries; graph digest for repo-rule cache keys. Incremental: per-file extraction keyed by file digest through gob-cache. Parallel over files with rayon. Symref parsing and ambiguity errors per code-model.md section 2. Markdown corpus tests (plain files under tests/corpus until gob-mdtest lands) and criterion bench on this repository."
