# v1 done-report

## Done report

Root cause: check_local_edits hashed raw disk bytes, so a CRLF rewrite by git checkout under core.autocrlf=true looked like a local edit. Fix: on-disk bytes now go through gix's filter pipeline (convert_to_git, honoring core.autocrlf and .gitattributes text/eol) before hashing and comparing against the old tip, the new content and the staged id. Tests cover a simulated CRLF rewrite (succeeds) and a genuine edit under autocrlf (still refuses). The core.autocrlf=false workaround in frob-ledger tests can be dropped later.

### Changed
```
 crates/gob-git/src/ledger.rs   | 50 +++++++++++++++++++++++++++++++++++-----
 crates/gob-git/tests/ledger.rs | 52 ++++++++++++++++++++++++++++++++++++++++++
 tickets/T-0030/ticket.md       |  6 ++---
 3 files changed, 99 insertions(+), 9 deletions(-)
```

