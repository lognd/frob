acceptance = ["Given concurrent writers and a reader on Windows, when the reader reads during a replace, then it gets a hit or a miss and never an error, across 20 consecutive runs on nova-windows"]
body = "CI runs 37182219626 and 37181044823 (windows-latest, intermittent): gob-trust::state concurrent_writers_never_expose_a_torn_entry fails because StateStore::get returns Io{op: read} PermissionDenied (os error 5) while another writer renames a new entry over it; Windows denies opens of a file in the replace or delete-pending window, Linux never does. Real users with concurrent frob processes would hit it. Treat PermissionDenied (and sharing violations) on read as transient: retry with a short bounded backoff, then report a Miss (the caller recomputes) rather than an error; never surface a torn entry."
