body = "Second vocabulary of the unity pack: [SerializeField] fields and public instance fields of MonoBehaviour and ScriptableObject types (not [NonSerialized], not static, not properties without [field: SerializeField]) are written from outside the code (scenes, prefabs, the Inspector), so effect and flow rules see an external writer and a never-assigned warning does not fire. Sites: packs/unity.toml vocabulary rows, the effect and flow rule readers in crates/frob-obligations and crates/gob-ir eval. Reference shape: 79 [SerializeField] fields in the game repository. Docs: docs/design/packs.md vocabulary table."
