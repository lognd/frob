acceptance = ["Given a 200 GraphQL response whose errors array reports rate limiting, when parsed, then it is a rate-limit failure carrying the reset time and no data is returned", "Given partial data with a non-empty errors array, when parsed, then the whole query scope is failed", "Given a rate-limited response with no remaining budget, when handled, then the client stops without sleeping and reports the reset time", "Given repeated 5xx with budget left and a fake clock, when retried, then waits are 60 s then doubling and the client stops after three retries"]
body = """
Implements mirror.md section 3.2 (Errors).

retry-after is honoured; with no remaining budget the run stops without sleeping to the reset and records the reset time; otherwise wait 60 s, doubling, at most three retries, then stop. Every GraphQL response's errors array is checked (rate limiting arrives there with HTTP 200) and partial data fails that query's scope."""
