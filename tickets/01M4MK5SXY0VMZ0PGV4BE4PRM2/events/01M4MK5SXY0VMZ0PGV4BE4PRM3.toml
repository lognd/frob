body = "Found by ~1NN2YCK. The 23 percent hit rate has two causes: (1) engine keyed on exe bytes (fixed in ~1NN2YCK), (2) ObligationFileCheck::side_input for REF001 returns FrobShared.ledger_tip, which moves on every ticket event in any worktree. decode_all needs every rule key of a file to hit, so one stale REF001 key recomputes all four rules for every file (cache holds 12k REF001 rows vs 4k for DOC001 = 3 tips). Fix: key REF001 by the sorted set of ticket ids referenced in the file text whose standing is not Open/Terminal (empty when none), computed from a per-run set built in collect(). Mutating a referenced ticket must miss; an unrelated ticket event must hit. Measure cached_hits/files on a second run with a ticket event in between."
