body = "Consumer F-355 (T-4135), both items: (1) cross-ticket-leakage refusal when two tickets share a worktree doesn't name its remedy (close the other ticket in this worktree, or move its files out) even though the rule itself is correct; (2) a waiver whose live-tracker citation is this same closing ticket has exactly one sensible remedy (re-point/drop the citation in this same diff), but the generic two-remedy message lists 'file a successor ticket' first, which produced a junk ticket filed only to satisfy the gate. Fix: detect the self-citation case and state its one remedy outright; for the general case, always state a remedy, not just the rule. Fixture-testable: YES."
