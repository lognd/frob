body = "Implement crates/gob-mdtest per build-test-ci.md section 2 and audit L18. A test harness that walks tests/mdtest/**/*.md in a consuming crate, parses fenced blocks with an info string (language plus options such as rule=ID, expect=fire|clean, config=...), runs a caller-supplied closure (text, options) -> Vec<Finding>, and asserts the expected finding ids and line numbers given by inline markers (a comment containing error: RULE or the finding count); failures print a diff. Every rule corpus must contain at least one fire and one clean case for the rule or the harness fails the corpus with the rule id (positive-control doctrine). Expose a macro mdtest!(dir, runner) that registers each file as a libtest case name for nextest. Document the corpus format in the crate docs."
