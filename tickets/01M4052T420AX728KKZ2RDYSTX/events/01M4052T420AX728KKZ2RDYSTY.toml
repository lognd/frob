acceptance = ["Given an edit read twice after a crash, when recorded, then one proposal exists keyed by its tracker event id, and an accepted or declined one never returns", "Given a 5000-character edited value, when recorded, then the excerpt is 200 characters, escaped, origin tracker, and the digest covers the full value", "Given a second edit by the same actor to the same field, when recorded, then a superseding event is appended", "Given more than P new proposals in a run, when recorded, then those beyond P stay after the cursor and are recorded in a later run, and all recorded ones share one ledger commit"]
body = """
Implements mirror.md section 3.5 (F9).

A proposal stores the tracker item id, field, actor id, time, a digest of the value and a capped (200 characters), escaped excerpt with origin tracker; the full value is fetched at accept time. Keyed by the tracker event id so a re-run never records an edit twice. A later edit by the same actor to the same field appends proposal-superseded. Caps: one new proposal per (issue, field) per day and P per run. All proposals of a run are written in one ledger commit."""
