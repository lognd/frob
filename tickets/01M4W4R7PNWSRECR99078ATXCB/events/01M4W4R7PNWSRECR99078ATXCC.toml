acceptance = ["A land whose stage blocks forever aborts within the watchdog bound and frees the lock; a waiter takes over a stale-holder lock; holder file shows stage and last-progress; test covers the blocked-stage case."]
body = "Observed 2026-10-13: a debug-build `frob land` held land.lock ~35 min with no child process, no socket, all threads parked (futex), no log output; every other land queued behind it and agents reported lands taking ~40 min instead of ~1. Structural fix: (1) every land stage runs under a bounded timeout and the land as a whole has an idle-progress watchdog that aborts and releases the lock when no stage has progressed for N minutes; (2) the lock holder file records pid, start time, current stage and last-progress time, and a waiter may take over a lock whose holder pid is dead or whose progress is stale, with a logged reason; (3) `frob land --status` prints holder, stage and age; (4) land refuses the unoptimized debug binary for the lock-holding path or warns loudly; (5) a regression test with a stage that blocks forever."
