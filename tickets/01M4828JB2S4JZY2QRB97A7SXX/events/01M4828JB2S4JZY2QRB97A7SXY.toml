body = "Found while working ~6KKJF80. The TS adapter marks describe/it/test calls (vitest, jest, playwright) on their apply nodes and lists them with gob_symbols::test_items, but they are not units, so calls inside a test body are attributed to the enclosing file or unit and COV001 and touched-test selection cannot name a test. Make each suite and case a unit (a symref-safe name from the title, [dupN] on repeats) with a test attribute, wire is_test for TS into the obligation code, and keep Unknown for dynamic titles (test.each)."
