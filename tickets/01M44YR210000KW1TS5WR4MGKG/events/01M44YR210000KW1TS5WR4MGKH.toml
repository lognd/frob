body = "Trial migration of the game repository (Unity 6, 129 C# files, 17 asmdefs, 116 v1 tickets, hullbreach_game.strata, frob.toml with one [[test.runner]]) using the verbs of docs/design/migration.md (frob migrate tickets, config, directives, exceptions; grimble migrate for design/*.strata), run in a scratch clone first with --dry-run, then merged into the repository by its owner; frob2 runs side by side with v1 and `frob2 compare --against frob` until the diff is explained (migration.md section 2); only acks current under v1 carry over. The ticket does not modify the hullbreach repository from this checkout: the work happens in a scratch clone, and any change to the real repository is a reviewed change the owner lands. Requires every layer of this epic: the C# adapter with fixtures and fidelity row, the .asmdef project model, the unity pack with UNITY rules, C# test selection and the unity provider (editor 6000.0.43f1, one run at a time through goway). Output: the unity pack enabled, UNITY findings triaged against the real tracked .meta files, reach roots matching the used Unity messages, the 274 [Test] and 17 [UnityTest] tests all discovered by test ids, one real EditMode run recorded as evidence, and a gap ticket per v2 deficiency found."
