body = "Implement crates/gob-languages per code-model.md section 3 and the audit L17. Feature-gated grammars: rust (tree-sitter-rust), markdown (tree-sitter-md), toml (tree-sitter-toml-ng or equivalent); pick tree-sitter 0.25 or 0.27 consistently and record the version choice and the ast-grep compatibility question in the done-report (audit M26). API: Language enum, detect(path) -> Option<Language>, parse(language, text) -> ParsedTree with a per-file size cap and parse timeout (both knobs) returning Unresolved markers rather than panicking, a grammar identity string (crate version + grammar hash) for cache keys, a query helper that compiles tree-sitter queries once per language (cached) and iterates captures with gob-text spans. Document how to add a language (docs comment in lib.rs and a generated docs/reference/languages page later)."
