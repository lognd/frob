scope = ["crates/gob-symbols/src/pipeline.rs", "crates/gob-check/src/**", "crates/frob-check/src/**", "crates/frob-check/tests/**"]
acceptance = ["Given a tracked non-UTF-8 markdown file, when frob check runs, then the report has a required Unresolved finding naming the file and the decode error, and the gate fails under the default fail_on_unresolved", "Given the fidelity section, when files were skipped, then their count and reasons appear"]
body = "Reproduced by the v1 gap analysis (notes/review/v1-gap/C-features.md P-02): a tracked non-UTF-8 .md file produces identical frob check --json output to the repository without it; the only trace is a stderr log line, and the skipped counter in gob-symbols/src/pipeline.rs is never read. A file the gates never read must never look clean (v2 principle: Unknown is never a pass). Fix: every file the walk includes but cannot read or decode becomes a required Unresolved finding naming the file and the reason (encoding, permission, size), counted in fidelity; the skipped counter feeds the report. Decide and document whether a declared binary or generated file is excluded instead (then it is never read and never reported)."
