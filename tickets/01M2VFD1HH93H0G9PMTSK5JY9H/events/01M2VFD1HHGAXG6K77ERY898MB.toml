acceptance = ["Given src/frob/tickets/_store_api.py exists, when another frob module needs to read or write a ticket, then it imports _store_api and never opens tickets/<id>/ticket.md itself.", "POSITIVE CONTROL: tests/unit/test_ledger_store_api.py::test_no_module_opens_ticket_md_directly asserts that no src/frob module other than _store_api.py performs a read/write against a tickets/**/ticket.md path. This test FAILS on dev today (multiple such sites exist) and passes after this leaf.", "Given a fallible store operation, when it fails, then it returns a typani Result error value rather than raising; tests/unit/test_ledger_store_api.py::test_missing_ticket_is_a_result_error proves it.", "docs/modules/tickets-data-storage.md names _store_api as the single entry point and is updated in this same change."]
body = """
Kernel decoupling leaf (LEDGER story). ~3 points.

Today ticket data is reached a dozen different ways across src/frob/tickets/*.py (_store.py is 2536 lines and is only one of the readers) and src/frob/app/ticket_runner/*.py. That is why the ledger, the leases and the land cannot be separated: there is no seam.

Build ONE typed store API module, src/frob/tickets/_store_api.py: pydantic models in, pydantic models out, every fallible operation returning a typani Result[T, E]. Every other module goes through it; nothing else opens tickets/<id>/ticket.md.

Do NOT change the on-disk ticket.md format or the CLI. This leaf introduces the seam and migrates the readers the positive control names; a follow-up may migrate the rest.

Log every read and write at DEBUG with ticket id and operation, every refusal at WARNING."""
