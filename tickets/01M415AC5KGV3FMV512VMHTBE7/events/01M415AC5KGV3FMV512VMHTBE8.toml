body = "Observed by the coordinator on 2026-10-03: with several agents recording evidence (each a ledger commit on experimental), land ~0MQNY3G --wait 300 and land ~DH63PV1 --wait 300 failed with E-LAND-STALE 'experimental moved while landing' (retryable: true) and needed manual reruns. Under --wait, land should retry a stale compare-and-swap itself: re-merge the new base, re-run the check only if non-ledger paths changed, and retry with backoff until the wait budget is spent; then report the attempt count. Without --wait, behaviour is unchanged."
