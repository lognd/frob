body = 'Implement crates/gob-config and the ConfigTable derive in gob-macros per architecture.md section 6 (config), goals.md principle no invisible variables, D22, D34. Features: #[derive(ConfigTable)] with #[config(table = "tickets", materialize)] and per-field #[config(default = ..., doc from doc comment, enforcement = true)]; a Config loader that reads <product>.toml from the repo root (product name is a parameter, frob.toml for frob), applies layering (defaults < file < explicit CLI overrides passed as a map) and reports unknown keys as errors with a did-you-mean; a materialize function that writes every enforcement knob that is absent from the file with its default and a doc comment, used by frob init, and a check function that returns one CFG001 finding per missing materialized knob (rule declared here with #[derive(Rule)]); a JSON schema export of the whole config (schemars) for frob schema; an inventory of tables so gob-dev can generate the config reference page. Use toml_edit to preserve comments and ordering when materializing. Tests with insta snapshots of materialized output.'
