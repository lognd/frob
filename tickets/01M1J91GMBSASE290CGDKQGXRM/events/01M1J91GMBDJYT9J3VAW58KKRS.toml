body = "apollo FROBLEMS.md 2026-09-03: frob coverage --full runs pytest with --cov-report= then coverage xml -i, which dies with 'No data to report' (no .coverage produced by its own pytest invocation). Also its first failure mode was injecting -n 12 into a repo without pytest-xdist installed (exit 4 usage error, reported as 'suite was RED'). Manual workaround: uv run pytest --cov + uv run coverage xml -i + frob check --stamp-coverage works."
