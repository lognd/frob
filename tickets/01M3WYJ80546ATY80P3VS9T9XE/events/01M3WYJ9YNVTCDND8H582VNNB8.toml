# v1 done-report

## Done report

gob-rules and gob-macros per rules.md sections 1-2 and D3/D32: #[derive(Rule)] with compile-time validated id (FAMILY + 3 digits, family must match), slug, product (default frob), severity, tier, scope, fix, version, since; explanation from the doc comment; inventory registration with module_path for duplicate reporting; Registry::global with lookup by id or slug and verify_unique returning an error naming both modules (also duplicate slugs); Finding/Fix/TextEdit with blake3 fingerprints over rule id, anchor and a normalized message (digits collapsed, never line numbers); exception data types and check_reason with a ReasonPolicy (min length 15, banned filler patterns, restated rule id, repeated words). trybuild compile-fail tests for missing id and bad severity. Deviations: RuleMeta.id is a static str parsed by rule_id(); META is an inherent const so Rule stays object-safe; duplicate-reason limit and Error-severity review requirement from exceptions.md section 5 are deferred to frob-obligations where cross-exception state exists; Finding has no serde derives yet because gob-text types lack them.

