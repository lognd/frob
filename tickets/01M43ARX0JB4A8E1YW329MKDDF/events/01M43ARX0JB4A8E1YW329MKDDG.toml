body = "No crate or ticket exists for gob-fix although boundaries.md 2.1 and architecture.md name it and crunk, grimble and frob all fix. Build it: Edit (byte range plus replacement), Fix with applicability from ~DW4RJVG, overlap resolution that is deterministic (earlier span wins, the loser is reported not just logged), dry-run diff identical to the real run, atomic write (tmp plus rename) with a check that the file is unchanged since the check ran (also the cure for ~WS4WZBD), a fix journal. Python source: crunk.fixes (205 LOC: plan_fixes, apply_plans) and INV-FIX-01/02. Applicability location is an open design point (plugins.md 324 says gob-fix, ~DW4RJVG puts it in gob-rules); keep the type in one place."
