kind = "create"
title = "gob-config: product-scoped config registries and dynamic-key tables; migrate crunk-spec"
type = "story"
category = "todo"
priority = "medium"
acceptance = ["Given frob and crunk config tables, when gen runs, then each product gets its own reference page and schema and neither contains the other's keys", "Given crunk-spec, when built, then its tables are declared through gob-config, not hand-written serde and schemars types"]
body = "gob-config's ConfigTable derive registers every table in one global inventory, so a crate in another product (crunk-spec, for crunk.toml) cannot use it without its keys leaking into frob's docs/reference/config.md and docs/schemas/config.json. ~BWXXV5H therefore defined crunk.toml with plain serde and schemars types, a second way to declare config. Make registries product-scoped (each table names the config file and product it belongs to; gen emits one reference page and schema per product), support dynamic-key tables (palette, lint, breakpoints) in the derive, and migrate crunk-spec onto it so there is one config declaration mechanism. Read D87 (one binary per package) in docs/design/README.md."
