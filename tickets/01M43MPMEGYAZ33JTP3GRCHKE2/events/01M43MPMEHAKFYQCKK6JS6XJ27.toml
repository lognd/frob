acceptance = ["Given a foreign crunk executable on the ambient PATH, when the CLI test suite runs, then every snapshot is unchanged"]
body = "frob-cli test doctor_piped_is_json_envelope_even_with_cfg001 fails on a machine where the Python crunk is on PATH: sibling discovery finds it and the snapshot gains a warning. Tests that run the frob binary must be hermetic about siblings: the test harness sets PATH (and any sibling discovery env) to a controlled directory, so results never depend on what the developer has installed. Apply it in the shared test support used by the CLI tests, not per test, and add a test that a foreign crunk on the ambient PATH does not change doctor output."
