<!doctype html><meta charset="utf-8">
<style>
@font-face{font-family:F0;src:url("file://FONT0")}
@font-face{font-family:F1;src:url("file://FONT1")}
@font-face{font-family:F2;src:url("file://FONT2")}
span{white-space:pre;font-size:16px;position:absolute;font-kerning:normal;text-rendering:auto}
</style><body><pre id=out></pre>
<script>
const corpus = CORPUS;
document.fonts.ready.then(async () => {
  await Promise.all(["F0","F1","F2"].map(f => document.fonts.load("16px "+f, "A")));
  const res = {};
  for (const f of ["F0","F1","F2"]) {
    const s = document.createElement("span"); s.style.fontFamily = f; document.body.appendChild(s);
    res[f] = corpus.strings.map(t => { s.textContent = t; return s.getBoundingClientRect().width; });
  }
  document.getElementById("out").textContent = "RESULT" + JSON.stringify(res) + "ENDRESULT";
});
</script>
