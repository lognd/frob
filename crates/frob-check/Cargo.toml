[package]
name = "frob-check"
version = "0.0.0"
description = "frob check: the check pipeline (walk, graph, rules, exceptions, cache, fix, tool stages) and its verb."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
blake3 = "1"
frob-ack = { path = "../frob-ack" }
frob-evidence = { path = "../frob-evidence" }
frob-lease = { path = "../frob-lease" }
frob-ledger = { path = "../frob-ledger" }
frob-obligations = { path = "../frob-obligations" }
frob-tests = { path = "../frob-tests" }
gob-check = { path = "../gob-check" }
gob-cache = { path = "../gob-cache" }
gob-cli = { path = "../gob-cli" }
gob-diagnostics = { path = "../gob-diagnostics" }
gob-directives = { path = "../gob-directives" }
gob-exec = { path = "../gob-exec" }
gob-git = { path = "../gob-git" }
gob-languages = { path = "../gob-languages" }
gob-lock = { path = "../gob-lock" }
gob-rules = { path = "../gob-rules" }
gob-symbols = { path = "../gob-symbols" }
gob-text = { path = "../gob-text" }
gob-walk = { path = "../gob-walk" }
rayon = "1"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tracing = "0.1"

[dev-dependencies]
criterion = { version = "0.5", default-features = false }
tempfile = "3"

[[bin]]
name = "fake-sibling"
path = "tests/support/fake_sibling.rs"
test = false

[[bench]]
name = "full_check"
harness = false

[lints]
workspace = true
