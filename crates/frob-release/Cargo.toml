[package]
name = "frob-release"
version = "0.0.0"
description = "frob release tooling: compile changelog.d fragments into CHANGELOG.md."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
blake3 = "1"
frob-pm = { path = "../frob-pm" }
gob-exec = { path = "../gob-exec" }
gob-git = { path = "../gob-git" }
gob-rules = { path = "../gob-rules" }
schemars = "1"
similar = "2"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
semver = "1"
toml = "1"
toml_edit = "0.25"
tracing = "0.1"
ulid = "1"

[dev-dependencies]
gob-mdtest = { path = "../gob-mdtest" }
serde_yaml_ng = "0.10"
tempfile = "3"

[lints]
workspace = true
