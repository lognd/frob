[package]
name = "frob-release"
version.workspace = true
description = "frob release tooling: compile changelog.d fragments into CHANGELOG.md."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
blake3 = "1"
frob-pm = { version = "0.532.0", path = "../frob-pm" }
gob-config = { version = "0.532.0", path = "../gob-config" }
gob-exec = { version = "0.532.0", path = "../gob-exec" }
gob-fs = { version = "0.532.0", path = "../gob-fs" }
gob-git = { version = "0.532.0", path = "../gob-git" }
gob-rules = { version = "0.532.0", path = "../gob-rules" }
schemars = "1"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
thiserror = "2"
toml = "1"
toml_edit = "0.25"
tracing = "0.1"
ulid = "3"

[dev-dependencies]
gob-mdtest = { path = "../gob-mdtest" }
serde_yaml_ng = "0.10"
tempfile = "3"

[lints]
workspace = true
