[package]
name = "frob-release"
version = "0.0.0"
description = "frob release tooling: compile changelog.d fragments into CHANGELOG.md."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
blake3 = "1"
gob-rules = { path = "../gob-rules" }
schemars = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "1"
tracing = "0.1"
ulid = "1"

[dev-dependencies]
gob-mdtest = { path = "../gob-mdtest" }
tempfile = "3"

[lints]
workspace = true
