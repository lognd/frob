[package]
autotests = false
name = "frob-pm"
version.workspace = true
description = "frob project management objects: milestones and cycles as event-sourced ledger objects."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
frob-ledger = { version = "0.532.0", path = "../frob-ledger" }
gob-config = { version = "0.532.0", path = "../gob-config" }
gob-git = { version = "0.532.0", path = "../gob-git" }
gob-rules = { version = "0.532.0", path = "../gob-rules" }
gob-time = { version = "0.532.0", path = "../gob-time" }
gob-text = { version = "0.532.0", path = "../gob-text" }
schemars = "1"
serde = { version = "1", features = ["derive"] }
strsim = "0.11"
thiserror = "2"
toml = "1"
tracing = "0.1"

[dev-dependencies]
gob-mdtest = { path = "../gob-mdtest" }
tempfile = "3"

[lints]
workspace = true

# frob:ticket 01M4MGEZBQ9DD7BKKZ8ZM1HA1J
# One integration-test binary: tests/main.rs includes every other tests/*.rs as a module, so the
# crate links once instead of once per file. A new tests/x.rs must be added there as `mod x;`.
[[test]]
name = "main"
path = "tests/main.rs"
