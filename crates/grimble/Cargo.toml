[package]
name = "grimble"
version = "0.0.0"
description = "The grimble binary: check, init, doctor, fmt and exceptions list over the shared goblin CLI root."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
publish = false

[lib]
name = "grimble"
path = "src/lib.rs"

[[bin]]
name = "grimble"
path = "src/main.rs"

[dependencies]
gob-check = { path = "../gob-check" }
gob-cli = { path = "../gob-cli" }
gob-config = { path = "../gob-config" }
gob-git = { path = "../gob-git" }
gob-lock = { path = "../gob-lock" }
gob-rules = { path = "../gob-rules" }
gob-symbols = { path = "../gob-symbols" }
gob-walk = { path = "../gob-walk" }
grimble-bind = { path = "../grimble-bind" }
grimble-check = { path = "../grimble-check" }
grimble-model = { path = "../grimble-model" }
jiff = "0.2"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
assert_cmd = "2"
jsonschema = { version = "0.58.5", default-features = false }
tempfile = "3"
toml = "1"

[lints]
workspace = true
