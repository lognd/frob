[package]
name = "frob-evidence"
version.workspace = true
description = "Evidence providers, the dir: blob store, evidence events and the close guard for frob tickets."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
gob-time = { version = "0.532.0", path = "../gob-time" }
blake3 = "1"
frob-lease = { version = "0.532.0", path = "../frob-lease" }
frob-ledger = { version = "0.532.0", path = "../frob-ledger" }
frob-pm = { version = "0.532.0", path = "../frob-pm" }
frob-release = { version = "0.532.0", path = "../frob-release" }
gob-cli = { version = "0.532.0", path = "../gob-cli" }
gob-config = { version = "0.532.0", path = "../gob-config" }
gob-exec = { version = "0.532.0", path = "../gob-exec" }
gob-fs = { version = "0.532.0", path = "../gob-fs" }
gob-git = { version = "0.532.0", path = "../gob-git" }
gob-log = { version = "0.532.0", path = "../gob-log" }
gob-symbols = { version = "0.532.0", path = "../gob-symbols" }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1"
tracing = "0.1"
which = "8"

[dev-dependencies]
proptest = "1"
gob-testsupport = { path = "../gob-testsupport" }
tempfile = "3"

[lints]
workspace = true
