[package]
autotests = false
name = "gob-trust"
version.workspace = true
description = "Product-neutral per-machine key and keyed-blake3 MAC primitives for trust entries, cache rows and markers."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
blake3 = "1"
getrandom = "0.3"
gob-exec = { version = "0.532.0", path = "../gob-exec" }
gob-fs = { version = "0.532.0", path = "../gob-fs" }
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
proptest = "1"
tempfile = "3"

[lints]
workspace = true

# frob:ticket 01M4MGEZBQ9DD7BKKZ8ZM1HA1J
# One integration-test binary: tests/main.rs includes every other tests/*.rs as a module, so the
# crate links once instead of once per file. A new tests/x.rs must be added there as `mod x;`.
[[test]]
name = "main"
path = "tests/main.rs"
