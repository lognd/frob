[package]
autotests = false
name = "crunk-check"
version.workspace = true
description = "crunk check: the Crunk product over the shared check pipeline and the gob.sibling/1 document."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
blake3 = "1"
crunk-ingest = { version = "0.532.0", path = "../crunk-ingest" }
crunk-rules = { version = "0.532.0", path = "../crunk-rules" }
crunk-spec = { version = "0.532.0", path = "../crunk-spec" }
crunk-tailwind = { version = "0.532.0", path = "../crunk-tailwind" }
crunk-tokens = { version = "0.532.0", path = "../crunk-tokens" }
gob-cache = { version = "0.532.0", path = "../gob-cache" }
gob-check = { version = "0.532.0", path = "../gob-check" }
gob-config = { version = "0.532.0", path = "../gob-config" }
gob-exec = { version = "0.532.0", path = "../gob-exec" }
gob-diagnostics = { version = "0.532.0", path = "../gob-diagnostics" }
gob-packs = { version = "0.532.0", path = "../gob-packs" }
gob-plan = { version = "0.532.0", path = "../gob-plan" }
gob-lock = { version = "0.532.0", path = "../gob-lock" }
gob-rules = { version = "0.532.0", path = "../gob-rules" }
gob-text = { version = "0.532.0", path = "../gob-text" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
gob-mdtest = { path = "../gob-mdtest" }
tempfile = "3"

[lints]
workspace = true

# frob:ticket 01M4MGEZBQ9DD7BKKZ8ZM1HA1J
# One integration-test binary: tests/main.rs includes every other tests/*.rs as a module, so the
# crate links once instead of once per file. A new tests/x.rs must be added there as `mod x;`.
[[test]]
name = "main"
path = "tests/main.rs"
