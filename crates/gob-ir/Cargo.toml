[package]
name = "gob-ir"
version = "0.0.0"
description = "The universal structural model U: sorted ABT terms, scope graph with status, facet digests, queries and a Kleene rule evaluator."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
blake3 = "1"
gob-rules = { path = "../gob-rules" }
gob-text = { path = "../gob-text" }
inventory = "0.3"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
criterion = { version = "0.5", default-features = false }
proptest = "1"

[[bench]]
name = "terms"
harness = false

[lints]
workspace = true
