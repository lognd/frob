[package]
name = "gob-ir"
version.workspace = true
description = "The universal structural model U: sorted ABT terms, scope graph with status, facet digests, queries and a Kleene rule evaluator."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
blake3 = "1"
gob-caps = { version = "0.532.0", path = "../gob-caps" }
gob-rules = { version = "0.532.0", path = "../gob-rules" }
gob-walk = { version = "0.532.0", path = "../gob-walk" }
gob-text = { version = "0.532.0", path = "../gob-text" }
inventory = "0.3"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
criterion = { version = "0.5", default-features = false }
postcard = { version = "1", default-features = false, features = ["use-std"] }
proptest = "1"
inventory = "0.3"

[[bench]]
name = "terms"
harness = false

[lints]
workspace = true
