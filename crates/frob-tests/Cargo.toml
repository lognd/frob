[package]
name = "frob-tests"
version.workspace = true
description = "Touched-set test selection, nextest runs, evidence capture and the TEST001 rule for frob."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
frob-evidence = { version = "0.532.0", path = "../frob-evidence" }
frob-ledger = { version = "0.532.0", path = "../frob-ledger" }
gob-cache = { version = "0.532.0", path = "../gob-cache" }
gob-cli = { version = "0.532.0", path = "../gob-cli" }
gob-directives = { version = "0.532.0", path = "../gob-directives" }
gob-exec = { version = "0.532.0", path = "../gob-exec" }
gob-git = { version = "0.532.0", path = "../gob-git" }
gob-rules = { version = "0.532.0", path = "../gob-rules" }
gob-symbols = { version = "0.532.0", path = "../gob-symbols" }
gob-walk = { version = "0.532.0", path = "../gob-walk" }
schemars = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "1"
tracing = "0.1"

[dev-dependencies]
gob-time = { version = "0.532.0", path = "../gob-time" }
gob-languages = { path = "../gob-languages" }
gob-caps = { path = "../gob-caps" }
gob-testsupport = { path = "../gob-testsupport" }
serde_json = "1"
tempfile = "3"

[lints]
workspace = true
