[package]
name = "frob-lease"
version = "0.0.0"
description = "Locked scope leases for frob tickets: overlap analysis, TTL, steal, contention and SCOPE001."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
frob-ledger = { version = "0.0.0", path = "../frob-ledger" }
frob-release = { version = "0.0.0", path = "../frob-release" }
globset = "0.4"
gob-cli = { version = "0.0.0", path = "../gob-cli" }
gob-config = { version = "0.0.0", path = "../gob-config" }
gob-diagnostics = { version = "0.0.0", path = "../gob-diagnostics" }
gob-git = { version = "0.0.0", path = "../gob-git" }
gob-rules = { version = "0.0.0", path = "../gob-rules" }
gob-walk = { version = "0.0.0", path = "../gob-walk" }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
