[package]
name = "crunk-spec"
version = "0.0.0"
description = "The crunk.toml design spec for crunk: schema, validation with located errors, DesignSpec, token naming and presets."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
keywords = ["css", "design-system", "design-tokens", "config", "schema"]
categories = ["config", "web-programming"]

[lints]
workspace = true

[dependencies]
crunk-values = { version = "0.0.0", path = "../crunk-values" }
gob-config = { version = "0.0.0", path = "../gob-config" }
gob-diagnostics = { version = "0.0.0", path = "../gob-diagnostics" }
indexmap = { version = "2", features = ["serde"] }
schemars = { version = "1", features = ["indexmap2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strsim = "0.11"
thiserror = "2"
toml_edit = { version = "0.25", features = ["serde"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
