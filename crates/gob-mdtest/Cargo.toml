[package]
autotests = false
name = "gob-mdtest"
version.workspace = true
description = "Markdown corpus test harness with firing and clean positive controls for the frob/grimble/crunk goblins."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
publish = false

[dependencies]
gob-diagnostics = { path = "../gob-diagnostics" }
gob-path = { path = "../gob-path" }
gob-rules = { path = "../gob-rules" }
gob-text = { path = "../gob-text" }
insta = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "1"
tracing = "0.1"
walkdir = "2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

# frob:ticket 01M4MGEZBQ9DD7BKKZ8ZM1HA1J
# One integration-test binary: tests/main.rs includes every other tests/*.rs as a module, so the
# crate links once instead of once per file. A new tests/x.rs must be added there as `mod x;`.
[[test]]
name = "main"
path = "tests/main.rs"
