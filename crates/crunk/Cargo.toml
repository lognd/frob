[package]
name = "crunk"
version.workspace = true
description = "The crunk binary: check and doctor over the shared goblin CLI root."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true

[package.metadata.dist]
# crunk is a product binary (D87): it opts in to a dist archive of its own.
dist = true

[lib]
name = "crunk"
path = "src/lib.rs"

[[bin]]
name = "crunk"
path = "src/main.rs"

[features]
default = []
# The screen gallery (manifest, cells, GALLERY001-005); off by default to keep the binary and wheel small.
gallery = ["dep:crunk-gallery"]

[dependencies]
clap = { version = "4", features = ["derive"] }
crunk-fix = { version = "0.532.0", path = "../crunk-fix" }
crunk-ingest = { version = "0.532.0", path = "../crunk-ingest" }
crunk-check = { version = "0.532.0", path = "../crunk-check" }
crunk-query = { version = "0.532.0", path = "../crunk-query" }
crunk-gallery = { version = "0.532.0", path = "../crunk-gallery", optional = true }
crunk-rules = { version = "0.532.0", path = "../crunk-rules" }
crunk-spec = { version = "0.532.0", path = "../crunk-spec" }
crunk-tokens = { version = "0.532.0", path = "../crunk-tokens" }
gob-cache = { version = "0.532.0", path = "../gob-cache" }
gob-check = { version = "0.532.0", path = "../gob-check" }
gob-cli = { version = "0.532.0", path = "../gob-cli" }
gob-diagnostics = { version = "0.532.0", path = "../gob-diagnostics" }
gob-config = { version = "0.532.0", path = "../gob-config" }
# frob:ticket 01M4RN89XGXSXMSF2HV2FPSG41
gob-lock = { version = "0.532.0", path = "../gob-lock" }
gob-git = { version = "0.532.0", path = "../gob-git" }
gob-rules = { version = "0.532.0", path = "../gob-rules" }
gob-product = { version = "0.532.0", path = "../gob-product" }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
assert_cmd = "2"
jsonschema = { version = "0.58.5", default-features = false }
tempfile = "3"
toml = "1"

[lints]
workspace = true
