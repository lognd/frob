[package]
name = "gob-check"
version = "0.0.0"
description = "The product-neutral check pipeline (walk, per-file and repo rules, caches, exceptions, tool stages, fixes) that frob and grimble both drive."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
blake3 = "1"
gob-cache = { path = "../gob-cache" }
gob-config = { path = "../gob-config" }
gob-diagnostics = { path = "../gob-diagnostics" }
gob-exec = { path = "../gob-exec" }
gob-lock = { path = "../gob-lock" }
gob-rules = { path = "../gob-rules" }
gob-symbols = { path = "../gob-symbols" }
gob-text = { path = "../gob-text" }
gob-walk = { path = "../gob-walk" }
jiff = "0.2"
rayon = "1"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
toml = "1"

[lints]
workspace = true
