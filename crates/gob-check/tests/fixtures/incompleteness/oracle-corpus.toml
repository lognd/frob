# Oracle corpus: the true answer (oracle) beside the answer the analysis gave (observed).
# docs/design/testing.md section 8.
# Each case carries a probe (file, query, source) the real adapter reads; `observed` is checked
# against that live answer by tests/oracle_live.rs and regenerated with FROB_BLESS_ORACLE=1.

[[case]]
id = "rust-resolve_ref-01"
language = "rust"
capability = "resolve_ref"
file = "example.rs"
query = "helper"
source = '''
fn helper() {}
fn main() {
    helper();
}
'''
oracle = "yes"
observed = "yes"

