[package]
name = "grimble-check"
version = "0.0.0"
description = "grimble check: the Grimble product over the shared check pipeline, the gob.sibling/1 document and grimble.toml tables."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
blake3 = "1"
gob-check = { version = "0.0.0", path = "../gob-check" }
gob-config = { version = "0.0.0", path = "../gob-config" }
gob-diagnostics = { version = "0.0.0", path = "../gob-diagnostics" }
gob-ir = { version = "0.0.0", path = "../gob-ir" }
gob-rules = { version = "0.0.0", path = "../gob-rules" }
gob-symbols = { version = "0.0.0", path = "../gob-symbols" }
gob-text = { version = "0.0.0", path = "../gob-text" }
gob-walk = { version = "0.0.0", path = "../gob-walk" }
grimble-bind = { version = "0.0.0", path = "../grimble-bind" }
grimble-model = { version = "0.0.0", path = "../grimble-model" }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
