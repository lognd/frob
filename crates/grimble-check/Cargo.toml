[package]
name = "grimble-check"
version.workspace = true
description = "grimble check: the Grimble product over the shared check pipeline, the gob.sibling/1 document and grimble.toml tables."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
blake3 = "1"
gob-check = { version = "0.532.0", path = "../gob-check" }
gob-config = { version = "0.532.0", path = "../gob-config" }
gob-directives = { version = "0.532.0", path = "../gob-directives" }
gob-diagnostics = { version = "0.532.0", path = "../gob-diagnostics" }
gob-ir = { version = "0.532.0", path = "../gob-ir" }
gob-packs = { version = "0.532.0", path = "../gob-packs" }
gob-plan = { version = "0.532.0", path = "../gob-plan" }
gob-rules = { version = "0.532.0", path = "../gob-rules" }
gob-symbols = { version = "0.532.0", path = "../gob-symbols" }
gob-text = { version = "0.532.0", path = "../gob-text" }
gob-languages = { version = "0.532.0", path = "../gob-languages" }
gob-walk = { version = "0.532.0", path = "../gob-walk" }
grimble-arch = { version = "0.532.0", path = "../grimble-arch" }
grimble-ci = { version = "0.532.0", path = "../grimble-ci" }
grimble-bind = { version = "0.532.0", path = "../grimble-bind" }
grimble-lints = { version = "0.532.0", path = "../grimble-lints" }
grimble-model = { version = "0.532.0", path = "../grimble-model" }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1"
tracing = "0.1"

[dev-dependencies]
gob-mdtest = { path = "../gob-mdtest" }
tempfile = "3"

[lints]
workspace = true
