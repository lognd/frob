[package]
autotests = false
name = "grimble-bind"
version.workspace = true
description = "The binding relation B (entity, role, identity, status, source) from the four ranked sources, ownership, and the SYS binding rules."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
gob-cache = { version = "0.532.0", path = "../gob-cache" }
gob-directives = { version = "0.532.0", path = "../gob-directives" }
gob-ir = { version = "0.532.0", path = "../gob-ir" }
gob-languages = { version = "0.532.0", path = "../gob-languages" }
gob-lock = { version = "0.532.0", path = "../gob-lock" }
gob-rules = { version = "0.532.0", path = "../gob-rules" }
gob-symbols = { version = "0.532.0", path = "../gob-symbols" }
gob-text = { version = "0.532.0", path = "../gob-text" }
gob-walk = { version = "0.532.0", path = "../gob-walk" }
grimble-model = { version = "0.532.0", path = "../grimble-model" }
postcard = { version = "1", default-features = false, features = ["use-std"] }
rayon = "1"
serde_json = "1"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
gob-mdtest = { path = "../gob-mdtest" }
tempfile = "3"

# frob:ticket 01M4MGEZBQ9DD7BKKZ8ZM1HA1J
# One integration-test binary: tests/main.rs includes every other tests/*.rs as a module, so the
# crate links once instead of once per file. A new tests/x.rs must be added there as `mod x;`.
[[test]]
name = "main"
path = "tests/main.rs"
