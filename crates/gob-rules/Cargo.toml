[package]
autotests = false
name = "gob-rules"
version.workspace = true
description = "Rule metadata, findings, registry and exception primitives for the frob/grimble/crunk goblins."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
blake3 = "1"
gob-caps = { version = "0.532.0", path = "../gob-caps" }
gob-macros = { version = "0.532.0", path = "../gob-macros" }
gob-text = { version = "0.532.0", path = "../gob-text" }
inventory = "0.3"
schemars = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
trybuild = "1"

[lints]
workspace = true

# frob:ticket 01M4MGEZBQ9DD7BKKZ8ZM1HA1J
# One integration-test binary: tests/main.rs includes every other tests/*.rs as a module, so the
# crate links once instead of once per file. A new tests/x.rs must be added there as `mod x;`.
[[test]]
name = "main"
path = "tests/main.rs"
