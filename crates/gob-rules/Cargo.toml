[package]
name = "gob-rules"
version = "0.0.0"
description = "Rule metadata, findings, registry and exception primitives for the frob/grimble/crunk goblins."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
blake3 = "1"
gob-macros = { path = "../gob-macros" }
gob-text = { path = "../gob-text" }
inventory = "0.3"
schemars = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
