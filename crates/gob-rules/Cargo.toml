[package]
name = "gob-rules"
version.workspace = true
description = "Rule metadata, findings, registry and exception primitives for the frob/grimble/crunk goblins."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
blake3 = "1"
