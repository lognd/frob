gob-text = { version = "0.532.0", path = "../gob-text" }
inventory = "0.3"
schemars = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
