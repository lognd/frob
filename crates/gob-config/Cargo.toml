[package]
name = "gob-config"
version.workspace = true
description = "Layered config loading, materialized knobs, CFG001 and schema export for the frob/grimble/crunk goblins."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
blake3 = "1"
gob-macros = { version = "0.532.0", path = "../gob-macros" }
gob-rules = { version = "0.532.0", path = "../gob-rules" }
inventory = "0.3"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strsim = "0.11"
thiserror = "2"
toml = "1"
toml_edit = "0.25"
tracing = "0.1"

[dev-dependencies]
insta = { version = "1", features = ["json"] }
tempfile = "3"

[lints]
workspace = true
