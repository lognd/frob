[package]
name = "gob-diagnostics"
version.workspace = true
description = "Output envelope, exit-code table and text/JSON renderers for the frob/grimble/crunk goblins."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
anstream = "1.0"
anstyle = "1"
gob-rules = { version = "0.532.0", path = "../gob-rules" }
gob-text = { version = "0.532.0", path = "../gob-text" }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
insta = "1"
proptest = "1"

[lints]
workspace = true
