[package]
name = "gob-diagnostics"
version = "0.0.0"
description = "Output envelope, exit-code table and text/JSON renderers for the frob/grimble/crunk goblins."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
anstream = "0.6"
anstyle = "1"
gob-rules = { path = "../gob-rules" }
gob-text = { path = "../gob-text" }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
insta = "1"

[lints]
workspace = true
