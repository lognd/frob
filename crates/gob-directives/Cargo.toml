[package]
autotests = false
name = "gob-directives"
version.workspace = true
description = "Directive DSL: Directive derive support, comment scanner, binding rules and the PARSE and DSL rules for the frob/grimble/crunk goblins."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
gob-config = { version = "0.532.0", path = "../gob-config" }
gob-languages = { version = "0.532.0", path = "../gob-languages" }
gob-macros = { version = "0.532.0", path = "../gob-macros" }
gob-rules = { version = "0.532.0", path = "../gob-rules" }
gob-symbols = { version = "0.532.0", path = "../gob-symbols" }
gob-text = { version = "0.532.0", path = "../gob-text" }
inventory = "0.3"
postcard = { version = "1", default-features = false, features = ["use-std"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strsim = "0.11"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
gob-mdtest = { path = "../gob-mdtest" }
gob-walk = { path = "../gob-walk" }

[lints]
workspace = true

# frob:ticket 01M4MGEZBQ9DD7BKKZ8ZM1HA1J
# One integration-test binary: tests/main.rs includes every other tests/*.rs as a module, so the
# crate links once instead of once per file. A new tests/x.rs must be added there as `mod x;`.
[[test]]
name = "main"
path = "tests/main.rs"

# scan asserts the exact set of registered verbs, so it must not share a binary with derive.rs,
# whose derived `demo:all-modes` directive registers into the same global registry.
[[test]]
name = "scan"
path = "tests/scan.rs"
