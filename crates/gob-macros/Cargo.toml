[package]
autotests = false
name = "gob-macros"
version.workspace = true
description = "Proc macros (derive Rule, ConfigTable, Command, Directive) for the frob/grimble/crunk goblins."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true

[lib]
proc-macro = true

[dependencies]
darling = "0.20"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

[dev-dependencies]
frob-ledger = { path = "../frob-ledger" }
gob-cli = { path = "../gob-cli" }
gob-config = { path = "../gob-config" }
gob-directives = { path = "../gob-directives" }
gob-rules = { path = "../gob-rules" }
trybuild = "1"

[lints]
workspace = true

# frob:ticket 01M4MGEZBQ9DD7BKKZ8ZM1HA1J
# One integration-test binary: tests/main.rs includes every other tests/*.rs as a module, so the
# crate links once instead of once per file. A new tests/x.rs must be added there as `mod x;`.
[[test]]
name = "main"
path = "tests/main.rs"
