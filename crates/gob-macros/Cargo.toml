[package]
name = "gob-macros"
version.workspace = true
description = "Proc macros (derive Rule, ConfigTable, Command, Directive) for the frob/grimble/crunk goblins."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true

[lib]
proc-macro = true

[dependencies]
darling = "0.20"
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["full"] }

[dev-dependencies]
frob-ledger = { path = "../frob-ledger" }
gob-cli = { path = "../gob-cli" }
gob-config = { path = "../gob-config" }
gob-directives = { path = "../gob-directives" }
gob-rules = { path = "../gob-rules" }
trybuild = "1"

[lints]
workspace = true
