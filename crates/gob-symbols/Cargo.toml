[package]
name = "gob-symbols"
version = "0.0.0"
description = "Symrefs, three-facet digests, imports and call graph for the frob goblins."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
gob-cache = { path = "../gob-cache" }
gob-languages = { path = "../gob-languages" }
gob-text = { path = "../gob-text" }
gob-walk = { path = "../gob-walk" }
blake3 = "1"
petgraph = { version = "0.8", default-features = false }
postcard = { version = "1", default-features = false, features = ["use-std"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
tree-sitter = "=0.27.0"

[dev-dependencies]
criterion = { version = "0.5", default-features = false }
tempfile = "3"

[[bench]]
name = "graph"
harness = false
