[package]
name = "gob-cache"
version.workspace = true
description = "Per-worktree SQLite artifact and findings cache for the frob goblins."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
blake3 = "1"
gob-time = { version = "0.532.0", path = "../gob-time" }
gob-exec = { version = "0.532.0", path = "../gob-exec" }
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
criterion = { version = "0.5", default-features = false }
tempfile = "3"

[[bench]]
name = "cache"
harness = false
