[package]
name = "gob-cli"
version.workspace = true
description = "Shared clap root, Command trait, envelope plumbing and verb registry for the frob/grimble/crunk goblins."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
gob-config = { version = "0.532.0", path = "../gob-config" }
gob-diagnostics = { version = "0.532.0", path = "../gob-diagnostics" }
gob-log = { version = "0.532.0", path = "../gob-log" }
gob-macros = { version = "0.532.0", path = "../gob-macros" }
gob-rules = { version = "0.532.0", path = "../gob-rules" }
gob-time = { version = "0.532.0", path = "../gob-time" }
inventory = "0.3"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
