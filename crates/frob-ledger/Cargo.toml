[package]
name = "frob-ledger"
version = "0.0.0"
description = "The frob ticket ledger: ULID tickets, append-only events, fold, SQLite index and merge driver."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
error_set = "0.9"
blake3 = "1"
gob-config = { version = "0.0.0", path = "../gob-config" }
gob-diagnostics = { version = "0.0.0", path = "../gob-diagnostics" }
gob-git = { version = "0.0.0", path = "../gob-git" }
gob-macros = { version = "0.0.0", path = "../gob-macros" }
gob-rules = { version = "0.0.0", path = "../gob-rules" }
inventory = "0.3"
gob-time = { version = "0.0.0", path = "../gob-time" }
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1"
tracing = "0.1"
ulid = "1"

[dev-dependencies]
criterion = { version = "0.5", default-features = false }
tempfile = "3"
proptest = "1"

[[bench]]
name = "ledger"
harness = false

[lints]
workspace = true
