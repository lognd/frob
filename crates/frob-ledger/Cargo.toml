[package]
name = "frob-ledger"
version = "0.0.0"
description = "The frob ticket ledger: ULID tickets, append-only events, fold, SQLite index and merge driver."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
error_set = "0.9"
gob-diagnostics = { path = "../gob-diagnostics" }
gob-git = { path = "../gob-git" }
gob-macros = { path = "../gob-macros" }
gob-rules = { path = "../gob-rules" }
inventory = "0.3"
jiff = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1"
tracing = "0.1"
ulid = "1"

[dev-dependencies]
criterion = { version = "0.5", default-features = false }
tempfile = "3"

[[bench]]
name = "ledger"
harness = false

[lints]
workspace = true
