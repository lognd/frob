[package]
autotests = false
name = "gob-git"
version.workspace = true
description = "In-process git for the frob/grimble/crunk goblins: gix reads, ledger commits by compare-and-swap, bounded spawn fallbacks."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
gix = { version = "0.87", default-features = false, features = ["sha1", "max-performance-safe", "index", "status", "revision", "blob-diff", "worktree-mutation", "merge"] }
gob-path = { version = "0.532.0", path = "../gob-path" }
gob-exec = { version = "0.532.0", path = "../gob-exec" }
gob-walk = { version = "0.532.0", path = "../gob-walk" }
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

# frob:ticket 01M4MGEZBQ9DD7BKKZ8ZM1HA1J
# One integration-test binary: tests/main.rs includes every other tests/*.rs as a module, so the
# crate links once instead of once per file. A new tests/x.rs must be added there as `mod x;`.
[[test]]
name = "main"
path = "tests/main.rs"
