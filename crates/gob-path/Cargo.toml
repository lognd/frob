[package]
autotests = false
name = "gob-path"
version.workspace = true
description = "Repository-relative path type, host-path bridges and display paths for the frob/grimble/crunk goblins."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
thiserror = "2"
tracing = "0.1"
typed-path = "0.12"

[dev-dependencies]
proptest = "1"

[lints]
workspace = true

# frob:ticket 01M4MGEZBQ9DD7BKKZ8ZM1HA1J
# One integration-test binary: tests/main.rs includes every other tests/*.rs as a module, so the
# crate links once instead of once per file. A new tests/x.rs must be added there as `mod x;`.
[[test]]
name = "main"
path = "tests/main.rs"
