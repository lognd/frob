[package]
name = "frob-land"
version = "0.0.0"
description = "frob land: synchronous land of a leased ticket branch under the land lock, with preconditions, dry-run and close on land."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
blake3 = "1"
frob-check = { version = "0.0.0", path = "../frob-check" }
frob-evidence = { version = "0.0.0", path = "../frob-evidence" }
frob-lease = { version = "0.0.0", path = "../frob-lease" }
frob-ledger = { version = "0.0.0", path = "../frob-ledger" }
frob-worktree = { version = "0.0.0", path = "../frob-worktree" }
gob-cli = { version = "0.0.0", path = "../gob-cli" }
gob-diagnostics = { version = "0.0.0", path = "../gob-diagnostics" }
gob-exec = { version = "0.0.0", path = "../gob-exec" }
gob-git = { version = "0.0.0", path = "../gob-git" }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
