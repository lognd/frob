[package]
autotests = false
name = "gob-pattern"
version.workspace = true
description = "The declarative rule engine over U terms: rules/*.grl.toml with kind, role, callee, all, any, not, inside and has, one rule file for every language."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
gob-ir = { version = "0.532.0", path = "../gob-ir" }
serde = { version = "1", features = ["derive"] }
gob-languages = { version = "0.532.0", path = "../gob-languages" }
thiserror = "2"
tracing = "0.1"
tree-sitter = "=0.27.0"
toml = "1"

[dev-dependencies]
gob-text = { version = "0.532.0", path = "../gob-text" }

[lints]
workspace = true

# frob:ticket 01M4MGEZBQ9DD7BKKZ8ZM1HA1J
# One integration-test binary: tests/main.rs includes every other tests/*.rs as a module, so the
# crate links once instead of once per file. A new tests/x.rs must be added there as `mod x;`.
[[test]]
name = "main"
path = "tests/main.rs"
