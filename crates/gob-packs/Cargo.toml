[package]
autotests = false
name = "gob-packs"
version.workspace = true
description = "Product-neutral pack.toml manifest model and validation shared by frob, grimble and crunk."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
blake3 = "1"
globset = "0.4"
toml = "1"
tracing = "0.1"
gob-ir = { version = "0.532.0", path = "../gob-ir" }
gob-plan = { version = "0.532.0", path = "../gob-plan" }
gob-trust = { version = "0.532.0", path = "../gob-trust" }

[dev-dependencies]
proptest = "1"
tempfile = "3"

[lints]
workspace = true

# frob:ticket 01M4MGEZBQ9DD7BKKZ8ZM1HA1J
# One integration-test binary: tests/main.rs includes every other tests/*.rs as a module, so the
# crate links once instead of once per file. A new tests/x.rs must be added there as `mod x;`.
[[test]]
name = "main"
path = "tests/main.rs"
