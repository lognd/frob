# zizmor: GitHub Actions security audits (tool-binding.md section 2).
name = "zizmor"
command = "uvx"
version = "1.30.1"
min_version = "1.30.0"
max_version = "1.30.99"
version_args = ["zizmor@1.30.1", "--version"]
parser = "zizmor-json-v1"
config_files = [".github/zizmor.yml", ".github/zizmor.yaml", "zizmor.yml"]
suppression = "#\\s*zizmor:\\s*ignore"

[exit]
success = [0]
findings = [10, 11, 12, 13, 14]

[[variants]]
args = ["zizmor@1.30.1", "--offline", "--format", "json-v1", "--no-exit-codes", "."]

[id_map]
unpinned-uses = "CI001"
dangerous-triggers = "CI006"
template-injection = "CI007"
artipacked = "CI010"
excessive-permissions = "CI003"
