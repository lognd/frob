[package]
name = "crunk-tokens"
version.workspace = true
description = "The crunk design-token model: the token set derived from a DesignSpec, token naming and Tailwind theme mapping inputs."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
keywords = ["css", "design-system", "design-tokens", "tailwind"]
categories = ["web-programming"]
readme = "README.md"

[lints]
workspace = true

[dependencies]
crunk-spec = { version = "0.532.0", path = "../crunk-spec" }
crunk-tailwind = { version = "0.532.0", path = "../crunk-tailwind" }
crunk-values = { version = "0.532.0", path = "../crunk-values" }
gob-exec = { version = "0.532.0", path = "../gob-exec" }
gob-fs = { version = "0.532.0", path = "../gob-fs" }
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
