[package]
name = "gob-languages"
version.workspace = true
description = "Feature-gated tree-sitter grammars, bounded parsing and cached queries for the goblins."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true

[features]
default = ["rust", "markdown", "toml", "python", "csharp", "typescript", "tsx", "javascript", "jsx", "css"]
rust = ["dep:tree-sitter-rust"]
markdown = ["dep:tree-sitter-md"]
toml = ["dep:tree-sitter-toml-ng"]
python = ["dep:tree-sitter-python"]
csharp = ["dep:tree-sitter-c-sharp"]
typescript = ["dep:tree-sitter-typescript"]
tsx = ["dep:tree-sitter-typescript"]
javascript = ["dep:tree-sitter-javascript"]
# JSX is the JavaScript grammar (it parses JSX natively) under its own language name.
jsx = ["dep:tree-sitter-javascript"]
css = ["dep:tree-sitter-css"]

[dependencies]
gob-text = { version = "0.532.0", path = "../gob-text" }
thiserror = "2"
tracing = "0.1"
tree-sitter = "=0.27.0"
# Grammar crates are pinned exactly: the pin is part of the cache identity
# (see `grammar::GRAMMAR_PINS` and the test that checks it against this file).
tree-sitter-rust = { version = "=0.24.2", optional = true }
tree-sitter-md = { version = "=0.5.3", optional = true }
tree-sitter-toml-ng = { version = "=0.7.0", optional = true }
tree-sitter-python = { version = "=0.25.0", optional = true }
tree-sitter-c-sharp = { version = "=0.23.5", optional = true }
tree-sitter-typescript = { version = "=0.23.2", optional = true }
tree-sitter-javascript = { version = "=0.25.0", optional = true }
tree-sitter-css = { version = "=0.25.0", optional = true }

[lints]
workspace = true
