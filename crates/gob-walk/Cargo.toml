[package]
name = "gob-walk"
version.workspace = true
description = "Ignore-aware parallel repository walk with blake3 digests for the frob goblins."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
blake3 = "1"
ignore = "0.4"
inventory = "0.3"
rayon = "1"
thiserror = "2"
toml = "1"
tracing = "0.1"

[dev-dependencies]
# frob:ticket 01M561ZFF7PTBZAMHJ0JJFRXBG
# path-only: a versioned dev-dep would make gob-walk and gob-git publish-order cycle
gob-git = { path = "../gob-git" }
criterion = { version = "0.5", default-features = false }
proptest = "1"
serde_json = "1"
tempfile = "3"

[[bench]]
name = "walk"
harness = false
