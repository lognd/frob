[package]
name = "gob-walk"
version = "0.0.0"
description = "Ignore-aware parallel repository walk with blake3 digests for the frob goblins."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
blake3 = "1"
gob-git = { path = "../gob-git" }
ignore = "0.4"
rayon = "1"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
criterion = { version = "0.5", default-features = false }
proptest = "1"
tempfile = "3"

[[bench]]
name = "walk"
harness = false
