[package]
autotests = false
name = "gob-exec"
version.workspace = true
description = "Bounded process pool, spawn allowlist and PROC001 scan for the frob/grimble/crunk goblins."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
gob-fs = { version = "0.532.0", path = "../gob-fs" }
gob-log = { version = "0.532.0", path = "../gob-log" }
thiserror = "2"
tracing = "0.1"
walkdir = "2"
which = "8"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["signal"] }

[dev-dependencies]
proptest = "1"
tempfile = "3"

[lints]
workspace = true

# frob:ticket 01M4MGEZBQ9DD7BKKZ8ZM1HA1J
# One integration-test binary: tests/main.rs includes every other tests/*.rs as a module, so the
# crate links once instead of once per file. A new tests/x.rs must be added there as `mod x;`.
[[test]]
name = "main"
path = "tests/main.rs"
