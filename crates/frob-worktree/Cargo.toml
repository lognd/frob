[package]
name = "frob-worktree"
version = "0.0.0"
description = "frob work, start and requeue: lease, worktree, branch and in-progress transition in one verb."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
frob-ledger = { path = "../frob-ledger" }
frob-lease = { path = "../frob-lease" }
frob-pm = { path = "../frob-pm" }
gob-cli = { path = "../gob-cli" }
gob-config = { path = "../gob-config" }
gob-diagnostics = { path = "../gob-diagnostics" }
gob-git = { path = "../gob-git" }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1"
tracing = "0.1"

[dev-dependencies]
gob-exec = { path = "../gob-exec" }
tempfile = "3"

[lints]
workspace = true
