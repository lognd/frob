[package]
autotests = false
name = "grimble-model"
version.workspace = true
description = "The .grmb language: lexer, parser, formatter, U adapter (F4) and the MDL well-formedness rules."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
gob-caps = { version = "0.532.0", path = "../gob-caps" }
gob-directives = { version = "0.532.0", path = "../gob-directives" }
gob-ir = { version = "0.532.0", path = "../gob-ir" }
gob-languages = { version = "0.532.0", path = "../gob-languages" }
gob-rules = { version = "0.532.0", path = "../gob-rules" }
gob-symbols = { version = "0.532.0", path = "../gob-symbols" }
gob-text = { version = "0.532.0", path = "../gob-text" }
gob-walk = { version = "0.532.0", path = "../gob-walk" }
inventory = "0.3"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
gob-mdtest = { path = "../gob-mdtest" }
proptest = "1"

# frob:ticket 01M4MGEZBQ9DD7BKKZ8ZM1HA1J
# One integration-test binary: tests/main.rs includes every other tests/*.rs as a module, so the
# crate links once instead of once per file. A new tests/x.rs must be added there as `mod x;`.
[[test]]
name = "main"
path = "tests/main.rs"
