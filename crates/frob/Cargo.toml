[package]
name = "frob-cli"
version = "0.0.0"
description = "The frob binary: doctor, init, config, schema and ticket verbs on the shared goblin CLI root."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
publish = false

[lib]
name = "frob_cli"
path = "src/lib.rs"

[[bin]]
name = "frob"
path = "src/main.rs"

[dependencies]
gob-cache = { path = "../gob-cache" }
gob-cli = { path = "../gob-cli" }
gob-config = { path = "../gob-config" }
gob-exec = { path = "../gob-exec" }
gob-git = { path = "../gob-git" }
gob-rules = { path = "../gob-rules" }
frob-ledger = { path = "../frob-ledger" }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tracing = "0.1"

[dev-dependencies]
assert_cmd = "2"
insta = { version = "1", features = ["json", "redactions"] }
tempfile = "3"

[lints]
workspace = true
