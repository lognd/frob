[package]
name = "frob-cli"
version = "0.0.0"
description = "The frob binary: doctor, init, config, schema, ticket, lease, evidence, test, ack, check and land verbs on the shared goblin CLI root."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
publish = false

[package.metadata.dist]
# frob-cli is the only distributable binary; dist ignores publish = false without this.
dist = true

[lib]
name = "frob_cli"
path = "src/lib.rs"

[[bin]]
name = "frob"
path = "src/main.rs"

[dependencies]
gob-cache = { path = "../gob-cache" }
gob-cli = { path = "../gob-cli" }
gob-config = { path = "../gob-config" }
gob-exec = { path = "../gob-exec" }
gob-git = { path = "../gob-git" }
gob-rules = { path = "../gob-rules" }
gob-symbols = { path = "../gob-symbols" }
gob-walk = { path = "../gob-walk" }
frob-ack = { path = "../frob-ack" }
frob-check = { path = "../frob-check" }
frob-evidence = { path = "../frob-evidence" }
frob-land = { path = "../frob-land" }
frob-lease = { path = "../frob-lease" }
frob-ledger = { path = "../frob-ledger" }
frob-tests = { path = "../frob-tests" }
frob-worktree = { path = "../frob-worktree" }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tracing = "0.1"

[dev-dependencies]
assert_cmd = "2"
insta = { version = "1", features = ["json", "redactions"] }
tempfile = "3"

[lints]
workspace = true
