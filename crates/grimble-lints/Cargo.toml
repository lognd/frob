[package]
name = "grimble-lints"
version.workspace = true
description = "Syntactic detectors behind grimble's universal lint rules: host-path portability (PATH001-PATH003), clock discipline (TIME001-TIME002) for Rust and Python, swallowed errors (ERR001-ERR003) for Rust, Python, TypeScript and C#, and unpaired resource acquisition for TypeScript and JavaScript, and the first NEAT neatness rules (NEAT010 effect ceiling, NEAT031 dispatch-site-owns-logic) for Rust."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
gob-ir = { version = "0.532.0", path = "../gob-ir" }
gob-languages = { version = "0.532.0", path = "../gob-languages" }
gob-rules = { version = "0.532.0", path = "../gob-rules" }
gob-text = { version = "0.532.0", path = "../gob-text" }
rayon = "1"
thiserror = "2"
tree-sitter = "=0.27.0"
tracing = "0.1"

[dev-dependencies]
gob-mdtest = { path = "../gob-mdtest" }
