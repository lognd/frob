[package]
name = "grimble-lints"
version.workspace = true
description = "Syntactic detectors behind grimble's universal lint rules: host-path portability (PATH001-PATH003), swallowed errors (ERR001-ERR003) for Rust, Python, TypeScript and C#, and unpaired resource acquisition for TypeScript and JavaScript."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
gob-languages = { version = "0.532.0", path = "../gob-languages" }
gob-text = { version = "0.532.0", path = "../gob-text" }
thiserror = "2"
tree-sitter = "=0.27.0"
tracing = "0.1"
