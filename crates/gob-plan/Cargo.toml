[package]
name = "gob-plan"
version.workspace = true
description = "Plan format, GRL compiler and executor for the frob/grimble/crunk goblins (this milestone: the GRL lexer)."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
gob-caps = { version = "0.532.0", path = "../gob-caps" }
gob-ir = { version = "0.532.0", path = "../gob-ir" }
gob-pattern = { version = "0.532.0", path = "../gob-pattern" }
gob-rules = { version = "0.532.0", path = "../gob-rules" }
gob-symbols = { version = "0.532.0", path = "../gob-symbols" }
gob-text = { version = "0.532.0", path = "../gob-text" }
grimble-model = { version = "0.532.0", path = "../grimble-model" }
globset = "0.4"
regex = "1"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
proptest = "1"
insta = "1"
criterion = { version = "0.5", default-features = false }
gungraun = "0.20.0"

[[bench]]
name = "b1_plan_vs_handwritten"
harness = false

[[bench]]
name = "b1_equality"

[[bench]]
name = "ic_plan"
harness = false

[lints]
workspace = true
