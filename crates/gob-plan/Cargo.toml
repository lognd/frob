[package]
autotests = false
name = "gob-plan"
version.workspace = true
description = "Plan format, GRL compiler and executor for the frob/grimble/crunk goblins (this milestone: the GRL lexer)."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
gob-caps = { version = "0.532.0", path = "../gob-caps" }
gob-ir = { version = "0.532.0", path = "../gob-ir" }
gob-pattern = { version = "0.532.0", path = "../gob-pattern" }
gob-rules = { version = "0.532.0", path = "../gob-rules" }
gob-symbols = { version = "0.532.0", path = "../gob-symbols" }
gob-text = { version = "0.532.0", path = "../gob-text" }
globset = "0.4"
regex = "1"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
proptest = "1"
insta = "1"

[lints]
workspace = true

# frob:ticket 01M4MGEZBQ9DD7BKKZ8ZM1HA1J
# One integration-test binary: tests/main.rs includes every other tests/*.rs as a module, so the
# crate links once instead of once per file. A new tests/x.rs must be added there as `mod x;`.
[[test]]
name = "main"
path = "tests/main.rs"

[[test]]
name = "conformance"
path = "tests/conformance/main.rs"

[[test]]
name = "grl_errors"
path = "tests/grl_errors/main.rs"

[[test]]
name = "ten_rules"
path = "tests/ten_rules/main.rs"
