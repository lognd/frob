[package]
name = "gob-dev"
version = "0.0.0"
description = "Developer task runner (`cargo dev`) for the frob monorepo."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
name = "gob_dev"
path = "src/lib.rs"

[[bin]]
name = "gob-dev"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
frob-cli = { path = "../frob" }
gob-cli = { path = "../gob-cli" }
gob-config = { path = "../gob-config" }
gob-diagnostics = { path = "../gob-diagnostics" }
gob-directives = { path = "../gob-directives" }
gob-log = { path = "../gob-log" }
gob-mdtest = { path = "../gob-mdtest" }
gob-rules = { path = "../gob-rules" }
serde_json = "1"
similar = "2"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
