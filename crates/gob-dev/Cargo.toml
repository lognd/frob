[package]
name = "gob-dev"
version.workspace = true
description = "Developer task runner (`cargo dev`) for the frob monorepo."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
publish = false

[lib]
name = "gob_dev"
path = "src/lib.rs"

[[bin]]
name = "gob-dev"
path = "src/main.rs"

[dependencies]
gob-time = { version = "0.532.0", path = "../gob-time" }
clap = { version = "4", features = ["derive"] }
crunk-check = { path = "../crunk-check" }
crunk-spec = { path = "../crunk-spec" }
frob-check = { path = "../frob-check" }
frob-cli = { path = "../frob" }
frob-evidence = { path = "../frob-evidence" }
frob-ledger = { path = "../frob-ledger" }
gob-cli = { path = "../gob-cli" }
gob-config = { path = "../gob-config" }
gob-diagnostics = { path = "../gob-diagnostics" }
gob-exec = { path = "../gob-exec" }
gob-git = { path = "../gob-git" }
gob-directives = { path = "../gob-directives" }
gob-log = { path = "../gob-log" }
gob-mdtest = { path = "../gob-mdtest" }
gob-rules = { path = "../gob-rules" }
grimble-check = { path = "../grimble-check" }
jiff = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
similar = "2"
tempfile = "3"
thiserror = "2"
toml = "1"
tracing = "0.1"
ulid = "1"

[dev-dependencies]
# Only tests/profile_coverage.rs reads the product command trees (Cli::verb_flags); linking the
# product crates into the tool itself would add their verbs to the generated CLI reference.
crunk = { path = "../crunk" }
grimble = { path = "../grimble" }

[lints]
workspace = true
