[package]
name = "gob-dev"
version.workspace = true
description = "Developer task runner (`cargo dev`) for the frob monorepo."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
publish = false

[lib]
name = "gob_dev"
path = "src/lib.rs"

[[bin]]
name = "gob-dev"
path = "src/main.rs"

[dependencies]
gob-time = { version = "0.532.0", path = "../gob-time" }
clap = { version = "4", features = ["derive"] }
crunk = { path = "../crunk" }
crunk-check = { path = "../crunk-check" }
crunk-spec = { path = "../crunk-spec" }
gob-check = { path = "../gob-check" }
gob-cli = { path = "../gob-cli" }
gob-config = { path = "../gob-config" }
gob-diagnostics = { path = "../gob-diagnostics" }
gob-exec = { path = "../gob-exec" }
gob-git = { path = "../gob-git" }
gob-directives = { path = "../gob-directives" }
gob-log = { path = "../gob-log" }
gob-path = { path = "../gob-path" }
gob-plan = { path = "../gob-plan" }
gob-mdtest = { path = "../gob-mdtest" }
gob-rules = { path = "../gob-rules" }
gob-symbols = { path = "../gob-symbols" }
grimble = { path = "../grimble" }
grimble-check = { path = "../grimble-check" }
jiff = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
tempfile = "3"
thiserror = "2"
toml = "1"
tracing = "0.1"

[dev-dependencies]
gob-testsupport = { path = "../gob-testsupport" }
serde_yaml_ng = "0.10"

[lints]
workspace = true
