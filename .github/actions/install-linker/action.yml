name: Install the Linux linker
description: >-
  Install clang and mold on a Linux runner, the linker setup .cargo/config.toml selects for
  Linux (clang driver, -fuse-ld=mold). A no-op on other runners. Every job that compiles Rust
  on a Linux host uses this one step (a test in crates/frob-release/tests/it/release_workflow.rs
  fails otherwise).
runs:
  using: composite
  steps:
    - name: Install mold and clang (linux linker)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        # Ubuntu mirrors flake on hosted runners; retry the whole update+install with backoff.
        for attempt in 1 2 3 4 5; do
          if sudo apt-get -o Acquire::Retries=3 update \
            && sudo apt-get -o Acquire::Retries=3 install -y mold clang; then
            exit 0
          fi
          echo "apt attempt $attempt failed; retrying" >&2
          sleep $((attempt * 15))
        done
        exit 1
