# frob:used-by .github/workflows/ci.yml
# Actions in .github/workflows/*.yml are pinned to commit SHAs; Dependabot
# bumps the SHA and the trailing version comment together.
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
