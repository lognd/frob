name: Bug report
description: Report unexpected or incorrect behavior
title: "bug: "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: 'Output of `frob --version`, or the commit hash.'
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS
      placeholder: "Ubuntu 24.04, macOS 15, Windows 11"
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Command run
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The smallest repository shape or transcript that reproduces it.
    validations:
      required: true
