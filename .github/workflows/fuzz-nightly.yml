name: fuzz-nightly

# Nightly fuzzing (docs/design/build-test-ci.md section 6): the same `fuzz-build` step the PR
# job runs, but each target gets FROB_FUZZ_SECONDS (15 minutes) instead of 60 s. A crash uploads
# the reproducer as an artifact and files one GitHub issue per crash file. Every `uses:` below is
# pinned by full commit SHA (tests/fuzz_nightly.rs fails otherwise).
# frob:ticket 01M47QV3BRRZZSMJ5Q79N8G5S2

on:
  schedule:
    - cron: "43 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: fuzz (longer run per target)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      issues: write
    env:
      FROB_FUZZ_SECONDS: "900"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: "0"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # frob:accept TOOL002 because="sccache has no maintained first-party action; pinned by commit sha"
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal
          rustup default "$channel"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # frob:accept TOOL002 because="a local composite action must be addressed with ./; actionlint rejects the $/ form zizmor suggests"
      - uses: ./.github/actions/install-linker
      - name: Install cargo-fuzz
        run: cargo install --locked cargo-fuzz --version 0.12.0
      - name: Fuzz every target
        run: cargo dev ci --step fuzz-build
      - name: Upload crash reproducers
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crashes
          path: fuzz/artifacts/
          if-no-files-found: ignore
      - name: File one issue per crash
        if: failure()
        shell: bash
        run: |
          shopt -s nullglob
          for crash in fuzz/artifacts/*/crash-* fuzz/artifacts/*/oom-* fuzz/artifacts/*/timeout-*; do
            target=$(basename "$(dirname "$crash")")
            gh issue create \
              --title "fuzz: $target crashed ($(basename "$crash"))" \
              --body "Nightly run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID found a crash in target $target. Reproducer: artifact fuzz-crashes, file $crash. Replay: cargo +nightly fuzz run $target $crash"
          done
