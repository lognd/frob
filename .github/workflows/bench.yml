name: bench

# Scheduled benchmarks. B1 (docs/design/plugins.md section 6.6) holds the plan executor to 1.3x
# of handwritten Rust on TODO001, COV001 and DOC002; the bench binary exits non-zero when a
# ratio is over budget or findings differ, so a red run here is a regression signal.
# frob:ticket 01M5C7AA69TZRHHMZJGMRX2DYV

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  b1:
    name: b1 (plan executor vs handwritten)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # frob:accept TOOL002 because="sccache has no maintained first-party action; pinned by commit sha"
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal
          rustup default "$channel"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # frob:accept TOOL002 because="a local composite action must be addressed with ./; actionlint rejects the $/ form zizmor suggests"
      - uses: ./.github/actions/install-linker
      - name: B1 plan vs handwritten
        run: cargo bench -p gob-plan --bench b1_plan_vs_handwritten
