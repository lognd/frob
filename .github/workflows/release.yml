name: release

# T-3922: every third-party `uses:` in this file is pinned to a 40-hex
# commit SHA with a trailing version comment. Do not hand-unpin one to fix
# a build -- `.github/dependabot.yml` (github-actions ecosystem) is the
# expected update path: it resolves the pinned SHA, checks for a newer
# release, and opens a PR that bumps the SHA and its comment together.
#
# T-3011: manual dispatch ONLY. No push/pull_request/tag/schedule/release
# trigger exists here -- see docs/guides/release.md's "Proof: a normal
# push does not upload" section, and tests/unit/test_release_workflow_gate.py
# for the mechanical check that this stays true.
on:
  workflow_dispatch:
    inputs:
      override_red_ci:
        description: >-
          T-3251 escape hatch ONLY: explicitly override a non-green (RED
          or UNDETERMINED) CI status for the commit being released.
          Never the default -- leave false for a normal release. Requires
          override_reason to be non-empty or the override itself is
          refused.
        type: boolean
        default: false
      override_reason:
        description: >-
          Required when override_red_ci is true: why this release is
          proceeding despite a non-green CI status. Recorded in this
          run's own log alongside the dispatching actor.
        type: string
        default: ""

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # T-3251: fail-closed gate ahead of `upload`. Resolves ci.yml's
  # conclusion for THE EXACT COMMIT SHA being released (never a branch
  # name, never "the most recent run" on any commit) via
  # scripts/verify_release_ci_status.py, and distinguishes GREEN / RED /
  # UNDETERMINED -- an unreadable status is never treated as green. Does
  # NOT gate `build`/`build-sdists` (T-3011: building and retaining
  # evidence is never consent-gated) and does NOT weaken/replace any
  # existing T-3011 gate on `upload` -- it is an ADDITIONAL entry in
  # `upload`'s own `needs:` list below.
  verify-ci-status:
    name: Verify CI is green for this commit
    runs-on: ubuntu-latest
    permissions:
      actions: read
    # T-4806: checkout v4->v7, setup-uv v5->v10, cache v4->v6,
    # upload-artifact v4->v7 and download-artifact v4->v8 bumped
    # throughout this workflow (Dependabot PRs 6-10). Checked for
    # breaking changes: every multi-artifact download below already
    # passes `merge-multiple: true` (required since download-artifact
    # v4 when using `pattern:` against more than one matching artifact),
    # `retention-days` on upload-artifact is still a supported input in
    # v7, and setup-uv is not given cache inputs here so its v10 cache
    # default change has no effect. No input changes were needed.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Resolve ci.yml's status for this exact commit SHA
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          OVERRIDE: ${{ inputs.override_red_ci }}
          OVERRIDE_REASON: ${{ inputs.override_reason }}
        run: |
          set -e
          uv run python3 scripts/verify_release_ci_status.py \
            --repo "$REPO" --sha "$SHA" \
            --override "$OVERRIDE" --override-reason "$OVERRIDE_REASON"

  # Builds wheels for the full target matrix plus an sdist per crate, and
  # retains everything as CI artifacts. Runs on every manual dispatch, no
  # approval required -- building and retaining evidence is never
  # consent-gated, only the upload step below is.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # T-4464: pinned to 2_28 (glibc 2.28), not "auto" (manylinux2014,
          # glibc 2.17). tree-sitter 0.25.10's build.rs compiles its C
          # sources with -std=c11 and -D_DEFAULT_SOURCE; _DEFAULT_SOURCE as
          # a feature-test macro was introduced in glibc 2.19, so on 2.17
          # the endian.h shim never exposes le16toh/etc and the symbol goes
          # unresolved at import time (undefined symbol: le16toh). glibc
          # 2.28 defines _DEFAULT_SOURCE's macros, so the import smoke step
          # below succeeds. Do not revert to "auto" without re-verifying
          # the import smoke on a manylinux2014 container.
          - target: manylinux-x86_64
            os: ubuntu-latest
            maturin_target: x86_64-unknown-linux-gnu
            manylinux: "2_28"
          # cross: true -- built via maturin-action's manylinux
          # container/QEMU on an x86_64 ubuntu-latest host, so the
          # resulting wheel's platform tag (aarch64) does not match the
          # host's own architecture -- an x86_64 process cannot `uv pip
          # install`/import it (coordinator addendum to T-4470, run
          # 34781548188: "Failed to determine installation plan").
          # Import-smoke below is skipped for cross entries; a wheel
          # QEMU-running Python is deliberately out of scope.
          - target: manylinux-aarch64
            os: ubuntu-latest
            maturin_target: aarch64-unknown-linux-gnu
            manylinux: "2_28"
            cross: true
          # T-4470: macos-13 (Intel hosted image) was retired by GitHub
          # in late 2025 -- the label never schedules a runner, the job
          # queues forever, and (because this workflow's concurrency
          # group is `release` with cancel-in-progress: false) every
          # later dispatch queues behind it too (run 34769124533 sat
          # queued 4h18m). Fix: build x86_64-apple-darwin as a CROSS
          # build on the arm64 macos-latest runner -- maturin-action
          # adds the x86_64-apple-darwin rustup target itself when the
          # requested target differs from the host, so no separate
          # toolchain/target-add step is needed here (this job has no
          # explicit rust-toolchain step at all; maturin-action owns
          # that). The abi3 wheel this cross-build produces needs no
          # x86_64 Python to build, only to import -- see the
          # import-smoke step below for the matching skip.
          - target: macos-x86_64
            os: macos-latest
            maturin_target: x86_64-apple-darwin
            manylinux: "off"
            cross: true
          - target: macos-arm64
            os: macos-latest
            maturin_target: aarch64-apple-darwin
            manylinux: "off"
          - target: windows-x86_64
            os: windows-latest
            maturin_target: x86_64-pc-windows-msvc
            manylinux: "off"
    # T-4470: an unschedulable label (a retired image, or a future one)
    # must FAIL after a bounded wait, not sit queued indefinitely and
    # hold `concurrency: group: release` against every later dispatch.
    timeout-minutes: 60
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Build frob-core wheel (abi3-py311)
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: frob-core
          target: ${{ matrix.maturin_target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
      - name: Build frob-strata wheel (abi3-py311)
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: strata-core
          target: ${{ matrix.maturin_target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
      # Acceptance: "a built wheel installs into a clean venv on each
      # target platform and the natives import successfully" -- verified
      # HERE, on the real runner that just built it, not asserted.
      # T-4464: OS-aware venv layout. The POSIX bin/python path does not
      # exist on Windows (uv lays a Windows venv out as Scripts/python.exe)
      # -- previously hardcoded, which made this step fail to find an
      # interpreter on windows-x86_64 every run. Also moved the venv under
      # $RUNNER_TEMP instead of a hardcoded /tmp path, which is not valid
      # on Windows runners either.
      - name: Install the just-built wheels into a clean venv and import them
        shell: bash
        run: |
          set -e
          # T-4472: `uv pip install` of a foreign-arch wheel itself fails
          # ("Failed to determine installation plan ... incompatible
          # with the current platform") -- it is not only the `import`
          # call after it that a cross build can't survive on its own
          # host. Run 34786316434 (post-T-4470 land e16d97290) showed
          # both cross entries still failing this step because the venv
          # creation and uv pip install used to run UNCONDITIONALLY
          # before the cross/native branch below, so the skip branch was
          # never reached in time -- the install itself already blew up.
          # Cross entries now do nothing but a wheel-existence check;
          # only the native branch creates a venv and installs/imports.
          #
          # T-4470 (+coordinator addendum): a `cross: true` matrix entry
          # is built for an architecture that does NOT match this job's
          # own host (macos-x86_64 cross-built on arm64 macos-latest;
          # manylinux-aarch64 cross-built via QEMU/manylinux container
          # on x86_64 ubuntu-latest). The host process can never install
          # or import a wheel for a different architecture -- that
          # failure has nothing to do with the wheel's correctness -- so
          # cross entries skip both and fall back to a wheel-file
          # existence check; every native (non-cross) target still
          # installs and imports for real.
          if [ "${{ matrix.cross }}" = "true" ]; then
            echo "T-4470/T-4472: skipping cross-arch install+import smoke for ${{ matrix.target }} (host cannot install/import a wheel built for a different architecture)"
            ls frob-core/dist/*.whl strata-core/dist/*.whl
          else
            venv_dir="$RUNNER_TEMP/native-check-venv"
            uv venv "$venv_dir"
            if [ "$RUNNER_OS" = "Windows" ]; then
              python_bin="$venv_dir/Scripts/python.exe"
            else
              python_bin="$venv_dir/bin/python"
            fi
            uv pip install --python "$python_bin" \
              frob-core/dist/*.whl strata-core/dist/*.whl
            "$python_bin" -c "import frob_core, strata_core; print(frob_core.__name__, strata_core.__name__)"
          fi
      - name: Upload frob-core wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frob-core-${{ matrix.target }}
          path: frob-core/dist/*.whl
          retention-days: 90
      - name: Upload frob-strata wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: strata-core-${{ matrix.target }}
          path: strata-core/dist/*.whl
          retention-days: 90

  build-sdists:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, resolved 2026-09-05
      - name: frob-core sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: frob-core
          command: sdist
          args: --out dist
      - name: frob-strata sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: strata-core
          command: sdist
          args: --out dist
      - name: frob sdist + wheel (pure Python)
        run: uv build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frob-core-sdist
          path: frob-core/dist/*.tar.gz
          retention-days: 90
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: strata-core-sdist
          path: strata-core/dist/*.tar.gz
          retention-days: 90
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frob-dist
          path: dist/*
          retention-days: 90

  # T-3884: proves the BUILT frob wheel (not the source tree ci.yml
  # already proves) installs, starts, and reports healthy -- on the SAME
  # per-target runner that built this platform's frob-core/strata-core
  # wheels, for the same reason the native-check step in `build` runs
  # there rather than centrally: the platform that built a wheel is the
  # honest place to prove it installs (a linux-only smoke test would not
  # catch a Windows-only packaging fault). Installs the LOCAL wheel but
  # resolves every OTHER dependency from the real index (never
  # TestPyPI, never --no-index) -- see
  # docs/guides/release.md#artifact-smoke-stage-t-3884 for the full
  # local-dist-vs-index decision. This job's failure BLOCKS `upload`
  # (see `upload`'s own `needs:` below) -- an advisory smoke test is a
  # green light nobody reads.
  # T-4470: unlike `build`'s import-smoke step (a single import call this
  # job's own artifact_smoke.py does more than that -- it installs the
  # wheel into a clean venv and RUNS real `frob` commands against it
  # (see the script's own docstring: "a REAL command, never just an
  # import statement"). That needs a genuinely-executable x86_64
  # interpreter, not just an x86_64-tagged wheel, and this repo has no
  # verified way to get one on the arm64 macos-latest hosted runner
  # (no macos-13 x86_64 image is left to run it on, and an unverified
  # Rosetta/uv-managed-interpreter guess is worse than an honest gap --
  # PLATFORM001). So macos-x86_64 is DROPPED from this matrix rather
  # than faked: the x86_64 wheel still gets built and retained as a CI
  # artifact (see `build`'s matrix), it is just not smoke-executed here.
  # docs/guides/release.md notes this boundary explicitly.
  artifact-smoke:
    needs: [build, build-sdists]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: manylinux-x86_64
            os: ubuntu-latest
          # T-4476: run 34799974130 -- this leg previously ran on
          # ubuntu-latest (x86_64) and tried to `uv pip install` the
          # aarch64 wheel into an x86_64 host venv, the same
          # cross-architecture boundary T-4470 hit for macos-x86_64.
          # Unlike macos-x86_64 (no native arm64 hosted image was
          # available there), GitHub DOES publish a hosted native
          # arm64 Linux image -- `ubuntu-24.04-arm` -- free for public
          # repos (this repo is public: gh repo view --json isPrivate
          # -> false) since it went GA in Jan 2025. Running the leg
          # there keeps this smoke test REAL (a genuine install +
          # `frob` execution on matching hardware) instead of falling
          # back to the PLATFORM001 wheel-existence-only boundary.
          - target: manylinux-aarch64
            os: ubuntu-24.04-arm
          - target: macos-arm64
            os: macos-latest
          - target: windows-x86_64
            os: windows-latest
    # T-4470: an unschedulable label (a retired image, or a future one)
    # must FAIL after a bounded wait, not sit queued indefinitely and
    # hold `concurrency: group: release` against every later dispatch.
    timeout-minutes: 60
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Download the universal frob wheel (built once, build-sdists)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frob-dist
          path: smoke-dist/frob
      - name: Download this platform's frob-core/strata-core wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*-core-${{ matrix.target }}"
          path: smoke-dist/cores
          merge-multiple: true
      - name: Run the artifact smoke stage (T-3884)
        shell: bash
        run: |
          set -e
          WHEEL=$(ls smoke-dist/frob/*.whl)
          uv run python scripts/artifact_smoke.py \
            --wheel "$WHEEL" \
            --core-wheels-dir smoke-dist/cores

  # T-4263: PyPI identifies a PENDING trusted publisher by the tuple
  # (owner, repo, workflow filename, environment name) -- NOT by project
  # name. A single job publishing all three distributions under one
  # environment makes all three claim the identical tuple, so the first
  # registration succeeds and PyPI refuses the second as a duplicate
  # ("A pending trusted publisher matching this configuration has
  # already been registered for a different project name"). Since an
  # environment is declared per JOB, the fix is one job per distribution,
  # each with its own environment -- see the three upload-* jobs below.
  # This is why `upload` no longer exists as a single job; do not
  # recombine these three into one without re-reading this comment.
  #
  # APPROVAL-GATE DECISION (T-4263, acceptance #3): only the application
  # (`upload-frob`) carries a required-reviewer environment (`pypi`, the
  # pre-existing protected environment -- unchanged from before this
  # split). The two kernel environments (`pypi-frob-core`,
  # `pypi-frob-strata`) are deliberately left WITHOUT a required
  # reviewer in this repo's Settings > Environments. Reasoning: a kernel
  # publish is gated by the exact same four upstream jobs the application
  # is (green CI, real built wheels, a passing artifact smoke test, and
  # manual workflow_dispatch itself) and, per the ordering contract
  # below, is a strict PREREQUISITE the application cannot proceed
  # without -- it never reaches the index on its own initiative. A
  # reviewer gate on top of that would be a second approval prompt for a
  # decision already made once when the human dispatched this release,
  # not an independent checkpoint. `upload-frob` keeps the human gate
  # because it is the last, irreversible step of the whole release.
  #
  # ORDERING CONTRACT (T-3254's docs/guides/release.md comment, preserved
  # here as an explicit job dependency instead of in-job step order): the
  # application pins both kernels by exact version (Decision 1 in
  # docs/guides/release.md), so an application published without them is
  # uninstallable for everyone. `upload-frob`'s `needs:` below names both
  # kernel jobs, so a failure (or skip) of either one skips `upload-frob`
  # entirely -- GitHub Actions' default `needs:` semantics, not a manual
  # check. Proven by tests/unit/test_release_workflow_gate.py's
  # TestUploadSplitPerDistribution.
  #
  # Trusted publishing (OIDC, `id-token: write`) is used instead of a
  # stored PyPI API token in all three jobs -- see docs/guides/release.md's
  # "Decision 3".
  upload-frob-core:
    needs: [build, build-sdists, verify-ci-status, artifact-smoke]
    runs-on: ubuntu-latest
    environment: pypi-frob-core
    permissions:
      id-token: write
    steps:
      # Merges every frob-core-* artifact (5 platform wheels + sdist)
      # into one flat dir.
      - name: Download frob-core artifacts (wheels + sdist)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: frob-core-*
          path: dist-staging/frob-core
          merge-multiple: true
      - name: Publish frob-core to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist-staging/frob-core

  upload-frob-strata:
    needs: [build, build-sdists, verify-ci-status, artifact-smoke]
    runs-on: ubuntu-latest
    environment: pypi-frob-strata
    permissions:
      id-token: write
    steps:
      - name: Download frob-strata artifacts (wheels + sdist)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: strata-core-*
          path: dist-staging/strata-core
          merge-multiple: true
      - name: Publish frob-strata to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist-staging/strata-core

  # T-3011's original consent gate, unchanged: needs real wheels, green
  # CI, a passing smoke test, and workflow_dispatch, all gated behind the
  # `pypi` protected environment's required reviewer. T-4263 ADDS the two
  # kernel jobs to `needs:` (the ordering contract above) without
  # weakening any of the four pre-existing entries.
  upload-frob:
    needs: [build, build-sdists, verify-ci-status, artifact-smoke, upload-frob-core, upload-frob-strata]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download frob artifact (wheel + sdist)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frob-dist
          path: dist-staging/frob
      - name: Publish frob to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist-staging/frob
