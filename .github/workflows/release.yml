name: release

# Standalone binary archives for the `frob`, `grimble` and `crunk` binaries (one archive per
# product per platform: frob-cli-<target>, grimble-<target>, crunk-<target>), built with cargo-dist
# (dist-workspace.toml) and attached to a GitHub release. Hand-written
# around `dist build` so the trigger, SHA pins, per-job permissions and
# timeouts are ours (docs/decisions/2026-10-03-release-workflow-hand-written.md).
# Plan, build and smoke live in the reusable build-smoke.yml, shared with the dev jobs of ci.yml:
# the matrix, the dist pin and the smoke steps have one source there. It also builds
# the PyPI wheel sets (five wheels per product) (packaging/pypi) as run artifacts only.
# The `crates` job publishes the workspace crates to crates.io
# (`cargo dev publish`, resumable) from the protected `crates-io` environment
# through trusted publishing (OIDC, no stored token) once the crates exist;
# crates.io cannot configure trusted publishing for a crate that has never been
# published, so the first publish uses a CARGO_REGISTRY_TOKEN secret of the
# `crates-io` environment when one is set (the owner deletes it afterwards, and
# the job falls back to OIDC). The `pypi` job uploads the
# smoked wheels to PyPI the same way, from the protected `pypi` environment.

on:
  push:
    tags:
      - "frob-v*"
  # Dry run: builds, wheels and smoke on all five targets from the dispatched ref, publishing
  # nowhere (every publishing job below is guarded by `if: github.event_name == 'push'`, so a
  # dispatch never reaches the `release`, `crates` or `pypi` jobs, nor their environments). No
  # tag is involved, so the plan job skips the tag check and builds the Cargo version as is.
  workflow_dispatch:

permissions: {}

# One release at a time, queued rather than cancelled (a half-uploaded
# release must finish). Every job has a timeout, so a runner label that never
# schedules fails the run instead of holding this group forever.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Plan, build and smoke are the shared reusable workflow (also called by the dev jobs of ci.yml):
  # the tag check, the five archives, the five wheels, and the fresh-runner smoke of
  # every artifact. The call succeeds only when all of them did, so a job that
  # lists `artifacts` in `needs` runs only after the smoke passed. It passes no
  # secrets (the build needs none). A called workflow's permissions are capped by
  # this job's, so `contents: read` here is the most the build can hold.
  artifacts:
    name: artifacts (plan, build, wheel, smoke)
    # frob:accept TOOL002 because="actionlint accepts only ./ for a local reusable workflow; zizmor suggests $/, which actionlint rejects"
    uses: ./.github/workflows/build-smoke.yml
    permissions:
      contents: read
    with:
      tag: ${{ github.event_name == 'push' && github.ref_name || '' }}
      wheels: true

  release:
    name: release (GitHub release with archives)
    needs: artifacts
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: archives-*
          path: archives
          merge-multiple: true
      - name: Create the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.artifacts.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          flags=()
          case "$VERSION" in *-*) flags+=(--prerelease) ;; esac
          # The notes are the compiled CHANGELOG section of this version, printed by the
          # linux archive's own `frob release notes`; no markdown is parsed in shell.
          # The section is the whole body; no generated list is appended.
          mkdir unpacked
          tar -xJf archives/frob-cli-x86_64-unknown-linux-gnu.tar.xz -C unpacked
          frob_bin=$(find unpacked -name frob -type f | head -n 1)
          chmod +x "$frob_bin"
          "$frob_bin" release notes --version "$VERSION" --text > notes.md
          # Every product archive and checksum is named by its product (frob-cli, grimble, crunk); any
          # other file in archives/ is a bug and stops the release.
          assets=()
          for product in frob-cli grimble crunk; do
            for f in archives/"$product"-*; do assets+=("$f"); done
          done
          [ "${#assets[@]}" -eq "$(ls archives | wc -l)" ] || { echo "unexpected files in archives/" >&2; ls archives >&2; exit 1; }
          gh release create "$TAG" --repo "$REPO" --verify-tag --title "frob $VERSION" \
            --notes-file notes.md "${flags[@]}" "${assets[@]}"

  # crates.io in dependency order (crates/gob-dev/src/publish.rs). Resumable:
  # versions already on the index are skipped, so re-running a failed run
  # continues at the first unpublished crate. Trusted publishing: the job mints
  # an OIDC token and crates-io-auth-action trades it for a short-lived
  # registry token; no long-lived secret is stored. The `crates-io`
  # environment carries the owner's required-reviewer approval.
  crates:
    name: crates (crates.io publish in dependency order)
    needs: artifacts
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    env:
      # The repository's mold linker config is for dev machines; use the stock linker here.
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: cc
      RUSTFLAGS: "-C debuginfo=0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal
          rustup default "$channel"
      - name: Dry run (print the publish order)
        shell: bash
        run: cargo dev publish --dry-run
      # A secret cannot appear in an `if`, so this step turns "is a token set" into an output.
      - name: Detect a first-publish registry token in the crates-io environment
        id: mode
        shell: bash
        env:
          FIRST_PUBLISH_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -n "$FIRST_PUBLISH_TOKEN" ]; then
            echo "token=true" >> "$GITHUB_OUTPUT"
            echo "publishing with the environment's CARGO_REGISTRY_TOKEN (first publish)"
          else
            echo "token=false" >> "$GITHUB_OUTPUT"
            echo "no stored token; using trusted publishing (OIDC)"
          fi
      - name: Exchange the OIDC token for a short-lived crates.io token
        id: auth
        if: ${{ steps.mode.outputs.token != 'true' }}
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish in dependency order (skips versions already on the index)
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.auth.outputs.token }}
        run: cargo dev publish

  # PyPI, trusted publishing (OIDC, no stored token) from the protected `pypi`
  # environment, which carries the owner's required-reviewer approval. Three PyPI projects,
  # frob, grimble and crunk (one wheel set per product, D87; each project trusts this workflow and
  # this environment). It builds nothing: it uploads exactly the wheels the shared workflow
  # built and smoked
  # on fresh runners. It runs after smoke and independently of the crates.io publish
  # (which can take hours behind the new-crate rate limit). pypa/gh-action-pypi-publish is
  # used rather than the uv upload command
  # because it also uploads PEP 740 attestations by default and needs no tool
  # install. skip-existing makes a re-run after a partial upload resume.
  # The only job with id-token: write besides `crates`; it never gets contents.
  pypi:
    name: pypi (PyPI publish of the smoked wheels)
    needs: artifacts
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - name: Exactly five wheels per product are present
        shell: bash
        run: |
          total=0
          for product in frob grimble crunk; do
            count=$(find dist -maxdepth 1 -name "$product-*.whl" | wc -l)
            if [ "$count" -ne 5 ]; then
              echo "expected exactly five $product wheels in dist, found $count:" >&2
              find dist -type f >&2
              exit 1
            fi
            total=$((total + count))
          done
          if [ "$(find dist -type f | wc -l)" -ne "$total" ]; then
            echo "unexpected files in dist:" >&2
            find dist -type f >&2
            exit 1
          fi
      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          skip-existing: true
