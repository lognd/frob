name: release

# Standalone binary archives for the `frob` binary, built with cargo-dist
# (dist-workspace.toml) and attached to a GitHub release. Hand-written
# around `dist build` so the trigger, SHA pins, per-job permissions and
# timeouts are ours (docs/decisions/2026-10-03-release-workflow-hand-written.md).
# The PyPI wheel and crates.io publish are separate jobs added by their own
# tickets; this file publishes nothing outside the GitHub release.

on:
  push:
    tags:
      - "frob-v*"

permissions: {}

# One release at a time, queued rather than cancelled (a half-uploaded
# release must finish). Every job has a timeout, so a runner label that never
# schedules fails the run instead of holding this group forever.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  DIST_VERSION: "0.32.0"

jobs:
  plan:
    name: plan (tag and version agree)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Tag matches the lockstep workspace version
        id: check
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#frob-v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "tag $TAG is not frob-vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          crate=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "frob-cli") | .version')
          if [ "$crate" != "$version" ]; then
            echo "tag version $version differs from frob-cli version $crate" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.target }})
    needs: plan
    # An unschedulable label must fail after a bounded wait (v1 T-4470).
    timeout-minutes: 60
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            dist_host: x86_64-unknown-linux-gnu
            dist_sha: eb52f9fae0d0506774e9f1801c1168f87fa2c87a45e2d64d3ae7c89401929946
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            dist_host: aarch64-unknown-linux-gnu
            dist_sha: d29bcffeb3f8b0c517b4ce0dd2470926ed5cb0bb29d78c6bdd5f88d76ee14a6a
          - target: aarch64-apple-darwin
            os: macos-latest
            dist_host: aarch64-apple-darwin
            dist_sha: aa343b2ff78ec2981f17a65140250c5ad6062c74072163f68c5c2686d94763a7
          # Cross-built on the arm64 macos-latest runner; the Intel
          # image (macos-13) was retired and queued forever (v1 T-4470).
          - target: x86_64-apple-darwin
            os: macos-latest
            dist_host: aarch64-apple-darwin
            dist_sha: aa343b2ff78ec2981f17a65140250c5ad6062c74072163f68c5c2686d94763a7
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            dist_host: x86_64-pc-windows-msvc
            dist_sha: 26e845cabff12a92911ce960af73a86c8f9b2b2d9072b01dfe5b662acf044fa3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain and target
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --target "$TARGET"
          rustup default "$channel"
      - name: Install dist (checksum verified, unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          DIST_HOST: ${{ matrix.dist_host }}
          DIST_SHA: ${{ matrix.dist_sha }}
        run: |
          url="https://github.com/axodotdev/cargo-dist/releases/download/v${DIST_VERSION}/cargo-dist-${DIST_HOST}.tar.xz"
          curl --proto '=https' --tlsv1.2 -sSfL "$url" -o "$RUNNER_TEMP/dist.tar.xz"
          echo "${DIST_SHA}  $RUNNER_TEMP/dist.tar.xz" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/dist-bin"
          tar -xJf "$RUNNER_TEMP/dist.tar.xz" -C "$RUNNER_TEMP/dist-bin" --strip-components=1
          echo "$RUNNER_TEMP/dist-bin" >> "$GITHUB_PATH"
      - name: Install dist (checksum verified, windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          DIST_HOST: ${{ matrix.dist_host }}
          DIST_SHA: ${{ matrix.dist_sha }}
        run: |
          $url = "https://github.com/axodotdev/cargo-dist/releases/download/v$env:DIST_VERSION/cargo-dist-$env:DIST_HOST.zip"
          $zip = Join-Path $env:RUNNER_TEMP "dist.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          if ((Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower() -ne $env:DIST_SHA) { throw "dist checksum mismatch" }
          $dest = Join-Path $env:RUNNER_TEMP "dist-bin"
          Expand-Archive -Path $zip -DestinationPath $dest
          Add-Content -Path $env:GITHUB_PATH -Value $dest
      - name: Build archives
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: dist build --artifacts=local --target "$TARGET" --output-format=json > dist-manifest.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: archives-${{ matrix.target }}
          path: |
            target/distrib/*.tar.xz
            target/distrib/*.zip
            target/distrib/*.sha256
          if-no-files-found: error

  release:
    name: release (GitHub release with archives)
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: archives-*
          path: archives
          merge-multiple: true
      - name: Create the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.plan.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          flags=()
          case "$VERSION" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" --repo "$REPO" --verify-tag --title "frob $VERSION" \
            --generate-notes "${flags[@]}" archives/*
