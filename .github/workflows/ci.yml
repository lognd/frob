name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            frob-core/target
            strata-core/target
          key: cargo-${{ hashFiles('frob-core/Cargo.lock', 'strata-core/Cargo.lock') }}
      - name: Sync deps
        run: uv sync --all-extras --all-groups
      - name: Build native extensions (frob-core + strata-core, Rust/PyO3)
        run: make core
      - name: cargo test (frob-core kernels)
        run: cd frob-core && cargo test --lib
      - name: cargo test (strata-core kernels)
        run: cd strata-core && cargo test --lib
      - name: Lint
        run: uv run ruff check src tests
      - name: Typecheck
        run: uv run ty check src
      - name: Test
        run: uv run pytest -q
      # T-1265 (CHK-THEME-GITIGNORED-TRUST successor): this used to swallow
      # EVERY finding, ERROR-tier included, behind an unconditional
      # `|| echo "::warning"` -- a real gate error (SUPPRESS001, INV006,
      # PRE001, ...) never failed the build, only ever showed as a
      # printed line a reviewer had to notice by hand. ERROR-tier findings
      # now fail the job outright; only the swallow is gone, not the
      # command -- a genuinely warning-only run still exits 0 on its own.
      - name: frob check (self-gate)
        run: uv run frob check
      # T-1265: `.frob/coverage-stamp` and `.frob/baseline` are gitignored
      # (.gitignore:21,:72) and never restored in a fresh CI checkout, so
      # TEST005/006 (per-symbol/per-module coverage floors) are
      # structurally inert here -- CI has no fresh coverage measurement to
      # check them against, and `frob check` above cannot fail a job on a
      # signal it never had. `frob-coverage.lock.json` (T-0545) is the one
      # coverage-derived channel that IS committed and travels with the
      # diff; TEST012 (its own drift check) is WARN-severity by design
      # (frob.gates._coverage's `stamp_coverage` docstring), so it would
      # not fail the self-gate step above even with the swallow removed.
      # This step promotes exactly that one check to a hard CI failure --
      # the narrowest of T-1265's three suggested fixes, chosen because it
      # is the only one that needs no fresh .frob state to evaluate.
      - name: frob-coverage.lock.json must not be missing or drifted (TEST012)
        run: |
          uv run frob check --only test --json > /tmp/frob-test-check.json
          uv run python -c "
          import json, sys
          report = json.load(open('/tmp/frob-test-check.json'))
          hits = [
              d
              for result in report.get('results', [])
              for d in result.get('diagnostics', [])
              if d.get('code') == 'TEST012'
          ]
          for d in hits:
              print(f\"{d.get('file', '?')}: {d.get('message', '')}\")
          if hits:
              print('::error::frob-coverage.lock.json is missing or drifted (TEST012) -- run: make coverage')
          sys.exit(1 if hits else 0)
          "

  # Locks the T-0133 degrade contract: a bare `pip install`/`uv tool
  # install` of the frob wheel (NO frob-core, NO strata-core -- exactly what
  # `uv tool install frob` gets before `make install-tool`) must never
  # crash. This is a separate job (no Rust toolchain, no `make core`) so a
  # regression like T-0077/T-0133's original module-level `import
  # strata_core` gets caught here even if the main `build` job's native
  # extensions mask it.
  standalone-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Build the bare wheel (no native extras)
        run: uv build --wheel
      - name: Install into a clean venv
        run: |
          uv venv /tmp/frob-standalone-venv
          uv pip install --python /tmp/frob-standalone-venv/bin/python dist/*.whl
      - name: frob --help must not crash without native extensions
        run: /tmp/frob-standalone-venv/bin/frob --help
      # T-0135 moved sys_gate's `from frob.strata import load_design_ids`
      # (and _design_dir's own `frob.strata` import) to after the
      # design/-directory opt-in check, and T-0134 guarded frob.strata's
      # remaining strata_core call sites to degrade to a typed Err instead
      # of crashing -- so this step now hard-fails on any traceback.
      - name: frob check on a tiny fixture repo must not crash
        run: |
          set -e
          fixture=/tmp/frob-standalone-fixture
          rm -rf "$fixture" && mkdir -p "$fixture/src/demo"
          cd "$fixture"
          git init -q
          printf '"""Empty demo package."""\n' > src/demo/__init__.py
          printf 'module m\nnode n : trusted {\n}\n' > src/demo/x.strata
          # Exit code is not asserted: a real repo can legitimately fail
          # gates (missing tickets, coverage stamp, ...). What this step
          # locks down is that the process itself does not crash with an
          # unhandled exception/traceback when strata-core and frob-core
          # are both absent -- grep the output for the traceback marker
          # Python always emits on an uncaught exception.
          output="$(/tmp/frob-standalone-venv/bin/frob check 2>&1)" || true
          echo "$output"
          if echo "$output" | grep -q "^Traceback (most recent call last):"; then
            echo "::error::frob check crashed with an unhandled exception in a natives-less install"
            exit 1
          fi
