name: ci

# The dev channel (docs/design/releases.md section 5) is the last two jobs of this workflow:
# `dev-artifacts` and `dev-publish` run only on a push to a branch in the gate's list, of this
# repository, after every test job passed. It is not a `workflow_run` workflow: GitHub fires
# those only from the default branch's copy of the file.

on:
  push:
    branches: [main, experimental]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # frob reads the ledger ref and diffs against origin/experimental.
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
          rustup default "$channel"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: nextest
      # The tests need a python3 on PATH; pytest itself comes from uv (pip is refused on PEP 668 hosts).
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
      - name: Install uv (pytest step, zizmor and actionlint tool stages)
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # frob:accept TOOL002 because="a local composite action must be addressed with ./; actionlint rejects the $/ form zizmor suggests"
      - uses: ./.github/actions/install-linker
      - name: Install the Windows cross-check target (clippy-windows step)
        if: runner.os == 'Linux'
        run: rustup target add x86_64-pc-windows-gnu
      - name: Install the MinGW C compiler (libsqlite3-sys for clippy-windows)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y gcc-mingw-w64-x86-64
      # Every check below is `cargo dev ci --step <name>` on Linux and `cargo dev-isolated ci --step
      # <name>` on Windows (a running gob-dev.exe cannot be rebuilt, so the tool lives in
      # target/dev-tool there): the argv, flags and environment live in crates/gob-dev/src/ci.rs,
      # so `cargo dev ci` locally runs exactly this list.
      # crates/gob-dev/tests/ci_parity.rs fails when the two diverge.
      - name: rustfmt
        if: runner.os == 'Linux'
        run: cargo dev ci --step fmt
      - name: rustfmt (Windows, isolated tool)
        if: runner.os == 'Windows'
        run: cargo dev-isolated ci --step fmt
      - name: clippy
        if: runner.os == 'Linux'
        run: cargo dev ci --step clippy
      - name: clippy (Windows, isolated tool)
        if: runner.os == 'Windows'
        run: cargo dev-isolated ci --step clippy
      - name: clippy for the Windows target
        if: runner.os == 'Linux'
        run: cargo dev ci --step clippy-windows
      - name: Docs
        if: runner.os == 'Linux'
        run: cargo dev ci --step docs
      - name: Docs (Windows, isolated tool)
        if: runner.os == 'Windows'
        run: cargo dev-isolated ci --step docs
      - name: Install pinned pytest with uv (pytest-backed tests must not skip)
        if: runner.os == 'Linux'
        run: cargo dev ci --step pytest
      - name: Install pinned pytest (Windows, isolated tool)
        if: runner.os == 'Windows'
        run: cargo dev-isolated ci --step pytest
      - name: nextest
        if: runner.os == 'Linux'
        run: cargo dev ci --step nextest
      - name: nextest (Windows, isolated tool)
        if: runner.os == 'Windows'
        run: cargo dev-isolated ci --step nextest
      - name: Generated files are current (GEN001)
        if: runner.os == 'Linux'
        run: cargo dev ci --step gen
      - name: Generated files are current (GEN001) (Windows, isolated tool)
        if: runner.os == 'Windows'
        run: cargo dev-isolated ci --step gen
      - name: Make the ledger ref resolvable
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Pull requests check out a detached merge commit; frob needs the
          # [tickets] ref (refs/heads/experimental) as a local branch.
          if ! git rev-parse --verify -q refs/heads/experimental >/dev/null; then
            git fetch --no-tags origin '+refs/heads/experimental:refs/remotes/origin/experimental'
            git update-ref refs/heads/experimental refs/remotes/origin/experimental
          fi
      - name: Fetch zizmor (version from frob.toml)
        if: runner.os == 'Linux'
        run: cargo dev ci --step zizmor
      - name: Fetch actionlint (version from frob.toml)
        if: runner.os == 'Linux'
        run: cargo dev ci --step actionlint
      - name: frob doctor (self-hosted, frob v2 built from this tree)
        if: runner.os == 'Linux'
        run: cargo dev ci --step doctor
      - name: frob check
        if: runner.os == 'Linux'
        run: cargo dev ci --step check
      - name: "frob test selection (dry run, CI holds no lease)"
        if: runner.os == 'Linux'
        run: cargo dev ci --step test-dry-run

  # Dev channel: build and smoke are the shared reusable workflow (also called by release.yml):
  # the matrix, the pinned dist and the smoke steps have one source there. No wheels are built
  # here (`wheels: false`), and no secrets are passed. The called jobs run only `contents: read`,
  # capped by this job's permissions. The checkout is the tested sha, never a branch. The gate
  # (push, this repository, a dev branch) is repeated on dev-publish; a skipped dev-artifacts
  # skips it as well. To add a dev branch, add its ref to the list in both `if` lines.
  dev-artifacts:
    name: dev artifacts (build and smoke)
    needs: rust
    if: ${{ github.event_name == 'push' && github.repository == 'lognd/frob' && contains(fromJSON('["refs/heads/experimental"]'), github.ref) }}
    # frob:accept TOOL002 because="actionlint accepts only ./ for a local reusable workflow; zizmor suggests $/, which actionlint rejects"
    uses: ./.github/workflows/build-smoke.yml
    permissions:
      contents: read
    with:
      ref: ${{ github.sha }}
      wheels: false

  # The only job that can write. It runs only when every build job (and its
  # smoke) passed, so a failed build never touches `dev`. Replacement is
  # add-then-prune: the new assets carry the tested sha in their names, so
  # they never collide with the previous ones; they are uploaded first, the
  # tag and notes move next, and the previous assets are deleted last. A run
  # that fails before the prune removes only the assets it uploaded itself (a
  # recorded list, never a match by sha) and leaves the previous assets in place.
  dev-publish:
    name: publish (replace the dev prerelease assets)
    needs: [rust, dev-artifacts]
    if: ${{ github.event_name == 'push' && github.repository == 'lognd/frob' && contains(fromJSON('["refs/heads/experimental"]'), github.ref) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Queue, never cancel: a half-published release must finish.
    concurrency:
      group: dev-channel
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SHA: ${{ github.sha }}
    steps:
      - name: Name the tested commit
        shell: bash
        run: echo "SHORT=${SHA:0:12}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: archives-*
          path: archives
          merge-multiple: true
      - name: Name the archives after the tested sha and checksum them
        shell: bash
        run: |
          mkdir staged
          for f in archives/*; do
            base=$(basename "$f")
            # cargo-dist checksums name the unstaged archive; they are regenerated below.
            case "$base" in *.sha256) continue ;; esac
            # Only the product archives (frob-cli, grimble, crunk) may be published.
            case "$base" in frob-cli-*|grimble-*|crunk-*) ;; *) echo "unexpected file $base" >&2; exit 1 ;; esac
            stem="${base%%.*}"
            new="${stem}-${SHORT}.${base#*.}"
            cp "$f" "staged/$new"
            (cd staged && sha256sum "$new" > "$new.sha256")
          done
          ls -l staged
      - name: Ensure the dev prerelease exists
        id: ensure
        shell: bash
        run: |
          if gh release view dev --repo "$REPO" >/dev/null 2>&1; then
            echo "fresh=false" >> "$GITHUB_OUTPUT"
          else
            gh release create dev --repo "$REPO" --prerelease --target "$SHA" \
              --title "frob dev" --notes "dev channel: creating"
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload the new assets (additive; a name already on the release is skipped)
        shell: bash
        run: |
          # Existing names (same sha from an earlier run) are never overwritten, deleted or
          # re-added. A name is recorded before its upload starts, so the failure cleanup
          # removes exactly what this run may have created and nothing else.
          : > "$RUNNER_TEMP/uploaded.txt"
          existing=$(gh release view dev --repo "$REPO" --json assets --jq '.assets[].name')
          for f in staged/*; do
            name=$(basename "$f")
            if printf '%s\n' "$existing" | grep -Fxq "$name"; then
              echo "skip $name: already on the release for this sha"
              continue
            fi
            echo "$name" >> "$RUNNER_TEMP/uploaded.txt"
            gh release upload dev --repo "$REPO" "$f"
          done
      - name: Move the dev tag to the tested commit
        shell: bash
        run: |
          gh api -X PATCH "repos/$REPO/git/refs/tags/dev" -f sha="$SHA" -F force=true
      - name: Name the tested sha in the release notes
        shell: bash
        run: |
          printf 'Development build of %s (commit %s), built after ci succeeded.\nAssets are replaced on every green land; do not rely on them for production.\n' \
            "$SHORT" "$SHA" > notes.md
          gh release edit dev --repo "$REPO" --prerelease --title "frob dev ($SHORT)" --notes-file notes.md
      - name: Prune the previous assets (last, so a failure above keeps them)
        id: prune
        shell: bash
        run: |
          gh release view dev --repo "$REPO" --json assets --jq '.assets[].name' | while read -r name; do
            case "$name" in
              *"-${SHORT}."*) ;;
              *) gh release delete-asset dev "$name" --repo "$REPO" --yes ;;
            esac
          done
      - name: Remove this run's own uploads (previous assets stay)
        if: ${{ failure() && steps.prune.outcome == 'skipped' }}
        shell: bash
        run: |
          # Only names recorded by this run's upload step; never matched by sha.
          if [ -f "$RUNNER_TEMP/uploaded.txt" ]; then
            while read -r name; do
              [ -n "$name" ] && { gh release delete-asset dev "$name" --repo "$REPO" --yes || true; }
            done < "$RUNNER_TEMP/uploaded.txt"
          fi
