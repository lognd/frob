name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # T-3425: windows-latest is ADVISORY ONLY (continue-on-error) until
    # T-3076's 278 Windows-only failures (five missing POSIX primitives:
    # fcntl, os.sysconf, AF_UNIX, fork context, charmap codec) are drained.
    # Without this, ci.yml's overall conclusion is RED on every push
    # regardless of ubuntu/macOS health, so scripts/verify_release_ci_status.py
    # (T-3251) can never resolve GREEN and every release needs the
    # override_red_ci escape hatch -- making the escape hatch the normal
    # path instead of an exception (PLATFORM001 doctrine: declare the
    # boundary, never silently degrade). The job still runs and reports on
    # every push -- the signal is kept for measuring the T-3076 burn-down --
    # it just no longer flips the workflow conclusion. Remove this flag
    # when T-3076's failure set reaches zero.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    # T-3192: a hanging job used to produce NO failure signal at all -- the
    # owner cancelled run 33135896391 by hand after 54 minutes, and runs
    # 33032904841/32968539246 (2h40m) sit in history as `cancelled`, never
    # `failure`, because nothing here ever timed the JOB out on its own
    # (GitHub's own default ceiling is 6 hours). This backstops the
    # per-step `timeout -s ABRT` below (which targets the Test step
    # specifically, with a stack dump) -- a belt-and-braces ceiling in
    # case a hang lands in a DIFFERENT step (Sync deps, native build,
    # ...) that isn't individually wrapped. Budget: the slowest OBSERVED
    # full-job completion in this matrix is macOS's ~23 minutes for the
    # Test stage alone (run 33135896391).
    #
    # T-3426: raised 45 -> 60 alongside the ubuntu Test step's own
    # 25m -> 40m raise below, so the step budget (with its stack dump)
    # remains the thing that fires first on a genuine hang rather than
    # this job-level ceiling -- 60 minutes keeps a >2x margin over the
    # 40-minute step budget without leaving a hang to run for hours
    # before anyone notices.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            frob-core/target
            strata-core/target
          key: cargo-${{ hashFiles('frob-core/Cargo.lock', 'strata-core/Cargo.lock') }}
      - name: Sync deps
        run: uv sync --all-extras --all-groups
      - name: Build native extensions (frob-core + strata-core, Rust/PyO3)
        run: make core
      - name: cargo test (frob-core kernels)
        run: cd frob-core && cargo test --lib
      - name: cargo test (strata-core kernels)
        run: cd strata-core && cargo test --lib
      - name: Lint
        run: uv run ruff check src tests
      - name: Typecheck
        run: uv run ty check src
      # T-3192: a hanging Test step used to produce no failure signal beyond
      # the job-level timeout-minutes backstop above -- a bare timeout kills
      # the job with a red X and NO information about where it was wedged,
      # barely better than the manual cancellations in this repo's own CI
      # history (runs 33135896391/33032904841/32968539246, all on
      # ubuntu-latest). `timeout -s ABRT` (not the default SIGTERM) plus
      # `PYTHONFAULTHANDLER=1` makes Python's built-in fault handler dump
      # every live thread's stack to stderr the instant the budget is hit,
      # before the process dies -- the exact recipe this repo already uses
      # for local hang diagnosis (see docs/modules/testing.md's SIGUSR1
      # stack-dump handler and the `PYTHONFAULTHANDLER=1 timeout -s ABRT N`
      # local recipe). `timeout` is GNU coreutils and only reliably present
      # on the ubuntu-latest runner's bash (not Windows' default pwsh, and
      # not macOS's BSD userland), so ubuntu keeps the GNU form directly.
      #
      # T-3250: run 33169097371 (job 98841565692, macos-latest) FALSIFIES
      # the premise this comment used to state here ("windows/macos have
      # never hung in this matrix's own history") -- macOS hung at 99% for
      # 10m49s of total silence and produced ZERO diagnostics, because the
      # step below used to be an uninstrumented `uv run pytest -q` for
      # every non-Linux platform. macOS and Windows now get the same
      # stack-dump-on-hang standard as ubuntu, using shell/pwsh builtins
      # (`kill -ABRT` / `Wait-Process`) in place of GNU `timeout`, which
      # remains genuinely absent from both userlands.
      #
      # Budget: macOS's own Test stage completed in ~23 minutes when it
      # last ran cleanly (run 33135896391) and ubuntu's Test step, when it
      # fails outright rather than hanging, finishes within the ~15-minute
      # whole-job budget (run 33035660969) -- 25 minutes gave the slower
      # platform's own observed ceiling a small margin without leaving a
      # genuine hang to run anywhere near the (then-)45-minute job timeout
      # above.
      #
      # T-3426: run 33277131782 (HEAD bb5c28203, 2026-08-29) proved 25m
      # is too tight for a PASSING ubuntu run, not just a hung one -- the
      # suite reached 99% at ~20m and was still inside two whole-repo
      # self-scan tests' bodies (not blocked on a lock) when the 25m
      # `timeout -s ABRT` fired at 22:18:23, killing a run that would have
      # finished. macOS (more cores) completed the identical suite in
      # 18m31s in the SAME run, so this was ubuntu's own budget being too
      # tight on its slow self-scan tail at that point, not the T-3420
      # SIGTERM deadlock (this invocation runs without coverage). Raised
      # 25m -> 40m to clear that tail with real margin; macOS/Windows
      # were left unchanged at the time, since macOS's own 18.5m run
      # showed no equivalent problem there YET.
      #
      # T-3482: the suite kept growing (12816 tests by 2026-08-30) and
      # macOS's own 25m budget went stale the same way -- run 33308245923
      # was killed at [67%] mid-run, not hung, with two prior CLEAN macOS
      # runs already at 24m/28m. Raised 25m -> 40m here too, matching
      # ubuntu's own T-3426 raise, so the two platforms cannot drift
      # apart again (both now share the 40m/2400s budget). Windows stays
      # unchanged (advisory only, T-3425). A follow-up ticket (not this
      # one) should make the self-scan tests share one cached graph per
      # session so the tail stops costing minutes per test on every
      # platform -- these budget raises only stop CI from killing a
      # passing-but-slow run.
      #
      # WHY faulthandler_timeout=100 / --timeout=120 (pyproject.toml,
      # pytest-timeout, --timeout-method=thread) did NOT fire during the
      # 649s macOS silence, even though the Windows job's own dumps in
      # this same run ARE stamped by that exact mechanism ("Timeout
      # (0:01:40)"): both are PER-TEST watchdogs armed only while a test
      # is executing. The 99% marker means the last test had already
      # finished; the silence was in session teardown / xdist worker
      # shutdown, a window no per-test timeout structurally reaches. The
      # step-level guards below are what cover that window; per-test hangs
      # remain covered by the pyproject.toml settings as before.
      - name: Test (ubuntu, timed with stack-dump-on-hang)
        if: runner.os == 'Linux'
        env:
          PYTHONFAULTHANDLER: "1"
        # T-3516: `tee` a copy of the run's own output to a log file so the
        # step below can grep it for `WORKER-CRASH-REPORT:` -- `pipefail`
        # keeps `timeout ... | tee ...`'s own exit code as pytest's real
        # one (a plain test failure or the 40m ABRT timeout), not tee's
        # always-0 exit, so this step still fails exactly as before.
        run: |
          set -o pipefail
          timeout -s ABRT 40m uv run pytest -q 2>&1 | tee /tmp/pytest-ubuntu.log
      # T-3516: collect, do not scatter -- and stay loud even off the raw
      # log: an xdist worker crash today (see tests/conftest.py's
      # `WORKER-CRASH-REPORT:` section, T-3516) is otherwise only visible
      # by scrolling the full Test step's log. `always()` so this still
      # runs (and still reports) on a failing/timed-out Test step, the
      # exact run this exists to make visible without scrolling.
      #
      # T-3531: widened from ubuntu-only to every platform, and from
      # WORKER-CRASH-REPORT-only to ALSO surfacing the SUITE-RESULT /
      # SUITE-RESULT-FAILED block (tests/conftest.py's own per-node-id
      # pass/fail summary) -- previously the failing test set was only
      # readable by scrolling the raw job log, on every platform. Runs
      # under `shell: bash` explicitly (GitHub's hosted Windows runners
      # ship Git Bash, and `RUNNER_TEMP` resolves identically across all
      # three shells) so one step covers all three Test steps' log files
      # rather than three near-duplicate platform-specific steps.
      - name: Surface WORKER-CRASH-REPORT and SUITE-RESULT in step summary (T-3516/T-3531)
        if: always()
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) log=/tmp/pytest-ubuntu.log ;;
            macOS) log=/tmp/pytest-macos.log ;;
            Windows)
              # T-3531: stdout/stderr were captured to two separate files
              # (the Windows Test step's own Start-Process redirection,
              # T-3250) -- concatenate them in the order a reader expects
              # (stdout's SUITE-RESULT lines, then stderr's own tail) into
              # one combined file this step can grep the same way as the
              # other two platforms'.
              log="$RUNNER_TEMP/pytest-combined.log"
              cat "$RUNNER_TEMP/pytest-stdout.log" "$RUNNER_TEMP/pytest-stderr.log" \
                > "$log" 2>/dev/null || true
              ;;
          esac
          if [ -f "$log" ] && grep -q '^WORKER-CRASH-REPORT:' "$log"; then
            {
              echo '## Worker crash report (T-3516)'
              echo '```'
              grep '^WORKER-CRASH-REPORT:' "$log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          # T-3531: NOT `^`-anchored -- pytest's own `-q` progress output
          # ("......[100%]") and the FIRST `SUITE-RESULT:` summary line
          # (tests/conftest.py) print with no newline between them
          # (measured directly off a real run's raw log: both share one
          # timestamped line), so a `^SUITE-RESULT` anchor silently misses
          # exactly that one line. `-o` extracts the matched suffix from
          # wherever it starts, dropping the leading dots/percentage
          # instead of anchoring past them. Every `SUITE-RESULT-FAILED:`
          # line (the per-test failing-set detail, the actual signal this
          # ticket cares about) already starts its own line and matches
          # either way.
          if [ -f "$log" ] && grep -qE 'SUITE-RESULT(-FAILED)?:' "$log"; then
            {
              echo '## Suite result (T-3531)'
              echo '```'
              grep -oE 'SUITE-RESULT(-FAILED)?:.*' "$log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      # T-3250: macOS has bash but not GNU coreutils' `timeout`. `kill -ABRT`
      # is a POSIX shell builtin present in macOS's own bash, so it reaches
      # the same faulthandler dump-then-die mechanism as ubuntu's step
      # without depending on GNU tooling.
      # T-3482: run 33308245923 (macos-latest, HEAD 355eb4468, 2026-08-30)
      # proved 25m is too tight for a PASSING macOS run too, the same
      # class of miss T-3426 fixed for ubuntu -- the suite reached [67%]
      # and was killed by this step's own 1500s watcher at ~11:38 with
      # test_frob_self_model.py::test_sys_gate_zero_violations on the
      # stack, not a hang: the previous two clean macOS runs took 24m
      # (33298117154) and 28m (33303586303) on a suite that has grown to
      # 12816 tests. Raised 25m -> 40m to match ubuntu's own T-3426 raise
      # and give the grown suite the same margin; Windows is unchanged
      # (advisory only, T-3425).
      - name: Test (macos, timed with stack-dump-on-hang)
        if: matrix.os == 'macos-latest'
        env:
          PYTHONFAULTHANDLER: "1"
        run: |
          set -uo pipefail
          budget=2400  # 40m, same budget/rationale as ubuntu's step above (T-3426/T-3482)
          # T-3531: process substitution (not a plain `| tee` pipeline) so
          # `$!` below still captures pytest's OWN pid, not tee's -- the
          # SIGABRT-for-a-faulthandler-dump targeting below needs the real
          # pytest process, exactly like ubuntu's own `tee` step but without
          # ubuntu's `timeout`/pipefail shape (macOS has no GNU `timeout`,
          # T-3250) to lean on for that distinction.
          uv run pytest -q > >(tee /tmp/pytest-macos.log) 2>&1 &
          pid=$!
          (
            sleep "$budget"
            if kill -0 "$pid" 2>/dev/null; then
              echo "::error::macOS Test step exceeded ${budget}s with no completion (T-3250) -- sending SIGABRT for a PYTHONFAULTHANDLER stack dump before the kill"
              kill -ABRT "$pid" 2>/dev/null || true
              sleep 10
              kill -KILL "$pid" 2>/dev/null || true
            fi
          ) &
          watcher=$!
          wait "$pid"
          status=$?
          kill "$watcher" 2>/dev/null || true
          exit "$status"
      # T-3250: Windows' default `run:` shell is pwsh, which has no `kill
      # -ABRT` equivalent -- there is no portable way for an external
      # process to trigger a SIGABRT-style fault dump in a Windows child.
      # PLATFORM001 doctrine
      # (docs/modules/gates.md#platform001-posix-only-primitive-degrades-silently-t-2919):
      # declare that boundary rather than silently doing nothing. Per-test
      # hangs still get thread-based stack dumps via pytest-timeout's
      # --timeout=120/--timeout-method=thread (proven in run 33169097371 --
      # the Windows job's own dumps are stamped "Timeout (0:01:40)"); this
      # step only closes the teardown-window gap with a TIMED FAILURE and
      # an explicit message, not a stack dump, on that one platform.
      # T-3540: deliberately NOT `-NoNewWindow` any more -- that flag made
      # the child share THIS step's own console, and GitHub's hosted
      # Windows runners are known to broadcast a CTRL_BREAK_EVENT to their
      # console for heartbeat/cancellation handling; anything attached to
      # that console (the `-NoNewWindow` child included) received it too,
      # and CPython maps a console-break event to a `KeyboardInterrupt` on
      # the main thread -- the measured T-3540 incident (run 33353658750:
      # the whole suite aborted at ~1%, 49s in, nowhere near this step's
      # own budget or pytest-timeout's own 120s per-test timeout). Without
      # `-NoNewWindow`, `Start-Process` gives the child its OWN console /
      # process group by default, so it is no longer reachable by that
      # broadcast; `Stop-Process -Id $p.Id` (the hang-guard's own
      # terminator below) still works identically regardless of which
      # console/process-group the target process is in. The tradeoff:
      # output is no longer inherited live into this step's log (a
      # separate console has nothing to inherit), so stdout/stderr are
      # redirected to files and replayed with Get-Content once the run
      # finishes (or is force-terminated) instead.
      - name: Test (windows, timed with hang guard)
        if: matrix.os == 'windows-latest'
        env:
          PYTHONFAULTHANDLER: "1"
        run: |
          $budget = 1500  # 25m, same budget/rationale as ubuntu's step above
          $stdout = Join-Path $env:RUNNER_TEMP "pytest-stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "pytest-stderr.log"
          $p = Start-Process -FilePath "uv" -ArgumentList "run","pytest","-q" -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            Wait-Process -Id $p.Id -Timeout $budget -ErrorAction Stop
          } catch {
            Write-Host "::error::Windows Test step exceeded $budget s with no completion (T-3250) -- terminating. NOTE (PLATFORM001 declared boundary): Windows has no portable equivalent of SIGABRT-triggered faulthandler dump from an external process, so this teardown-window path gets a timed failure without a stack dump; per-test hangs are still covered by pytest-timeout's --timeout=120/--timeout-method=thread."
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            Get-Content $stdout -ErrorAction SilentlyContinue
            Get-Content $stderr -ErrorAction SilentlyContinue
            exit 1
          }
          Get-Content $stdout -ErrorAction SilentlyContinue
          Get-Content $stderr -ErrorAction SilentlyContinue
          exit $p.ExitCode
      # T-1265 (CHK-THEME-GITIGNORED-TRUST successor): this used to swallow
      # EVERY finding, ERROR-tier included, behind an unconditional
      # `|| echo "::warning"` -- a real gate error (SUPPRESS001, INV006,
      # PRE001, ...) never failed the build, only ever showed as a
      # printed line a reviewer had to notice by hand. ERROR-tier findings
      # now fail the job outright; only the swallow is gone, not the
      # command -- a genuinely warning-only run still exits 0 on its own.
      - name: frob check (self-gate)
        run: uv run frob check
      # T-1265: `.frob/coverage-stamp` and `.frob/baseline` are gitignored
      # (.gitignore:21,:72) and never restored in a fresh CI checkout, so
      # TEST005/006 (per-symbol/per-module coverage floors) are
      # structurally inert here -- CI has no fresh coverage measurement to
      # check them against, and `frob check` above cannot fail a job on a
      # signal it never had. `frob-coverage.lock.json` (T-0545) is the one
      # coverage-derived channel that IS committed and travels with the
      # diff; TEST012 (its own drift check) is WARN-severity by design
      # (frob.gates._coverage's `stamp_coverage` docstring), so it would
      # not fail the self-gate step above even with the swallow removed.
      # This step promotes exactly that one check to a hard CI failure --
      # the narrowest of T-1265's three suggested fixes, chosen because it
      # is the only one that needs no fresh .frob state to evaluate.
      - name: frob-coverage.lock.json must not be missing or drifted (TEST012)
        run: |
          uv run frob check --only test --json > /tmp/frob-test-check.json
          uv run python -c "
          import json, sys
          report = json.load(open('/tmp/frob-test-check.json'))
          hits = [
              d
              for result in report.get('results', [])
              for d in result.get('diagnostics', [])
              if d.get('code') == 'TEST012'
          ]
          for d in hits:
              print(f\"{d.get('file', '?')}: {d.get('message', '')}\")
          if hits:
              print('::error::frob-coverage.lock.json is missing or drifted (TEST012) -- run: make coverage')
          sys.exit(1 if hits else 0)
          "
      # T-1366 (T-1265 successor): the step above only checks the ONE
      # committed coverage channel (frob-coverage.lock.json's rounded
      # summary). `.frob/coverage-stamp` and `.frob/baseline` are
      # gitignored and never restored here, so TEST005/006 (per-symbol/
      # per-module coverage floors) and `--delta` baseline filtering stay
      # structurally inert in CI -- a fresh checkout has no stamp/baseline
      # to check them against, so `frob check` above cannot fail on a
      # signal it never had, and neither an ABSENT nor a TAMPERED stamp
      # is distinguishable from "never measured" without this step. This
      # step produces a REAL, fresh stamp/baseline in the CI runner
      # itself (never trusts one carried in from the checkout -- there is
      # none, by design) and then fails the build if either one is
      # missing, stale (content-hash mismatch against the tree that
      # produced it, `is_stamp_stale`/`is_baseline_stale` -- the same
      # signal that catches tampering, since a hand-edited stamp cannot
      # reproduce a matching content hash either), or if a fresh TEST005/
      # TEST006 evaluation against it still finds a violation.
      - name: coverage stamp + delta baseline must be freshly measurable and clean (T-1366)
        run: |
          make coverage
          uv run frob check --stamp-baseline --only gates-native
          uv run frob check --stamp-baseline --only gates-security
          uv run frob check --stamp-baseline --only test
          uv run frob check --stamp-baseline --only drift --only coverage --only invariant \
            --only policy --only doclink --only docanchor --only fuzz --only release \
            --only decisions --only tickets --only refs --only registry --only compliance \
            --only docblocks --only walk_lint --only excludehazard --only debt --only deprecated \
            --only render_lint --only parse_failures --only lang_conformance \
            --only lang_project_conformance --only scope --only prework --only fmt --only affect_drift \
            --only ffi_boundary
          uv run frob check --only test --json > /tmp/frob-test-recheck.json
          uv run python -c "
          import json, sys
          from pathlib import Path
          from frob.gates._coverage import load_stamp, is_stamp_stale
          from frob.gates._baseline import load_baseline, is_baseline_stale

          root = Path('.')
          failures = []

          stamp = load_stamp(root)
          if stamp is None:
              failures.append('.frob/coverage-stamp is missing after a fresh make coverage run')
          elif is_stamp_stale(root, stamp):
              failures.append('.frob/coverage-stamp is stale (content-hash mismatch) immediately after stamping -- tampered or a stamp/measurement race')

          baseline = load_baseline(root)
          if baseline is None:
              failures.append('.frob/baseline is missing after a fresh frob check --stamp-baseline run')
          elif is_baseline_stale(root, baseline):
              failures.append('.frob/baseline is stale (content-hash mismatch) immediately after stamping -- tampered or a stamp/measurement race')

          report = json.load(open('/tmp/frob-test-recheck.json'))
          hits = [
              d
              for result in report.get('results', [])
              for d in result.get('diagnostics', [])
              if d.get('code') in ('TEST005', 'TEST006') and d.get('severity') == 'error'
          ]
          for d in hits:
              failures.append(f\"{d.get('code')}: {d.get('file', '?')}: {d.get('message', '')}\")

          for f in failures:
              print(f'::error::{f}')
          sys.exit(1 if failures else 0)
          "

  # Locks the T-0133 degrade contract: a bare `pip install`/`uv tool
  # install` of the frob wheel (NO frob-core, NO strata-core -- exactly what
  # `uv tool install frob` gets before `make install-tool`) must never
  # crash. This is a separate job (no Rust toolchain, no `make core`) so a
  # regression like T-0077/T-0133's original module-level `import
  # strata_core` gets caught here even if the main `build` job's native
  # extensions mask it.
  standalone-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Build the bare wheel (no native extras)
        run: uv build --wheel
      - name: Install into a clean venv
        run: |
          uv venv /tmp/frob-standalone-venv
          uv pip install --python /tmp/frob-standalone-venv/bin/python dist/*.whl
      - name: frob --help must not crash without native extensions
        run: /tmp/frob-standalone-venv/bin/frob --help
      # T-0135 moved sys_gate's `from frob.strata import load_design_ids`
      # (and _design_dir's own `frob.strata` import) to after the
      # design/-directory opt-in check, and T-0134 guarded frob.strata's
      # remaining strata_core call sites to degrade to a typed Err instead
      # of crashing -- so this step now hard-fails on any traceback.
      - name: frob check on a tiny fixture repo must not crash
        run: |
          set -e
          fixture=/tmp/frob-standalone-fixture
          rm -rf "$fixture" && mkdir -p "$fixture/src/demo"
          cd "$fixture"
          git init -q
          printf '"""Empty demo package."""\n' > src/demo/__init__.py
          printf 'module m\nnode n : trusted {\n}\n' > src/demo/x.strata
          # Exit code is not asserted: a real repo can legitimately fail
          # gates (missing tickets, coverage stamp, ...). What this step
          # locks down is that the process itself does not crash with an
          # unhandled exception/traceback when strata-core and frob-core
          # are both absent -- grep the output for the traceback marker
          # Python always emits on an uncaught exception.
          output="$(/tmp/frob-standalone-venv/bin/frob check 2>&1)" || true
          echo "$output"
          if echo "$output" | grep -q "^Traceback (most recent call last):"; then
            echo "::error::frob check crashed with an unhandled exception in a natives-less install"
            exit 1
          fi
