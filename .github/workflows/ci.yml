      # variant above still receives SIGINT, a guarded tool child (git or
      # ruff, bisect by re-enabling one at a time) is the sender after all,
      # despite the console-detached-child reasoning above -- an important,
      # actionable surprise either way.
      - name: Diagnose frob check hang on windows -- zero-tool-spawn variant (T-3657)
        if: matrix.os == 'windows-latest'
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Continue'
          $fixture = Join-Path $env:RUNNER_TEMP "frob-diag-fixture"
          # Reuses the SAME fixture the step above already created (repo
          # scan target, git init, initial commit) -- no need to rebuild it.
          $codeLines = @(
            'print("diag-python-alive", flush=True)',
            "import faulthandler",
            "import os",
            "import signal",
            "import sys",
            "import traceback",
            "",
            "# T-3657: refuse every guarded tool spawn up front (see this",
            "# step's own comment in ci.yml for what this does and does not",
            "# cover) -- set BEFORE importing frob.__main__ so no earlier",
            "# import-time code path can spawn anything first.",
            "os.environ['FROB_DISABLE_EXEC'] = '1'",
            "os.environ['FROB_WIN32_SPAWN_DEBUG'] = '1'",
            "",
            "def _t3657_log_signal(signum, frame):",
            "    try:",
            "        name = signal.Signals(signum).name",
            "    except ValueError:",
            "        name = repr(signum)",
            "    print(f'T-3648-SIGNAL: received {name} (signum={signum}) at frame={frame!r}', flush=True)",  # noqa: E501
            "    traceback.print_stack(frame)",
            "    raise KeyboardInterrupt",
            "signal.signal(signal.SIGINT, _t3657_log_signal)",
            "if hasattr(signal, 'SIGBREAK'):",
            "    signal.signal(signal.SIGBREAK, _t3657_log_signal)",
            "",
            "faulthandler.dump_traceback_later(240, exit=True)",
            "",
            "from frob.__main__ import main",
            "",
            'sys.argv = ["frob", "check"]',
            "print('diag-python: about to call main()', flush=True)",
            "try:",
            "    raise SystemExit(main())",
            "except BaseException as exc:",
            "    print(f'diag-python: main() raised {exc!r}', flush=True)",
            "    traceback.print_exc()",
            "    raise"
          )
          Set-Content -Path (Join-Path $env:RUNNER_TEMP "frob_check_diag_zerospawn.py") -Value $codeLines
          Write-Host "T-3657 breadcrumb: zero-spawn diag python file written"
          $diagOut = Join-Path $env:RUNNER_TEMP "diag_zerospawn.out"
          $diagErr = Join-Path $env:RUNNER_TEMP "diag_zerospawn.err"
          $diagPy = Join-Path $env:RUNNER_TEMP "frob_check_diag_zerospawn.py"
          $started = Get-Date
          $elapsed = [TimeSpan]::Zero
          $exitCode = -1
          Write-Host "T-3657 breadcrumb: about to invoke uv via Start-Process"
          try {
            $p = Start-Process -FilePath "uv" `
              -ArgumentList "run", "--project", "$env:GITHUB_WORKSPACE", "python", "$diagPy" `
              -WorkingDirectory $fixture `
              -PassThru -RedirectStandardOutput $diagOut -RedirectStandardError $diagErr
            try {
              Wait-Process -Id $p.Id -Timeout 290 -ErrorAction Stop
              $exitCode = $p.ExitCode
            } catch {
              Write-Host "T-3657 breadcrumb: Wait-Process timed out at 290s -- terminating"
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            }
          } catch {
            Write-Host "T-3657: invoke threw: $_"
          } finally {
            $elapsed = (Get-Date) - $started
            Write-Host "T-3657 breadcrumb: Start-Process invocation returned (elapsed: $($elapsed.TotalSeconds)s)"
            Write-Host "--- diag_zerospawn.out ---"
            if (Test-Path $diagOut) { Get-Content $diagOut | Write-Host } else { Write-Host "(missing)" }
            Write-Host "--- diag_zerospawn.err ---"
            if (Test-Path $diagErr) { Get-Content $diagErr | Write-Host } else { Write-Host "(missing)" }
            Write-Host "zero-tool-spawn diag exit code: $exitCode (elapsed: $($elapsed.TotalSeconds)s)"
