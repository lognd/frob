      # FROB_DISABLE_EXEC=1 set BEFORE frob.__main__.main() runs, so
      # guarded_subprocess_run (src/frob/process/_guard.py) refuses to
      # spawn any of the 4 guarded tool children -- ZERO of THOSE children
