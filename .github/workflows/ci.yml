          Set-Content -Path (Join-Path $env:RUNNER_TEMP "frob_check_diag_nopoolpreload.py") -Value $codeLines
          Write-Host "T-3670 breadcrumb: pool-preload-disabled diag python file written"
          $diagOut = Join-Path $env:RUNNER_TEMP "diag_nopoolpreload.out"
          $diagErr = Join-Path $env:RUNNER_TEMP "diag_nopoolpreload.err"
          $diagPy = Join-Path $env:RUNNER_TEMP "frob_check_diag_nopoolpreload.py"
          $started = Get-Date
          $elapsed = [TimeSpan]::Zero
          $exitCode = -1
          Write-Host "T-3670 breadcrumb: about to invoke uv via Start-Process"
          try {
