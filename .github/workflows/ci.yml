      # T-3675 (round 18): FROB_TEST_HARD_EXIT=1 is set here, and ONLY
      # here in this repo -- round 17's own evidence (run 33556847222)
      # showed that with the FROB_TEST_IGNORE_CONSOLE_CTRL guard above
      # armed, the injected SIGINT stopped killing this step and it
      # HUNG past its 1500s budget instead, with orphan pytest/python
      # processes still alive: the interrupt was MASKING a real
      # session-teardown wedge (a non-daemon thread or unreaped child
      # blocking interpreter shutdown) the whole time. This hard-exit
      # (tests/conftest.py::_maybe_hard_exit_after_session_finish)
      # documents what wedges teardown (one FROB-TEST-HARD-EXIT: line
      # inventorying live threads/children) and os._exit()s with the
      # session's real exit code right after that line, instead of
      # letting pytest's own wrap_session teardown -- and whatever
      # wedges inside it -- ever run. See docs/modules/process.md's
      # "Round 18" paragraph for the full rationale.
      #
      # T-3683 (round 19): round 18's own run (33582058515) measured
      # this step hitting its 1500s budget AGAIN, with NO FROB-TEST-
      # HARD-EXIT: line printed at all -- the suite wedges BEFORE
      # pytest_sessionfinish, which the hard-exit above can never
      # reach. FROB_TEST_MIDRUN_WATCHDOG_SECONDS=300 arms tests/
      # conftest.py's independent mid-run watchdog (_run_midrun_
      # watchdog): if no test call-phase reports progress for 300s
      # (comfortably inside this step's 1500s budget), it prints the
      # SAME thread/child inventory line and os._exit()s, instead of
      # a silent Wait-Process timeout with zero diagnostic output.
      # This is diagnostic-first, not itself the fix: the real fix is
      # T-3683's own Part A (bisecting/killing the in-pipeline SIGINT
      # sender a subprocess frob-check call inside a test would
      # otherwise be masking-and-hanging on) -- once that lands, this
      # watchdog should simply stop firing in practice, but stays
      # armed so a future wedge is never silent again.
      #
      # T-3689: threshold lowered 300s -> 180s. T-3686 fixed the self-
      # interrupt, which UNMASKED a second win32 problem this watchdog
      # was blind to: run 33615554440 measured a single zero-tool-spawn
      # `frob check` completing (not hanging) in 122.7s on win32, and
      # the Windows Test step still exceeded its 1500s budget with the
      # watchdog never firing -- individual test call-phases were each
      # slow-but-progressing (each logreport landing under the old 300s
      # gap), never wedged for a single >=300s stretch, so cumulative
      # slowness across many tests summed past budget with no single
      # stall this watchdog's no-progress-in-N-seconds design could see.
      # 180s narrows that blind spot (any ONE test call-phase now taking
      # more than ~1.5x a single measured 122.7s check is caught) without
      # dropping below a single slow-but-healthy check's own measured
      # duration.
      #
      # T-3746: threshold raised 180s -> 1350s. Run 33769225680 showed 180s
      # FALSE-tripping on a legitimately-slow single test:
      # test_fleet_status_ticket_readiness_arch001 (and the self-scan-heavy
      # family) each block in ONE `frob check` subprocess reporting no
      # pytest call-phase progress for the subprocess's whole duration. On
      # win32 the Test step runs `-p no:xdist` (single-threaded), so those
      # heavy tests -- some carrying @pytest.mark.timeout(1200) -- run back
      # to back with long no-progress stretches that are NOT hangs. The
      # midrun watchdog must sit ABOVE the largest legitimate per-test
      # timeout (1200s, kept comfortably under the matrix test's <1500 budget assertion) so it only fires on a test wedged beyond even its
      # own pytest-timeout (a true unkillable win32 hang); cumulative
      # slowness is now caught by FROB_TEST_TOTAL_BUDGET_SECONDS below, and
      # per-test hangs by pytest-timeout's --timeout=120/per-test overrides.
      - name: Test (windows, timed with hang guard)
        if: matrix.os == 'windows-latest'
        env:
          PYTHONFAULTHANDLER: "1"
          # T-3755: emit the FULL failing-node-id list (not the first 50 + "and
          # N more") so a platform-drain drive can read the complete failure set
          # from one CI run.
          FROB_TEST_SUITE_RESULT_MAX_NODE_IDS: "500"
          FROB_TEST_IGNORE_CONSOLE_CTRL: "1"
          FROB_TEST_HARD_EXIT: "1"
          # T-3793: temporary diagnostic for the ~39 CI-only doctor-cluster
          # failures -- FROB_TEST_HARD_EXIT above os._exit()s before
          # pytest's own FAILURES section flushes, so this dumps each
          # failed/errored test's longrepr via the SUITE-RESULT reporter
          # (which DOES flush first). windows-only; ubuntu/macos unchanged.
          FROB_TEST_DUMP_FAILURE_REPR: "1"
          FROB_TEST_MIDRUN_WATCHDOG_SECONDS: "1350"
          # T-3707 Part B: a suite that never stalls 180s at a stretch but
          # sums past this step's own 3300s Wait-Process budget still gets
          # killed with zero diagnostic output (T-3692's finding) -- this
          # wall-clock cap (comfortably under the 3300s step budget) hard-
          # exits with the same thread/child inventory the stall watchdog
          # prints, so that class of silent timeout gets a real diagnostic
          # too.
          # T-3749: raised 3000 -> 4500. T-3741 re-enabled xdist here; run
          # 33804740730 confirmed it is SAFE (execnet run_server/run_connection
          # worker threads live, F./. progress reported, NO KeyboardInterrupt
          # saga -- FROB_TEST_IGNORE_CONSOLE_CTRL holds) but the 13k-test suite
          # on a 4-core windows runner still ran past the 3000s cap even
          # parallel (windows subprocess spawn is ~2x macos, whose xdist suite
          # is ~25min). 4500s (75m) gives the parallel run room to finish; the
          # 180s->1350s midrun watchdog (T-3746) and pytest-timeout still catch
          # a genuine per-test hang, so this is not a blind ceiling raise.
          # (History: T-3740 raised 1200->3000 for the single-threaded run.)
          FROB_TEST_TOTAL_BUDGET_SECONDS: "4500"
        run: |
          # T-3692: two diagnostic additions, both env-var-expansion-proof
          # (curly-brace ${...} form throughout, matching macOS's own
          # step above -- run 33625622797's error line printed the bare
          # "$budget" form literally unexpanded, so this round hardens
          # every interpolation site to the unambiguous form rather than
          # trusting bare "$name" before a space). (1) echoes the env var
          # pytest_configure is supposed to see, so the next run answers
          # "did FROB_TEST_MIDRUN_WATCHDOG_SECONDS even reach the uv/
          # pytest child process" directly, independent of whether the
          # watchdog fires; conftest.py's own new FROB-TEST-MIDRUN-
          # WATCHDOG: armed line (T-3692) answers the python-side half.
          Write-Host "T-3692: FROB_TEST_MIDRUN_WATCHDOG_SECONDS=$($env:FROB_TEST_MIDRUN_WATCHDOG_SECONDS)"
          ${budget} = 4800  # 80m: win32 runs the suite in parallel now (T-3741 xdist) but a 4-core windows runner is still ~2x macos, so the python-side FROB_TEST_TOTAL_BUDGET_SECONDS=4500 cap fires first with a diagnostic and this Wait-Process budget is the outer backstop (T-3749)
          $stdout = Join-Path $env:RUNNER_TEMP "pytest-stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "pytest-stderr.log"
          # T-3741: xdist re-enabled. `-p no:xdist -v --full-trace` was a
          # T-3549/T-3560 diagnostics-era artifact from the win32 hang
          # investigation -- single-threaded, so a collection-heavy suite
          # crawled and the midrun watchdog false-fired from session start
          # (run 33778211294). The hang root causes are fixed (T-3686 os.kill
          # self-ctrl-c, T-3708 abandoned-thread atexit, T-3726 capture,
          # T-3730/3735 test_cli_doctor, T-3738 test_wire) and the console
          # ctrl mitigation (FROB_TEST_IGNORE_CONSOLE_CTRL=1, above) neutralizes
          # the injected-SIGINT class, so the suite runs parallel like ubuntu/
          # macos via pyproject's `-n auto --dist=loadgroup` addopts. `-q` keeps
          # output sane under xdist (matches the macos step).
          # T-3757: append --timeout=600 (pyproject addopts sets --timeout=120).
          # A second --timeout on the pytest command line wins over the addopts
          # value (pytest-timeout/argparse last-value-wins; verified locally:
          # `pytest -p no:xdist --timeout=1 --timeout=300` does NOT error at 1s).
          # Slow full-repo-scan gate tests (test_fleet_status_ticket_readiness_
          # arch001.py, test_docptr_gate.py, test_gates_tickets_hygiene.py::
          # TestTick003StaleArchive, and more of that class) were exceeding the
          # 120s default on the slower Windows runner, os._exit-killing their
          # xdist worker and aborting the whole suite (T-3608 stall-abort)
          # before the full failing-test list could ever be collected. The
          # self-scan-heavy tests' own @pytest.mark.timeout(1200) marker still
          # wins over this CLI value (marker > CLI), so this only widens the
          # default floor, not the explicitly-marked ceiling.
          # frob:waive BUG002 reason="CI-config timeout change; the worker-crash-abort is only reproducible on the slow Windows CI runner, not the Linux land suite"
          # T-3776 reverted (T-3777): pytest-rerunfailures 16.6 INTERNALERRORs under xdist on py3.14 (macos), turning a rare flake into a whole-suite abort; flakes are handled by fixing the specific flaky tests instead (T-3775).
          # T-3785: append -rA --tb=short so a failure's full traceback
          # (not just its node id from the SUITE-RESULT-FAILED line) reaches
          # this step's log -- needed to diagnose the ~39 doctor-cluster
          # tests that only fail in this full-suite Windows run, never under
          # isolated winrun (T-3775/doctor). Reporting verbosity only: no
          # --reruns, no change to which tests pass or fail. Verified
          # locally (Linux) that -rA --tb=short prints the FAILURES section
          # with full tracebacks under -n auto --dist=loadgroup -q.
          $p = Start-Process -FilePath "uv" -ArgumentList "run","pytest","-q","--timeout=600","-rA","--tb=short" -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            Wait-Process -Id $p.Id -Timeout ${budget} -ErrorAction Stop
          } catch {
            Write-Host "::error::Windows Test step exceeded ${budget}s with no completion (T-3250) -- terminating. NOTE (PLATFORM001 declared boundary): Windows has no portable equivalent of SIGABRT-triggered faulthandler dump from an external process, so this teardown-window path gets a timed failure without a stack dump; per-test hangs are still covered by pytest-timeout's --timeout=120/--timeout-method=thread."
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            Get-Content $stdout -ErrorAction SilentlyContinue
            Get-Content $stderr -ErrorAction SilentlyContinue
            exit 1
          }
          Get-Content $stdout -ErrorAction SilentlyContinue
          Get-Content $stderr -ErrorAction SilentlyContinue
          exit $p.ExitCode
      # T-1265 (CHK-THEME-GITIGNORED-TRUST successor): this used to swallow
      # EVERY finding, ERROR-tier included, behind an unconditional
      # `|| echo "::warning"` -- a real gate error (SUPPRESS001, INV006,
      # PRE001, ...) never failed the build, only ever showed as a
      # printed line a reviewer had to notice by hand. ERROR-tier findings
      # now fail the job outright; only the swallow is gone, not the
      # command -- a genuinely warning-only run still exits 0 on its own.
      - name: frob check (self-gate)
        run: uv run frob check
      # T-1265: `.frob/coverage-stamp` and `.frob/baseline` are gitignored
      # (.gitignore:21,:72) and never restored in a fresh CI checkout, so
      # TEST005/006 (per-symbol/per-module coverage floors) are
      # structurally inert here -- CI has no fresh coverage measurement to
      # check them against, and `frob check` above cannot fail a job on a
      # signal it never had. `frob-coverage.lock.json` (T-0545) is the one
      # coverage-derived channel that IS committed and travels with the
      # diff; TEST012 (its own drift check) is WARN-severity by design
      # (frob.gates._coverage's `stamp_coverage` docstring), so it would
      # not fail the self-gate step above even with the swallow removed.
      # This step promotes exactly that one check to a hard CI failure --
      # the narrowest of T-1265's three suggested fixes, chosen because it
      # is the only one that needs no fresh .frob state to evaluate.
      - name: frob-coverage.lock.json must not be missing or drifted (TEST012)
        run: |
          uv run frob check --only test --json > /tmp/frob-test-check.json
          uv run python -c "
          import json, sys
          report = json.load(open('/tmp/frob-test-check.json'))
          hits = [
              d
              for result in report.get('results', [])
              for d in result.get('diagnostics', [])
              if d.get('code') == 'TEST012'
          ]
          for d in hits:
              print(f\"{d.get('file', '?')}: {d.get('message', '')}\")
          if hits:
              print('::error::frob-coverage.lock.json is missing or drifted (TEST012) -- run: uv run frob coverage --full')
          sys.exit(1 if hits else 0)
          "
      # T-1366 (T-1265 successor): the step above only checks the ONE
      # committed coverage channel (frob-coverage.lock.json's rounded
      # summary). `.frob/coverage-stamp` and `.frob/baseline` are
      # gitignored and never restored here, so TEST005/006 (per-symbol/
      # per-module coverage floors) and `--delta` baseline filtering stay
      # structurally inert in CI -- a fresh checkout has no stamp/baseline
      # to check them against, so `frob check` above cannot fail on a
      # signal it never had, and neither an ABSENT nor a TAMPERED stamp
      # is distinguishable from "never measured" without this step. This
      # step produces a REAL, fresh stamp/baseline in the CI runner
      # itself (never trusts one carried in from the checkout -- there is
      # none, by design) and then fails the build if either one is
      # missing, stale (content-hash mismatch against the tree that
      # produced it, `is_stamp_stale`/`is_baseline_stale` -- the same
      # signal that catches tampering, since a hand-edited stamp cannot
      # reproduce a matching content hash either), or if a fresh TEST005/
      # TEST006 evaluation against it still finds a violation.
      # T-3747: gated to ubuntu-latest ONLY. Coverage is platform-
      # independent (the committed frob-coverage.lock.json is a single
      # Linux-measured baseline), so running the full suite a SECOND time
      # under coverage on macos and windows was pure duplication of the
      # Test step's own suite run -- and on windows the -p no:xdist serial
      # suite is already the job's long pole. Reconcile/doctor/stamp-
      # baseline are all repo-state, platform-independent, so the whole
      # step belongs on one leg. See T-3748 for the deeper reuse (run the
      # suite once WITH --cov in the Test step and stamp from that).
      # T-3756: REVERT of T-3748. T-3748 had this step stop re-running the
      # suite under coverage, relying on the ubuntu Test step's
      # `frob coverage --full --fail-on-degraded` run to produce
      # coverage.xml + .frob/coverage-stamp. That coupled ubuntu's pass/fail
      # gate to coverage-sensitivity (see the Test step's own comment above).
      # This step now re-runs `frob coverage --full` itself, as a SEPARATE,
      # non-blocking best-effort measurement: `continue-on-error: true` on
      # the step means a degraded/failed coverage run never reds the build,
      # and the command itself drops `--fail-on-degraded` (measurement, not
      # a gate). FROB_COVERAGE_MAX_WORKERS/WALLCLOCK_DEADLINE_S are restored
      # here (they still cap the coverage-instrumented pool's memory and give
      # it room to finish, T-3747) since this step is once again the one
      # actually running the suite under coverage.
      - name: coverage stamp + delta baseline must be freshly measurable and clean (T-1366)
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
        env:
          FROB_COVERAGE_MAX_WORKERS: "2"
          FROB_COVERAGE_WALLCLOCK_DEADLINE_S: "7200"
        run: |
          uv run frob coverage --full
          uv run frob ticket reconcile --apply
          uv run frob doctor
          # T-3740: a single bare `--stamp-baseline` (no --only) runs every
          # gate chunk in one process and always (re)stamps .frob/baseline.
          # The previous hand-maintained `--only <group>` enumeration
          # duplicated _stamp_baseline_gate_chunks() and silently desynced:
          # it covered only 40 of 68 expected gate-ids (missing
          # win32_kill_signal, gates_schema, arch_schema, ... added since),
          # so `covered < expected_union` stayed true forever, stamp_baseline
          # was never called, every command exited 0, and .frob/baseline was
          # never written -- caught only by the assertion below. Chunking
          # exists solely for the agent foreground cap (T-0751), which does
          # not apply to CI (this is the documented coordinator-only path).
          uv run frob check --stamp-baseline
          uv run frob check --only test --json > /tmp/frob-test-recheck.json
          uv run python -c "
          import json, sys
          from pathlib import Path
          from frob.gates._coverage import load_stamp, is_stamp_stale
          from frob.gates._baseline import load_baseline, is_baseline_stale

          root = Path('.')
          failures = []

          stamp = load_stamp(root)
          if stamp is None:
              failures.append('.frob/coverage-stamp is missing after a fresh frob coverage --full run')
          elif is_stamp_stale(root, stamp):
              failures.append('.frob/coverage-stamp is stale (content-hash mismatch) immediately after stamping -- tampered or a stamp/measurement race')

          baseline = load_baseline(root)
          if baseline is None:
              failures.append('.frob/baseline is missing after a fresh frob check --stamp-baseline run')
          elif is_baseline_stale(root, baseline):
              failures.append('.frob/baseline is stale (content-hash mismatch) immediately after stamping -- tampered or a stamp/measurement race')

          report = json.load(open('/tmp/frob-test-recheck.json'))
          hits = [
              d
              for result in report.get('results', [])
              for d in result.get('diagnostics', [])
              if d.get('code') in ('TEST005', 'TEST006') and d.get('severity') == 'error'
          ]
          for d in hits:
              failures.append(f\"{d.get('code')}: {d.get('file', '?')}: {d.get('message', '')}\")

          for f in failures:
              print(f'::error::{f}')
          sys.exit(1 if failures else 0)
          "

  # Locks the T-0133 degrade contract: a bare `pip install`/`uv tool
  # install` of the frob wheel (NO frob-core, NO strata-core -- exactly what
  # `uv tool install frob` gets before `make install-tool`) must never
  # crash. This is a separate job (no Rust toolchain, no `make core`) so a
  # regression like T-0077/T-0133's original module-level `import
  # strata_core` gets caught here even if the main `build` job's native
  # extensions mask it.
  standalone-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      # T-3935: frob-core/strata-core are hard `==`-pinned DEFAULT deps
      # (T-3845) and neither is published to any registry, so a plain
      # `uv pip install dist/*.whl` resolve reaches out to PyPI for them
      # and fails outright ("frob-core was not found in the package
      # registry"; measured in CI run 34005559354). This job's own point
      # is to prove a BARE install (no Rust toolchain, no `make core`,
      # unlike the `build` job) still works, so the cores are built here
      # via maturin directly rather than reusing `build`'s native step --
      # keeping this job self-contained and not adding a cross-job
      # artifact dependency for a single ubuntu-only smoke check.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, resolved 2026-09-05
      - name: Build frob-core wheel (abi3-py311, local find-links only)
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: frob-core
          args: --release --out dist
      - name: Build strata-core wheel (abi3-py311, local find-links only)
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: strata-core
          args: --release --out dist
      - name: Build the bare wheel (no native extras)
        run: uv build --wheel
      # T-3935: `--find-links` points the resolver at the just-built core
      # wheels INSTEAD OF a registry -- the pin is honoured (still exact
      # `==0.530.0`, still resolved for real) but satisfied locally, since
      # neither core is published anywhere yet.
      - name: Install into a clean venv
        run: |
          uv venv /tmp/frob-standalone-venv
          uv pip install --python /tmp/frob-standalone-venv/bin/python \
            dist/*.whl \
            --find-links frob-core/dist \
            --find-links strata-core/dist
      - name: frob --help must not crash without native extensions
        run: /tmp/frob-standalone-venv/bin/frob --help
      # T-0135 moved sys_gate's `from frob.strata import load_design_ids`
      # (and _design_dir's own `frob.strata` import) to after the
      # design/-directory opt-in check, and T-0134 guarded frob.strata's
      # remaining strata_core call sites to degrade to a typed Err instead
      # of crashing -- so this step now hard-fails on any traceback.
      - name: frob check on a tiny fixture repo must not crash
        run: |
          set -e
          fixture=/tmp/frob-standalone-fixture
          rm -rf "$fixture" && mkdir -p "$fixture/src/demo"
          cd "$fixture"
          git init -q
          printf '"""Empty demo package."""\n' > src/demo/__init__.py
          printf 'module m\nnode n : trusted {\n}\n' > src/demo/x.strata
          # Exit code is not asserted: a real repo can legitimately fail
          # gates (missing tickets, coverage stamp, ...). What this step
          # locks down is that the process itself does not crash with an
          # unhandled exception/traceback when strata-core and frob-core
          # are both absent -- grep the output for the traceback marker
          # Python always emits on an uncaught exception.
          output="$(/tmp/frob-standalone-venv/bin/frob check 2>&1)" || true
          echo "$output"
          if echo "$output" | grep -q "^Traceback (most recent call last):"; then
            echo "::error::frob check crashed with an unhandled exception in a natives-less install"
            exit 1
          fi
