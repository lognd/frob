name: ci

# T-3922: every third-party `uses:` in this file is pinned to a 40-hex
# commit SHA with a trailing version comment; `.github/dependabot.yml`
# (github-actions ecosystem) is the update path -- see the release
# workflow's matching note for why hand-unpinning is never the fix.

# T-4338: every TOOLCHAIN this workflow installs (as opposed to the actions
# that install them, already covered by T-3922 above) is pinned here, once,
# for every leg to read -- see T-4327 for why this matters. Neither CI leg
# pinned a `uv` version; astral-sh/setup-uv caches the binary under a key
# keyed on OS/arch/system-Python, so a cache HIT silently reuses an old `uv`
# while a cache MISS on a different leg silently downloads the current
# release. Ubuntu's cache hit reused an older `uv`; macOS's miss pulled
# uv 0.12.10, whose new strict VIRTUAL_ENV-vs-project-path check produced 68
# failures that looked like a platform bug and cost a full ticket (T-4308)
# before T-4327 found the real cause. Every leg reading ONE pin here means
# the legs are comparable by construction instead of by cache-state luck.
#
# SURVEY (T-4338): three toolchain inputs in this workflow were resolved
# implicitly before this change -- `uv` (astral-sh/setup-uv, no `version:`),
# the Rust toolchain (dtolnay/rust-toolchain, no `toolchain:`, defaulted to
# whatever "stable" meant that day), and `maturin` (PyO3/maturin-action, no
# `maturin-version:`, installed latest-matching-constraint at run time).
# All three are pinned below. The actions that install them (`uses: ...@
# <sha>`) were already pinned by T-3922 and are not part of this count.
#
# PIN-ADVANCEMENT OWNERSHIP (decided here, T-4338): these three pins are
# OUTSIDE `.github/dependabot.yml`'s scope and deliberately stay manual.
# Dependabot's github-actions ecosystem (T-3922) tracks the `uses: ...@sha`
# references themselves -- it has no mechanism that watches a `with:`
# input's string value, so UV_VERSION/RUST_TOOLCHAIN_VERSION/
# MATURIN_VERSION would never be touched by an automated PR even if a
# github-actions ecosystem bump landed on the same line. Advancing them is
# a human decision (bump, rerun this workflow, confirm the "Print resolved
# toolchain versions" step below on all three legs, then update this
# block) -- do not fold that into the T-4268 dependabot-sequencing plan,
# which only ever governs the `uses:` SHAs.
env:
  UV_VERSION: "0.11.19"
  RUST_TOOLCHAIN_VERSION: "1.98.0"
  MATURIN_VERSION: "1.7.4"

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # T-3425: windows-latest is ADVISORY ONLY (continue-on-error) until
    # T-3076's 278 Windows-only failures (five missing POSIX primitives:
    # fcntl, os.sysconf, AF_UNIX, fork context, charmap codec) are drained.
    # Without this, ci.yml's overall conclusion is RED on every push
    # regardless of ubuntu/macOS health, so scripts/verify_release_ci_status.py
    # (T-3251) can never resolve GREEN and every release needs the
    # override_red_ci escape hatch -- making the escape hatch the normal
    # path instead of an exception (PLATFORM001 doctrine: declare the
    # boundary, never silently degrade). The job still runs and reports on
    # every push -- the signal is kept for measuring the T-3076 burn-down --
    # it just no longer flips the workflow conclusion. Remove this flag
    # when T-3076's failure set reaches zero.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    # T-3192: a hanging job used to produce NO failure signal at all -- the
    # owner cancelled run 33135896391 by hand after 54 minutes, and runs
    # 33032904841/32968539246 (2h40m) sit in history as `cancelled`, never
    # `failure`, because nothing here ever timed the JOB out on its own
    # (GitHub's own default ceiling is 6 hours). This backstops the
    # per-step `timeout -s ABRT` below (which targets the Test step
    # specifically, with a stack dump) -- a belt-and-braces ceiling in
    # case a hang lands in a DIFFERENT step (Sync deps, native build,
    # ...) that isn't individually wrapped. Budget: the slowest OBSERVED
    # full-job completion in this matrix is macOS's ~23 minutes for the
    # Test stage alone (run 33135896391).
    #
    # T-3426: raised 45 -> 60 alongside the ubuntu Test step's own
    # 25m -> 40m raise below, so the step budget (with its stack dump)
    # remains the thing that fires first on a genuine hang rather than
    # this job-level ceiling -- 60 minutes keeps a >2x margin over the
    # 40-minute step budget without leaving a hang to run for hours
    # before anyone notices.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, resolved 2026-09-05
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
      # T-4338: state what this run actually used -- a version that must be
      # inferred from setup-uv/rust-toolchain's own cache-hit-or-miss log
      # lines is not reported. Printed unconditionally (not `if: failure()`)
      # so a passing run's own step summary is also a record of what it ran,
      # not only a failed one's.
      - name: Print resolved toolchain versions (T-4338)
        shell: bash
        run: |
          {
            echo '## Resolved toolchain versions (T-4338)'
            echo '```'
            echo "uv:      $(uv --version)"
            echo "rustc:   $(rustc --version)"
            echo "cargo:   $(cargo --version)"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      # T-3980: the cache key MUST include runner.os (and arch, since
      # macos-latest can move between arm64/x86_64 runners) -- this path
      # covers frob-core/target and strata-core/target, which is where
      # `maturin build` drops target/wheels/*.whl. Without an os/arch
      # component every matrix leg shares ONE cache entry, so whichever
      # job finishes first (observed: macos-latest) writes its
      # platform-tagged wheels into a cache the ubuntu-latest leg then
      # restores verbatim -- test_artifact_smoke.py's serve-extra checks
      # then resolve against `strata-core` wheels tagged
      # `macosx_11_0_arm64` on an x86_64 Linux runner and fail with a
      # uv "no wheels with a matching platform tag" resolver error that
      # has nothing to do with the artifact under test.
      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            frob-core/target
            strata-core/target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frob-core/Cargo.lock', 'strata-core/Cargo.lock') }}
      - name: Sync deps
        run: uv sync --all-extras --all-groups
      - name: Build native extensions (frob-core + strata-core, Rust/PyO3)
        run: make core
      - name: cargo test (frob-core kernels)
        run: cd frob-core && cargo test --lib
      - name: cargo test (strata-core kernels)
        run: cd strata-core && cargo test --lib
      - name: Lint
        run: uv run ruff check src tests
      - name: Typecheck
        run: uv run ty check src
      # T-3192: a hanging Test step used to produce no failure signal beyond
      # the job-level timeout-minutes backstop above -- a bare timeout kills
      # the job with a red X and NO information about where it was wedged,
      # barely better than the manual cancellations in this repo's own CI
      # history (runs 33135896391/33032904841/32968539246, all on
      # ubuntu-latest). `timeout -s ABRT` (not the default SIGTERM) plus
      # `PYTHONFAULTHANDLER=1` makes Python's built-in fault handler dump
      # every live thread's stack to stderr the instant the budget is hit,
      # before the process dies -- the exact recipe this repo already uses
      # for local hang diagnosis (see docs/modules/testing.md's SIGUSR1
      # stack-dump handler and the `PYTHONFAULTHANDLER=1 timeout -s ABRT N`
      # local recipe). `timeout` is GNU coreutils and only reliably present
      # on the ubuntu-latest runner's bash (not Windows' default pwsh, and
      # not macOS's BSD userland), so ubuntu keeps the GNU form directly.
      #
      # T-3250: run 33169097371 (job 98841565692, macos-latest) FALSIFIES
      # the premise this comment used to state here ("windows/macos have
      # never hung in this matrix's own history") -- macOS hung at 99% for
      # 10m49s of total silence and produced ZERO diagnostics, because the
      # step below used to be an uninstrumented `uv run pytest -q` for
      # every non-Linux platform. macOS and Windows now get the same
      # stack-dump-on-hang standard as ubuntu, using shell/pwsh builtins
      # (`kill -ABRT` / `Wait-Process`) in place of GNU `timeout`, which
      # remains genuinely absent from both userlands.
      #
      # Budget: macOS's own Test stage completed in ~23 minutes when it
      # last ran cleanly (run 33135896391) and ubuntu's Test step, when it
      # fails outright rather than hanging, finishes within the ~15-minute
      # whole-job budget (run 33035660969) -- 25 minutes gave the slower
      # platform's own observed ceiling a small margin without leaving a
      # genuine hang to run anywhere near the (then-)45-minute job timeout
      # above.
      #
      # T-3426: run 33277131782 (HEAD bb5c28203, 2026-08-29) proved 25m
      # is too tight for a PASSING ubuntu run, not just a hung one -- the
      # suite reached 99% at ~20m and was still inside two whole-repo
      # self-scan tests' bodies (not blocked on a lock) when the 25m
      # `timeout -s ABRT` fired at 22:18:23, killing a run that would have
      # finished. macOS (more cores) completed the identical suite in
      # 18m31s in the SAME run, so this was ubuntu's own budget being too
      # tight on its slow self-scan tail at that point, not the T-3420
      # SIGTERM deadlock (this invocation runs without coverage). Raised
      # 25m -> 40m to clear that tail with real margin; macOS/Windows
      # were left unchanged at the time, since macOS's own 18.5m run
      # showed no equivalent problem there YET.
      #
      # T-3482: the suite kept growing (12816 tests by 2026-08-30) and
      # macOS's own 25m budget went stale the same way -- run 33308245923
      # was killed at [67%] mid-run, not hung, with two prior CLEAN macOS
      # runs already at 24m/28m. Raised 25m -> 40m here too, matching
      # ubuntu's own T-3426 raise, so the two platforms cannot drift
      # apart again (both now share the 40m/2400s budget). Windows stays
      # unchanged (advisory only, T-3425). A follow-up ticket (not this
      # one) should make the self-scan tests share one cached graph per
      # session so the tail stops costing minutes per test on every
      # platform -- these budget raises only stop CI from killing a
      # passing-but-slow run.
      #
      # WHY faulthandler_timeout=100 / --timeout=120 (pyproject.toml,
      # pytest-timeout, --timeout-method=thread) did NOT fire during the
      # 649s macOS silence, even though the Windows job's own dumps in
      # this same run ARE stamped by that exact mechanism ("Timeout
      # (0:01:40)"): both are PER-TEST watchdogs armed only while a test
      # is executing. The 99% marker means the last test had already
      # finished; the silence was in session teardown / xdist worker
      # shutdown, a window no per-test timeout structurally reaches. The
      # step-level guards below are what cover that window; per-test hangs
      # remain covered by the pyproject.toml settings as before.
      # T-3756: REVERT of T-3748. T-3748 made ubuntu run the suite ONCE, under
      # coverage, as a combined pass/fail + coverage gate
      # (`frob coverage --full --fail-on-degraded`). Measured across CI runs
      # 33839329030 and 33845970790: this made ubuntu's pass/fail gate
      # coverage-sensitive -- the SAME code that passes macOS's coverage-free
      # `pytest -q` fails reproducibly on ubuntu under coverage instrumentation
      # + the -n2 worker cap (coverage-sensitivity/timing, not a real
      # regression), and `--fail-on-degraded` correctly, but wrongly for this
      # purpose, reds the leg on it. Reverted to a coverage-free `pytest -q`
      # matching macOS's own intent, so ubuntu's pass/fail is measuring the
      # same thing macOS measures. Coverage itself is now a separate,
      # non-blocking best-effort measurement -- see the coverage step below.
      - name: Test (ubuntu, timed with stack-dump-on-hang)
        if: runner.os == 'Linux'
        env:
          PYTHONFAULTHANDLER: "1"
          # T-3755: emit the FULL failing-node-id list (not the first 50 + "and
          # N more") so a platform-drain drive can read the complete failure set
          # from one CI run.
          FROB_TEST_SUITE_RESULT_MAX_NODE_IDS: "500"
        # T-3516: `tee` a copy of the run's own output to a log file so the
        # step below can grep it for `WORKER-CRASH-REPORT:` -- `pipefail`
        # keeps `timeout ... | tee ...`'s own exit code as the real one (a
        # red suite or the ABRT timeout), not tee's always-0 exit, so this
        # step still fails exactly as before.
        run: |
          set -o pipefail
          # T-3776 reverted (T-3777): pytest-rerunfailures 16.6 INTERNALERRORs under xdist on py3.14 (macos), turning a rare flake into a whole-suite abort; flakes are handled by fixing the specific flaky tests instead (T-3775).
          timeout -s ABRT 40m uv run pytest -q 2>&1 | tee /tmp/pytest-ubuntu.log
      # T-3516: collect, do not scatter -- and stay loud even off the raw
      # log: an xdist worker crash today (see tests/conftest.py's
      # `WORKER-CRASH-REPORT:` section, T-3516) is otherwise only visible
      # by scrolling the full Test step's log. `always()` so this still
      # runs (and still reports) on a failing/timed-out Test step, the
      # exact run this exists to make visible without scrolling.
      #
      # T-3531: widened from ubuntu-only to every platform, and from
      # WORKER-CRASH-REPORT-only to ALSO surfacing the SUITE-RESULT /
      # SUITE-RESULT-FAILED block (tests/conftest.py's own per-node-id
      # pass/fail summary) -- previously the failing test set was only
      # readable by scrolling the raw job log, on every platform. Runs
      # under `shell: bash` explicitly (GitHub's hosted Windows runners
      # ship Git Bash, and `RUNNER_TEMP` resolves identically across all
      # three shells) so one step covers all three Test steps' log files
      # rather than three near-duplicate platform-specific steps.
      - name: Surface WORKER-CRASH-REPORT and SUITE-RESULT in step summary (T-3516/T-3531)
        if: always()
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) log=/tmp/pytest-ubuntu.log ;;
            macOS) log=/tmp/pytest-macos.log ;;
            Windows)
              # T-3531: stdout/stderr were captured to two separate files
              # (the Windows Test step's own Start-Process redirection,
              # T-3250) -- concatenate them in the order a reader expects
              # (stdout's SUITE-RESULT lines, then stderr's own tail) into
              # one combined file this step can grep the same way as the
              # other two platforms'.
              log="$RUNNER_TEMP/pytest-combined.log"
              cat "$RUNNER_TEMP/pytest-stdout.log" "$RUNNER_TEMP/pytest-stderr.log" \
                > "$log" 2>/dev/null || true
              ;;
          esac
          if [ -f "$log" ] && grep -q '^WORKER-CRASH-REPORT:' "$log"; then
            {
              echo '## Worker crash report (T-3516)'
              echo '```'
              grep '^WORKER-CRASH-REPORT:' "$log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          # T-3531: NOT `^`-anchored -- pytest's own `-q` progress output
          # ("......[100%]") and the FIRST `SUITE-RESULT:` summary line
          # (tests/conftest.py) used to print with no newline between them
          # (measured directly off a real run's raw log: both shared one
          # timestamped line), so a `^SUITE-RESULT` anchor silently missed
          # exactly that one line. `-o` extracts the matched suffix from
          # wherever it starts, dropping the leading dots/percentage
          # instead of anchoring past them. Every `SUITE-RESULT-FAILED:`
          # line (the per-test failing-set detail, the actual signal this
          # ticket cares about) already starts its own line and matches
          # either way.
          #
          # T-4103: the producer (`pytest_sessionfinish` in
          # tests/conftest.py) is now fixed -- it calls
          # `reporter.ensure_newline()` before writing the line, so a
          # NEWER run's log always has `SUITE-RESULT:` at column zero. This
          # workaround is deliberately LEFT IN PLACE (not re-anchored with
          # `^`) because this step must keep matching logs produced by
          # OLDER commits during any bisect or rerun.
          if [ -f "$log" ] && grep -qE 'SUITE-RESULT(-FAILED)?:' "$log"; then
            {
              echo '## Suite result (T-3531)'
              echo '```'
              grep -oE 'SUITE-RESULT(-FAILED)?:.*' "$log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      # T-3250: macOS has bash but not GNU coreutils' `timeout`. `kill -ABRT`
      # is a POSIX shell builtin present in macOS's own bash, so it reaches
      # the same faulthandler dump-then-die mechanism as ubuntu's step
      # without depending on GNU tooling.
      # T-3482: run 33308245923 (macos-latest, HEAD 355eb4468, 2026-08-30)
      # proved 25m is too tight for a PASSING macOS run too, the same
      # class of miss T-3426 fixed for ubuntu -- the suite reached [67%]
      # and was killed by this step's own 1500s watcher at ~11:38 with
      # test_frob_self_model.py::test_sys_gate_zero_violations on the
      # stack, not a hang: the previous two clean macOS runs took 24m
      # (33298117154) and 28m (33303586303) on a suite that has grown to
      # 12816 tests. Raised 25m -> 40m to match ubuntu's own T-3426 raise
      # and give the grown suite the same margin; Windows is unchanged
      # (advisory only, T-3425).
      - name: Test (macos, timed with stack-dump-on-hang)
        if: matrix.os == 'macos-latest'
        env:
          PYTHONFAULTHANDLER: "1"
          # T-3755: emit the FULL failing-node-id list (not the first 50 + "and
          # N more") so a platform-drain drive can read the complete failure set
          # from one CI run.
          FROB_TEST_SUITE_RESULT_MAX_NODE_IDS: "500"
        run: |
          set -uo pipefail
          budget=2400  # 40m, same budget/rationale as ubuntu's step above (T-3426/T-3482)
          # T-3531: process substitution (not a plain `| tee` pipeline) so
          # `$!` below still captures pytest's OWN pid, not tee's -- the
          # SIGABRT-for-a-faulthandler-dump targeting below needs the real
          # pytest process, exactly like ubuntu's own `tee` step but without
          # ubuntu's `timeout`/pipefail shape (macOS has no GNU `timeout`,
          # T-3250) to lean on for that distinction.
          # T-3776 reverted (T-3777): pytest-rerunfailures 16.6 INTERNALERRORs under xdist on py3.14 (macos), turning a rare flake into a whole-suite abort; flakes are handled by fixing the specific flaky tests instead (T-3775).
          # T-4274: `$!` after backgrounding `uv run pytest ...` was `uv`'s
          # OWN pid, not pytest's -- `uv run` forks and supervises a real
          # child process rather than exec'ing into it (measured directly:
          # backgrounding `uv run python -c '...'` and comparing `$!` to the
          # child python's own pid via `ps --ppid` shows they differ; sending
          # that pid SIGABRT aborts `uv` itself -- "Aborted (core dumped)",
          # exit 134 -- exactly this ticket's own incident, and `uv` has no
          # `PYTHONFAULTHANDLER` of its own so nothing is ever dumped).
          # Reproduced and fixed locally: invoking the ALREADY-synced venv's
          # own interpreter directly (`.venv/bin/python -m pytest`, no `uv
          # run` supervisor in between) backgrounds the real python process
          # itself, so `$!` is the correct pid and `kill -ABRT` reaches the
          # process that actually has `PYTHONFAULTHANDLER=1` installed --
          # verified with a deliberately hung script under this exact
          # background+watcher+ABRT-then-KILL shape: a stack appears with
          # the direct-interpreter form and does not with `uv run`. The
          # preceding "Sync deps" step already ran `uv sync --all-extras
          # --all-groups`, so `.venv/bin/python` is the exact interpreter
          # `uv run` would have selected anyway -- this changes WHICH
          # process receives the signal, not which environment the suite
          # runs in.
          # T-4368: this direct-interpreter invocation does not go through
          # `uv run`, so it never gets `uv run`'s own PATH activation (which
          # prepends the target project's own bin dir). Without `.venv/bin`
          # on PATH, `shutil.which("ty")`/`shutil.which("mypy")` inside the
          # test process -- and inside any subprocess it spawns -- resolve
          # to nothing even though ty/mypy are this repo's own dev
          # dependencies, sitting right there at `.venv/bin/ty`/`.venv/bin/
          # mypy`. Reproduced locally (platform-independent PATH-content
          # defect, not a macOS-specific one): `env -i PATH=/usr/bin:/bin
          # .venv/bin/python -m pytest -q
          # tests/test_gates_suppress.py::TestSuppressionDialects::test_available_reflects_path_not_project_config`
          # fails with `dialects["ty"].available is False`; prepending
          # `.venv/bin` to PATH fixes it. Prepend rather than replace, so
          # the runner's own ambient PATH (git, coreutils, etc) stays
          # intact -- this only ADDS this repo's own venv bin dir, exactly
          # what `uv run` would have done had this step used it.
          export PATH="$PWD/.venv/bin:$PATH"
          .venv/bin/python -m pytest -q > >(tee /tmp/pytest-macos.log) 2>&1 &
          pid=$!
          started=$(date +%s)
          (
            sleep "$budget"
            if kill -0 "$pid" 2>/dev/null; then
              echo "::error::macOS Test step exceeded ${budget}s with no completion (T-3250) -- sending SIGABRT for a PYTHONFAULTHANDLER stack dump before the kill"
              kill -ABRT "$pid" 2>/dev/null || true
              sleep 10
              kill -KILL "$pid" 2>/dev/null || true
            fi
          ) &
          watcher=$!
          wait "$pid"
          status=$?
          kill "$watcher" 2>/dev/null || true
          # T-4274 acceptance [3]: report the margin between how long the
          # step actually took and its budget, on EVERY completion (not
          # only a failure) -- a pass with the margin nearly gone (as the
          # 39m-of-40m run before this incident was) must be visible
          # before it becomes the next failure, not discovered in
          # hindsight from two runs' timestamps.
          elapsed=$(( $(date +%s) - started ))
          remaining=$(( budget - elapsed ))
          echo "::notice::macOS Test step finished in ${elapsed}s against a ${budget}s budget (${remaining}s margin)"
          exit "$status"
      # T-3250: Windows' default `run:` shell is pwsh, which has no `kill
      # -ABRT` equivalent -- there is no portable way for an external
      # process to trigger a SIGABRT-style fault dump in a Windows child.
      # PLATFORM001 doctrine
      # (docs/modules/gates.md#platform001-posix-only-primitive-degrades-silently-t-2919):
      # declare that boundary rather than silently doing nothing. Per-test
      # hangs still get thread-based stack dumps via pytest-timeout's
      # --timeout=120/--timeout-method=thread (proven in run 33169097371 --
      # the Windows job's own dumps are stamped "Timeout (0:01:40)"); this
      # step only closes the teardown-window gap with a TIMED FAILURE and
      # an explicit message, not a stack dump, on that one platform.
      # T-3540: deliberately NOT `-NoNewWindow` any more -- that flag made
      # the child share THIS step's own console, a real (but, per T-3549,
      # NOT the dominant) contributor to Windows-only `KeyboardInterrupt`
      # aborts here; without `-NoNewWindow`, `Start-Process` gives the
      # child its own console/process group instead, so `Stop-Process -Id
      # $p.Id` (the hang-guard's own terminator below) still works
      # identically regardless of which console/process-group the target
      # process is in. Output is redirected to files and replayed with
      # Get-Content once the run finishes (or is force-terminated) since a
      # separate console has nothing live to inherit into this step's log.
      # T-3549: re-measured AFTER T-3540's fix landed (run 33361224273) --
      # the suite still aborted at the SAME ~1% point via the SAME
      # `KeyboardInterrupt` at `threading.py:359`, with no
      # "::error::...exceeded" message (so `Wait-Process` never timed
      # out -- the interrupt is raised INSIDE the pytest process, not
      # delivered externally), ruling console-sharing out as the dominant
      # cause. Root cause (read directly from the installed package):
      # execnet's (pytest-xdist's transport) `Gateway._terminate_
      # execution` (`execnet/gateway_base.py`) calls `_thread.
      # interrupt_main()` on win32 when a worker gateway's channel closes
      # uncleanly and its execution pool has not drained within 5s --
      # exactly this `KeyboardInterrupt`-on-`threading.py` shape,
      # internal to execnet/xdist's own teardown machinery, not this
      # repo's code. `-p no:xdist` below removes xdist (and therefore
      # execnet) from the windows-latest leg entirely, trading Windows'
      # own parallelism for actually completing; ubuntu-latest/macos-
      # latest keep `-n auto --dist=loadgroup` (pyproject.toml addopts)
      # unchanged, since this mechanism has not been observed to misfire
      # on either. Unverified against a real windows-latest run at the
      # time this landed (no local Windows box) -- if the interrupt
      # recurs even single-process, the mechanism above needs revisiting
      # by someone who can reproduce interactively.
      #
      # T-3560 (round 3, TEMPORARY diagnostics): `-p no:xdist` (T-3549) was
      # FALSIFIED as the fix -- run 33367854833 (HEAD e1974b649) still died
      # with the same `KeyboardInterrupt` at `threading.py:1169`
      # (`Thread.join`) at ~4 minutes in, ~1% through collection, plain
      # serial, no execnet in the process at all. `git grep` found zero
      # in-repo senders of CTRL_C_EVENT/interrupt_main/os.kill(SIGINT).
      # `-v --full-trace` plus a win32-only SIGBREAK faulthandler
      # registration in `tests/conftest.py` (both TEMPORARY, T-3560) named
      # the exact hang site: `tests/system/conftest.py`'s win32 `run()`
      # branch (`subprocess.run(..., timeout=100)`), blocked in
      # `subprocess._communicate`'s reader-thread `Thread.join` -- NOT
      # pytest-timeout (T-3577 confirmed: neither of its two handlers
      # (`timeout_sigalrm`, `timeout_timer`) ever raises `KeyboardInterrupt`;
      # `timeout_timer` hard-kills via `os._exit(1)` instead). Root cause
      # (T-3577): `subprocess.run`'s own internal timeout handling calls
      # `process.kill()` on `TimeoutExpired` and then retries
      # `communicate()` a SECOND time with NO timeout to drain remaining
      # output -- if a grandchild process the frob CLI spawned is still
      # holding the inherited stdout/stderr pipe open (Windows
      # `CreateProcess` duplicates ALL inheritable handles into every
      # child it spawns, unlike POSIX close-on-exec), that untimed second
      # `communicate()` blocks forever. Compounding suspect closed in the
      # SAME ticket: `src/frob/process/_lock.py`'s `_msvcrt_acquire_
      # blocking` was an UNBOUNDED same-process-reentrancy-unsafe poll
      # loop -- now bounded, converting a silent forever-hang into a loud,
      # bounded failure. Both T-3560 diagnostics (`-v --full-trace` here
      # and the SIGBREAK handler in `tests/conftest.py`) are REVERTED in
      # this same land per T-3560's own contract; `-p no:xdist` (T-3549)
      # stays, since it is still a real, independent risk-reduction even
      # though it was not the root cause here.
      # T-3582 (round 5): the interrupt SURVIVED T-3577's bounded msvcrt
      # lock + bounded win32 run() wrapper -- run 33385515507 (HEAD
      # 94931dde1) still died with KeyboardInterrupt at [1%]. T-3577's
      # fix only covers tests/system/conftest.py's win32 run() branch;
      # the actual hang site this round is further into collection
      # (tests/integration/, around test_gitlog.py). `-v --full-trace`
      # is re-added here as a PERSISTENT setting (not the T-3560 TEMPORARY
      # kind) while this leg stays advisory -- every future run needs the
      # trace until Windows is actually green; removing it again before
      # then repeats the T-3560 premature-revert mistake.
      # T-3675 (round 18): FROB_TEST_HARD_EXIT=1 is set here, and ONLY
      # here in this repo -- round 17's own evidence (run 33556847222)
      # showed that with the FROB_TEST_IGNORE_CONSOLE_CTRL guard above
      # armed, the injected SIGINT stopped killing this step and it
      # HUNG past its 1500s budget instead, with orphan pytest/python
      # processes still alive: the interrupt was MASKING a real
      # session-teardown wedge (a non-daemon thread or unreaped child
      # blocking interpreter shutdown) the whole time. This hard-exit
      # (tests/conftest.py::_maybe_hard_exit_after_session_finish)
      # documents what wedges teardown (one FROB-TEST-HARD-EXIT: line
      # inventorying live threads/children) and os._exit()s with the
      # session's real exit code right after that line, instead of
      # letting pytest's own wrap_session teardown -- and whatever
      # wedges inside it -- ever run. See docs/modules/process.md's
      # "Round 18" paragraph for the full rationale.
      #
      # T-3683 (round 19): round 18's own run (33582058515) measured
      # this step hitting its 1500s budget AGAIN, with NO FROB-TEST-
      # HARD-EXIT: line printed at all -- the suite wedges BEFORE
      # pytest_sessionfinish, which the hard-exit above can never
      # reach. FROB_TEST_MIDRUN_WATCHDOG_SECONDS=300 arms tests/
      # conftest.py's independent mid-run watchdog (_run_midrun_
      # watchdog): if no test call-phase reports progress for 300s
      # (comfortably inside this step's 1500s budget), it prints the
      # SAME thread/child inventory line and os._exit()s, instead of
      # a silent Wait-Process timeout with zero diagnostic output.
      # This is diagnostic-first, not itself the fix: the real fix is
      # T-3683's own Part A (bisecting/killing the in-pipeline SIGINT
      # sender a subprocess frob-check call inside a test would
      # otherwise be masking-and-hanging on) -- once that lands, this
      # watchdog should simply stop firing in practice, but stays
      # armed so a future wedge is never silent again.
      #
      # T-3689: threshold lowered 300s -> 180s. T-3686 fixed the self-
      # interrupt, which UNMASKED a second win32 problem this watchdog
      # was blind to: run 33615554440 measured a single zero-tool-spawn
      # `frob check` completing (not hanging) in 122.7s on win32, and
      # the Windows Test step still exceeded its 1500s budget with the
      # watchdog never firing -- individual test call-phases were each
      # slow-but-progressing (each logreport landing under the old 300s
      # gap), never wedged for a single >=300s stretch, so cumulative
      # slowness across many tests summed past budget with no single
      # stall this watchdog's no-progress-in-N-seconds design could see.
      # 180s narrows that blind spot (any ONE test call-phase now taking
      # more than ~1.5x a single measured 122.7s check is caught) without
      # dropping below a single slow-but-healthy check's own measured
      # duration.
      #
      # T-3746: threshold raised 180s -> 1350s. Run 33769225680 showed 180s
      # FALSE-tripping on a legitimately-slow single test:
      # test_fleet_status_ticket_readiness_arch001 (and the self-scan-heavy
      # family) each block in ONE `frob check` subprocess reporting no
      # pytest call-phase progress for the subprocess's whole duration. On
      # win32 the Test step runs `-p no:xdist` (single-threaded), so those
      # heavy tests -- some carrying @pytest.mark.timeout(1200) -- run back
      # to back with long no-progress stretches that are NOT hangs. The
      # midrun watchdog must sit ABOVE the largest legitimate per-test
      # timeout (1200s, kept comfortably under the matrix test's <1500 budget assertion) so it only fires on a test wedged beyond even its
      # own pytest-timeout (a true unkillable win32 hang); cumulative
      # slowness is now caught by FROB_TEST_TOTAL_BUDGET_SECONDS below, and
      # per-test hangs by pytest-timeout's --timeout=120/per-test overrides.
      - name: Test (windows, timed with hang guard)
        if: matrix.os == 'windows-latest'
        env:
          PYTHONFAULTHANDLER: "1"
          # T-3755: emit the FULL failing-node-id list (not the first 50 + "and
          # N more") so a platform-drain drive can read the complete failure set
          # from one CI run.
          FROB_TEST_SUITE_RESULT_MAX_NODE_IDS: "500"
          FROB_TEST_IGNORE_CONSOLE_CTRL: "1"
          FROB_TEST_HARD_EXIT: "1"
          # T-3793: temporary diagnostic for the ~39 CI-only doctor-cluster
          # failures -- FROB_TEST_HARD_EXIT above os._exit()s before
          # pytest's own FAILURES section flushes, so this dumps each
          # failed/errored test's longrepr via the SUITE-RESULT reporter
          # (which DOES flush first). windows-only; ubuntu/macos unchanged.
          FROB_TEST_DUMP_FAILURE_REPR: "1"
          FROB_TEST_MIDRUN_WATCHDOG_SECONDS: "1350"
          # T-3707 Part B: a suite that never stalls 180s at a stretch but
          # sums past this step's own 3300s Wait-Process budget still gets
          # killed with zero diagnostic output (T-3692's finding) -- this
          # wall-clock cap (comfortably under the 3300s step budget) hard-
          # exits with the same thread/child inventory the stall watchdog
          # prints, so that class of silent timeout gets a real diagnostic
          # too.
          # T-3749: raised 3000 -> 4500. T-3741 re-enabled xdist here; run
          # 33804740730 confirmed it is SAFE (execnet run_server/run_connection
          # worker threads live, F./. progress reported, NO KeyboardInterrupt
          # saga -- FROB_TEST_IGNORE_CONSOLE_CTRL holds) but the 13k-test suite
          # on a 4-core windows runner still ran past the 3000s cap even
          # parallel (windows subprocess spawn is ~2x macos, whose xdist suite
          # is ~25min). 4500s (75m) gives the parallel run room to finish; the
          # 180s->1350s midrun watchdog (T-3746) and pytest-timeout still catch
          # a genuine per-test hang, so this is not a blind ceiling raise.
          # (History: T-3740 raised 1200->3000 for the single-threaded run.)
          # T-4372: raised 4500 -> 6000. T-4360 cut workers 4 -> 2 (`-n 2`
          # below) to fix a real, repeated OOM (measured: two independent
          # frob_self_scan_heavy-group tests died at ~300s each under -n4
          # ambient load); the tradeoff it accepted was "roughly doubling
          # this leg's wall-clock time", but that leg's own 4500s cap was
          # never raised to match. Run 34371162715 (win4.log) MEASURED the
          # result: the -n2 suite hit this exact cap at 83% collected-item
          # completion (last progress line before SUITE-RESULT: TOTAL-
          # BUDGET-EXCEEDED read "[ 83%]", timestamped at 4500.7s elapsed).
          # Linear extrapolation from that single data point: 4500.7s /
          # 0.83 ~= 5423s (~90.4m) to reach 100%. 6000s (100m) covers that
          # projection with ~10% headroom for run-to-run variance without
          # reopening the OOM this ticket is not touching (worker count is
          # unchanged) -- see tickets/T-4372/ticket.md for the full
          # percentage-vs-timestamp derivation. Comfortably inside this
          # job's timeout-minutes: 150 (9000s) alongside the other steps.
          FROB_TEST_TOTAL_BUDGET_SECONDS: "6000"
        run: |
          # T-3692: two diagnostic additions, both env-var-expansion-proof
          # (curly-brace ${...} form throughout, matching macOS's own
          # step above -- run 33625622797's error line printed the bare
          # "$budget" form literally unexpanded, so this round hardens
          # every interpolation site to the unambiguous form rather than
          # trusting bare "$name" before a space). (1) echoes the env var
          # pytest_configure is supposed to see, so the next run answers
          # "did FROB_TEST_MIDRUN_WATCHDOG_SECONDS even reach the uv/
          # pytest child process" directly, independent of whether the
          # watchdog fires; conftest.py's own new FROB-TEST-MIDRUN-
          # WATCHDOG: armed line (T-3692) answers the python-side half.
          Write-Host "T-3692: FROB_TEST_MIDRUN_WATCHDOG_SECONDS=$($env:FROB_TEST_MIDRUN_WATCHDOG_SECONDS)"
          ${budget} = 6300  # 105m: outer Wait-Process backstop, kept ~300s above the python-side FROB_TEST_TOTAL_BUDGET_SECONDS=6000 cap so that cap fires first with a diagnostic (T-3749); raised alongside it by T-4372 (see that env var's own comment above for the measured 83%-at-4500.7s extrapolation this is sized from)
          $stdout = Join-Path $env:RUNNER_TEMP "pytest-stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "pytest-stderr.log"
          # T-3741: xdist re-enabled. `-p no:xdist -v --full-trace` was a
          # T-3549/T-3560 diagnostics-era artifact from the win32 hang
          # investigation -- single-threaded, so a collection-heavy suite
          # crawled and the midrun watchdog false-fired from session start
          # (run 33778211294). The hang root causes are fixed (T-3686 os.kill
          # self-ctrl-c, T-3708 abandoned-thread atexit, T-3726 capture,
          # T-3730/3735 test_cli_doctor, T-3738 test_wire) and the console
          # ctrl mitigation (FROB_TEST_IGNORE_CONSOLE_CTRL=1, above) neutralizes
          # the injected-SIGINT class, so the suite runs parallel like ubuntu/
          # macos via pyproject's `-n auto --dist=loadgroup` addopts. `-q` keeps
          # output sane under xdist (matches the macos step).
          # T-3757: append --timeout=600 (pyproject addopts sets --timeout=120).
          # A second --timeout on the pytest command line wins over the addopts
          # value (pytest-timeout/argparse last-value-wins; verified locally:
          # `pytest -p no:xdist --timeout=1 --timeout=300` does NOT error at 1s).
          # Slow full-repo-scan gate tests (test_fleet_status_ticket_readiness_
          # arch001.py, test_docptr_gate.py, test_gates_tickets_hygiene.py::
          # TestTick003StaleArchive, and more of that class) were exceeding the
          # 120s default on the slower Windows runner, os._exit-killing their
          # xdist worker and aborting the whole suite (T-3608 stall-abort)
          # before the full failing-test list could ever be collected. The
          # self-scan-heavy tests' own @pytest.mark.timeout(1200) marker still
          # wins over this CLI value (marker > CLI), so this only widens the
          # default floor, not the explicitly-marked ceiling.
          # frob:waive BUG002 reason="CI-config timeout change; the worker-crash-abort is only reproducible on the slow Windows CI runner, not the Linux land suite"
          # T-3776 reverted (T-3777): pytest-rerunfailures 16.6 INTERNALERRORs under xdist on py3.14 (macos), turning a rare flake into a whole-suite abort; flakes are handled by fixing the specific flaky tests instead (T-3775).
          # T-3785: append -rA --tb=short so a failure's full traceback
          # (not just its node id from the SUITE-RESULT-FAILED line) reaches
          # this step's log -- needed to diagnose the ~39 doctor-cluster
          # tests that only fail in this full-suite Windows run, never under
          # isolated winrun (T-3775/doctor). Reporting verbosity only: no
          # --reruns, no change to which tests pass or fail. Verified
          # locally (Linux) that -rA --tb=short prints the FAILURES section
          # with full tracebacks under -n auto --dist=loadgroup -q.
          # T-4360: append -n 2, overriding pyproject's `-n auto` (4 workers
          # on this runner's 4 cores) the same way --timeout above overrides
          # it -- pytest-xdist/argparse last-`-n`-wins. MEASURED, not a
          # round-number guess: winrun-driven local measurement found one
          # isolated frob_self_scan_heavy scan costs ~0.9GB resident, but
          # the OTHER 3 workers' own real-subprocess-heavy tests (T-2099)
          # already summed to ~5.5GB of ambient python.exe working set on
          # their own, mid-run, on a slower/contended box -- i.e. the
          # dominant memory cost under -n4 is ambient worker fanout, not
          # the scan itself. windows-latest is nameplate 16GB/4-core (GH
          # docs), but two DIFFERENT frob_self_scan_heavy tests were each
          # observed dying independently at their own ~300s mark in one
          # real run (34315257799, win6.log) -- ruling out "two scans
          # compounding on one worker" and confirming a single scan plus
          # -n4's ambient load already exceeds whatever headroom the real
          # VM has (nameplate RAM is not headroom: AV/runner-service/Node
          # Action overhead all eat into it, invisible to this
          # measurement). Halving worker count roughly halves the
          # measured ~5.5GB ambient term, leaving substantially more
          # headroom than a smaller cut (-n 3) would, at the cost of
          # roughly doubling this leg's own wall time -- still comfortably
          # inside the existing 4500s/80m budget (win3/win5 finished a
          # full -n4 run in ~70min wall time end to end). See
          # tickets/T-4360/measurement-notes.md for the full arithmetic.
          # NOT yet confirmed by repeated green runs -- see that file's
          # own "consecutive completions" section for the bar this needs
          # to clear before being called fixed.
          $p = Start-Process -FilePath "uv" -ArgumentList "run","pytest","-q","-n","2","--timeout=600","-rA","--tb=short" -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            Wait-Process -Id $p.Id -Timeout ${budget} -ErrorAction Stop
          } catch {
            Write-Host "::error::Windows Test step exceeded ${budget}s with no completion (T-3250) -- terminating. NOTE (PLATFORM001 declared boundary): Windows has no portable equivalent of SIGABRT-triggered faulthandler dump from an external process, so this teardown-window path gets a timed failure without a stack dump; per-test hangs are still covered by pytest-timeout's --timeout=120/--timeout-method=thread."
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            Get-Content $stdout -ErrorAction SilentlyContinue
            Get-Content $stderr -ErrorAction SilentlyContinue
            exit 1
          }
          Get-Content $stdout -ErrorAction SilentlyContinue
          Get-Content $stderr -ErrorAction SilentlyContinue
          exit $p.ExitCode
      # T-1265 (CHK-THEME-GITIGNORED-TRUST successor): this used to swallow
      # EVERY finding, ERROR-tier included, behind an unconditional
      # `|| echo "::warning"` -- a real gate error (SUPPRESS001, INV006,
      # PRE001, ...) never failed the build, only ever showed as a
      # printed line a reviewer had to notice by hand. ERROR-tier findings
      # now fail the job outright; only the swallow is gone, not the
      # command -- a genuinely warning-only run still exits 0 on its own.
      # T-4269: this step (and the checks after it) used to carry the
      # GitHub Actions default `if: success()`, so a failing windows Test
      # step skipped every step after it -- including this one -- and
      # gates have therefore NEVER actually run on windows, independent of
      # whether the Test step's own failures are real. `matrix.os ==
      # 'windows-latest'` is ADDED to the run condition (not swapped in
      # for `success()`) so ubuntu/macos keep their existing fail-fast
      # behavior unchanged; `!cancelled()` keeps a genuinely cancelled
      # run from still executing this step, which bare
      # `success() || matrix.os == 'windows-latest'` would not exclude.
      - name: frob check (self-gate)
        if: ${{ !cancelled() && (success() || matrix.os == 'windows-latest') }}
        run: uv run frob check
      # T-1265: `.frob/coverage-stamp` and `.frob/baseline` are gitignored
      # (.gitignore:21,:72) and never restored in a fresh CI checkout, so
      # TEST005/006 (per-symbol/per-module coverage floors) are
      # structurally inert here -- CI has no fresh coverage measurement to
      # check them against, and `frob check` above cannot fail a job on a
      # signal it never had. `frob-coverage.lock.json` (T-0545) is the one
      # coverage-derived channel that IS committed and travels with the
      # diff; TEST012 (its own drift check) is WARN-severity by design
      # (frob.gates._coverage's `stamp_coverage` docstring), so it would
      # not fail the self-gate step above even with the swallow removed.
      # This step promotes exactly that one check to a hard CI failure --
      # the narrowest of T-1265's three suggested fixes, chosen because it
      # is the only one that needs no fresh .frob state to evaluate.
      - name: frob-coverage.lock.json must not be missing or drifted (TEST012)
        run: |
          uv run frob check --only test --json > /tmp/frob-test-check.json
          uv run python -c "
          import json, sys
          report = json.load(open('/tmp/frob-test-check.json'))
          hits = [
              d
              for result in report.get('results', [])
              for d in result.get('diagnostics', [])
              if d.get('code') == 'TEST012'
          ]
          for d in hits:
              print(f\"{d.get('file', '?')}: {d.get('message', '')}\")
          if hits:
              print('::error::frob-coverage.lock.json is missing or drifted (TEST012) -- run: uv run frob coverage --full')
          sys.exit(1 if hits else 0)
          "
      # T-1366 (T-1265 successor): the step above only checks the ONE
      # committed coverage channel (frob-coverage.lock.json's rounded
      # summary). `.frob/coverage-stamp` and `.frob/baseline` are
      # gitignored and never restored here, so TEST005/006 (per-symbol/
      # per-module coverage floors) and `--delta` baseline filtering stay
      # structurally inert in CI -- a fresh checkout has no stamp/baseline
      # to check them against, so `frob check` above cannot fail on a
      # signal it never had, and neither an ABSENT nor a TAMPERED stamp
      # is distinguishable from "never measured" without this step. This
      # step produces a REAL, fresh stamp/baseline in the CI runner
      # itself (never trusts one carried in from the checkout -- there is
      # none, by design) and then fails the build if either one is
      # missing, stale (content-hash mismatch against the tree that
      # produced it, `is_stamp_stale`/`is_baseline_stale` -- the same
      # signal that catches tampering, since a hand-edited stamp cannot
      # reproduce a matching content hash either), or if a fresh TEST005/
      # TEST006 evaluation against it still finds a violation.
      # T-3747: gated to ubuntu-latest ONLY. Coverage is platform-
      # independent (the committed frob-coverage.lock.json is a single
      # Linux-measured baseline), so running the full suite a SECOND time
      # under coverage on macos and windows was pure duplication of the
      # Test step's own suite run -- and on windows the -p no:xdist serial
      # suite is already the job's long pole. Reconcile/doctor/stamp-
      # baseline are all repo-state, platform-independent, so the whole
      # step belongs on one leg. See T-3748 for the deeper reuse (run the
      # suite once WITH --cov in the Test step and stamp from that).
      # T-3756: REVERT of T-3748. T-3748 had this step stop re-running the
      # suite under coverage, relying on the ubuntu Test step's
      # `frob coverage --full --fail-on-degraded` run to produce
      # coverage.xml + .frob/coverage-stamp. That coupled ubuntu's pass/fail
      # gate to coverage-sensitivity (see the Test step's own comment above).
      # This step now re-runs `frob coverage --full` itself, as a SEPARATE,
      # non-blocking best-effort measurement: `continue-on-error: true` on
      # the step means a degraded/failed coverage run never reds the build,
      # and the command itself drops `--fail-on-degraded` (measurement, not
      # a gate). FROB_COVERAGE_MAX_WORKERS/WALLCLOCK_DEADLINE_S are restored
      # here (they still cap the coverage-instrumented pool's memory and give
      # it room to finish, T-3747) since this step is once again the one
      # actually running the suite under coverage.
      - name: coverage stamp + delta baseline must be freshly measurable and clean (T-1366)
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
        env:
          FROB_COVERAGE_MAX_WORKERS: "2"
          FROB_COVERAGE_WALLCLOCK_DEADLINE_S: "7200"
        run: |
          uv run frob coverage --full
          uv run frob ticket reconcile --apply
          uv run frob doctor
          # T-3740: a single bare `--stamp-baseline` (no --only) runs every
          # gate chunk in one process and always (re)stamps .frob/baseline.
          # The previous hand-maintained `--only <group>` enumeration
          # duplicated _stamp_baseline_gate_chunks() and silently desynced:
          # it covered only 40 of 68 expected gate-ids (missing
          # win32_kill_signal, gates_schema, arch_schema, ... added since),
          # so `covered < expected_union` stayed true forever, stamp_baseline
          # was never called, every command exited 0, and .frob/baseline was
          # never written -- caught only by the assertion below. Chunking
          # exists solely for the agent foreground cap (T-0751), which does
          # not apply to CI (this is the documented coordinator-only path).
          uv run frob check --stamp-baseline
          uv run frob check --only test --json > /tmp/frob-test-recheck.json
          uv run python -c "
          import json, sys
          from pathlib import Path
          from frob.gates._coverage import load_stamp, is_stamp_stale
          from frob.gates._baseline import load_baseline, is_baseline_stale

          root = Path('.')
          failures = []

          stamp = load_stamp(root)
          if stamp is None:
              failures.append('.frob/coverage-stamp is missing after a fresh frob coverage --full run')
          elif is_stamp_stale(root, stamp):
              failures.append('.frob/coverage-stamp is stale (content-hash mismatch) immediately after stamping -- tampered or a stamp/measurement race')

          baseline = load_baseline(root)
          if baseline is None:
              failures.append('.frob/baseline is missing after a fresh frob check --stamp-baseline run')
          elif is_baseline_stale(root, baseline):
              failures.append('.frob/baseline is stale (content-hash mismatch) immediately after stamping -- tampered or a stamp/measurement race')

          report = json.load(open('/tmp/frob-test-recheck.json'))
          hits = [
              d
              for result in report.get('results', [])
              for d in result.get('diagnostics', [])
              if d.get('code') in ('TEST005', 'TEST006') and d.get('severity') == 'error'
          ]
          for d in hits:
              failures.append(f\"{d.get('code')}: {d.get('file', '?')}: {d.get('message', '')}\")

          for f in failures:
              print(f'::error::{f}')
          sys.exit(1 if failures else 0)
          "

  # Locks the T-0133 degrade contract: a bare `pip install`/`uv tool
  # install` of the frob wheel (NO frob-core, NO strata-core -- exactly what
  # `uv tool install frob` gets before `make install-tool`) must never
  # crash. This is a separate job (no Rust toolchain, no `make core`) so a
  # regression like T-0077/T-0133's original module-level `import
  # strata_core` gets caught here even if the main `build` job's native
  # extensions mask it.
  standalone-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: ${{ env.UV_VERSION }}
      # T-3935: frob-core/strata-core are hard `==`-pinned DEFAULT deps
      # (T-3845) and neither is published to any registry, so a plain
      # `uv pip install dist/*.whl` resolve reaches out to PyPI for them
      # and fails outright ("frob-core was not found in the package
      # registry"; measured in CI run 34005559354). This job's own point
      # is to prove a BARE install (no Rust toolchain, no `make core`,
      # unlike the `build` job) still works, so the cores are built here
      # via maturin directly rather than reusing `build`'s native step --
      # keeping this job self-contained and not adding a cross-job
      # artifact dependency for a single ubuntu-only smoke check.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, resolved 2026-09-05
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
      - name: Print resolved toolchain versions (T-4338)
        shell: bash
        run: |
          {
            echo '## Resolved toolchain versions (T-4338, standalone-install)'
            echo '```'
            echo "uv:      $(uv --version)"
            echo "rustc:   $(rustc --version)"
            echo "cargo:   $(cargo --version)"
            echo "maturin: pinned ${{ env.MATURIN_VERSION }} (see maturin-action steps below)"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Build frob-core wheel (abi3-py311, local find-links only)
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: frob-core
          args: --release --out dist
          maturin-version: ${{ env.MATURIN_VERSION }}
      - name: Build strata-core wheel (abi3-py311, local find-links only)
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: strata-core
          args: --release --out dist
          maturin-version: ${{ env.MATURIN_VERSION }}
      - name: Build the bare wheel (no native extras)
        run: uv build --wheel
      # T-3935: `--find-links` points the resolver at the just-built core
      # wheels INSTEAD OF a registry -- the pin is honoured (still exact
      # `==0.530.0`, still resolved for real) but satisfied locally, since
      # neither core is published anywhere yet.
      - name: Install into a clean venv
        run: |
          uv venv /tmp/frob-standalone-venv
          uv pip install --python /tmp/frob-standalone-venv/bin/python \
            dist/*.whl \
            --find-links frob-core/dist \
            --find-links strata-core/dist
      - name: frob --help must not crash without native extensions
        run: /tmp/frob-standalone-venv/bin/frob --help
      # T-0135 moved sys_gate's `from frob.strata import load_design_ids`
      # (and _design_dir's own `frob.strata` import) to after the
      # design/-directory opt-in check, and T-0134 guarded frob.strata's
      # remaining strata_core call sites to degrade to a typed Err instead
      # of crashing -- so this step now hard-fails on any traceback.
      - name: frob check on a tiny fixture repo must not crash
        run: |
          set -e
          fixture=/tmp/frob-standalone-fixture
          rm -rf "$fixture" && mkdir -p "$fixture/src/demo"
          cd "$fixture"
          git init -q
          printf '"""Empty demo package."""\n' > src/demo/__init__.py
          printf 'module m\nnode n : trusted {\n}\n' > src/demo/x.strata
          # Exit code is not asserted: a real repo can legitimately fail
          # gates (missing tickets, coverage stamp, ...). What this step
          # locks down is that the process itself does not crash with an
          # unhandled exception/traceback when strata-core and frob-core
          # are both absent -- grep the output for the traceback marker
          # Python always emits on an uncaught exception.
          output="$(/tmp/frob-standalone-venv/bin/frob check 2>&1)" || true
          echo "$output"
          if echo "$output" | grep -q "^Traceback (most recent call last):"; then
            echo "::error::frob check crashed with an unhandled exception in a natives-less install"
            exit 1
          fi
