        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Continue'
          $fixture = Join-Path $env:RUNNER_TEMP "frob-diag-fixture"
          $codeLines = @(
            'print("diag-python-alive", flush=True)',
            "import faulthandler",
            "import os",
            "import signal",
            "import sys",
            "import traceback",
            "",
            "# T-3670: skip frob.gates's ProcessPoolExecutor preload entirely",
            "# (src/frob/process/_guard.py::pool_preload_enabled) -- set",
            "# BEFORE importing frob.__main__ so no earlier import-time code",
            "# path can construct the pool first.",
            "os.environ['FROB_DISABLE_POOL_PRELOAD'] = '1'",
            "os.environ['FROB_WIN32_SPAWN_DEBUG'] = '1'",
            "",
            "def _t3670_log_signal(signum, frame):",
            "    try:",
            "        name = signal.Signals(signum).name",
            "    except ValueError:",
            "        name = repr(signum)",
