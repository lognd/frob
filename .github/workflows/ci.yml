name: ci

# The dev channel (docs/design/releases.md section 5) is the last two jobs of this workflow:
# `dev-artifacts` and `dev-publish` run only on a push to a branch in the gate's list, of this
# repository, after every test job passed. It is not a `workflow_run` workflow: GitHub fires
# those only from the default branch's copy of the file.

on:
  push:
    branches: [main, experimental]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Cost controls (~BN7DCP3, audit M18):
# - Superseded runs are cancelled per JOB, not per workflow: a workflow-level
#   `cancel-in-progress` would also kill a `dev-publish` that is mid-upload, and a half-published
#   release must finish (dev-publish keeps its own queue-never-cancel group). Every group is
#   `<workflow>-<ref>-<job>`, so a second push to the same ref cancels the earlier run's jobs.
# - A first `changes` job maps the diff to job sets. It is a job-level filter, not a workflow
#   `paths:` filter: a workflow that never starts leaves the commit with no checks at all, and
#   the land gate (crates/frob-land/src/base_ci.rs) reads no checks as Unresolved. A skipped job
#   counts as passing, so every commit still carries a verdict.
# - Workspace crates are cached across runs by sccache (GitHub Actions cache backend), which
#   keys on content, not mtime; a fresh checkout stamps every source file with the checkout time,
#   so cargo's own fingerprints (and rust-cache of target/) rebuild every workspace crate.

jobs:
  # Decides whether the Rust jobs run. A push is diffed against the head of the newest
  # SUCCESSFUL ci run on the branch (a cancelled or failed run never becomes the base, so code a
  # superseded run did not finish testing is still seen); a pull request against its base sha.
  # Anything unreadable runs everything.
  changes:
    name: changes (which job sets run)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      EVENT: ${{ github.event_name }}
      REF_NAME: ${{ github.ref_name }}
      SHA: ${{ github.sha }}
      PR_BASE: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Map the diff to job sets
        id: diff
        shell: bash
        run: |
          # Paths no Rust job reads. docs/guides, docs/crunk, docs/reference and docs/schemas are
          # read by tests or by the generated-file check, so they are NOT here.
          prose='^(tickets/|changelog\.d/|notes/|docs/(design|decisions|migration)/)'
          if [ "$EVENT" = "pull_request" ]; then
            base="$PR_BASE"
          else
            base=$(gh run list --repo "$REPO" --workflow ci.yml --branch "$REF_NAME" --status success --limit 1 --json headSha --jq '.[0].headSha // empty' || true)
          fi
          rust=true
          if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            if files=$(git diff --name-only "$base" "$SHA"); then
              # Files outside the prose set; none left means no Rust job can be affected.
              rest=$(printf '%s\n' "$files" | grep -Ev "$prose" | grep -v '^$' || true)
              if [ -z "$rest" ]; then
                rust=false
              fi
              echo "diff base $base: Rust-relevant files: ${rest:-none}"
            fi
          else
            echo "no usable diff base (${base:-none}); running everything"
          fi
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "rust jobs: $rust"

  # The cheap job a prose-only push gets instead of the Rust pipeline: typos over the whole tree
  # from a prebuilt binary (no compile). It always runs, so a commit always carries a verdict and
  # the dev jobs have a job to wait for; the rust job runs the same check on code pushes.
  docs:
    name: docs (spelling)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install uv (runs the prebuilt typos wheel)
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # The pin equals gob_dev::ci::TYPOS_VERSION (a prebuilt wheel, so nothing compiles here).
      - name: typos (spelling)
        run: uvx typos==1.50.3

  rust:
    name: rust (${{ matrix.os }})
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-rust-${{ matrix.os }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          # `dev` is the cargo alias that runs the CI tool: the shared target dir on Linux, an
          # isolated one on Windows (a running gob-dev.exe cannot be rebuilt in place).
          - os: ubuntu-latest
            dev: dev
          - os: windows-latest
            dev: dev-isolated
    defaults:
      run:
        shell: bash
    env:
      DEV: ${{ matrix.dev }}
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # frob reads the ledger ref and diffs against origin/experimental.
          fetch-depth: 0
      # frob:accept TOOL002 because="sccache has no maintained first-party action; pinned by commit sha"
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
          rustup default "$channel"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: nextest
      # The tests need a python3 on PATH; pytest itself comes from uv (pip is refused on PEP 668 hosts).
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
      - name: Install uv (pytest step, zizmor and actionlint tool stages)
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # frob:accept TOOL002 because="a local composite action must be addressed with ./; actionlint rejects the $/ form zizmor suggests"
      - uses: ./.github/actions/install-linker
      - name: Install the Windows cross-check target (clippy-windows step)
        if: runner.os == 'Linux'
        run: rustup target add x86_64-pc-windows-gnu
      - name: Install the MinGW C compiler (libsqlite3-sys for clippy-windows)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y gcc-mingw-w64-x86-64
      # Every check below is `cargo $DEV ci --step <name>` on both OSes (`cargo dev` on Linux,
      # `cargo dev-isolated` on Windows, from the matrix: a running gob-dev.exe cannot be rebuilt,
      # so the tool lives in target/dev-tool there), or a literal `cargo dev ci --step <name>` for
      # a Linux-only check: the argv, flags and environment live in crates/gob-dev/src/ci.rs, so
      # `cargo dev ci` locally runs exactly this list.
      # crates/gob-dev/tests/ci_parity.rs fails when the two diverge.
      - name: rustfmt
        run: cargo $DEV ci --step fmt
      - name: clippy
        run: cargo $DEV ci --step clippy
      - name: clippy for the Windows target
        if: runner.os == 'Linux'
        run: cargo dev ci --step clippy-windows
      - name: Docs
        run: cargo $DEV ci --step docs
      - name: Install pinned pytest with uv (pytest-backed tests must not skip)
        run: cargo $DEV ci --step pytest
      - name: Install cargo-insta (nextest step runs through it)
        run: cargo install --locked cargo-insta --version 1.48.0
      - name: Snapshot hygiene (no pending snapshot files)
        if: runner.os == 'Linux'
        run: cargo dev ci --step snapshots
      - name: nextest
        run: cargo $DEV ci --step nextest
      - name: Generated files are current (GEN001)
        run: cargo $DEV ci --step gen
      - name: Make the ledger ref resolvable
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Pull requests check out a detached merge commit; frob needs the
          # [tickets] ref (refs/heads/experimental) as a local branch.
          if ! git rev-parse --verify -q refs/heads/experimental >/dev/null; then
            git fetch --no-tags origin '+refs/heads/experimental:refs/remotes/origin/experimental'
            git update-ref refs/heads/experimental refs/remotes/origin/experimental
          fi
      - name: Fetch zizmor (version from frob.toml)
        if: runner.os == 'Linux'
        run: cargo dev ci --step zizmor
      - name: Fetch actionlint (version from frob.toml)
        if: runner.os == 'Linux'
        run: cargo dev ci --step actionlint
      - name: Install cargo-deny (deny step)
        if: runner.os == 'Linux'
        run: cargo install --locked cargo-deny --version 0.19.9
      - name: Install cargo-shear (shear step)
        if: runner.os == 'Linux'
        run: cargo install --locked cargo-shear --version 1.14.0
      - name: Install typos (typos step)
        if: runner.os == 'Linux'
        run: cargo install --locked typos-cli --version 1.50.3
      - name: cargo-deny (advisories, licenses, bans, sources)
        if: runner.os == 'Linux'
        run: cargo dev ci --step deny
      - name: cargo-shear (unused dependencies)
        if: runner.os == 'Linux'
        run: cargo dev ci --step shear
      - name: typos (spelling)
        if: runner.os == 'Linux'
        run: cargo dev ci --step typos
      # No MSRV step while `rust-version` is the pinned toolchain (the same compiler, a second
      # full workspace check for nothing): `cargo dev ci` adds the `msrv` step back, and the
      # parity test then demands it here, as soon as rust-version drops below the toolchain.
      - name: frob doctor (self-hosted, frob v2 built from this tree)
        if: runner.os == 'Linux'
        run: cargo dev ci --step doctor
      - name: frob check
        if: runner.os == 'Linux'
        run: cargo dev ci --step check
      - name: "frob test selection (dry run, CI holds no lease)"
        if: runner.os == 'Linux'
        run: cargo dev ci --step test-dry-run

  # frob:ticket 01M4CS7ZMEY096RVK91RWD03DW
  # Command profile (~RWD03DW, docs/design/build-test-ci.md section 4): `cargo dev profile` times
  # every leaf command of frob, grimble and crunk against the budgets in crates/gob-dev/profile.toml,
  # in a throwaway clone. It runs parallel with the rust job on ubuntu only. The report is uploaded;
  # the deltas against the newest successful experimental report are printed, never blocking. A
  # budget breach fails the job, and the dev jobs wait for every test job, so it holds the dev channel.
  profile:
    name: profile (command budgets)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    timeout-minutes: 60
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-profile
      cancel-in-progress: true
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # The throwaway clone copies every branch; frob reads the ledger ref from it.
          fetch-depth: 0
      # frob:accept TOOL002 because="sccache has no maintained first-party action; pinned by commit sha"
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal
          rustup default "$channel"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # frob:accept TOOL002 because="a local composite action must be addressed with ./; actionlint rejects the $/ form zizmor suggests"
      - uses: ./.github/actions/install-linker
      - name: Make the ledger ref resolvable
        shell: bash
        run: |
          if ! git rev-parse --verify -q refs/heads/experimental >/dev/null; then
            git fetch --no-tags origin '+refs/heads/experimental:refs/remotes/origin/experimental'
            git update-ref refs/heads/experimental refs/remotes/origin/experimental
          fi
      - name: Fetch the newest successful experimental report (optional baseline)
        shell: bash
        run: |
          mkdir -p target/profile/base
          run_id=$(gh run list --repo "$REPO" --workflow ci.yml --branch experimental --status success --limit 1 --json databaseId --jq '.[0].databaseId' || true)
          if [ -n "$run_id" ]; then
            gh run download "$run_id" --repo "$REPO" --name profile-report --dir target/profile/base || echo "run $run_id has no profile-report artifact"
          else
            echo "no successful experimental run to compare against"
          fi
      # GitHub runners are slower than the machines the budgets were seeded on: the factor is the headroom.
      - name: Profile every command
        run: cargo dev profile --budget-factor 2 --compare target/profile/base/report.json
      - name: Upload the report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: profile-report
          path: target/profile/report.json
          if-no-files-found: warn

  # Dev channel: build and smoke are the shared reusable workflow (also called by release.yml):
  # the matrix, the pinned dist and the smoke steps have one source there. No wheels are built
  # here (`wheels: false`), and no secrets are passed. The called jobs run only `contents: read`,
  # capped by this job's permissions. The checkout is the tested sha, never a branch. The gate
  # (push, this repository, a dev branch) is repeated on dev-publish; a skipped dev-artifacts
  # skips it as well. To add a dev branch, add its ref to the list in both `if` lines.
  # The throttle: the dev channel is rebuilt at most once an hour (the 5-target build is the most
  # expensive thing this workflow does, and lands arrive every few minutes). A skipped rust job
  # (a prose-only push) skips this and everything after it; an unreadable release state builds.
  dev-gate:
    name: dev gate (at most one dev build an hour)
    needs: [changes, docs, rust, profile]
    if: ${{ github.event_name == 'push' && github.repository == 'lognd/frob' && contains(fromJSON('["refs/heads/experimental"]'), github.ref) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      build: ${{ steps.throttle.outputs.build }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Skip when the dev prerelease was refreshed within the hour
        id: throttle
        shell: bash
        run: |
          newest=$(gh release view dev --repo "$REPO" --json assets --jq '[.assets[].createdAt] | max // empty' 2>/dev/null || true)
          build=true
          if [ -n "$newest" ] && then_s=$(date -d "$newest" +%s 2>/dev/null); then
            age=$(( $(date +%s) - then_s ))
            echo "newest dev asset is $age s old"
            if [ "$age" -lt 3600 ]; then build=false; fi
          else
            echo "no readable dev asset time; building"
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"

  dev-artifacts:
    name: dev artifacts (build and smoke)
    needs: [changes, docs, rust, profile, dev-gate]
    if: ${{ github.event_name == 'push' && github.repository == 'lognd/frob' && contains(fromJSON('["refs/heads/experimental"]'), github.ref) && needs.dev-gate.outputs.build == 'true' }}
    # frob:accept TOOL002 because="actionlint accepts only ./ for a local reusable workflow; zizmor suggests $/, which actionlint rejects"
    uses: ./.github/workflows/build-smoke.yml
    permissions:
      contents: read
    with:
      ref: ${{ github.sha }}
      wheels: false

  # The only job that can write. It runs only when every build job (and its
  # smoke) passed, so a failed build never touches `dev`. Replacement is
  # add-then-prune: the new assets carry the tested sha in their names, so
  # they never collide with the previous ones; they are uploaded first, the
  # tag and notes move next, and the previous assets are deleted last. A run
  # that fails before the prune removes only the assets it uploaded itself (a
  # recorded list, never a match by sha) and leaves the previous assets in place.
  dev-publish:
    name: publish (replace the dev prerelease assets)
    needs: [changes, docs, rust, profile, dev-gate, dev-artifacts]
    if: ${{ github.event_name == 'push' && github.repository == 'lognd/frob' && contains(fromJSON('["refs/heads/experimental"]'), github.ref) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Queue, never cancel: a half-published release must finish.
    concurrency:
      group: dev-channel
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SHA: ${{ github.sha }}
    steps:
      - name: Name the tested commit
        shell: bash
        run: echo "SHORT=${SHA:0:12}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: archives-*
          path: archives
          merge-multiple: true
      - name: Name the archives after the tested sha and checksum them
        shell: bash
        run: |
          mkdir staged
          for f in archives/*; do
            base=$(basename "$f")
            # cargo-dist checksums name the unstaged archive; they are regenerated below.
            case "$base" in *.sha256) continue ;; esac
            # Only the product archives (frob-cli, grimble, crunk) may be published.
            case "$base" in frob-cli-*|grimble-*|crunk-*) ;; *) echo "unexpected file $base" >&2; exit 1 ;; esac
            stem="${base%%.*}"
            new="${stem}-${SHORT}.${base#*.}"
            cp "$f" "staged/$new"
            (cd staged && sha256sum "$new" > "$new.sha256")
          done
          ls -l staged
      - name: Ensure the dev prerelease exists
        id: ensure
        shell: bash
        run: |
          if gh release view dev --repo "$REPO" >/dev/null 2>&1; then
            echo "fresh=false" >> "$GITHUB_OUTPUT"
          else
            gh release create dev --repo "$REPO" --prerelease --target "$SHA" \
              --title "frob dev" --notes "dev channel: creating"
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload the new assets (additive; a name already on the release is skipped)
        shell: bash
        run: |
          # Existing names (same sha from an earlier run) are never overwritten, deleted or
          # re-added. A name is recorded before its upload starts, so the failure cleanup
          # removes exactly what this run may have created and nothing else.
          : > "$RUNNER_TEMP/uploaded.txt"
          existing=$(gh release view dev --repo "$REPO" --json assets --jq '.assets[].name')
          for f in staged/*; do
            name=$(basename "$f")
            if printf '%s\n' "$existing" | grep -Fxq "$name"; then
              echo "skip $name: already on the release for this sha"
              continue
            fi
            echo "$name" >> "$RUNNER_TEMP/uploaded.txt"
            gh release upload dev --repo "$REPO" "$f"
          done
      - name: Move the dev tag to the tested commit
        shell: bash
        run: |
          # A ref update that carries a change under .github/workflows (the diff between the old
          # tag target and the tested sha) is refused to the job token with 403 "Resource not
          # accessible by integration": the `workflows` permission cannot be granted to
          # GITHUB_TOKEN (docs.github.com/en/rest/releases/releases). Releases the same token
          # creates are not refused, so on that refusal the tag ref (never the release or its
          # assets) is deleted, which drafts the release, and publishing it again with
          # --target recreates the tag at the tested sha through the Releases API.
          if gh api -X PATCH "repos/$REPO/git/refs/tags/dev" -f sha="$SHA" -F force=true; then
            echo "dev tag moved in place"
          else
            echo "::warning::in-place tag move refused; recreating the dev tag through the release"
            gh api -X DELETE "repos/$REPO/git/refs/tags/dev"
            gh release edit dev --repo "$REPO" --draft=false --prerelease --target "$SHA"
          fi
          tagged=$(gh api "repos/$REPO/git/ref/tags/dev" --jq '.object.sha')
          if [ "$tagged" != "$SHA" ]; then
            echo "dev tag is at $tagged, expected $SHA" >&2
            exit 1
          fi
      - name: Name the tested sha in the release notes
        shell: bash
        run: |
          printf 'Development build of %s (commit %s), built after ci succeeded.\nAssets are replaced on every green land; do not rely on them for production.\n' \
            "$SHORT" "$SHA" > notes.md
          gh release edit dev --repo "$REPO" --prerelease --title "frob dev ($SHORT)" --notes-file notes.md
      - name: Prune the previous assets (last, so a failure above keeps them)
        id: prune
        shell: bash
        run: |
          gh release view dev --repo "$REPO" --json assets --jq '.assets[].name' | while read -r name; do
            case "$name" in
              *"-${SHORT}."*) ;;
              *) gh release delete-asset dev "$name" --repo "$REPO" --yes ;;
            esac
          done
      - name: Remove this run's own uploads (previous assets stay)
        if: ${{ failure() && steps.prune.outcome == 'skipped' }}
        shell: bash
        run: |
          # Only names recorded by this run's upload step; never matched by sha.
          if [ -f "$RUNNER_TEMP/uploaded.txt" ]; then
            while read -r name; do
              [ -n "$name" ] && { gh release delete-asset dev "$name" --repo "$REPO" --yes || true; }
            done < "$RUNNER_TEMP/uploaded.txt"
          fi
