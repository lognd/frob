name: ci

on:
  push:
    branches: [main, experimental]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          # frob reads the ledger ref and diffs against origin/experimental.
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
          rustup default "$channel"
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Install mold (linux linker)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mold clang
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo nextest run --profile ci
      - name: Generated files are current (GEN001)
        run: cargo dev gen all --check
      - name: Make the ledger ref resolvable
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Pull requests check out a detached merge commit; frob needs the
          # [tickets] ref (refs/heads/experimental) as a local branch.
          if ! git rev-parse --verify -q refs/heads/experimental >/dev/null; then
            git fetch --no-tags origin '+refs/heads/experimental:refs/remotes/origin/experimental'
            git update-ref refs/heads/experimental refs/remotes/origin/experimental
          fi
      - name: frob doctor (self-hosted, frob v2 built from this tree)
        if: runner.os == 'Linux'
        run: cargo run -p frob-cli -- doctor
      - name: frob check
        if: runner.os == 'Linux'
        run: cargo run -p frob-cli -- check
      - name: frob test selection (dry run: CI holds no lease)
        if: runner.os == 'Linux'
        run: cargo run -p frob-cli -- test --base origin/experimental --dry-run
      - name: Docs
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --all-features
