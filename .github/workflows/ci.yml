            exit 1
          }
          Write-Host "direct-python diag: no hang (returned in $($elapsed.TotalSeconds)s) -- exit code $exitCode is an ordinary gate result, not a failure of this diagnostic step. If this variant is CLEAN of T-3648-SIGNAL while variant (a) still gets it, uv is the sender."
          exit 0

      # T-3670 (round 16): variant (d) tests suspect 1 -- frob.gates's
      # ProcessPoolExecutor preload. Same invocation shape as variant (a)
