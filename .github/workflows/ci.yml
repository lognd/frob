name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            frob-core/target
            strata-core/target
          key: cargo-${{ hashFiles('frob-core/Cargo.lock', 'strata-core/Cargo.lock') }}
      - name: Sync deps
        run: uv sync --all-extras --all-groups
      - name: Build native extensions (frob-core + strata-core, Rust/PyO3)
        run: make core
      - name: cargo test (frob-core kernels)
        run: cd frob-core && cargo test --lib
      - name: cargo test (strata-core kernels)
        run: cd strata-core && cargo test --lib
      - name: Lint
        run: uv run ruff check src tests
      - name: Typecheck
        run: uv run ty check src
      - name: Test
        run: uv run pytest -q
      - name: frob check (self-gate)
        run: uv run frob check || echo "::warning::frob check reported findings"
