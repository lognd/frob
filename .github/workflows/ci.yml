name: ci

# T-3922: every third-party `uses:` in this file is pinned to a 40-hex
# commit SHA with a trailing version comment; `.github/dependabot.yml`
# (github-actions ecosystem) is the update path -- see the release
# workflow's matching note for why hand-unpinning is never the fix.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # T-3425: windows-latest is ADVISORY ONLY (continue-on-error) until
    # T-3076's 278 Windows-only failures (five missing POSIX primitives:
    # fcntl, os.sysconf, AF_UNIX, fork context, charmap codec) are drained.
    # Without this, ci.yml's overall conclusion is RED on every push
    # regardless of ubuntu/macOS health, so scripts/verify_release_ci_status.py
    # (T-3251) can never resolve GREEN and every release needs the
    # override_red_ci escape hatch -- making the escape hatch the normal
    # path instead of an exception (PLATFORM001 doctrine: declare the
    # boundary, never silently degrade). The job still runs and reports on
    # every push -- the signal is kept for measuring the T-3076 burn-down --
    # it just no longer flips the workflow conclusion. Remove this flag
    # when T-3076's failure set reaches zero.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    # T-3192: a hanging job used to produce NO failure signal at all -- the
    # owner cancelled run 33135896391 by hand after 54 minutes, and runs
    # 33032904841/32968539246 (2h40m) sit in history as `cancelled`, never
    # `failure`, because nothing here ever timed the JOB out on its own
    # (GitHub's own default ceiling is 6 hours). This backstops the
    # per-step `timeout -s ABRT` below (which targets the Test step
    # specifically, with a stack dump) -- a belt-and-braces ceiling in
    # case a hang lands in a DIFFERENT step (Sync deps, native build,
    # ...) that isn't individually wrapped. Budget: the slowest OBSERVED
    # full-job completion in this matrix is macOS's ~23 minutes for the
    # Test stage alone (run 33135896391).
    #
    # T-3426: raised 45 -> 60 alongside the ubuntu Test step's own
    # 25m -> 40m raise below, so the step budget (with its stack dump)
    # remains the thing that fires first on a genuine hang rather than
    # this job-level ceiling -- 60 minutes keeps a >2x margin over the
    # 40-minute step budget without leaving a hang to run for hours
    # before anyone notices.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, resolved 2026-09-05
      # T-3980: the cache key MUST include runner.os (and arch, since
      # macos-latest can move between arm64/x86_64 runners) -- this path
      # covers frob-core/target and strata-core/target, which is where
      # `maturin build` drops target/wheels/*.whl. Without an os/arch
      # component every matrix leg shares ONE cache entry, so whichever
      # job finishes first (observed: macos-latest) writes its
      # platform-tagged wheels into a cache the ubuntu-latest leg then
      # restores verbatim -- test_artifact_smoke.py's serve-extra checks
      # then resolve against `strata-core` wheels tagged
      # `macosx_11_0_arm64` on an x86_64 Linux runner and fail with a
      # uv "no wheels with a matching platform tag" resolver error that
      # has nothing to do with the artifact under test.
      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            frob-core/target
            strata-core/target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frob-core/Cargo.lock', 'strata-core/Cargo.lock') }}
      - name: Sync deps
        run: uv sync --all-extras --all-groups
      - name: Build native extensions (frob-core + strata-core, Rust/PyO3)
        run: make core
      - name: cargo test (frob-core kernels)
        run: cd frob-core && cargo test --lib
      - name: cargo test (strata-core kernels)
        run: cd strata-core && cargo test --lib
      - name: Lint
        run: uv run ruff check src tests
      - name: Typecheck
        run: uv run ty check src
      # T-3192: a hanging Test step used to produce no failure signal beyond
      # the job-level timeout-minutes backstop above -- a bare timeout kills
      # the job with a red X and NO information about where it was wedged,
      # barely better than the manual cancellations in this repo's own CI
      # history (runs 33135896391/33032904841/32968539246, all on
      # ubuntu-latest). `timeout -s ABRT` (not the default SIGTERM) plus
      # `PYTHONFAULTHANDLER=1` makes Python's built-in fault handler dump
      # every live thread's stack to stderr the instant the budget is hit,
      # before the process dies -- the exact recipe this repo already uses
      # for local hang diagnosis (see docs/modules/testing.md's SIGUSR1
      # stack-dump handler and the `PYTHONFAULTHANDLER=1 timeout -s ABRT N`
      # local recipe). `timeout` is GNU coreutils and only reliably present
      # on the ubuntu-latest runner's bash (not Windows' default pwsh, and
      # not macOS's BSD userland), so ubuntu keeps the GNU form directly.
      #
      # T-3250: run 33169097371 (job 98841565692, macos-latest) FALSIFIES
      # the premise this comment used to state here ("windows/macos have
      # never hung in this matrix's own history") -- macOS hung at 99% for
      # 10m49s of total silence and produced ZERO diagnostics, because the
      # step below used to be an uninstrumented `uv run pytest -q` for
      # every non-Linux platform. macOS and Windows now get the same
      # stack-dump-on-hang standard as ubuntu, using shell/pwsh builtins
      # (`kill -ABRT` / `Wait-Process`) in place of GNU `timeout`, which
      # remains genuinely absent from both userlands.
      #
      # Budget: macOS's own Test stage completed in ~23 minutes when it
      # last ran cleanly (run 33135896391) and ubuntu's Test step, when it
      # fails outright rather than hanging, finishes within the ~15-minute
      # whole-job budget (run 33035660969) -- 25 minutes gave the slower
      # platform's own observed ceiling a small margin without leaving a
      # genuine hang to run anywhere near the (then-)45-minute job timeout
      # above.
      #
      # T-3426: run 33277131782 (HEAD bb5c28203, 2026-08-29) proved 25m
      # is too tight for a PASSING ubuntu run, not just a hung one -- the
      # suite reached 99% at ~20m and was still inside two whole-repo
      # self-scan tests' bodies (not blocked on a lock) when the 25m
      # `timeout -s ABRT` fired at 22:18:23, killing a run that would have
      # finished. macOS (more cores) completed the identical suite in
      # 18m31s in the SAME run, so this was ubuntu's own budget being too
      # tight on its slow self-scan tail at that point, not the T-3420
      # SIGTERM deadlock (this invocation runs without coverage). Raised
      # 25m -> 40m to clear that tail with real margin; macOS/Windows
      # were left unchanged at the time, since macOS's own 18.5m run
      # showed no equivalent problem there YET.
      #
      # T-3482: the suite kept growing (12816 tests by 2026-08-30) and
      # macOS's own 25m budget went stale the same way -- run 33308245923
      # was killed at [67%] mid-run, not hung, with two prior CLEAN macOS
      # runs already at 24m/28m. Raised 25m -> 40m here too, matching
      # ubuntu's own T-3426 raise, so the two platforms cannot drift
      # apart again (both now share the 40m/2400s budget). Windows stays
      # unchanged (advisory only, T-3425). A follow-up ticket (not this
      # one) should make the self-scan tests share one cached graph per
      # session so the tail stops costing minutes per test on every
      # platform -- these budget raises only stop CI from killing a
      # passing-but-slow run.
      #
      # WHY faulthandler_timeout=100 / --timeout=120 (pyproject.toml,
      # pytest-timeout, --timeout-method=thread) did NOT fire during the
      # 649s macOS silence, even though the Windows job's own dumps in
      # this same run ARE stamped by that exact mechanism ("Timeout
      # (0:01:40)"): both are PER-TEST watchdogs armed only while a test
      # is executing. The 99% marker means the last test had already
      # finished; the silence was in session teardown / xdist worker
      # shutdown, a window no per-test timeout structurally reaches. The
      # step-level guards below are what cover that window; per-test hangs
      # remain covered by the pyproject.toml settings as before.
      # T-3756: REVERT of T-3748. T-3748 made ubuntu run the suite ONCE, under
      # coverage, as a combined pass/fail + coverage gate
      # (`frob coverage --full --fail-on-degraded`). Measured across CI runs
      # 33839329030 and 33845970790: this made ubuntu's pass/fail gate
      # coverage-sensitive -- the SAME code that passes macOS's coverage-free
      # `pytest -q` fails reproducibly on ubuntu under coverage instrumentation
      # + the -n2 worker cap (coverage-sensitivity/timing, not a real
      # regression), and `--fail-on-degraded` correctly, but wrongly for this
      # purpose, reds the leg on it. Reverted to a coverage-free `pytest -q`
      # matching macOS's own intent, so ubuntu's pass/fail is measuring the
      # same thing macOS measures. Coverage itself is now a separate,
      # non-blocking best-effort measurement -- see the coverage step below.
      - name: Test (ubuntu, timed with stack-dump-on-hang)
        if: runner.os == 'Linux'
        env:
          PYTHONFAULTHANDLER: "1"
          # T-3755: emit the FULL failing-node-id list (not the first 50 + "and
          # N more") so a platform-drain drive can read the complete failure set
          # from one CI run.
          FROB_TEST_SUITE_RESULT_MAX_NODE_IDS: "500"
        # T-3516: `tee` a copy of the run's own output to a log file so the
        # step below can grep it for `WORKER-CRASH-REPORT:` -- `pipefail`
        # keeps `timeout ... | tee ...`'s own exit code as the real one (a
        # red suite or the ABRT timeout), not tee's always-0 exit, so this
        # step still fails exactly as before.
        run: |
          set -o pipefail
          # T-3776 reverted (T-3777): pytest-rerunfailures 16.6 INTERNALERRORs under xdist on py3.14 (macos), turning a rare flake into a whole-suite abort; flakes are handled by fixing the specific flaky tests instead (T-3775).
          timeout -s ABRT 40m uv run pytest -q 2>&1 | tee /tmp/pytest-ubuntu.log
      # T-3516: collect, do not scatter -- and stay loud even off the raw
      # log: an xdist worker crash today (see tests/conftest.py's
      # `WORKER-CRASH-REPORT:` section, T-3516) is otherwise only visible
      # by scrolling the full Test step's log. `always()` so this still
      # runs (and still reports) on a failing/timed-out Test step, the
      # exact run this exists to make visible without scrolling.
      #
      # T-3531: widened from ubuntu-only to every platform, and from
      # WORKER-CRASH-REPORT-only to ALSO surfacing the SUITE-RESULT /
      # SUITE-RESULT-FAILED block (tests/conftest.py's own per-node-id
      # pass/fail summary) -- previously the failing test set was only
      # readable by scrolling the raw job log, on every platform. Runs
      # under `shell: bash` explicitly (GitHub's hosted Windows runners
      # ship Git Bash, and `RUNNER_TEMP` resolves identically across all
      # three shells) so one step covers all three Test steps' log files
      # rather than three near-duplicate platform-specific steps.
      - name: Surface WORKER-CRASH-REPORT and SUITE-RESULT in step summary (T-3516/T-3531)
        if: always()
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) log=/tmp/pytest-ubuntu.log ;;
            macOS) log=/tmp/pytest-macos.log ;;
            Windows)
              # T-3531: stdout/stderr were captured to two separate files
              # (the Windows Test step's own Start-Process redirection,
              # T-3250) -- concatenate them in the order a reader expects
              # (stdout's SUITE-RESULT lines, then stderr's own tail) into
              # one combined file this step can grep the same way as the
              # other two platforms'.
              log="$RUNNER_TEMP/pytest-combined.log"
              cat "$RUNNER_TEMP/pytest-stdout.log" "$RUNNER_TEMP/pytest-stderr.log" \
                > "$log" 2>/dev/null || true
              ;;
          esac
          if [ -f "$log" ] && grep -q '^WORKER-CRASH-REPORT:' "$log"; then
            {
              echo '## Worker crash report (T-3516)'
              echo '```'
              grep '^WORKER-CRASH-REPORT:' "$log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          # T-3531: NOT `^`-anchored -- pytest's own `-q` progress output
          # ("......[100%]") and the FIRST `SUITE-RESULT:` summary line
          # (tests/conftest.py) print with no newline between them
          # (measured directly off a real run's raw log: both share one
          # timestamped line), so a `^SUITE-RESULT` anchor silently misses
          # exactly that one line. `-o` extracts the matched suffix from
          # wherever it starts, dropping the leading dots/percentage
          # instead of anchoring past them. Every `SUITE-RESULT-FAILED:`
          # line (the per-test failing-set detail, the actual signal this
          # ticket cares about) already starts its own line and matches
          # either way.
          if [ -f "$log" ] && grep -qE 'SUITE-RESULT(-FAILED)?:' "$log"; then
            {
              echo '## Suite result (T-3531)'
              echo '```'
              grep -oE 'SUITE-RESULT(-FAILED)?:.*' "$log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      # T-3250: macOS has bash but not GNU coreutils' `timeout`. `kill -ABRT`
      # is a POSIX shell builtin present in macOS's own bash, so it reaches
      # the same faulthandler dump-then-die mechanism as ubuntu's step
      # without depending on GNU tooling.
      # T-3482: run 33308245923 (macos-latest, HEAD 355eb4468, 2026-08-30)
      # proved 25m is too tight for a PASSING macOS run too, the same
      # class of miss T-3426 fixed for ubuntu -- the suite reached [67%]
      # and was killed by this step's own 1500s watcher at ~11:38 with
      # test_frob_self_model.py::test_sys_gate_zero_violations on the
      # stack, not a hang: the previous two clean macOS runs took 24m
      # (33298117154) and 28m (33303586303) on a suite that has grown to
      # 12816 tests. Raised 25m -> 40m to match ubuntu's own T-3426 raise
      # and give the grown suite the same margin; Windows is unchanged
      # (advisory only, T-3425).
      - name: Test (macos, timed with stack-dump-on-hang)
        if: matrix.os == 'macos-latest'
        env:
          PYTHONFAULTHANDLER: "1"
          # T-3755: emit the FULL failing-node-id list (not the first 50 + "and
          # N more") so a platform-drain drive can read the complete failure set
          # from one CI run.
          FROB_TEST_SUITE_RESULT_MAX_NODE_IDS: "500"
        run: |
          set -uo pipefail
          budget=2400  # 40m, same budget/rationale as ubuntu's step above (T-3426/T-3482)
          # T-3531: process substitution (not a plain `| tee` pipeline) so
          # `$!` below still captures pytest's OWN pid, not tee's -- the
          # SIGABRT-for-a-faulthandler-dump targeting below needs the real
          # pytest process, exactly like ubuntu's own `tee` step but without
          # ubuntu's `timeout`/pipefail shape (macOS has no GNU `timeout`,
          # T-3250) to lean on for that distinction.
          # T-3776 reverted (T-3777): pytest-rerunfailures 16.6 INTERNALERRORs under xdist on py3.14 (macos), turning a rare flake into a whole-suite abort; flakes are handled by fixing the specific flaky tests instead (T-3775).
          uv run pytest -q > >(tee /tmp/pytest-macos.log) 2>&1 &
          pid=$!
          (
            sleep "$budget"
            if kill -0 "$pid" 2>/dev/null; then
              echo "::error::macOS Test step exceeded ${budget}s with no completion (T-3250) -- sending SIGABRT for a PYTHONFAULTHANDLER stack dump before the kill"
              kill -ABRT "$pid" 2>/dev/null || true
              sleep 10
              kill -KILL "$pid" 2>/dev/null || true
            fi
          ) &
          watcher=$!
          wait "$pid"
          status=$?
          kill "$watcher" 2>/dev/null || true
          exit "$status"
      # T-3250: Windows' default `run:` shell is pwsh, which has no `kill
      # -ABRT` equivalent -- there is no portable way for an external
      # process to trigger a SIGABRT-style fault dump in a Windows child.
      # PLATFORM001 doctrine
      # (docs/modules/gates.md#platform001-posix-only-primitive-degrades-silently-t-2919):
      # declare that boundary rather than silently doing nothing. Per-test
      # hangs still get thread-based stack dumps via pytest-timeout's
      # --timeout=120/--timeout-method=thread (proven in run 33169097371 --
      # the Windows job's own dumps are stamped "Timeout (0:01:40)"); this
      # step only closes the teardown-window gap with a TIMED FAILURE and
      # an explicit message, not a stack dump, on that one platform.
      # T-3540: deliberately NOT `-NoNewWindow` any more -- that flag made
      # the child share THIS step's own console, a real (but, per T-3549,
      # NOT the dominant) contributor to Windows-only `KeyboardInterrupt`
      # aborts here; without `-NoNewWindow`, `Start-Process` gives the
      # child its own console/process group instead, so `Stop-Process -Id
      # $p.Id` (the hang-guard's own terminator below) still works
      # identically regardless of which console/process-group the target
      # process is in. Output is redirected to files and replayed with
      # Get-Content once the run finishes (or is force-terminated) since a
      # separate console has nothing live to inherit into this step's log.
      # T-3549: re-measured AFTER T-3540's fix landed (run 33361224273) --
      # the suite still aborted at the SAME ~1% point via the SAME
      # `KeyboardInterrupt` at `threading.py:359`, with no
      # "::error::...exceeded" message (so `Wait-Process` never timed
      # out -- the interrupt is raised INSIDE the pytest process, not
      # delivered externally), ruling console-sharing out as the dominant
      # cause. Root cause (read directly from the installed package):
      # execnet's (pytest-xdist's transport) `Gateway._terminate_
      # execution` (`execnet/gateway_base.py`) calls `_thread.
      # interrupt_main()` on win32 when a worker gateway's channel closes
      # uncleanly and its execution pool has not drained within 5s --
      # exactly this `KeyboardInterrupt`-on-`threading.py` shape,
      # internal to execnet/xdist's own teardown machinery, not this
      # repo's code. `-p no:xdist` below removes xdist (and therefore
      # execnet) from the windows-latest leg entirely, trading Windows'
      # own parallelism for actually completing; ubuntu-latest/macos-
      # latest keep `-n auto --dist=loadgroup` (pyproject.toml addopts)
      # unchanged, since this mechanism has not been observed to misfire
      # on either. Unverified against a real windows-latest run at the
      # time this landed (no local Windows box) -- if the interrupt
      # recurs even single-process, the mechanism above needs revisiting
      # by someone who can reproduce interactively.
      #
      # T-3560 (round 3, TEMPORARY diagnostics): `-p no:xdist` (T-3549) was
      # FALSIFIED as the fix -- run 33367854833 (HEAD e1974b649) still died
      # with the same `KeyboardInterrupt` at `threading.py:1169`
      # (`Thread.join`) at ~4 minutes in, ~1% through collection, plain
      # serial, no execnet in the process at all. `git grep` found zero
      # in-repo senders of CTRL_C_EVENT/interrupt_main/os.kill(SIGINT).
      # `-v --full-trace` plus a win32-only SIGBREAK faulthandler
      # registration in `tests/conftest.py` (both TEMPORARY, T-3560) named
      # the exact hang site: `tests/system/conftest.py`'s win32 `run()`
      # branch (`subprocess.run(..., timeout=100)`), blocked in
      # `subprocess._communicate`'s reader-thread `Thread.join` -- NOT
      # pytest-timeout (T-3577 confirmed: neither of its two handlers
      # (`timeout_sigalrm`, `timeout_timer`) ever raises `KeyboardInterrupt`;
      # `timeout_timer` hard-kills via `os._exit(1)` instead). Root cause
      # (T-3577): `subprocess.run`'s own internal timeout handling calls
      # `process.kill()` on `TimeoutExpired` and then retries
      # `communicate()` a SECOND time with NO timeout to drain remaining
      # output -- if a grandchild process the frob CLI spawned is still
      # holding the inherited stdout/stderr pipe open (Windows
      # `CreateProcess` duplicates ALL inheritable handles into every
      # child it spawns, unlike POSIX close-on-exec), that untimed second
      # `communicate()` blocks forever. Compounding suspect closed in the
      # SAME ticket: `src/frob/process/_lock.py`'s `_msvcrt_acquire_
      # blocking` was an UNBOUNDED same-process-reentrancy-unsafe poll
      # loop -- now bounded, converting a silent forever-hang into a loud,
      # bounded failure. Both T-3560 diagnostics (`-v --full-trace` here
      # and the SIGBREAK handler in `tests/conftest.py`) are REVERTED in
      # this same land per T-3560's own contract; `-p no:xdist` (T-3549)
      # stays, since it is still a real, independent risk-reduction even
      # though it was not the root cause here.
      # T-3582 (round 5): the interrupt SURVIVED T-3577's bounded msvcrt
      # lock + bounded win32 run() wrapper -- run 33385515507 (HEAD
      # 94931dde1) still died with KeyboardInterrupt at [1%]. T-3577's
      # fix only covers tests/system/conftest.py's win32 run() branch;
      # the actual hang site this round is further into collection
      # (tests/integration/, around test_gitlog.py). `-v --full-trace`
      # is re-added here as a PERSISTENT setting (not the T-3560 TEMPORARY
      # kind) while this leg stays advisory -- every future run needs the
      # trace until Windows is actually green; removing it again before
      # then repeats the T-3560 premature-revert mistake.
      # T-3589 (Windows round 6): run 33390218738 (full-trace active)
      # narrowed the hang further than T-3582's round-5 guess -- the
      # interrupt fires while tests/system/conftest.py:182's
      # `proc.communicate(timeout=...)` waits on the suite's FIRST `python
      # -m frob check` child (`test_cli_check.py:67`), not inside pytest's
      # own machinery at all. `frob check` itself hangs on win32 --
      # plausibly it has NEVER completed there (the `standalone-install`
      # job above only ever runs `frob --help`, never a real `frob
      # check`). This step isolates that ONE call, standalone, with a
      # watchdog armed INSIDE the child process (not an external
      # Wait-Process bound, which only proves the OUTER process eventually
      # dies, never names the frame it was stuck in) -- if this hangs, the
      # step's own output names the exact Python frame `frob check` was
      # blocked in on win32, closing the open question T-3582 left
      # unanswered. Runs against a tiny fixture repo (the `standalone-
      # install` job's own recipe, reused rather than re-derived) so a
      # slow REAL repo scan cannot be confused with a genuine hang.
      - name: Diagnose frob check hang on windows (T-3589)
        if: matrix.os == 'windows-latest'
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Continue'  # T-3619 round 9: Stop kills the step on any native stderr
          $fixture = Join-Path $env:RUNNER_TEMP "frob-diag-fixture"
          New-Item -ItemType Directory -Force -Path (Join-Path $fixture "src\demo") | Out-Null
          Set-Content -Path (Join-Path $fixture "src\demo\__init__.py") -Value '"""Empty demo package."""'
          # T-3604 (T-3589 round 7): a bare src/demo/__init__.py with no
          # pyproject.toml makes frob's own project-type detection
          # legitimately yield 'unknown' -- CHECK001, a real gate ERROR,
          # not a hang. Without this file run 33439890956 measured `frob
          # check` COMPLETING in 547ms and still aborting the job (T-3589
          # round 6's fix only addressed the ModuleNotFoundError that
          # hid this). A minimal pyproject.toml lets frob classify the
          # fixture as a real Python project and dispatch an actual
          # language stage, which is what this diagnostic exists to
          # exercise.
          Set-Content -Path (Join-Path $fixture "pyproject.toml") -Value @(
            "[project]",
            'name = "frob-diag-fixture"',
            'version = "0.0.0"',
            'requires-python = ">=3.11"'
          )
          Write-Host "T-3624 breadcrumb: fixture dir + pyproject.toml written"
          Push-Location $fixture
          git init -q
          git -c user.email=ci@frob -c user.name=CI commit --allow-empty -q -m init  # T-3619: fixture needs a HEAD
          Pop-Location
          Write-Host "T-3624 breadcrumb: fixture git init + initial commit done"
          # T-3589: built as a joined array (not a PowerShell here-string)
          # so every line stays a normal, YAML-indented `run:` statement --
          # a here-string's closing `"@` must sit at column 0, which
          # cannot coexist with this block's own required indentation.
          #
          # T-3624 round 10: FIRST line prints a liveness marker before
          # anything else (including the `import faulthandler` itself)
          # so the diag.out file proves the python process at least
          # started -- and the frob.__main__.main() call is wrapped in
          # try/except BaseException, writing the exception's repr +
          # full traceback to diag.out before re-raising, so whatever
          # "frob: interrupted" actually is gets a stack instead of
          # dying silently. T-3648 adds two more diagnostics: a SIGINT/
          # SIGBREAK logging handler (names which signal actually arrived,
          # since nothing external should send either at ~1.5s into a
          # tiny-fixture run) and FROB_WIN32_SPAWN_DEBUG=1 (prints every
          # subprocess frob.check spawns, with its creationflags) -- also
          # landing T-3648's own leading, code-evidenced fix in this same
          # push (guarded_subprocess_run now defaults spawned children to
          # CREATE_NEW_PROCESS_GROUP on win32), so a clean run here after
          # that fix would BOTH confirm the diagnosis and prove the fix.
