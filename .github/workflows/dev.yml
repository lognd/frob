name: dev

# The dev channel (docs/design/releases.md section 5): after the `ci` workflow
# succeeds on the base branch, rebuild the cargo-dist archives of the tested
# commit and replace the assets of the GitHub prerelease `dev`. Nothing is
# published to PyPI or crates.io. Build and smoke are the reusable
# build-smoke.yml that release.yml calls too (one matrix, one dist pin;
# crates/frob-release/tests/dev_workflow.rs pins that both call it).
# Safety: workflow_run runs with the base repository's token, so the plan job
# refuses anything but a successful push-triggered ci run of this repository;
# fork pull requests never reach a build and no secrets are read.
# The CI006 accept on `on:` is deliberate: see the plan job's `if` and the
# tests that pin it; nothing from the triggering event is executed.

# frob:accept CI006 because="workflow_run gated by the plan job on a successful push run of this repository"
on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions: {}

# Newest land wins but a half-published release must finish: queue, never cancel.
concurrency:
  group: dev-channel
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # The branches whose green land feeds the dev channel (space separated).
  # This repository's tip is `experimental` until main is cut over.
  DEV_BRANCHES: "experimental"

jobs:
  plan:
    name: plan (ci succeeded on the base branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_repository.full_name == github.repository
    permissions:
      contents: read
    outputs:
      go: ${{ steps.gate.outputs.go }}
      sha: ${{ steps.gate.outputs.sha }}
      short: ${{ steps.gate.outputs.short }}
    steps:
      - name: Gate on the base branch and name the tested commit
        id: gate
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          go=false
          for b in $DEV_BRANCHES; do
            if [ "$b" = "$HEAD_BRANCH" ]; then go=true; fi
          done
          if ! printf '%s' "$HEAD_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "head sha $HEAD_SHA is not a full commit sha" >&2
            exit 1
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
          echo "sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "short=${HEAD_SHA:0:12}" >> "$GITHUB_OUTPUT"
          if [ "$go" != true ]; then
            echo "::notice::branch $HEAD_BRANCH is not in DEV_BRANCHES ($DEV_BRANCHES); nothing to do"
          fi

  # Build and smoke are the shared reusable workflow (also called by release.yml):
  # the matrix, the pinned dist and the smoke steps have one source there. No
  # wheels are built here (`wheels: false`), and no secrets are passed. The called
  # jobs run only `contents: read`, capped by this job's permissions. The shared
  # plan job resolves the version; the checkout is the tested sha, never a branch.
  artifacts:
    name: artifacts (build and smoke)
    needs: plan
    if: needs.plan.outputs.go == 'true'
    # frob:accept TOOL002 because="actionlint accepts only ./ for a local reusable workflow; zizmor suggests $/, which actionlint rejects"
    uses: ./.github/workflows/build-smoke.yml
    permissions:
      contents: read
    with:
      ref: ${{ needs.plan.outputs.sha }}
      wheels: false

  # The only job that can write. It runs only when every build job (and its
  # smoke) passed, so a failed build never touches `dev`. Replacement is
  # add-then-prune: the new assets carry the tested sha in their names, so
  # they never collide with the previous ones; they are uploaded first, the
  # tag and notes move next, and the previous assets are deleted last. A run
  # that fails before the prune removes only the assets it uploaded itself (a
  # recorded list, never a match by sha) and leaves the previous assets in place.
  publish:
    name: publish (replace the dev prerelease assets)
    needs: [plan, artifacts]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SHA: ${{ needs.plan.outputs.sha }}
      SHORT: ${{ needs.plan.outputs.short }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: archives-*
          path: archives
          merge-multiple: true
      - name: Name the archives after the tested sha and checksum them
        shell: bash
        run: |
          mkdir staged
          for f in archives/*; do
            base=$(basename "$f")
            # cargo-dist checksums name the unstaged archive; they are regenerated below.
            case "$base" in *.sha256) continue ;; esac
            stem="${base%%.*}"
            new="${stem}-${SHORT}.${base#*.}"
            cp "$f" "staged/$new"
            (cd staged && sha256sum "$new" > "$new.sha256")
          done
          ls -l staged
      - name: Ensure the dev prerelease exists
        id: ensure
        shell: bash
        run: |
          if gh release view dev --repo "$REPO" >/dev/null 2>&1; then
            echo "fresh=false" >> "$GITHUB_OUTPUT"
          else
            gh release create dev --repo "$REPO" --prerelease --target "$SHA" \
              --title "frob dev" --notes "dev channel: creating"
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload the new assets (additive; a name already on the release is skipped)
        shell: bash
        run: |
          # Existing names (same sha from an earlier run) are never overwritten, deleted or
          # re-added. A name is recorded before its upload starts, so the failure cleanup
          # removes exactly what this run may have created and nothing else.
          : > "$RUNNER_TEMP/uploaded.txt"
          existing=$(gh release view dev --repo "$REPO" --json assets --jq '.assets[].name')
          for f in staged/*; do
            name=$(basename "$f")
            if printf '%s\n' "$existing" | grep -Fxq "$name"; then
              echo "skip $name: already on the release for this sha"
              continue
            fi
            echo "$name" >> "$RUNNER_TEMP/uploaded.txt"
            gh release upload dev --repo "$REPO" "$f"
          done
      - name: Move the dev tag to the tested commit
        shell: bash
        run: |
          gh api -X PATCH "repos/$REPO/git/refs/tags/dev" -f sha="$SHA" -F force=true
      - name: Name the tested sha in the release notes
        shell: bash
        run: |
          printf 'Development build of %s (commit %s), built after ci succeeded.\nAssets are replaced on every green land; do not rely on them for production.\n' \
            "$SHORT" "$SHA" > notes.md
          gh release edit dev --repo "$REPO" --prerelease --title "frob dev ($SHORT)" --notes-file notes.md
      - name: Prune the previous assets (last, so a failure above keeps them)
        id: prune
        shell: bash
        run: |
          gh release view dev --repo "$REPO" --json assets --jq '.assets[].name' | while read -r name; do
            case "$name" in
              *"-${SHORT}."*) ;;
              *) gh release delete-asset dev "$name" --repo "$REPO" --yes ;;
            esac
          done
      - name: Remove this run's own uploads (previous assets stay)
        if: ${{ failure() && steps.prune.outcome == 'skipped' }}
        shell: bash
        run: |
          # Only names recorded by this run's upload step; never matched by sha.
          if [ -f "$RUNNER_TEMP/uploaded.txt" ]; then
            while read -r name; do
              [ -n "$name" ] && { gh release delete-asset dev "$name" --repo "$REPO" --yes || true; }
            done < "$RUNNER_TEMP/uploaded.txt"
          fi
