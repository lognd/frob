# Known exceptions: rules that stay hand-written Rust in crates/crunk-rules/src/rules because GRL
# cannot express them yet. Each names the missing construct (feeds the owner decision on
# value-domain predicates). Shared blockers, true for every rule below:
#   host-input  the rules read CrunkHost (spec + stylesheet index), not a code-model node tree
#   side-schema (typing resolved: ConfigSchema types config.layers and config.org from
#               docs/schemas/crunk.json when passed that schema; wiring it into the pack remains)
#   gen-target  cargo dev gen rules emits only the std pack against the gob host

[[exception]]
rule = "LAYER001"
missing = "port pending: `is integer` and `x in config.layers.value` (side-column membership) now exist; the rule itself is not yet written in GRL"

[[exception]]
rule = "ORG001"
missing = "stylesheet-path predicate: a file under css_root that sits in no config.org.buckets directory (no glob-membership over a side-relation column, no css_root-relative path attribute)"

[[exception]]
rule = "ORG002"
missing = "port pending: `is bem_kebab|bem_snake|bem_camel` now exist (case chosen by comparing config.org.class_case with a literal); the rule itself is not yet written in GRL"

[[exception]]
rule = "ORG003"
missing = "the component-prefix test (name equals file.component or starts with component__ or component--) has no GRL form; file.bucket and file.component exist now"

[[exception]]
rule = "ORG004"
missing = "pack wiring only: file.bucket now states 'file is not in the tokens bucket'; the rule is not yet written in GRL against the crunk host"

[[exception]]
rule = "ORG005"
missing = "ungoverned-stylesheet relation: a css file outside css_root and outside config.org.ignore globs (no negated glob-membership over a side-relation column, no css_root attribute)"
