# core-effects atoms and stdlib-derived vocabularies (packs.md 8.1), version 1.0.0.
# ticket 01M5XNNHV9M8HCP76TD867GGVJ
#
# A callee vocabulary name is `a::b` (a Rust path, also matched behind extra leading segments),
# `a.b` (a dotted Python name), a leading `.m` (method m on any receiver, gated by a companion
# call), `Path.m` / `crate::Type.m` (method m on a receiver of that resolved type) or a trailing
# `*` (every item under the prefix). The vocabulary class is the atom name.
format = 1

# Python methods that name a capability only through the receiver's type: a method called on a
# receiver built by one of `ctors` is a Must use; an untyped receiver in a file that reaches
# `module` is a May use. `methods` entries are `atom:method`.
[[receiver_family]]
lang = "python"
module = "socket"
ctors = ["socket.socket", "socket.create_connection", "socket.create_server", "socket.fromfd", "socket.SocketType"]
methods = ["net.connect:connect", "net.connect:connect_ex", "net.connect:send", "net.connect:sendall", "net.connect:sendto", "net.listen:listen", "net.listen:bind"]

# Archive extraction writes the member paths the archive names (audit case p19).
[[receiver_family]]
lang = "python"
module = "tarfile"
ctors = ["tarfile.open", "tarfile.TarFile", "tarfile.TarFile.open"]
methods = ["fs.write:extractall", "fs.write:extract"]

[[receiver_family]]
lang = "python"
module = "zipfile"
ctors = ["zipfile.ZipFile", "zipfile.PyZipFile"]
methods = ["fs.write:extractall", "fs.write:extract"]

# Crates whose `Command` is a builder type, not a process: `clap::Command::new` names a CLI command
# and must not match the `Command::new` spawn entry behind its extra leading segments.
[non_process]
crates = ["clap"]

