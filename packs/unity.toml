# The built-in `unity` pack: Unity engine vocabulary. Opt-in: it is enabled only by the root config
# (`[[packs.enable]] name = "unity"` or `[packs] enabled = ["unity"]`), never by an adapter.
# The first vocabulary names the engine entry points: code the engine calls, so no caller exists in
# the repository. COV001 treats them as reached.
[pack]
name = "unity"
version = "0.1.0"

# MonoBehaviour and ScriptableObject messages, matched on a type that derives from an `entry.base`.
[[vocab]]
lang = "csharp"
class = "entry.message"
names = [
  "Awake", "Start", "Update", "FixedUpdate", "LateUpdate", "OnEnable", "OnDisable",
  "OnDestroy", "OnValidate", "Reset", "OnGUI", "OnApplicationQuit",
]

# Message families matched on a name prefix: OnDrawGizmos*, OnTrigger*, OnCollision*, OnMouse*.
[[vocab]]
lang = "csharp"
class = "entry.message_prefix"
names = ["OnDrawGizmos", "OnTrigger", "OnCollision", "OnMouse"]

# Engine base types; derivation is followed transitively through project-local bases.
[[vocab]]
lang = "csharp"
class = "entry.base"
names = ["MonoBehaviour", "ScriptableObject"]

# Attributes on a method that make the method an entry point.
[[vocab]]
lang = "csharp"
class = "entry.method_attribute"
names = ["RuntimeInitializeOnLoadMethod", "MenuItem", "ContextMenu"]

# Attributes on a type: [InitializeOnLoad] roots its static constructor, [CreateAssetMenu] marks a
# ScriptableObject type whose messages the engine calls.
[[vocab]]
lang = "csharp"
class = "entry.type_attribute"
names = ["InitializeOnLoad", "CreateAssetMenu"]

# Second vocabulary: editor-written state. A serialized field is written from outside the code (scenes,
# prefabs, the Inspector), so a never-assigned report does not fire for it. `entry.base` above also names
# the types whose public instance fields are serialized; static, const and readonly members never are.
# `[field: SerializeField]` on an auto-property serializes its backing field.
[[vocab]]
lang = "csharp"
class = "serialized.attribute"
names = ["SerializeField", "SerializeReference"]

# Attributes that exclude a field from serialization; they win over a serialize attribute.
[[vocab]]
lang = "csharp"
class = "serialized.skip_attribute"
names = ["NonSerialized"]

# Third vocabulary: dynamic calls. The engine resolves these by name at run time, so the repository holds
# no edge to the method or object they reach. Each is recorded as an Unresolved call edge with its reason
# and is never resolved by guesswork: a literal name never turns into an edge. A method-by-name call needs
# a string literal first argument (or a computed one on this object); `Invoke()` with no arguments, or a
# delegate's `Invoke(x)` on another receiver, is an ordinary call.
[[vocab]]
lang = "csharp"
class = "dynamic.call"
names = [
  "SendMessage", "SendMessageUpwards", "BroadcastMessage", "Invoke", "InvokeRepeating",
  "StartCoroutine", "StopCoroutine", "CancelInvoke", "IsInvoking",
]

# String-keyed lookups, written `Type.Method`, matched on the type written at the call.
[[vocab]]
lang = "csharp"
class = "dynamic.lookup"
names = [
  "GameObject.Find", "GameObject.FindWithTag", "GameObject.FindGameObjectWithTag",
  "GameObject.FindGameObjectsWithTag", "Resources.Load", "Resources.LoadAsync", "Resources.LoadAll",
]
