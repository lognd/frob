# The grimble-websec pack manifest (packs-and-plugins.md tier 1 data file). WEBSEC rule ids are registered
# inside the SEC namespace (SEC1xx), so the pack claims SEC and PII family rows beside SQL,
# COMPLY, ROUTE and WEBPERF (server side). The net capability atom comes from core-effects and
# is not redefined here; db.query is declared by no pack yet (planned with the STORE family, ~3VM7F8C). See docs/packs/grimble-websec.md.
[pack]
name = "grimble-websec"
version = "0.1.0"
families = ["COMPLY", "PII", "ROUTE", "SEC", "SQL", "WEBPERF"]

[provides]
rules = ["rules/*.grl", "rules/websec/*.grl", "rules/sql/*.grl", "rules/route/*.grl", "rules/comply-pii/*.grl", "rules/webperf-server/*.grl"]

[effects]
