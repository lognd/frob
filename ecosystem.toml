# Pinned corpus for `cargo dev ecosystem` (docs/design/build-test-ci.md section 6).
#
# Every entry is a real repository at an exact commit, so the base and head binaries always see
# the same tree and a finding delta is the binary's doing, never the project's. Bump a `sha`
# deliberately, in its own change. `tools` defaults to frob, grimble and crunk; crunk needs a
# crunk.toml in the project and otherwise reports E-NO-CONFIG, which the report collapses.
# frob:ticket 01M47QV23EAN5DE6DDV9HS3VP7

