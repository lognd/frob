[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "strata-core"
version = "0.1.0"
description = "Compute-only kernels for frob.strata (closure, staleness, demand); PyO3/abi3 extension"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "strata_core"
