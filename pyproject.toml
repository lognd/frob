[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "frob"
version = "0.0.4"
description = "These are tools that I use in my development workflow."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Logan Dapp", email = "logan@logand.app" }
]

dependencies = [
    "tomli>=2.0; python_version < '3.11'",
    "typani>=0.0.3",
    "pydantic>=2.12.0",
    "tree-sitter>=0.25.2",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-cpp>=0.23.4",
    "jinja2>=3.1",
]

[project.scripts]
frob = "frob.__main__:main"

[project.urls]
Homepage = "https://github.com/lognd/frob"
Documentation = "https://github.com/lognd/frob/docs"
Source = "https://github.com/lognd/frob"
Issues = "https://github.com/lognd/frob/issues"

[dependency-groups]
dev = [
    "black>=24",
    "packaging",
    "pytest>=8",
    "pytest-testmon>=2",
    "pytest-xdist>=3",
    "ruff>=0.8",
    "ty>=0.0.1a8",
]

[tool.setuptools]
packages = { find = { where = ["src"] } }

[tool.setuptools.package-data]
frob = [
    "py.typed",
    "init/data/*.j2",
    "scaffold/data/**/*.j2",
    "scaffold/data/**/*.toml",
    "logging/config.toml",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
# Fixture files are intentionally bad code used to test error detection
"tests/fixtures/**" = ["E501", "F401", "F811", "F841", "E741", "W"]

[tool.black]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -n auto"
pythonpath = ["."]
