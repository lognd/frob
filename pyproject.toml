[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "frob"
version = "0.530.0"
description = "The enforcement layer for agentic development: obligation graph, ticket queue, and gates."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-2.0-only"
license-files = ["LICENSE"]
authors = [
    { name = "Logan Dapp", email = "logan@logand.app" }
]

dependencies = [
    "typani>=0.0.3",
    "pydantic>=2.12.0",
    "tree-sitter>=0.25.2",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-cpp>=0.23.4",
    # T-0613: tree-sitter-language-pack already bundles a kotlin grammar
    # (get_parser("kotlin")/get_language("kotlin") both resolve) -- no
    # separate tree-sitter-kotlin pin needed, so frob.lang._walk_kotlin
    # loads it through the same language-pack loading mechanism every
    # other tree-sitter grammar here uses (see frob.lang's
    # GRAMMAR_FINGERPRINT_PACKAGES docstring for why that keeps this
    # dependency-free of a per-language fingerprint entry).
    "tree-sitter-language-pack>=0.13",
    "pyyaml>=6",
    "jinja2>=3.1",
    # T-0142: `frob check` shells out to ruff/ty for the Python quality
    # stage. A bare `pip install frob` without these was silently
    # non-functional (raw FileNotFoundError on `frob check`); pinned to
    # match the dev group so the standalone wheel is fully functional.
    "ruff>=0.8",
    "ty>=0.0.1a8",
    # T-0152: frob.vet._cve compares dependency versions via
    # packaging.version at import time; without this a bare wheel install
    # crashed every frob invocation with ModuleNotFoundError.
    "packaging>=24",
    # T-3845: `frob-core` (frob.dup R3+ clone-detection kernels) and
    # `strata-core` (frob.strata closure/staleness/demand kernels), both
    # PyO3/abi3-py311 extensions built by maturin, ship as DEFAULT
    # dependencies now that .github/workflows/release.yml's `upload` job
    # publishes both to PyPI before frob itself (verified 2026-09-05: its
    # three publish steps run in one job with no `continue-on-error`, so
    # GitHub Actions' default step-abort-on-failure means a failed
    # frob-core or strata-core publish stops the job before the "Publish
    # frob to PyPI" step ever runs -- frob's own new version is never
    # pushed unless both cores already succeeded this run). That ordering
    # guarantee is why these are pinned EXACT (`==`), not `>=`/`~=` (option
    # (a) of T-3845, not the floor-pin or extra-only alternatives): a
    # reversed partial (frob published, a core missing) cannot happen
    # given the job's real abort behavior, and three separately published
    # artifacts is otherwise three chances to skew -- this repo already
    # paid for that lesson once (T-2884 needed a git-SHA check on the
    # daemon BECAUSE VERSION STRINGS ALONE WERE NOT ENOUGH to detect
    # skew). Enforced by frob.gates._version_coupling (VERSION001), not
    # left to convention. A worst case of "cores published, frob's own
    # publish step fails" leaves the PREVIOUS frob release still
    # installable (nothing regresses) with the new cores simply unused
    # until the next successful run -- see
    # docs/guides/release.md#version-coupling-t-3011.
    #
    # T-0133 DEGRADE PATH STILL APPLIES: a source install (`pip install
    # frob` with no matching wheel for this platform, or any environment
    # where the native extensions are stripped/absent) still installs and
    # runs frob in pure-Python mode -- these are Requires-Dist entries a
    # resolver satisfies when a wheel exists, not a hard runtime import
    # requirement. frob.dup and frob.strata catch ImportError from the
    # native modules and return a clear Err, never crash; see
    # tests/system/test_cli_native_missing.py and
    # docs/guides/release.md#native-acceleration-degrade-doctrine-t-3011.
    "frob-core==0.530.0",
    "strata-core==0.530.0",
]

# Optional: `frob serve` (the MCP adapter) needs the mcp SDK; installing it
# pulls uvicorn and friends, so it stays out of the core install. `frob
# serve` degrades to a clear "mcp not installed" message without it.
# Install with: uv pip install "frob[serve]"
[project.optional-dependencies]
# T-3857: bounded below 2 -- mcp 2.x renamed `mcp.server.fastmcp.FastMCP`
# to `mcp.server.mcpserver.MCPServer` (mcp 2.x's own
# mcp/server/fastmcp.py is now a deliberate compat shim that raises
# ModuleNotFoundError on import, naming the rename). An unbounded lower
# bound let a fresh resolve pick up mcp 2.x and made a published extra
# fail on import; see docs/guides/release.md's Decision 5 section for
# the full incident and the port-later decision. Raise this bound only
# once frob.serve.server is ported to the mcp 2.x API.
serve = ["mcp>=1.28.1,<2"]
# T-3845: `frob-core`/`strata-core` are now ALSO plain default
# dependencies above (see that comment for the publish-ordering
# reasoning) -- this is option (c), not (a) alone: the extra stays so
# `frob[native]` keeps resolving for anyone pinning it, AND so
# frob.gates._version_coupling's VERSION001 (which reads
# `[project.optional-dependencies].native` for its exact-pin check) and
# frob.doctor's native-extension remediation message (which tells a user
# to `pip install 'frob[native]'`) both keep working unchanged --
# reworking either is out of this ticket's declared scope. The two lists
# must stay identical; VERSION001 already enforces that its extra pin
# matches frob's own version, and this comment plus the duplication is
# the enforcement that the two lists don't drift from EACH OTHER (no
# automated check for that narrower fact exists; consider one if a
# future edit desyncs them).
native = ["frob-core==0.530.0", "strata-core==0.530.0"]
# R7 (docs/modules/dup.md's bounded-SMT rung): translates tiny pure int/bool
# functions to Z3 and checks equivalence formally. Optional -- z3-solver
# ships native binaries and is only needed for `probe_smt_equivalence`;
# every other frob.dup rung works without it. Install with:
# uv pip install "frob[smt]"
#
# T-1508: upper-bounded at <4.15.5 -- this fleet's worktree hosts are
# aarch64 glibc 2.35. z3-solver>=4.15.8 (and 5.0.0.0) only ships a
# manylinux_2_38 aarch64 wheel (needs glibc>=2.38, newer than this host
# has); z3-solver 4.15.5.0-4.15.7.0 ship NO aarch64 wheel at all. Either
# case forces a source build, which genuinely fails here: 5.0.0.0's CMake
# build needs a C++20 <format> header GCC 11.4 (this host's system
# compiler) does not have, and z3-solver<=4.9.1.0's build needs pre-3.5
# CMake support this host's CMake 3.22 has removed -- verified directly,
# not a version nobody tried (T-1508's own Done report). 4.13.0.0 through
# 4.15.4.0 all ship a manylinux_2_34 (or older) aarch64 wheel, which
# installs from a prebuilt wheel with no compiler involved at all on
# THIS host's glibc 2.35. Raise this bound again once a newer z3-solver
# release ships a glibc<=2.35-compatible aarch64 wheel, or once this
# fleet's hosts move to glibc>=2.38. (T-1814: re-landed after T-1508's
# own land silently dropped this exact edit while keeping uv.lock's
# derived fix, then re-dropped it again -- see T-1814's Done report for
# the land-time fix that closes this class of loss.)
smt = ["z3-solver>=4.13,<4.15.5"]

[project.scripts]
frob = "frob.__main__:main"

# frob:ticket T-2068
# T-2068: closes the operator-facing half of T-2032's addopts-reinjection
# hole -- `pyproject.toml`'s own `addopts = "-n auto --dist=loadgroup ..."`
# below is merged into EVERY pytest invocation regardless of argv, so a
# plain `pytest ... -p no:xdist` (this playbook's own documented way to run
# a scoped subset serially) previously died with "unrecognized arguments:
# -n --dist=loadgroup" once the xdist plugin it disabled stopped
# recognising those tokens. `frob.testing._coverage_refresh`'s
# `pytest_load_initial_conftests` strips them from `args` in place --
# registered as a `pytest11` entry point (not a `tests/conftest.py`
# hookimpl) because entry-point plugins autoload strictly BEFORE this same
# hook is called on `args`, the only ordering that can actually see and
# mutate the merged addopts before argparse chokes on it. See that
# function's own docstring for why a conftest-based hookimpl cannot work
# here at all.
[project.entry-points.pytest11]
frob_addopts_neutralizer = "frob.testing._coverage_refresh"

[project.urls]
Homepage = "https://github.com/lognd/frob"
Documentation = "https://github.com/lognd/frob/tree/main/docs"
Source = "https://github.com/lognd/frob"
Issues = "https://github.com/lognd/frob/issues"

[dependency-groups]
dev = [
    "packaging",
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-testmon>=2",
    "hypothesis>=6",
    # T-3857: bounded below 2, same reason as the `serve` extra above --
    # a dev-group-only bound would leave the published extra broken, and
    # this bound alone (without the extra's) would mean CI never
    # exercises what a user installing `frob[serve]` actually gets.
    "mcp>=1.28.1,<2",
    "pytest-xdist>=3",
    "pytest-timeout>=2",
    # T-3709: bounded rerun for genuinely load-sensitive tests (CPU-relative
    # perf ratios that stay noisy under xdist on a shared CI runner even
    # after T-3655's tolerance widening) -- see the `flaky` marker below.
    "pytest-rerunfailures>=14",
    "ruff>=0.8",
    "ty>=0.0.1a8",
    # T-1340: mypy is a diagnostic ORACLE only -- SUPPRESS001
    # (frob.gates._suppress) shells out to it to get real ground-truth
    # mypy diagnostics for the ty->mypy suppression-portability direction.
    # `ty` stays the sole gating checker; mypy's own exit code/diagnostics
    # never gate `frob check` directly.
    "mypy>=1.10",
]

# T-3845 update: both crates ARE published to PyPI now (release.yml
# builds and uploads both -- see the T-3845 comment on `dependencies`),
# but this section still has a job: this repo's OWN `uv sync`/`uv lock`
# must keep resolving `frob-core`/`strata-core` (now default deps, not
# just the `native` extra) against the LOCAL crate checkouts, since dev
# builds them in-place via `make core`/maturin rather than pulling a
# published wheel of its own natives. Verified 2026-09-05 this does not
# leak into the published artifact: `[tool.uv.sources]` path entries are
# a uv-lock/dev-resolution-only construct -- a built wheel's METADATA
# carries only `Requires-Dist: frob-core==0.530.0` / `strata-core==...`,
# no path information, confirmed by inspecting `uv build --wheel`'s
# actual output. A consumer resolving frob from the index is unaffected;
# this section only matters inside this checkout.
[tool.uv.sources]
frob-core = { path = "frob-core" }
strata-core = { path = "strata-core" }

[tool.setuptools]
packages = { find = { where = ["src"] } }

[tool.setuptools.package-data]
frob = [
    "py.typed",
    "scaffold/data/**/*.j2",
    "scaffold/data/**/*.toml",
    "logging/config.toml",
]

[tool.ruff]
line-length = 88
# Fixture files are intentionally bad/broken code used as parser test data
extend-exclude = ["tests/fixtures"]

[tool.ty.src]
exclude = ["tests/fixtures/**"]

# frob_core (frob-core/, docs/modules/dup.md) ships no type stubs -- it's a PyO3
# native extension, not a Python package ty can introspect. This is the
# only module that imports it; same posture as lithos's OCP override.
[[tool.ty.overrides]]
include = ["src/frob/dup/_core.py"]

[tool.ty.overrides.rules]
unresolved-attribute = "ignore"
unresolved-import = "ignore"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
# Fixture files are intentionally bad code used to test error detection
"tests/fixtures/**" = ["E501", "F401", "F811", "F841", "E741", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# T-0692: --timeout=120/--timeout-method=thread is the CI-hardening guard
# against the _run_combined_jobs ProcessPoolExecutor-inside-ThreadPoolExecutor
# deadlock class (T-0265, structural fix tracked as T-0581) -- a wedged
# test now fails on its own in ~2min with a named traceback dump instead of
# silently burning the 6h CI job cap. `method=thread` (not the `signal`
# default) is deliberate: the hang lives inside a forked subprocess/thread
# pool, and only the thread-based watchdog reliably fires and dumps a
# stack from inside that state (the signal method can itself be starved by
# the same deadlock). Tests that legitimately run longer than 120s
# (`tests/system/test_scaffold_dx.py`'s `pytest.mark.slow` uv-sync/venv
# case) need their own `@pytest.mark.timeout(N)` override -- see
# docs/guides/testing.md#per-test-timeout-ci-hardening for the list;
# T-draft-1770ceef tracks adding those overrides (out of this ticket's
# docs/guides+config-only scope).
# T-1433: pytest's BUILTIN faulthandler plugin dumps every thread's stack
# to stderr for any single test that runs past faulthandler_timeout
# seconds -- a within-test hang now self-diagnoses (which function, which
# lock) instead of surfacing only as a bare kill with no traceback. This
# complements (does not replace) T-1433's SIGUSR1 handler in
# tests/conftest.py, which targets the OTHER wedge shape T-1433's two
# incidents actually hit -- a hang BETWEEN tests / in
# session-teardown/coverage-save machinery, outside any single test's
# --timeout watch window, where only an external signal reaches the
# stuck process.
#
# T-3531: raised 100 -> 600. At 100, this fired its FULL all-threads dump
# (a 60+ line stack spray per hit) for every HEALTHY test past 100s, which
# now includes the T-3525 frob_self_scan_heavy group (its own
# @pytest.mark.timeout(1200) override runs legitimately past 100s on a
# clean pass) -- measured on run 33353658750: 4 such healthy-but-slow
# dumps sprayed ~260 of the job's 1518 log lines, burying the run's 2
# actual failures. 600 sits above that group's healthy runtime and below
# its own 1200s cap, so a genuine hang in that group still dumps well
# before its kill; for every ORDINARY test (still killed at the global
# --timeout=120 below, unrelated to this setting) losing the redundant
# early dump costs nothing diagnostically -- --timeout-method=thread's own
# kill at 120s already emits its own per-thread traceback (T-0692's "fails
# on its own... with a named traceback dump" above), this dump was always
# a supplementary EARLY copy of that same information for the ordinary
# case, never the only source of it.
faulthandler_timeout = 600
# T-3531: bounds pytest's own "Captured log call" section (a SEPARATE
# reporter from frob's own stdout/stderr handlers -- see
# src/frob/logging/logger.py's own T-1621 comment on the two independent
# paths a record can reach a failing test's output through) to WARNING+.
# Without this, pytest's LogCaptureHandler inherits frob's own root
# logger level (config.toml's `[root] level = "DEBUG"`, deliberately
# verbose for real diagnostic use), so a failing test's captured-log
# block could carry every DEBUG/INFO record frob logged during that
# test, not just the WARNING+ ones actually relevant to triaging the
# failure.
log_level = "WARNING"
addopts = "-q -n auto --dist=loadgroup --timeout=120 --timeout-method=thread"
pythonpath = ["."]
markers = [
    "slow: long-running system tests excluded from quick loops",
    "heavy_subprocess: real git/subprocess-heavy module (T-2099) -- tests/conftest.py's pytest_collection_modifyitems groups every test in the module into its OWN xdist_group so they run serially on one worker instead of scattering and contending over real git across workers",
]

# T-0464: most frob code is exercised only via CLI SUBPROCESS system tests
# (tests/system/conftest.py spawns `python -m frob`), whose coverage only
# gets recorded if COVERAGE_PROCESS_START names this file (the `make
# coverage` target sets it -- see Makefile). `parallel = true` lets each
# subprocess write its own `.coverage.<host>.<pid>.<rand>` data file instead
# of racing on a single one; `coverage combine` merges them before the xml
# report is produced. Without this section (or without the env var), only
# the main pytest process's own code paths are measured -- everything a
# subprocess test exercises reads as 0% hit, deflating coverage.xml's
# line-rate (observed 0.49 vs a real 0.87) and exploding TEST005 with
# hundreds of false per-symbol/per-module coverage-floor findings.
[tool.coverage.run]
branch = true
parallel = true
relative_files = true
source = ["src/frob"]
# T-1235: gate families run in a ProcessPoolExecutor (forkserver/spawn) and
# frob spawns daemon/CLI children in tests -- without these two settings that
# execution is never recorded, deflating TEST005 (loss B of the 2026-07-29
# attribution diagnosis).
concurrency = ["multiprocessing", "thread"]
# T-3420: sigterm=true (coverage's own SIGTERM handler, which saves partial
# data on graceful termination) is OFF, not on. That handler takes
# Collector.data_lock, a plain non-reentrant threading.Lock, while saving; a
# SECOND SIGTERM arriving before it releases (as `timeout` sends on escalation,
# or as CI runners send when a job is slow to die) re-enters the same handler
# on the same thread and blocks on that lock FOREVER -- confirmed by direct
# reproduction (see tests/system/test_coverage_sigterm.py), and matches the
# open, unfixed upstream reports coveragepy#1101 and coveragepy#1340 (checked
# 2026-08-29 against coverage 7.14.1, the version installed here -- still
# open, no version floor available). A `timeout N` guarding a coverage run is
# only a reliable kill if coverage does not intercept the signal at all.
# TRADEOFF: with sigterm off, a run that is killed (timeout, CI cancellation)
# loses that run's coverage data entirely instead of saving what it collected
# so far. `parallel = true` already tolerates losing individual data files --
# `coverage combine` merges whatever partial files exist -- so this trades an
# already-partial, now-occasionally-poisoned data file for a kill that
# actually works. A run that finishes normally (the overwhelming majority) is
# unaffected: coverage saves via the normal atexit path, not the signal path.
sigterm = false

[tool.coverage.paths]
source = ["src/frob", "*/src/frob"]
