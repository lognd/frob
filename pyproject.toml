[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "frob"
version = "0.392.0"
description = "The enforcement layer for agentic development: obligation graph, ticket queue, and gates."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-2.0-only"
license-files = ["LICENSE"]
authors = [
    { name = "Logan Dapp", email = "logan@logand.app" }
]

dependencies = [
    "typani>=0.0.3",
    "pydantic>=2.12.0",
    "tree-sitter>=0.25.2",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-cpp>=0.23.4",
    # T-0613: tree-sitter-language-pack already bundles a kotlin grammar
    # (get_parser("kotlin")/get_language("kotlin") both resolve) -- no
    # separate tree-sitter-kotlin pin needed, so frob.lang._walk_kotlin
    # loads it through the same language-pack loading mechanism every
    # other tree-sitter grammar here uses (see frob.lang's
    # GRAMMAR_FINGERPRINT_PACKAGES docstring for why that keeps this
    # dependency-free of a per-language fingerprint entry).
    "tree-sitter-language-pack>=0.13",
    "pyyaml>=6",
    "jinja2>=3.1",
    # T-0142: `frob check` shells out to ruff/ty for the Python quality
    # stage. A bare `pip install frob` without these was silently
    # non-functional (raw FileNotFoundError on `frob check`); pinned to
    # match the dev group so the standalone wheel is fully functional.
    "ruff>=0.8",
    "ty>=0.0.1a8",
    # T-0152: frob.vet._cve compares dependency versions via
    # packaging.version at import time; without this a bare wheel install
    # crashed every frob invocation with ModuleNotFoundError.
    "packaging>=24",
]

# Optional: `frob serve` (the MCP adapter) needs the mcp SDK; installing it
# pulls uvicorn and friends, so it stays out of the core install. `frob
# serve` degrades to a clear "mcp not installed" message without it.
# Install with: uv pip install "frob[serve]"
[project.optional-dependencies]
serve = ["mcp>=1.28.1"]
# R7 (docs/modules/dup.md's bounded-SMT rung): translates tiny pure int/bool
# functions to Z3 and checks equivalence formally. Optional -- z3-solver
# ships native binaries and is only needed for `probe_smt_equivalence`;
# every other frob.dup rung works without it. Install with:
# uv pip install "frob[smt]"
#
# T-1508: upper-bounded at <4.15.5 -- this fleet's worktree hosts are
# aarch64 glibc 2.35. z3-solver>=4.15.8 (and 5.0.0.0) only ships a
# manylinux_2_38 aarch64 wheel (needs glibc>=2.38, newer than this host
# has); z3-solver 4.15.5.0-4.15.7.0 ship NO aarch64 wheel at all. Either
# case forces a source build, which genuinely fails here: 5.0.0.0's CMake
# build needs a C++20 <format> header GCC 11.4 (this host's system
# compiler) does not have, and z3-solver<=4.9.1.0's build needs pre-3.5
# CMake support this host's CMake 3.22 has removed -- verified directly,
# not a version nobody tried (T-1508's own Done report). 4.13.0.0 through
# 4.15.4.0 all ship a manylinux_2_34 (or older) aarch64 wheel, which
# installs from a prebuilt wheel with no compiler involved at all on
# THIS host's glibc 2.35. Raise this bound again once a newer z3-solver
# release ships a glibc<=2.35-compatible aarch64 wheel, or once this
# fleet's hosts move to glibc>=2.38. (T-1814: re-landed after T-1508's
# own land silently dropped this exact edit while keeping uv.lock's
# derived fix, then re-dropped it again -- see T-1814's Done report for
# the land-time fix that closes this class of loss.)
smt = ["z3-solver>=4.13,<4.15.5"]

[project.scripts]
frob = "frob.__main__:main"

[project.urls]
Homepage = "https://github.com/lognd/frob"
Documentation = "https://github.com/lognd/frob/tree/main/docs"
Source = "https://github.com/lognd/frob"
Issues = "https://github.com/lognd/frob/issues"

[dependency-groups]
dev = [
    "packaging",
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-testmon>=2",
    "hypothesis>=6",
    "mcp>=1.28.1",
    "pytest-xdist>=3",
    "pytest-timeout>=2",
    "ruff>=0.8",
    "ty>=0.0.1a8",
    # T-1340: mypy is a diagnostic ORACLE only -- SUPPRESS001
    # (frob.gates._suppress) shells out to it to get real ground-truth
    # mypy diagnostics for the ty->mypy suppression-portability direction.
    # `ty` stays the sole gating checker; mypy's own exit code/diagnostics
    # never gate `frob check` directly.
    "mypy>=1.10",
]

[tool.setuptools]
packages = { find = { where = ["src"] } }

[tool.setuptools.package-data]
frob = [
    "py.typed",
    "scaffold/data/**/*.j2",
    "scaffold/data/**/*.toml",
    "logging/config.toml",
]

[tool.ruff]
line-length = 88
# Fixture files are intentionally bad/broken code used as parser test data
extend-exclude = ["tests/fixtures"]

[tool.ty.src]
exclude = ["tests/fixtures/**"]

# frob_core (frob-core/, docs/modules/dup.md) ships no type stubs -- it's a PyO3
# native extension, not a Python package ty can introspect. This is the
# only module that imports it; same posture as lithos's OCP override.
[[tool.ty.overrides]]
include = ["src/frob/dup/_core.py"]

[tool.ty.overrides.rules]
unresolved-attribute = "ignore"
unresolved-import = "ignore"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
# Fixture files are intentionally bad code used to test error detection
"tests/fixtures/**" = ["E501", "F401", "F811", "F841", "E741", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# T-0692: --timeout=120/--timeout-method=thread is the CI-hardening guard
# against the _run_combined_jobs ProcessPoolExecutor-inside-ThreadPoolExecutor
# deadlock class (T-0265, structural fix tracked as T-0581) -- a wedged
# test now fails on its own in ~2min with a named traceback dump instead of
# silently burning the 6h CI job cap. `method=thread` (not the `signal`
# default) is deliberate: the hang lives inside a forked subprocess/thread
# pool, and only the thread-based watchdog reliably fires and dumps a
# stack from inside that state (the signal method can itself be starved by
# the same deadlock). Tests that legitimately run longer than 120s
# (`tests/system/test_scaffold_dx.py`'s `pytest.mark.slow` uv-sync/venv
# case) need their own `@pytest.mark.timeout(N)` override -- see
# docs/guides/testing.md#per-test-timeout-ci-hardening for the list;
# T-draft-1770ceef tracks adding those overrides (out of this ticket's
# docs/guides+config-only scope).
# T-1433: pytest's BUILTIN faulthandler plugin dumps every thread's stack
# to stderr for any single test that runs past faulthandler_timeout
# seconds, BEFORE --timeout-method=thread above kills it at 120s -- a
# within-test hang now self-diagnoses (which function, which lock) instead
# of surfacing only as a bare kill with no traceback. Deliberately shorter
# than the 120s kill deadline so the dump has time to land first. This
# complements (does not replace) T-1433's SIGUSR1 handler in
# tests/conftest.py, which targets the OTHER wedge shape T-1433's two
# incidents actually hit -- a hang BETWEEN tests / in
# session-teardown/coverage-save machinery, outside any single test's
# --timeout watch window, where only an external signal reaches the
# stuck process.
faulthandler_timeout = 100
addopts = "-q -n auto --dist=loadgroup --timeout=120 --timeout-method=thread"
pythonpath = ["."]
markers = [
    "slow: long-running system tests excluded from quick loops",
]

# T-0464: most frob code is exercised only via CLI SUBPROCESS system tests
# (tests/system/conftest.py spawns `python -m frob`), whose coverage only
# gets recorded if COVERAGE_PROCESS_START names this file (the `make
# coverage` target sets it -- see Makefile). `parallel = true` lets each
# subprocess write its own `.coverage.<host>.<pid>.<rand>` data file instead
# of racing on a single one; `coverage combine` merges them before the xml
# report is produced. Without this section (or without the env var), only
# the main pytest process's own code paths are measured -- everything a
# subprocess test exercises reads as 0% hit, deflating coverage.xml's
# line-rate (observed 0.49 vs a real 0.87) and exploding TEST005 with
# hundreds of false per-symbol/per-module coverage-floor findings.
[tool.coverage.run]
branch = true
parallel = true
relative_files = true
source = ["src/frob"]
# T-1235: gate families run in a ProcessPoolExecutor (forkserver/spawn) and
# frob spawns daemon/CLI children in tests -- without these two settings that
# execution is never recorded, deflating TEST005 (loss B of the 2026-07-29
# attribution diagnosis).
concurrency = ["multiprocessing", "thread"]
sigterm = true

[tool.coverage.paths]
source = ["src/frob", "*/src/frob"]
